rşısında dayanıklılığını koruyarak durumun değişmesini bekleyebilme.","story":"Arapça ṣabara fiilinde, bir güçlüğün karşısında dayanmayı sürdürme eylemi vardır. Bu eylemi adlandıran ṣabr, Türkçeye geçerken aynı dayanma düşüncesini taşıdı. Türkçenin erken kullanımlarında acele etmeden davranmayla da birleşen sabır, bugün hem sıkıntıya katlanmayı hem bekleyebilmeyi anlatır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ṣabr"},"relatives":[{"word":"sabırlı","relation":"türev"},{"word":"sabırsız","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sabır maddesi; dayanma anlamı","url":"https://www.nisanyansozluk.com/kelime/sab%C4%B1r"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sabır maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"merak","word":"merak","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"raḳḳa","meaning":"inceldi, acı duydu","period":null,"reconstructed":false},{"language":"ar","form":"maraḳḳ/marāḳḳ","meaning":"karın veya kulağın hassas bölümü, dalak","period":null,"reconstructed":false},{"language":"tr","form":"merak","meaning":"öğrenmeye yönelik ilgi ve istek","period":"17. yy","reconstructed":false}],"shortMeaning":"Bir şeyi öğrenmeye veya anlamaya duyulan istek.","currentMeaning":"Bir konu hakkında bilgi edinmek ve bilinmeyen yönlerini anlamak için duyulan ilgi.","story":"Merakın geçmişinde bedenin hassas bölgelerini adlandıran Arapça maraḳḳ ve marāḳḳ biçimleri bulunur, ancak bugünkü kelimeyle bağları kesin değildir. Eski kullanımlarda karın ve kulakla ilgili bir ad olan kelime, daha sonra dalak, ruhsal sıkıntı ve bir şeye düşkünlük çevresinde dolaşır. Yirminci yüzyılın başına gelindiğinde öğrenme isteği anlamı da belirgindir. Bu yolculuğun büyük bir anlam değişmesiyle mi, yoksa aynı kökten yeniden türetmeyle mi gerçekleştiği tartışmalıdır.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"meraḳḳ"},"relatives":[{"word":"meraklı","relation":"türev"}],"alternatives":["Nişanyan Sözlük, bedenin hassas bölgelerini adlandıran maraḳḳ/marāḳḳ ile bağlantıyı tartışmalı gösterir ve Türkçede kapsamlı bir anlam değişmesi yaşanmış olabileceğini belirtir.","Nişanyan Sözlük, kelimenin Arapça riḳḳat veya raḳīḳ üzerinden yeniden türetilmiş olmasını da olası bir açıklama olarak sunar."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"merak maddesi","url":"https://www.nisanyansozluk.com/kelime/merak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"merak maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"heves","word":"heves","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"hawisa","meaning":"şaşkınlığa veya deliliğe kapıldı","period":null,"reconstructed":false},{"language":"ar","form":"hawas","meaning":"geçici ruhsal taşkınlık, hayale veya boş uğraşa kapılma","period":null,"reconstructed":false},{"language":"tr","form":"heves","meaning":"bir şeye yönelik istek","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir şeyi yapmaya veya edinmeye duyulan istek.","currentMeaning":"Bir uğraşa, nesneye veya deneyime yönelten istek ve ilgi.","story":"Hevesin Arapçadaki başlangıcında sakin bir istekten çok, şaşırma ve ruhsal taşkınlık vardır. Hawas, gelip geçen ruh hâllerini ve insanı oyalayan boş uğraşları da kapsıyordu. Türkçede bu sert çağrışımlar hafifledi; kelime, insanı bir işe yönelten gündelik isteği anlatacak kadar genişledi.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"hevesdür"},"relatives":[{"word":"hevesli","relation":"türev"},{"word":"heveskâr","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"heves maddesi","url":"https://www.nisanyansozluk.com/kelime/heves"},{"name":"TDK Güncel Türkçe Sözlük","ref":"heves maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"heyecan","word":"heyecan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"hāca","meaning":"tozu havalandırdı, öfkesi veya telaşı arttı","period":null,"reconstructed":false},{"language":"ar","form":"hayacān","meaning":"tozun kalkması, coşup hareketlenme","period":null,"reconstructed":false},{"language":"tr","form":"heyecan","meaning":"güçlü ve geçici duygusal hareketlenme","period":"17. yy","reconstructed":false}],"shortMeaning":"Güçlü bir duygunun yarattığı geçici iç hareketlilik.","currentMeaning":"Sevinç, korku veya öfke gibi duygularla ortaya çıkan yoğun ve geçici duygusal durum.","story":"Heyecanın geçmişindeki Arapça hāca, hem tozun havalanmasını hem öfke ve telaşın kızışmasını anlatıyordu. Hayacān biçiminde dışarıdaki hareket ile insanın içindeki coşma aynı kelimede buluştu. Türkçede bedenden çok duygu dünyasına yerleşen heyecan, korkudan sevince kadar farklı duyguların yarattığı hareketliliği kapsadı.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"heyecān"},"relatives":[{"word":"heyecanlı","relation":"türev"},{"word":"heyecanlanmak","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"heyecan maddesi","url":"https://www.nisanyansozluk.com/kelime/heyecan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"heyecan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şefkat","word":"şefkat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şafaḳa","meaning":"kıstı, kıskançlık veya kaygı duydu","period":null,"reconstructed":false},{"language":"ar","form":"şafaḳa(t)","meaning":"acıyarak koruma ve gözetme","period":null,"reconstructed":false},{"language":"tr","form":"şefkat","meaning":"koruyucu ve esirgeyici sevgi","period":"14. yy","reconstructed":false}],"shortMeaning":"Birini sevgiyle korumaya ve esirgemeye yönelten duygu.","currentMeaning":"Başkasına karşı duyulan, onu koruma ve incitmekten sakınma isteği taşıyan sevgi.","story":"Şefkatin Arapçadaki fiil kökü, kaygılanmayı da içeren bir anlam alanına sahipti. Şafaḳa(t) adıyla bu alanın merhamet etme ve birini esirgeme yönü öne çıktı. Türkçeye taşınan kelimede de sevgi, karşıdakinin başına bir şey gelmesin diye onu gözetme duygusuyla birleşir.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"şafaḳat"},"relatives":[{"word":"şefkatli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"şefkat maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Fefkat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şefkat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"vicdan","word":"vicdan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"wacada","meaning":"buldu","period":null,"reconstructed":false},{"language":"ar","form":"wicdān","meaning":"bulma, zihinde canlandırma, öfke veya vecd","period":null,"reconstructed":false},{"language":"tr","form":"vicdan","meaning":"kişinin davranışlarını ahlaken değerlendiren iç duygu","period":"15. yy","reconstructed":false}],"shortMeaning":"İnsanın kendi davranışlarını ahlaken tartmasını sağlayan duygu.","currentMeaning":"Kişinin yaptıklarını kendi ahlak değerleri açısından değerlendirerek doğru veya yanlış bulmasını sağlayan iç duygu.","story":"Vicdanın çıkış noktasındaki Arapça wacada, bir şeyi bulma eylemini anlatır. Wicdān ise bulmanın yanında zihinde canlandırmayı, yoğun öfkeyi ve tasavvuftaki kendinden geçişi de kapsıyordu. Türkçedeki eski kullanımlar bu bulma ve iç yaşantı alanını korurken, on dokuzuncu yüzyılda kişinin içinde taşıdığı ahlaki ölçü belirginleşti. Bugünkü vicdanda bulunan şey bir eşya değil, insanın kendi davranışı hakkındaki yargısıdır.","firstAttestation":{"source":"Sinan Paşa — Tazarru'nâme","period":"1482","form":"vicdān"},"relatives":[{"word":"vicdanlı","relation":"türev"},{"word":"vicdansız","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"vicdan maddesi","url":"https://www.nisanyansozluk.com/kelime/vicdan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"vicdan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"gurur","word":"gurur","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ġarra","meaning":"görünüşle yanılttı","period":null,"reconstructed":false},{"language":"ar","form":"ġurūr","meaning":"yanıltma veya yanılgıya kapılma","period":null,"reconstructed":false},{"language":"tr","form":"gurur","meaning":"kendini üstün görme","period":"14. yy","reconstructed":false}],"shortMeaning":"Kendini üstün ve beğenilmeye değer görme duygusu.","currentMeaning":"İnsanın kendisini aşırı ölçüde beğenmesi ve başkalarından üstün sayması.","story":"Gururun Arapçadaki geçmişinde, görünüşe kanarak yanılmak vardır. Ġarra fiilinden gelişen ġurūr, hem kandırmayı hem aldanmayı adlandırıyordu. Türkçedeki kendini beğenme anlamında bu yanılgının odağı insanın kendisine çevrilir; kişi kendi değerini olduğundan büyük görür.","firstAttestation":{"source":"Anonim — Tezkiretü'l-Evliya tercümesi","period":"1341","form":"ġurūrdan"},"relatives":[{"word":"gururlu","relation":"türev"},{"word":"gururlanmak","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"gurur maddesi","url":"https://www.nisanyansozluk.com/kelime/gurur"},{"name":"TDK Güncel Türkçe Sözlük","ref":"gurur maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cesaret","word":"cesaret","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"casara","meaning":"dereyi veya vadiyi aştı, tehlikeye girişti","period":null,"reconstructed":false},{"language":"ar","form":"casāra(t)","meaning":"gözü pek davranma","period":null,"reconstructed":false},{"language":"tr","form":"cesaret","meaning":"tehlikeye veya güçlüğe karşı girişme güveni","period":"17. yy","reconstructed":false}],"shortMeaning":"Güç veya tehlikeli bir işe girişebilme güveni.","currentMeaning":"Kişinin tehlike ya da güçlük karşısında harekete geçmesini sağlayan kendine güven ve atılganlık.","story":"Cesaretin geçmişinde bir dereyi veya vadiyi aşma eylemi vardır. Arapça casara, bu somut geçişin yanında tehlikeli bir işe atılmayı da anlatıyordu. Casāra(t) ile adlandırılan gözü peklik Türkçeye cesaret olarak taşındı; aşılacak engel artık bir vadi kadar zor bir karar da olabilir.","firstAttestation":{"source":"Kâtip Çelebi — Fezleke","period":"1653","form":"cesāret"},"relatives":[{"word":"cesaretli","relation":"türev"}],"alternatives":null,"funFact":"Arapçada köprüyü adlandıran cisr de cesaretle aynı kökü paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"cesaret maddesi","url":"https://www.nisanyansozluk.com/kelime/cesaret"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cesaret maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kaide","word":"kaide","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳaˁada","meaning":"oturdu","period":null,"reconstructed":false},{"language":"ar","form":"ḳāˁida(t)","meaning":"üzerine oturulan temel, dayanak, kural","period":null,"reconstructed":false},{"language":"tr","form":"kaide","meaning":"uyulacak kural","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir işte veya davranışta uyulan kural.","currentMeaning":"Davranışları veya bir işin yürütülüşünü düzenleyen, uyulması beklenen ilke.","story":"Kaidenin Arapçadaki başlangıcı, oturma eylemini anlatan ḳaˁada fiilidir. Buradan gelişen ḳāˁida(t), bir şeyin oturduğu tabanı ve temeli adlandırırken soyut bir dayanak olan kuralı da kapsadı. Türkçedeki kural anlamı böylece bir düzenin üzerine oturduğu temel düşüncesini taşır.","firstAttestation":{"source":"Şeyyad Hamza — Dastan-ı Yusuf tercümesi","period":"<1348","form":"ḳāˁide"},"relatives":[{"word":"kaideli","relation":"türev"},{"word":"kaidesiz","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kaide maddesi","url":"https://www.nisanyansozluk.com/kelime/kaide"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kaide maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kanun","word":"kanun","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"grc","chain":[{"language":"grc","form":"kanōn","meaning":"kural, düzen","period":null,"reconstructed":false},{"language":"syc","form":"ḳānōnā","meaning":"kural, düzen","period":null,"reconstructed":false},{"language":"ar","form":"ḳānūn","meaning":"yasa, düzen","period":null,"reconstructed":false},{"language":"tr","form":"kanun","meaning":"yasa","period":"15. yy","reconstructed":false}],"shortMeaning":"Yetkili organın koyduğu bağlayıcı hukuk kuralı.","currentMeaning":"Yasama yetkisine sahip organın kabul ettiği, uyulması zorunlu hukuk düzenlemesi.","story":"Kanunun yolculuğu, kural ve düzeni adlandıran Eski Yunanca kanōn ile başlar. Kelime Süryanicede ḳānōnā biçimini aldıktan sonra Arapçaya ḳānūn olarak geçti. Türkçeye ulaşırken de insan davranışlarını ortak bir düzene bağlama düşüncesini korudu; bugünkü kullanımında bu düzenin bağlayıcı yasalarını adlandırır.","firstAttestation":{"source":"Sinan Paşa — Tazarru'nâme","period":"1482","form":"ḳānūn"},"relatives":[{"word":"kanunsuz","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kanun maddesi; yasa anlamı","url":"https://www.nisanyansozluk.com/kelime/kanun"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kanun maddesi; yasa anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hak","word":"hak","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥaḳḳ","meaning":"gerçeğe, yasaya ve erdeme uygunluk","period":null,"reconstructed":false},{"language":"tr","form":"hak","meaning":"doğruluk, gerçeklik ve hak edilmiş pay","period":"11. yy","reconstructed":false}],"shortMeaning":"Doğru ve gerçek olan; kişiye ait olması gereken pay.","currentMeaning":"Doğruluk ve gerçeklik; ayrıca adalet gereği bir kişiye tanınması veya verilmesi gereken şey.","story":"Arapça ḥaḳḳ, yasaya, hakikate ve erdeme uygun olmayı anlatıyordu. Aynı Sami kökün Aramice ve İbranicedeki karşılıkları taşa veya metale yazı kazımayı adlandırır, bu yüzden kelimenin arka planında kalıcı biçimde kaydedilmiş bir buyruk fikri sezilir. Türkçede hak, hem doğru olanı hem de kişinin emeği veya konumu gereği kendisine düşeni anlatır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ḥaḳ"},"relatives":[{"word":"hukuk","relation":"akraba"},{"word":"haklı","relation":"türev"},{"word":"haksız","relation":"türev"}],"alternatives":null,"funFact":"Hakkın uzak akrabası olan Aramice ve İbranice ḥaḳaḳ fiili, taşa veya metale yazı oymayı anlatır.","sources":[{"name":"Nişanyan Sözlük","ref":"hak maddesi; doğruluk ve hak edilmiş pay anlamı","url":"https://www.nisanyansozluk.com/kelime/hak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hak maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hukuk","word":"hukuk","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥaḳḳ","meaning":"doğruluk, yasaya uygunluk, hak","period":null,"reconstructed":false},{"language":"ar","form":"ḥuḳūḳ","meaning":"birden çok hak","period":null,"reconstructed":false},{"language":"tr","form":"hukuk","meaning":"toplumsal düzeni belirleyen bağlayıcı kurallar bütünü","period":"15. yy","reconstructed":false}],"shortMeaning":"Toplum düzenini sağlayan bağlayıcı kurallar bütünü.","currentMeaning":"İnsanların birbirleriyle ve devletle ilişkilerini düzenleyen, yaptırımlarla desteklenen kuralların bütünü.","story":"Hukuk, Arapçada hakkın çoğulu olarak kişilere ait hakları bir araya getiriyordu. Türkçedeki erken kullanımında da birinin yerine getirilmesi gereken haklarını anlatıyordu. Zamanla bu hakları düzenleyen kuralların bütününü de adlandırdı ve tek tek kişilerin alacaklarından toplumun ortak düzenine doğru genişledi.","firstAttestation":{"source":"Anonim — Ferec ba'd eş-şidde","period":"<1451","form":"ḥuḳūḳı"},"relatives":[{"word":"hak","relation":"akraba"},{"word":"hukukçu","relation":"türev"}],"alternatives":null,"funFact":"1945 öncesindeki bütün sözlüklerde hukuk, yalnızca hak kelimesinin çoğulu olarak gösterilir.","sources":[{"name":"Nişanyan Sözlük","ref":"hukuk maddesi","url":"https://www.nisanyansozluk.com/kelime/hukuk"},{"name":"Nişanyan Sözlük","ref":"hak maddesi; daha eski kök bağlantısı","url":"https://www.nisanyansozluk.com/kelime/hak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hukuk maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"adalet","word":"adalet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁadala","meaning":"denk, ölçülü ve adil oldu","period":null,"reconstructed":false},{"language":"ar","form":"ˁadāla(t)","meaning":"hakları gözeterek adil davranma","period":null,"reconstructed":false},{"language":"tr","form":"adalet","meaning":"hakka ve hukuka uygun davranma","period":"15. yy başından önce","reconstructed":false}],"shortMeaning":"Herkesin hakkını gözeterek doğru ve adil davranma.","currentMeaning":"Karar ve davranışlarda hakları gözetme, hakka ve hukuka uygun olma.","story":"Adaletin Arapçadaki fiil kökünde denklik ve ölçülülük birlikte yer alır. ˁAdāla(t), bu ölçüyü insan ilişkilerine taşıyarak hakları gözeten davranışı adlandırır. Türkçedeki adalet de kimsenin hakkının eksilmediği bir düzen düşüncesini bu denklik bağıyla taşır.","firstAttestation":{"source":"Anonim — Kitâb Fi'l-Fıkh Bi'l-Lisâni't-Türkî","period":"<1421","form":"ˁadāleti"},"relatives":[{"word":"adaletli","relation":"türev"},{"word":"adaletsiz","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"adalet maddesi","url":"https://www.nisanyansozluk.com/kelime/adalet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"adalet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"devlet","word":"devlet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"dāla","meaning":"döndü, talih yön değiştirdi","period":null,"reconstructed":false},{"language":"ar","form":"dawla(t)","meaning":"dönüş, talih, varlık ve egemenlik","period":null,"reconstructed":false},{"language":"tr","form":"devlet","meaning":"bir ülkenin siyasal ve hukuki örgütlenmesi","period":"11. yy","reconstructed":false}],"shortMeaning":"Bir ülkenin egemen siyasal ve hukuki örgütlenmesi.","currentMeaning":"Belirli bir toprak üzerinde yaşayan toplumu ortak bir egemenlik ve hukuk düzeni altında örgütleyen tüzel yapı.","story":"Devletin geçmişinde dönüp duran talih vardır. Arapça dāla feleğin ve kısmetin dönmesini anlatırken, ondan türeyen dawla(t) bu dönüşten bahta, zenginliğe ve iktidara uzanan bir anlam alanı kurdu. Türkçenin erken döneminde de mutluluğu ve talihi anlatan devlet, hükümdarın sahip olduğu güç ve baht üzerinden egemenlikle birleşti. Sonunda kişiye ait bir üstünlüğün adı olmaktan çıkıp siyasal örgütlenmenin soyut adına dönüştü.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"dawlat"},"relatives":[{"word":"devletli","relation":"türev"},{"word":"dolap","relation":"eş köken"}],"alternatives":null,"funFact":"Devlet ile dolap, geçmişlerinde aynı dönme kökünü paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"devlet maddesi","url":"https://www.nisanyansozluk.com/kelime/devlet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"devlet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"millet","word":"millet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"arc","chain":[{"language":"arc","form":"mālal, məlal","meaning":"söz söylemek","period":null,"reconstructed":false},{"language":"arc","form":"millā","meaning":"söylenen söz","period":null,"reconstructed":false},{"language":"ar","form":"milla(t)","meaning":"din, gelenek ve bunlara bağlı topluluk","period":null,"reconstructed":false},{"language":"tr","form":"millet","meaning":"ortak tarih ve kültürle bağlı insan topluluğu","period":"11. yy","reconstructed":false}],"shortMeaning":"Ortak tarih ve kültür bağları taşıyan insan topluluğu.","currentMeaning":"Dil, tarih, kültür, gelenek ve ortak aidiyet gibi bağlarla birbirine bağlı insan topluluğu.","story":"Milletin en eski halkalarında Aramice konuşma eylemi ve söylenen söz vardır. Millā Arapçaya geçtiğinde din, töre ve bunları paylaşan cemaat çevresinde yeni bir anlam kazandı. Türkçede uzun süre insanları aynı inançta buluşturan topluluğu anlattı. On dokuzuncu yüzyılın ikinci yarısında Fransızca nation karşılığındaki kullanımı güçlenince ortak tarih ve kültürle bağlı ulus anlamı öne çıktı.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"millatḳa"},"relatives":[{"word":"millî","relation":"akraba"},{"word":"milletvekili","relation":"birleşik"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"millet maddesi","url":"https://www.nisanyansozluk.com/kelime/millet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"millet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"vatan","word":"vatan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"waṭana","meaning":"bir yerde kaldı, yerleşti","period":null,"reconstructed":false},{"language":"ar","form":"waṭan","meaning":"yerleşilen yer, yaşanan konut","period":null,"reconstructed":false},{"language":"tr","form":"vatan","meaning":"aidiyet duyulan yurt","period":"15. yy","reconstructed":false}],"shortMeaning":"İnsanın kendisini ait hissettiği yurt.","currentMeaning":"Bir kişinin veya topluluğun aidiyet bağıyla bağlı olduğu ülke ve yurt toprakları.","story":"Vatanın Arapçadaki başlangıç resmi, insanın konakladığı veya yerleştiği yerdir. Waṭan, aynı kökü paylaşan waṭana fiiliyle birlikte bu yaşama ve yer tutma alanına bağlıdır. Türkçede kişinin yerleştiği yeri anlatan kelime, 1860'lardan itibaren Fransız devrimci düşüncesinin ve patrie kavramının etkisiyle siyasal bir genişleme yaşadı. Yaşanan yer, böylece mensup olunan devletin topraklarını kapsayan ortak yurda dönüştü.","firstAttestation":{"source":"Ahmedî Divanı","period":"1400","form":"vatan"},"relatives":[{"word":"vatandaş","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"vatan maddesi","url":"https://www.nisanyansozluk.com/kelime/vatan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"vatan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"memleket","word":"memleket","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"malaka","meaning":"sahip oldu, hükmetti","period":null,"reconstructed":false},{"language":"ar","form":"mamlaka(t)","meaning":"hükmedilen alan, krallık ve ülke","period":null,"reconstructed":false},{"language":"tr","form":"memleket","meaning":"ülke, kişinin yurdu","period":"14. yy","reconstructed":false}],"shortMeaning":"Ülke veya kişinin kendi yurdu saydığı yer.","currentMeaning":"Bir ülke; ayrıca kişinin doğduğu, yetiştiği veya kendisini ait hissettiği yer.","story":"Memleketin Arapçadaki kökü, bir şeye sahip olmayı ve onun üzerinde hüküm sürmeyi anlatır. Mamlaka(t), bu sahipliğin uzandığı alanı, yani krallığı veya ülkeyi adlandırdı. Türkçede ülke ve vilayet için kullanılan kelime, halk dilinde kişinin kendi yurduna da yerleşti. Böylece yönetilen toprak parçasının adı, insanın kendisini ait hissettiği yerin adına dönüştü.","firstAttestation":{"source":"Rabguzi — Kısasü'l-Enbiya tercümesi","period":"1310","form":"memleket"},"relatives":[{"word":"memleketli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"memleket maddesi","url":"https://www.nisanyansozluk.com/kelime/memleket"},{"name":"TDK Güncel Türkçe Sözlük","ref":"memleket maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"dünya","word":"dünya","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"danī","meaning":"aşağıda, bu tarafta","period":null,"reconstructed":false},{"language":"ar","form":"adnā","meaning":"daha aşağıda veya bu tarafa daha yakın","period":null,"reconstructed":false},{"language":"ar","form":"dunyā","meaning":"üzerinde yaşanan yeryüzü","period":null,"reconstructed":false},{"language":"tr","form":"dünya","meaning":"insanların yaşadığı yeryüzü","period":"11. yy","reconstructed":false}],"shortMeaning":"İnsanların üzerinde yaşadığı yeryüzü.","currentMeaning":"İnsanların yaşadığı, karaları ve denizleriyle yeryüzünün bütünü.","story":"Dünyanın Arapçadaki geçmişi, aşağıda veya bu tarafta bulunmayı anlatan danī ile başlar. Adnā biçiminde karşılaştırmaya dönüşen bu yer ilişkisi, dunyā ile yaşadığımız yeryüzünün adına bağlanır. İslam düşüncesindeki öteki hayatın karşısında dünya, insanın şimdi bulunduğu tarafı işaret eder. Türkçede bu karşıtlığı taşıyarak yerleşen kelime, gündelik kullanımda üzerinde yaşadığımız yeryüzünü adlandırır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"dunyā"},"relatives":[{"word":"dünyalık","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"dünya maddesi","url":"https://www.nisanyansozluk.com/kelime/d%C3%BCnya"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dünya maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çerçeve","word":"çerçeve","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"çobag","meaning":"çubuk","period":null,"reconstructed":false},{"language":"fa","form":"çūba","meaning":"çubuk","period":null,"reconstructed":false},{"language":"fa","form":"çār-çūba","meaning":"dört çubuktan oluşan kenarlık","period":null,"reconstructed":false},{"language":"tr","form":"çerçeve","meaning":"bir nesnenin çevresini kuşatan kenarlık","period":null,"reconstructed":false}],"shortMeaning":"Resim, ayna veya yazının çevresine geçirilen kenarlık.","currentMeaning":"Resim, yazı ve ayna gibi nesneleri çevreleyen, korumaya, süslemeye veya asmaya yarayan kenarlık.","story":"Çerçevenin Farsça adında dört çubuk yan yana durur: çār 'dört', çūba ise 'çubuk'tur. Bir araya getirilen bu parçalar, ortasında boşluk bulunan dörtgen bir kenarlık oluşturur. Türkçedeki eski kullanım kapının alt ve üst eşiklerini de kapsarken bugün sözcük resim ve aynaların çevresindeki kenarlıklarda yaşamayı sürdürür.","firstAttestation":{"source":"Filippo Argenti — Regola del Parlare Turco","period":"1533","form":"çerçive"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"çerçeve maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7er%C3%A7eve"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çerçeve","url":null}],"confidence":"yüksek","reviewed":true},{"id":"perde","word":"perde","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"pardag","meaning":"örtü, perde","period":null,"reconstructed":false},{"language":"fa","form":"parda","meaning":"örtü; müzik perdesi","period":null,"reconstructed":false},{"language":"tr","form":"perde","meaning":"bir açıklığı örten örtü; müzik terimi","period":null,"reconstructed":false}],"shortMeaning":"Işığı veya görüşü kesmek için asılan örtü.","currentMeaning":"Pencere ya da başka bir açıklığın önüne asılarak ışığı, görüşü veya görünürlüğü sınırlayan örtü.","story":"Farsça parda yalnızca pencereye asılan kumaşı değil, kapıyı, çadır girişini veya yüzü örten örtüyü de adlandırıyordu. Bu kullanımın merkezinde bir şeyi gözden saklayan örtü bulunur. Türkçe perde, aynı örtme işlevini koruyarak evlerin pencere örtülerinin yerleşik adı oldu.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"perdede"},"relatives":[],"alternatives":null,"funFact":"Perdenin müzikteki kullanımı da Farsçada vardı ve Türkçede 1330 yılında tanıklanmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"perde maddesi","url":"https://www.nisanyansozluk.com/kelime/perde"},{"name":"TDK Güncel Türkçe Sözlük","ref":"perde","url":null}],"confidence":"yüksek","reviewed":true},{"id":"merdiven","word":"merdiven","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nard","meaning":"tahta, tabla","period":null,"reconstructed":false},{"language":"fa","form":"nardubān","meaning":"basamaklı çıkma aracı","period":null,"reconstructed":false},{"language":"tr","form":"merdiven","meaning":"çıkıp inmeye yarayan basamaklar","period":null,"reconstructed":false}],"shortMeaning":"Yükseklikler arasında çıkıp inmeyi sağlayan basamaklar dizisi.","currentMeaning":"Farklı yükseklikteki yerler arasında geçiş sağlayan sabit veya taşınabilir basamaklı düzenek.","story":"Merdivenin geçmişi Farsçada tahta ve tabla için kullanılan nard adına uzanır. Ondan türeyen nardubān, yukarı çıkmayı sağlayan basamaklı aracı adlandırıyordu. Türkçede nerdübān gibi biçimlerden merdüven ve merdivene uzanan değişim sırasında adın sesleri değişti, basamaklarla yükselme fikri kaldı.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"nedübān"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"merdiven maddesi","url":"https://www.nisanyansozluk.com/kelime/merdiven"},{"name":"TDK Güncel Türkçe Sözlük","ref":"merdiven","url":null}],"confidence":"yüksek","reviewed":true},{"id":"duvar","word":"duvar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"dʰei̯ǵʰ-","meaning":"yoğurmak","period":null,"reconstructed":true},{"language":"peo","form":"deġa-","meaning":"kil, kerpiç","period":null,"reconstructed":false},{"language":"peo","form":"deġa-vāra-","meaning":"kerpiçten koruyucu çevre duvarı","period":null,"reconstructed":true},{"language":"fa","form":"dīvār","meaning":"duvar","period":null,"reconstructed":false},{"language":"tr","form":"duvar","meaning":"yapıyı çevreleyen veya bölen dikey yapı öğesi","period":null,"reconstructed":false}],"shortMeaning":"Bir yapıyı çevreleyen veya içini bölen dikey yapı öğesi.","currentMeaning":"Taş, tuğla ve benzeri malzemelerle oluşturulan, bir yapıyı dıştan sınırlayan veya iç mekânlarını ayıran dikey bölüm.","story":"Duvarın eski adında hem malzeme hem işlev bulunur: Eski Farsça deġa- kerpici, vāra- ise koruyup çevirmeyi anlatır. Kerpiç adının daha gerisindeki kök, kilin elle yoğrulması eylemine uzanır. Bu parçaların birleşimi Farsçada dīvār biçimine ulaşmış, Türkçede duvar olurken yalnızca kerpiçten yapılan yapılarla sınırlı kalmamıştır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"diuar"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"duvar maddesi","url":"https://www.nisanyansozluk.com/kelime/duvar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"duvar","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çeşme","word":"çeşme","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"çaşm","meaning":"göz","period":null,"reconstructed":false},{"language":"pal","form":"çaşmag","meaning":"göze, pınar","period":null,"reconstructed":false},{"language":"fa","form":"çaşma","meaning":"gözü andıran şey; su kaynağı","period":null,"reconstructed":false},{"language":"tr","form":"çeşme","meaning":"suyun akıtıldığı yapı","period":null,"reconstructed":false}],"shortMeaning":"Suyun bir musluk veya oluktan aktığı yapı.","currentMeaning":"Getirilen suyu bir musluk ya da oluktan akıtarak kullanıma sunan, çoğunlukla kamusal alanda bulunan yapı.","story":"Çeşmenin başlangıcında bir göz vardır: Orta Farsça çaşm, görme organının adıydı. Bu addan türeyen biçim, göz gibi görünen su çıkışını ve pınarı adlandırdı. Türkçede çeşme, doğal kaynağın yanında suyun getirilip akıtıldığı yapının da adı oldu; göz ile su kaynağı arasındaki benzerlik Türkçe gözede de görülür.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"çaşmadın"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"çeşme maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7e%C5%9Fme"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çeşme","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ayna","word":"ayna","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"ādēnag/āyēnag","meaning":"ayna","period":null,"reconstructed":true},{"language":"fa","form":"āyīna/aˀīna","meaning":"görüntüyü yansıtan nesne","period":null,"reconstructed":false},{"language":"tr","form":"ayna","meaning":"görüntü veren yansıtıcı yüzey","period":null,"reconstructed":false}],"shortMeaning":"Işığı yansıtarak karşısındakinin görüntüsünü veren yüzey.","currentMeaning":"Karşısındaki varlıkların görüntüsünü yansıtan, genellikle arka yüzü özel bir tabakayla kaplanmış cam.","story":"Farsça āyīna, karşısındaki kişiye kendi görüntüsünü gösteren nesnenin adıydı. Daha eski İran dili bağlantıları görme ve gösterme eylemlerine uzanır; ancak Orta Farsçadaki önceki biçim için alternatifler vardır. Türkçede âyine ve ayna biçimleriyle yaşayan ad, bugün de aynı yansıtma işini yapan nesneyi anlatır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"āyinedür"},"relatives":[],"alternatives":["Nişanyan Sözlük, Orta Farsça ēwēnag biçimini yeniden kurulan ādēnag/āyēnag biçimlerine alternatif olarak verir ve Avestaca avi-dayana- ile eş kökenlilik ilişkisi kurar."],"funFact":"Aynanın adını Farsçadaki demir veya Arapçadaki göz sözüyle açıklamak halk etimolojisidir.","sources":[{"name":"Nişanyan Sözlük","ref":"ayna maddesi","url":"https://www.nisanyansozluk.com/kelime/ayna"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ayna","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kilit","word":"kilit","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"kleh₂u-","meaning":"kapatmak","period":null,"reconstructed":true},{"language":"grc","form":"kleíō","meaning":"kapatmak, örtmek","period":null,"reconstructed":false},{"language":"grc","form":"kleïs, kleid-","meaning":"anahtar","period":null,"reconstructed":false},{"language":"fa","form":"kilīd/kalīd","meaning":"anahtar","period":null,"reconstructed":false},{"language":"tr","form":"kilit","meaning":"açılıp kapanmayı denetleyen kapatma düzeneği","period":null,"reconstructed":false}],"shortMeaning":"Anahtar veya benzeri bir parçayla açılan kapatma düzeneği.","currentMeaning":"Kapı, kapak veya benzeri şeyleri kapalı tutan ve anahtar gibi bir araçla açılıp kapanan düzenek.","story":"Eski Yunancada kapatmayı anlatan fiilden bir anahtar adı türedi ve Farsçada kilīd biçimini aldı. Türkçedeki erken kirit kullanımı da kapıyı açan anahtarı adlandırıyordu. Zamanla ad, elde tutulan anahtardan onun çalıştırdığı kapatma düzeneğine kaydı; bugünkü kilit bu anlam değişimini taşır.","firstAttestation":{"source":"Kaşgarî — Divan-i Lugati't-Türk","period":"1073","form":"kirit"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kilit maddesi","url":"https://www.nisanyansozluk.com/kelime/kilit"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kilit","url":null}],"confidence":"yüksek","reviewed":true},{"id":"menteşe","word":"menteşe","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"band","meaning":"bağ, eklem","period":null,"reconstructed":false},{"language":"fa","form":"band-guşā","meaning":"eklem, boğum","period":null,"reconstructed":false},{"language":"tr","form":"menteşe","meaning":"bir kapağın dönerek açılmasını sağlayan bağlantı","period":null,"reconstructed":false}],"shortMeaning":"Kapı veya kapağı dönerek açılıp kapanacak biçimde bağlayan parça.","currentMeaning":"Kapı, pencere ve kapakları sabit bir yüzeye bağlayıp bir eksen çevresinde hareket etmelerini sağlayan metal bağlantı.","story":"Menteşenin Farsça geçmişi için verilen biçimler farklıdır; açıklamalardan biri band 'bağ, eklem' ile guşā- 'açmak' parçalarını birleştirir. Bu açıklamadaki band-guşā, bedenin hareket eden eklem ve boğumlarını adlandırıyordu. Türkçedeki eski örneklerde de bedensel eklem kullanımı görülür; daha sonra aynı hareketli bağlantı düşüncesi kapının açılıp kapanmasını sağlayan parçaya taşınır.","firstAttestation":{"source":"Mercimek Ahmed — Kâbusname tercümesi","period":"1432","form":"bend-guşālar"},"relatives":[],"alternatives":["Nişanyan Sözlük menteşeyi Farsça band-guşā ile açıklarken TDK Güncel Türkçe Sözlük kaynak biçimi bendkeşe olarak verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"menteşe maddesi","url":"https://www.nisanyansozluk.com/kelime/mente%C5%9Fe"},{"name":"TDK Güncel Türkçe Sözlük","ref":"menteşe","url":null}],"confidence":"orta","reviewed":true},{"id":"kelepçe","word":"kelepçe","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":null,"ultimateOrigin":"otk","chain":[{"language":"otk","form":"bilek","meaning":"elin kola bağlandığı bölüm","period":null,"reconstructed":false},{"language":"tr","form":"bilekçe","meaning":"tutuklunun bileklerini bağlayan araç","period":null,"reconstructed":false},{"language":"tr","form":"kelepçe","meaning":"bilekleri birbirine bağlayan kilitli halkalar","period":null,"reconstructed":false}],"shortMeaning":"Bileklere takılarak ellerin hareketini sınırlayan kilitli halkalar.","currentMeaning":"Tutulan kişinin ellerini serbestçe kullanmasını veya kaçmasını önlemek için bileklerine takılan bağlantılı metal halkalar.","story":"Bir açıklamaya göre kelepçenin eski adı bilekçeydi ve takıldığı beden bölümünü doğrudan gösteriyordu. Bu açıklama, bilekçeden kelepçeye geçişi seslerin yer değiştirmesiyle ilişkilendirir. Farsça bir başlangıç önerisi de bulunduğundan köken tartışmalıdır; Türkçe açıklama benimsenirse bugünkü biçimin içinde tanınması zorlaşmış bir bilek saklıdır.","firstAttestation":{"source":"Mehmed Yeminî — Faziletname","period":"1519","form":"bilekçek"},"relatives":[{"word":"bilek","relation":"akraba"}],"alternatives":["Nişanyan Sözlük kelepçeyi Türkçe bilekçenin ses değişimine bağlar ve önceki Farsça açıklamasını yanlış olarak niteler.","TDK Güncel Türkçe Sözlük kelepçe için Farsça kelebçe kökenini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kelepçe maddesi","url":"https://www.nisanyansozluk.com/kelime/kelep%C3%A7e"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kelepçe","url":null}],"confidence":"orta","reviewed":true},{"id":"bahçe","word":"bahçe","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"bāġ","meaning":"pay, ayrılmış tarım toprağı; bahçe","period":null,"reconstructed":false},{"language":"fa","form":"bāġça","meaning":"bitki yetiştirilen yer","period":null,"reconstructed":false},{"language":"tr","form":"bahçe","meaning":"sebze, meyve veya süs bitkileri yetiştirilen alan","period":null,"reconstructed":false}],"shortMeaning":"Sebze, meyve, çiçek veya ağaç yetiştirilen alan.","currentMeaning":"Besin ya da süs amacıyla çeşitli bitkilerin yetiştirildiği toprak alan.","story":"Farsça bāġ, bahçenin yanında payı ve bir kişinin üretimine ayrılan toprağı da adlandırıyordu. Bahçeyi bu söze bağlayan açıklamada bāġça, işlenip bitki yetiştirilen alanın adıdır. Son bölüm küçültme ekiyle açıklanabilse de kelime yalnızca küçük yerleri anlatmaz; daha eski bağlantısı için başka bir öneri de vardır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"bakča"},"relatives":[],"alternatives":["Nişanyan Sözlük bāġça biçimini bāġ ve küçültme ekiyle ilişkilendirirken anlamda küçültme bulunmadığını belirtir; Avestaca vaχşa- 'mülk' bağlantısını da olasılık olarak sunar."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"bahçe maddesi","url":"https://www.nisanyansozluk.com/kelime/bah%C3%A7e"},{"name":"TDK Güncel Türkçe Sözlük","ref":"bahçe","url":null}],"confidence":"yüksek","reviewed":true},{"id":"bahar","word":"bahar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"wésr̥","meaning":"ilkbahar","period":null,"reconstructed":true},{"language":"peo","form":"vāhara","meaning":"ilkbahar","period":null,"reconstructed":false},{"language":"pal","form":"wahār","meaning":"ilkbahar","period":null,"reconstructed":false},{"language":"fa","form":"bahār","meaning":"ilkbahar","period":null,"reconstructed":false},{"language":"tr","form":"bahar","meaning":"kıştan sonra gelen mevsim","period": duyduğu bir acı gibi anlatır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"derdine"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"dert maddesi","url":"https://www.nisanyansozluk.com/kelime/dert"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dert maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"derman","word":"derman","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"dʰer-","meaning":"sağlıklı olmak, sağaltmak","period":null,"reconstructed":true},{"language":"ine","form":"dʰér-mn̥","meaning":"iyileşme","period":null,"reconstructed":true},{"language":"fa","form":"darmān","meaning":"ilaç ve tedavi","period":null,"reconstructed":false},{"language":"tr","form":"derman","meaning":"güç, takat; iyileştiren çare","period":null,"reconstructed":false}],"shortMeaning":"Bir işi yapmaya yeten güç; iyileştiren çare.","currentMeaning":"Bir şeyi yapabilmek için gereken güç ve dayanıklılık; bir sıkıntıyı gideren çare.","story":"Dermanın eski kökü, sağlıklı olma ve iyileşme düşüncesine uzanır. Farsçada darmān, hastayı sağlığına kavuşturan ilacı ve tedaviyi adlandırıyordu. Türkçede hem hastalığı gideren çareyi hem de insanın bedeninde duyduğu gücü anlatır; dermanı kalmayan kişi, hareket edecek takati bulamaz.","firstAttestation":{"source":"Edib Ahmed — Atebet-ül Hakayık","period":"<1250?","form":"darmānı"},"relatives":[{"word":"dharma","relation":"eş köken"}],"alternatives":null,"funFact":"Hint düşüncesindeki dharma adı ile derman, sağlamlık ve sağalma çevresindeki aynı eski kökü paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"derman maddesi","url":"https://www.nisanyansozluk.com/kelime/derman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"derman maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çare","word":"çare","rarity":"gündelik","partOfSpeech":"isim","formationType":
