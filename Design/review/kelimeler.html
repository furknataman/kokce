<title>Kökçe Kelime İncelemesi</title>
<style>
  :root{
    --kagit:#F3EAD6; --kagit-yumusak:#EDE0C9; --kart:#FBF6EA;
    --murekkep:#1B2A4A; --soluk:#6B6555; --cizgi:#DCCBA9;
    --altin:#8A6420; --altin-zemin:#F0E2C2; --isaret:#F6EBCF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --kagit:#12161F; --kagit-yumusak:#1A2130; --kart:#1A2130;
      --murekkep:#E9E0CA; --soluk:#9A9382; --cizgi:#2C3549;
      --altin:#D9AC63; --altin-zemin:#2A2416; --isaret:#241F13;
    }
  }
  :root[data-theme="dark"]{
    --kagit:#12161F; --kagit-yumusak:#1A2130; --kart:#1A2130;
    --murekkep:#E9E0CA; --soluk:#9A9382; --cizgi:#2C3549;
    --altin:#D9AC63; --altin-zemin:#2A2416; --isaret:#241F13;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0; background:var(--kagit); color:var(--murekkep);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .sarmal{max-width:900px; margin:0 auto; padding-inline:16px; padding-block:0}

  /* ---- üst çubuk ---- */
  .cubuk{
    position:sticky; top:0; z-index:9; background:var(--kagit);
    border-bottom:1px solid var(--cizgi); padding-block:12px 10px;
    margin-inline:-16px; padding-inline:16px;
  }
  .baslik{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 8px}
  .baslik h1{font:600 18px/1.2 Georgia,"Times New Roman",serif; margin:0; letter-spacing:.2px}
  .sayac{font-size:13px; color:var(--soluk)}
  .sayac b{color:var(--altin)}
  .alan{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  input[type=search], select, .dugme, input.not{
    font:inherit; color:var(--murekkep); background:var(--kart);
    border:1px solid var(--cizgi); border-radius:8px; padding:7px 10px;
  }
  input[type=search]{flex:1 1 220px; min-width:0}
  select{flex:0 1 auto; max-width:100%}
  .dugme{cursor:pointer; background:var(--kagit-yumusak)}
  .dugme:hover{border-color:var(--altin)}
  .dugme[aria-pressed="true"]{background:var(--altin-zemin); border-color:var(--altin); color:var(--altin); font-weight:600}
  .dugme.ana{background:var(--altin); border-color:var(--altin); color:var(--kagit); font-weight:600}

  /* ---- kart ---- */
  .liste{padding-block:12px}
  .kart{
    background:var(--kart); border:1px solid var(--cizgi); border-left:3px solid transparent;
    border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .kart.hatali{border-left-color:var(--altin); background:var(--isaret)}
  .satir1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .kelime{font:600 21px/1.25 Georgia,"Times New Roman",serif}
  .roz{
    font-size:11px; line-height:1.6; padding:1px 7px; border-radius:999px;
    border:1px solid var(--cizgi); color:var(--soluk); white-space:nowrap;
  }
  .roz.vurgu{border-color:var(--altin); color:var(--altin)}
  .roz.dolu{background:var(--altin-zemin); border-color:var(--altin); color:var(--altin); font-weight:600}
  .zincir{font-size:13px; color:var(--soluk); margin-top:5px; overflow-wrap:anywhere}
  .zincir .ok{color:var(--altin)}
  .kisa{font-size:14px; margin-top:3px; overflow-wrap:anywhere}
  .kontrol{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px}
  .kutu{display:flex; align-items:center; gap:5px; font-size:13px; color:var(--soluk); cursor:pointer; white-space:nowrap}
  .kutu input{accent-color:var(--altin); width:16px; height:16px; margin:0}
  .kart.hatali .kutu{color:var(--altin); font-weight:600}
  input.not{flex:1 1 160px; min-width:0; font-size:13px; padding:5px 8px}
  .ac{font-size:13px; padding:5px 9px}

  /* ---- ayrıntı ---- */
  .govde{border-top:1px dashed var(--cizgi); margin-top:10px; padding-top:8px}
  .govde h3{font:600 12px/1.4 inherit; letter-spacing:.08em; text-transform:uppercase; color:var(--altin); margin:12px 0 4px}
  .govde h3:first-child{margin-top:0}
  .govde p{margin:0 0 2px}
  .govde ol,.govde ul{margin:0; padding-left:20px}
  .govde li{margin-bottom:2px; overflow-wrap:anywhere}
  .govde a{color:var(--altin)}
  .meta{font-size:12px; color:var(--soluk); margin-bottom:6px; overflow-wrap:anywhere}
  .meta code{font-size:12px}
  .soluk{color:var(--soluk)}
  .bos{color:var(--soluk); text-align:center; padding:32px 0}

  /* ---- çıktı ---- */
  .cikti{border-top:1px solid var(--cizgi); padding-block:14px 28px}
  .cikti .alan{margin-bottom:8px}
  .cikti textarea{
    width:100%; min-height:120px; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--murekkep); background:var(--kart); border:1px solid var(--cizgi);
    border-radius:8px; padding:9px 10px; resize:vertical;
  }
  .durum{font-size:13px; color:var(--altin); min-height:1.2em; margin-top:6px}
  @media (max-width:430px){
    .kelime{font-size:19px}
    select{flex:1 1 46%}
  }
</style>

ime maddesi","url":"https://www.nisanyansozluk.com/kelime/kelime"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kelime maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"harf","word":"harf","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥarf","meaning":"keskin kenar; yazı birimi","period":null,"reconstructed":false},{"language":"tr","form":"harf","meaning":"alfabeyi oluşturan işaretlerden biri","period":null,"reconstructed":false}],"shortMeaning":"Alfabeyi oluşturan yazı işaretlerinden her biri.","currentMeaning":"Bir dilin yazısında sesleri göstermek için kullanılan alfabe işareti.","story":"Harf, Arapça ḥarf sözcüğünden gelir. Kaynak sözcüğün yazı birimi yanında keskin ağız veya kenar anlamı da vardır. Nişanyan Sözlük, yazıyla ilgili anlamı sivri uçla çizme ve kazıma eylemiyle ilişkilendirir.","firstAttestation":{"source":"Âşık Paşa, Garibnâme","period":"1330","form":"ḥarf"},"relatives":[{"word":"huruf","relation":"akraba"},{"word":"tahrif","relation":"akraba"}],"alternatives":null,"funFact":"Sivri uçla çizmekten yazmaya uzanan anlam yolu, Türkçe çizmek, Yunanca gráphō ve Latince scribere fiillerinde de görülür.","sources":[{"name":"Nişanyan Sözlük","ref":"harf maddesi","url":"https://www.nisanyansozluk.com/kelime/harf"},{"name":"TDK Güncel Türkçe Sözlük","ref":"harf maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"nokta","word":"nokta","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"arc","chain":[{"language":"arc","form":"nəḳūdtā","meaning":"nokta, yazıda kullanılan noktalama işareti","period":null,"reconstructed":false},{"language":"ar","form":"nuḳṭa(t)","meaning":"nokta, yazıda kullanılan noktalama işareti","period":null,"reconstructed":false},{"language":"tr","form":"nokta","meaning":"küçük iz veya noktalama işareti","period":null,"reconstructed":false}],"shortMeaning":"Küçük yuvarlak iz veya cümle sonunda kullanılan işaret.","currentMeaning":"Küçük bir iz, belirli bir yer ya da konum; yazıda çeşitli görevlerle kullanılan noktalama işareti.","story":"Noktanın kökeninde, delmek ve noktalamak anlamındaki Aramice nāḳad fiili bulunur. Bu kökten türeyen nəḳūdtā, Arami yazısında kullanılan noktalama işaretlerini adlandırıyordu. Sözcük Arapçaya nuḳṭa biçiminde geçti ve Türkçeye oradan alındı.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"nokta"},"relatives":[{"word":"noktalamak","relation":"türev"},{"word":"noktasal","relation":"türev"}],"alternatives":null,"funFact":"Kelimenin sonundaki t sesi Arapçadan değil, Aramicenin dişil ekinden gelir.","sources":[{"name":"Nişanyan Sözlük","ref":"nokta maddesi","url":"https://www.nisanyansozluk.com/kelime/nokta"}],"confidence":"orta","reviewed":true},{"id":"tarih","word":"tarih","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"taˀrīḫ","meaning":"tarih belirleme, olayları zaman sırasıyla kaydetme","period":null,"reconstructed":false},{"language":"tr","form":"tarih","meaning":"geçmiş olaylar ve bunların incelenmesi; gün bilgisi","period":null,"reconstructed":false}],"shortMeaning":"Geçmiş olaylar ve bunların incelenmesi; belirli bir günün bilgisi.","currentMeaning":"Geçmişteki olayların bütünü ve bunları inceleyen bilim; bir olayın gün, ay ve yıl olarak zamanı.","story":"Tarih, Arapça taˀrīḫ sözcüğünden alınmıştır. Sözcük, bir günün takvimdeki yerini belirleme ve olayları zaman sırasıyla yazma anlamlarını taşır. Gün belirtme ile geçmişi kaydetme arasındaki bağ, Türkçedeki iki temel anlamında korunur.","firstAttestation":{"source":"Rabguzi, Kısasü'l-Enbiya tercümesi","period":"1310","form":"taˀriḫni"},"relatives":[{"word":"tarihçi","relation":"türev"},{"word":"tarihsel","relation":"türev"},{"word":"müverrih","relation":"akraba"}],"alternatives":null,"funFact":"Tarih kelimesi, Sami dillerinde ay anlamına gelen warḫ biçimiyle ilişkilendirilir.","sources":[{"name":"Nişanyan Sözlük","ref":"tarih maddesi","url":"https://www.nisanyansozluk.com/kelime/tarih"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tarih maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"saat","word":"saat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sāˁa(t)","meaning":"süre, günün yirmi dörtte biri","period":null,"reconstructed":false},{"language":"tr","form":"saat","meaning":"altmış dakikalık süre; zamanı gösteren araç","period":null,"reconstructed":false}],"shortMeaning":"Altmış dakikalık süre veya zamanı gösteren araç.","currentMeaning":"Altmış dakikadan oluşan zaman birimi; zamanı ölçen ve gösteren araç.","story":"Saat, Arapça sāˁa sözcüğünden Türkçeye geçmiştir. Türkçenin eski tanıklıklarında genel olarak zamanı da anlatır. Zamanı ölçen aracın adı olarak kullanımı, süre bildiren anlamının yanında yerleşmiştir.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"sāˁatı"},"relatives":[{"word":"saatlik","relation":"türev"},{"word":"çalar saat","relation":"birleşik"}],"alternatives":null,"funFact":"Günün yirmi dörde bölünmesi milattan önce 600'den önce Babil'de benimsenmiş ve öbür dillere Aramice üzerinden yayılmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"saat maddesi","url":"https://www.nisanyansozluk.com/kelime/saat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"saat maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"vakit","word":"vakit","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"waḳt","meaning":"zamanın belirli bir noktası","period":null,"reconstructed":false},{"language":"tr","form":"vakit","meaning":"zaman, belirli süre veya an"," ain":[{"language":"ar","form":"taḳwīm","meaning":"düzeltme, konum belirleme, takvim","period":null,"reconstructed":false},{"language":"tr","form":"takvim","meaning":"günleri, ayları ve yılları düzenleyen sistem veya çizelge","period":null,"reconstructed":false}],"shortMeaning":"Günleri, ayları ve yılları düzenleyen sistem veya çizelge.","currentMeaning":"Zamanı gün, ay ve yıl gibi birimlere ayıran sistem; bu birimleri veya planlanan işleri gösteren çizelge.","story":"Takvim, Arapça taḳwīm sözcüğünden alınmıştır. Kaynak dilde düzeltme ve konum belirleme anlamları da vardır. Takvim anlamı, gök cisimlerinin yılın günlerine göre konumlarını gösteren astronomi tablolarıyla bağlantılıdır.","firstAttestation":{"source":"Hoca Mesud, Ferhengnâme-i Sadi tercümesi","period":"1342","form":"taḳvīm"},"relatives":[{"word":"kamet","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"takvim maddesi","url":"https://www.nisanyansozluk.com/kelime/takvim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"takvim maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"saniye","word":"saniye","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"s̱āniya(t)","meaning":"ikinci, ikinci olan şey","period":null,"reconstructed":false},{"language":"tr","form":"saniye","meaning":"dakikanın altmışta biri","period":null,"reconstructed":false}],"shortMeaning":"Dakikanın altmışta biri olan zaman birimi.","currentMeaning":"Bir dakikanın altmışta birine eşit zaman birimi; çok kısa süre.","story":"Saniye, Arapçada ikinci anlamındaki sāni sözcüğünün dişil biçiminden gelir. Türkçenin eski tanıklıklarında ikinci anlamıyla kullanılır. Zaman birimi anlamı, sözcüğün Türkçedeki tarihinde daha sonra belgelenir.","firstAttestation":{"source":"Neşrî, Kitab-ı Cihannümâ","period":"1492","form":"sāniye"},"relatives":[{"word":"sani","relation":"akraba"}],"alternatives":null,"funFact":"Fransızca seconde sözcüğü de ikinci ve saniye anlamları arasındaki aynı bağlantıyı taşır.","sources":[{"name":"Nişanyan Sözlük","ref":"saniye maddesi","url":"https://www.nisanyansozluk.com/kelime/saniye"},{"name":"TDK Güncel Türkçe Sözlük","ref":"saniye maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"dakika","word":"dakika","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"daḳīḳa(t)","meaning":"küçük parça, incelik, derecenin altmışta biri","period":null,"reconstructed":false},{"language":"tr","form":"dakika","meaning":"altmış saniyelik zaman birimi; açı birimi","period":null,"reconstructed":false}],"shortMeaning":"Altmış saniyelik zaman veya derecenin altmışta birlik açı birimi.","currentMeaning":"Saatin altmışta birine eşit süre; açı ölçümünde bir derecenin altmışta biri.","story":"Dakika, Arapça daḳīḳa sözcüğünden gelir. Kaynak biçim küçük parça, incelik ve ayrıntı anlamlarını taşır. Türkçedeki eski örneklerinde ince hüner anlamı görülür; zaman ölçüsü olarak kullanımı daha sonraki kaynaklarda belgelenir.","firstAttestation":{"source":"Seyf-i Sarayî, Gülistan tercümesi","period":"1391","form":"dakikanı"},"relatives":[{"word":"dakik","relation":"akraba"},{"word":"dikkat","relation":"akraba"}],"alternatives":null,"funFact":"Dakika ile dikkat, Arapçadaki dḳḳ köküne bağlıdır.","sources":[{"name":"Nişanyan Sözlük","ref":"dakika maddesi","url":"https://www.nisanyansozluk.com/kelime/dakika"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dakika maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"müddet","word":"müddet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"mudda(t)","meaning":"zamanda veya mekânda uzunluk, süre","period":null,"reconstructed":false},{"language":"tr","form":"müddet","meaning":"süre","period":null,"reconstructed":false}],"shortMeaning":"Bir olayın veya durumun devam ettiği süre.","currentMeaning":"Bir işin, olayın ya da durumun başlangıcı ile sonu arasında geçen zaman.","story":"Müddet, Arapça mudda sözcüğünden alınmıştır. Sözcük, uzamayla ilgili mdd köküne bağlıdır. Kaynak dilde zaman ve mekân boyunca uzanma düşüncesi bulunurken Türkçede süre anlamıyla kullanılır.","firstAttestation":{"source":"Edib Ahmed, Atebetü'l-Hakayık","period":"1250'den önce","form":"muddat"},"relatives":[{"word":"temdit","relation":"akraba"},{"word":"imdat","relation":"akraba"}],"alternatives":null,"funFact":"Müddet ile imdat, uzatma anlamındaki aynı Arapça köke dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"müddet maddesi","url":"https://www.nisanyansozluk.com/kelime/m%C3%BCddet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"müddet maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"mevsim","word":"mevsim","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"mawsim","meaning":"yıl içinde belirli bir işe veya olaya ayrılan dönem","period":null,"reconstructed":false},{"language":"tr","form":"mevsim","meaning":"yılın iklimle ayrılan bölümü; belirli bir işin dönemi","period":null,"reconstructed":false}],"shortMeaning":"Yılın iklim özellikleriyle ayrılan bölümü veya belirli bir dönem.","currentMeaning":"İlkbahar, yaz, sonbahar ve kıştan her biri; bir ürünün yetiştiği veya bir işin yapıldığı dönem.","story":"Mevsim, Arapça mawsim sözcüğünden gelir. Kaynak dilde hac, yağmur veya yolculuk gibi olayların yıl içindeki dönemlerini anlatır. Türkçede hem yılın iklimle ayrılan bölümleri hem de belirli işlerin uygun zamanı için kullanılır.","firstAttestation":{"source":"Âşık Paşa, Garibnâme","period":"1330","form":"mevsüm"},"relatives":[{"word":"mevsimlik","relation":"türev"},{"word":"mevsimsel","relation":"türev"},{"word":"muson","relation":"eş köken"}],"alternatives":null,"funFact":"Muson sözcüğü de mevsimin kaynağı olan Arapça mawsim biçimine dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"mevsim maddesi","url":"https://www.nisanyansozluk.com/kelime/mevsim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mevsim maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"sene","word":"sene","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sana(t)","meaning":"yıl","period":null,"reconstructed":false},{"language":"tr","form":"sene","meaning":"yıl","period":null,"reconstructed":false}],"shortMeaning":"On iki aylık zaman dilimi, yıl.","currentMeaning":"Takvimde on iki aydan oluşan zaman dilimi; yıl.","story":"Sene, Arapçada yıl anlamına gelen sana sözcüğünden alınmıştır. Türkçede aynı anlamdaki yıl sözcüğüyle birlikte kullanılır. Senelik ve senelerce gibi biçimler, bu alıntı tabana Türkçe ekler getirilerek oluşturulmuştur.","firstAttestation":{"source":"Neşrî, Kitab-ı Cihannümâ","period":"1492","form":"sene"},"relatives":[{"word":"senelik","relation":"türev"},{"word":"senelerce","relation":"türev"}],"alternatives":null,"funFact":"Sene ile saniye, Sami dillerinde iki ve yineleme anlamlarını taşıyan aynı kökle ilişkilendirilir.","sources":[{"name":"Nişanyan Sözlük","ref":"sene maddesi","url":"https://www.nisanyansozluk.com/kelime/sene"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sene maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"insan","word":"insan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"insān","meaning":"insanlık, insan soyu","period":null,"reconstructed":false},{"language":"tr","form":"insan","meaning":"kişi, insan türünün bireyi","period":null,"reconstructed":false}],"shortMeaning":"İnsan türünün bireyi, kişi.","currentMeaning":"Düşünme, dil kullanma ve toplumsal yaşam kurma yetileri bulunan insan türünün bireyi.","story":"İnsan, Arapçada insan soyunu topluca belirten insān kelimesinden alınmıştır. Türkçede hem türün bütününü hem de tek bir kişiyi anlatır. İnsanlık ve insanca gibi kelimeler Türkçe eklerle bu gövdeden türetilmiştir.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"insān"},"relatives":[{"word":"insanlık","relation":"türev"},{"word":"insanca","relation":"türev"},{"word":"ünsiyet","relation":"akraba"}],"alternatives":null,"funFact":"İnsan kelimesinin, Arapçada yakınlık ve alışkanlık anlamı taşıyan ünsiyet ile ilişkisi dikkat çekicidir.","sources":[{"name":"Nişanyan Sözlük","ref":"insan maddesi","url":"https://www.nisanyansozluk.com/kelime/insan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"insan maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"aile","word":"aile","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁāˀila(t)","meaning":"ev halkı","period":null,"reconstructed":false},{"language":"tr","form":"aile","meaning":"akrabalık veya evlilik bağlarıyla oluşan topluluk","period":null,"reconstructed":false}],"shortMeaning":"Akrabalık veya evlilik bağlarıyla birbirine bağlı kişiler topluluğu.","currentMeaning":"Evlilik, soy veya evlat edinme gibi bağlarla birbirine bağlı kişilerin oluşturduğu topluluk.","story":"Aile, Arapçada ev halkını anlatan ˁāˀila kelimesinden gelir. Kaynak dilde bu kelime, geçimini sağlamak ve bakmakla yükümlü olmak anlamındaki bir fiile bağlanır. Türkçede aynı kavram için uzun süre iyal kullanılmış, aile ancak 19. yüzyılda yaygınlaşmıştır.","firstAttestation":{"source":"Kitâb Fi'l-Fıkh Bi'l-Lisâni't-Türkî","period":"1421'den önce","form":"ˁāyilet"},"relatives":[{"word":"ailece","relation":"türev"},{"word":"ayal","relation":"akraba"}],"alternatives":null,"funFact":"Aile kelimesi eski sözlüklerde görülmez, Türkçede onun yerine iyal kullanılırdı.","sources":[{"name":"Nişanyan Sözlük","ref":"aile maddesi","url":"https://www.nisanyansozluk.com/kelime/aile"},{"name":"TDK Güncel Türkçe Sözlük","ref":"aile maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"akraba","word":"akraba","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"aḳribāˀ","meaning":"yakınlar, hısımlar","period":null,"reconstructed":false},{"language":"tr","form":"akraba","meaning":"soy veya evlilik bağı bulunan kişi","period":null,"reconstructed":false}],"shortMeaning":"Bir kimseyle soy veya evlilik bağı bulunan kişi.","currentMeaning":"Başka bir kişiyle soy, evlilik veya benzeri aile bağları üzerinden ilişkisi bulunan kimse.","story":"Akraba, Arapçada yakınlar anlamındaki aḳribāˀ kelimesinden alınmıştır. Bu biçim, yakın anlamına gelen ḳarīb kelimesinin çoğuludur. Türkçede tek kişi için de kullanılabildiğinden akrabalar biçiminde yeniden çoğullaştırılır.","firstAttestation":{"source":"Ahmed bin Kadı-i Manyas, Gülistan tercümesi","period":"1429","form":"aḳrıbā"},"relatives":[{"word":"akrabalık","relation":"türev"}],"alternatives":null,"funFact":"Akraba, Arapçada çoğul olmasına rağmen Türkçede tek bir kişiyi belirtebilir.","sources":[{"name":"Nişanyan Sözlük","ref":"akraba maddesi","url":"https://www.nisanyansozluk.com/kelime/akraba"},{"name":"TDK Güncel Türkçe Sözlük","ref":"akraba maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"ahbap","word":"ahbap","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"aḥbāb","meaning":"dostlar, sevilen kimseler","period":null,"reconstructed":false},{"language":"tr","form":"ahbap","meaning":"dost, yakın arkadaş","period":null,"reconstructed":false}],"shortMeaning":"Yakınlık duyulan, görüşülüp konuşulan dost.","currentMeaning":"Kendisiyle tanışıklık ve dostluk ilişkisi bulunan, samimi biçimde görüşülen kimse.","story":"Ahbap, Arapçada dostları ve sevilen kişileri belirten aḥbāb biçiminden gelir. Kelime, sevgili veya dost anlamındaki ḥabīb kelimesinin çoğuludur. Türkçede çoğulluk özelliğini yitirerek tek bir arkadaşın adı da olmuştur.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"aḥbāb"},"relatives":[{"word":"habip","relation":"akraba"},{"word":"muhabbet","relation":"akraba"}],"alternatives":null,"funFact":"Ahbap ile muhabbet, Arapçada sevme anlamıyla bağlantılı aynı köke dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"ahbap maddesi","url":"https://www.nisanyansozluk.com/kelime/ahbap"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ahbap maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"misafir","word":"misafir","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"musāfir","meaning":"yolcu, yolculuk eden","period":null,"reconstructed":false},{"language":"tr","form":"misafir","meaning":"konuk","period":null,"reconstructed":false}],"shortMeaning":"Bir yerde geçici olarak ağırlanan kimse, konuk.","currentMeaning":"Görüşmek veya geçici olarak kalmak amacıyla bir yere gelen ve orada ağırlanan kişi.","story":"Misafir, Arapçada yolculuk eden kişiyi anlatan musāfir kelimesinden alınmıştır. Sefer kelimesiyle aynı köke bağlıdır. Türkçedeki eski örneklerinde yolcu anlamı görülürken zamanla konuk anlamı yerleşmiştir.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"musāfir"},"relatives":[{"word":"sefer","relation":"akraba"},{"word":"misafirlik","relation":"türev"}],"alternatives":null,"funFact":"Misafir, Türkçede 19. yüzyılın başlarına kadar müsafir biçiminde yazılır ve söylenirdi.","sources":[{"name":"Nişanyan Sözlük","ref":"misafir maddesi","url":"https://www.nisanyansozluk.com/kelime/misafir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"misafir maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"davet","word":"davet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"daˁwa(t)","meaning":"çağırma, çağrı","period":null,"reconstructed":false},{"language":"tr","form":"davet","meaning":"çağrı, çağırma","period":null,"reconstructed":false}],"shortMeaning":"Birini bir yere veya bir etkinliğe çağırma.","currentMeaning":"Bir kimsenin gelmesini veya bir işe katılmasını isteme; bu amaçla yapılan çağrı ya da düzenlenen toplantı.","story":"Davet, Arapçada çağırmayı anlatan daˁwa kelimesinden gelir. Türkçede hem çağırma eylemini hem de insanların çağrıldığı toplantıyı belirtir. Davetli ve davetsiz kelimeleri bu gövdeye Türkçe eklerin getirilmesiyle oluşmuştur.","firstAttestation":{"source":"Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"daˁvat"},"relatives":[{"word":"davetli","relation":"türev"},{"word":"dua","relation":"akraba"}],"alternatives":null,"funFact":"Davet ile dua, Arapçada çağırma anlamını taşıyan aynı kökle bağlantılıdır.","sources":[{"name":"Nişanyan Sözlük","ref":"davet maddesi","url":"https://www.nisanyansozluk.com/kelime/davet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"davet maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"ziyaret","word":"ziyaret","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ziyāra(t)","meaning":"birinin yanına gitme","period":null,"reconstructed":false},{"language":"tr","form":"ziyaret","meaning":"birini veya bir yeri görmeye gitme","period":null,"reconstructed":false}],"shortMeaning":"Bir kimseyi veya bir yeri görmeye gitme.","currentMeaning":"Görüşmek, görmek, saygı göstermek veya incelemek amacıyla bir kişinin yanına ya da bir yere gitme.","story":"Ziyaret, Arapçada birinin yanına gitmeyi anlatan ziyāra kelimesinden alınmıştır. Türkçede kişiler kadar çeşitli yerler için de kullanılır. Ziyaretçi kelimesi, bu eylemi yapan kişiyi Türkçe bir ekle adlandırır.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"ziyārat"},"relatives":[{"word":"ziyaretçi","relation":"türev"},{"word":"mezar","relation":"akraba"}],"alternatives":null,"funFact":"Mezar kelimesi de aynı kökten gelir ve Arapçada ziyaret edilen yer anlamındadır.","sources":[{"name":"Nişanyan Sözlük","ref":"ziyaret maddesi","url":"https://www.nisanyansozluk.com/kelime/ziyaret"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ziyaret maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"sohbet","word":"sohbet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṣuḥba(t)","meaning":"arkadaşlık, dostluk etme","period":null,"reconstructed":false},{"language":"tr","form":"sohbet","meaning":"samimi karşılıklı konuşma","period":null,"reconstructed":false}],"shortMeaning":"Samimi bir ortamda yapılan karşılıklı konuşma.","currentMeaning":"İnsanların yakınlık içinde, genellikle gündelik konular üzerine karşılıklı konuşması.","story":"Sohbet, Arapçada arkadaşlığı ve dostça birlikteliği anlatan ṣuḥba kelimesinden gelir. Türkçede bu birlikteliğin konuşma yönü öne çıkmıştır. Kelimenin eski kullanımları, bugünkü konuşma anlamından daha geniş bir yakınlığı ifade edebilir.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"ṣoḥbat"},"relatives":[{"word":"hoşsohbet","relation":"birleşik"},{"word":"musahip","relation":"akraba"},{"word":"sahabe","relation":"akraba"}],"alternatives":null,"funFact":"Peygamberin arkadaşlarına verilen sahabe adı da aynı Arapça kökten gelir.","sources":[{"name":"Nişanyan Sözlük","ref":"sohbet maddesi","url":"https://www.nisanyansozluk.com/kelime/sohbet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sohbet maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"muhabbet","word":"muhabbet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"maḥabba(t)","meaning":"sevgi, dostluk","period":null,"reconstructed":false},{"language":"tr","form":"muhabbet","meaning":"sevgi, dostça konuşma","period":null,"reconstructed":false}],"shortMeaning":"Sevgi, yakınlık veya dostça konuşma.","currentMeaning":"Birine karşı duyulan sevgi ve bağlılık; samimi biçimde yapılan karşılıklı konuşma.","story":"Muhabbet, Arapçada sevgi ve dostluğu anlatan maḥabba kelimesinden alınmıştır. Türkçede sevgi anlamını korurken samimi konuşmayı da adlandırır. Ahbap ve habip kelimeleriyle aynı Arapça köke bağlıdır.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"maḥabbet"},"relatives":[{"word":"ahbap","relation":"akraba"},{"word":"habip","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"muhabbet maddesi","url":"https://www.nisanyansozluk.com/kelime/muhabbet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"muhabbet maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"selam","word":"selam","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"sux","chain":[{"language":"sux","form":"silim","meaning":"sağlık, esenlik, barış","period":null,"reconstructed":false},{"language":"akk","form":"şalāmu","meaning":"sağlık, esenlik, barış","period":null,"reconstructed":false},{"language":"ar","form":"salām","meaning":"esenlik, barış, selamlama sözü","period":null,"reconstructed":false},{"language":"tr","form":"selam","meaning":"esenlik ve iyi dilek bildiren söz veya hareket","period":null,"reconstructed":false}],"shortMeaning":"Karşılaşırken veya haber gönderirken bildirilen iyi dilek.","currentMeaning":"Birine esenlik, yakınlık ve saygı bildirmek için söylenen söz veya yapılan hareket.","story":"Selam, Arapçada esenlik ve barış anlamlarını taşıyan salām kelimesinden alınmıştır. Kelimenin geçmişi Akkadca şalāmu üzerinden Sümerce silim biçimine kadar götürülür. Türkçede hem selamlama sözünü hem de bu amaçla yapılan hareketi karşılar.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"salām"},"relatives":[{"word":"selamlaşmak","relation":"türev"},{"word":"selamet","relation":"akraba"}],"alternatives":null,"funFact":"Sümerce silim, milattan önce 3000'den başlayarak iki yüzü aşkın metinde geçer.","sources":[{"name":"Nişanyan Sözlük","ref":"selam maddesi","url":"https://www.nisanyansozluk.com/kelime/selam"}],"confidence":"orta","reviewed":true},{"id":"merhaba","word":"merhaba","rarity":"gündelik","partOfSpeech":"ünlem","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"marḥaban","meaning":"ferahlıkla; karşılama sözü","period":null,"reconstructed":false},{"language":"tr","form":"merhaba","meaning":"selamlama sözü","period":null,"reconstructed":false}],"shortMeaning":"Karşılaşma sırasında kullanılan selamlama sözü.","currentMeaning":"Birini karşılarken, onunla karşılaşırken veya konuşmaya başlarken kullanılan selamlama sözü.","story":"Merhaba, Arapça marḥaban karşılama sözünden gelir. Bu söz, ferahlık ve genişlik anlamlarıyla bağlantılı marḥab kelimesinin zarf biçimidir. Türkçede belirli bir zamanla sınırlı olmayan bir selamlama olarak kullanılır.","firstAttestation":{"source":"Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"marhabā"},"relatives":[{"word":"merhabalaşmak","relation":"türev"}],"alternatives":null,"funFact":"En eski Türkçe tanıklıkta merhaba, sana genişlik olsun sözüyle açıklanır.","sources":[{"name":"Nişanyan Sözlük","ref":"merhaba maddesi","url":"https://www.nisanyansozluk.com/kelime/merhaba"},{"name":"TDK Güncel Türkçe Sözlük","ref":"merhaba maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"teşekkür","word":"teşekkür","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"taşakkur","meaning":"şükretme, minnet bildirme","period":null,"reconstructed":false},{"language":"tr","form":"teşekkür","meaning":"iyilik karşısında duyulan minneti bildirme","period":null,"reconstructed":false}],"shortMeaning":"Bir iyilik veya yardım karşısında minnetini bildirme.","currentMeaning":"Birinin yaptığı iyilik, yardım veya gösterdiği ilgi karşısında duyulan memnuniyet ve minnetin dile getirilmesi.","story":"Teşekkür, Arapçada şükretmeyi anlatan taşakkur kelimesinden alınmıştır. Şükür ve müteşekkir kelimeleriyle aynı kökü paylaşır. Türkçede etmek yardımcı fiiliyle kullanılarak minnet bildiren bir eylem kurar.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"teşekkür"},"relatives":[{"word":"şükür","relation":"akraba"},{"word":"müteşekkir","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"teşekkür maddesi","url":"https://www.nisanyansozluk.com/kelime/te%C5%9Fekk%C3%BCr"},{"name":"TDK Güncel Türkçe Sözlük","ref":"teşekkür maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"cevap","word":"cevap","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"cawāb","meaning":"yanıt","period":null,"reconstructed":false},{"language":"tr","form":"cevap","meaning":"soruya veya söze verilen karşılık","period":null,"reconstructed":false}],"shortMeaning":"Bir soruya, söze veya isteğe verilen karşılık.","currentMeaning":"Bir soruya, söze, yazıya veya isteğe karşılık olarak bildirilen söz, yazı ya da tepki.","story":"Cevap, Arapçada yanıt anlamına gelen cawāb kelimesinden alınmıştır. Kutadgu Bilig'de de bir söze karşılık verme bağlamında görülür. Türkçede cevaplamak ve cevaplandırmak gibi fiillerin gövdesini oluşturur.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"cawāb"},"relatives":[{"word":"cevaplamak","relation":"türev"},{"word":"hazırcevap","relation":"birleşik"}],"alternatives":null,"funFact":"Cevabın Arapça kökünde öteye geçme ve aşma anlamları bulunur.","sources":[{"name":"Nişanyan Sözlük","ref":"cevap maddesi","url":"https://www.nisanyansozluk.com/kelime/cevap"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cevap maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"sual","word":"sual","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"suˀāl","meaning":"soru, sorma","period":null,"reconstructed":false},{"language":"tr","form":"sual","meaning":"soru","period":null,"reconstructed":false}],"shortMeaning":"Bir konuda bilgi almak için yöneltilen soru.","currentMeaning":"Bir şey öğrenmek veya bir açıklama istemek amacıyla yöneltilen söz, soru.","story":"Sual, Arapçada sormayı ve soruyu anlatan suˀāl kelimesinden gelir. Aynı kök, mesele ve mesul kelimelerinde de bulunur. Türkçede sual sormak ve sual etmek gibi ifadeler içinde kullanılır.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"suwāl"},"relatives":[{"word":"mesele","relation":"akraba"},{"word":"mesul","relation":"akraba"}],"alternatives":null,"funFact":"Sual ile mesul, Arapçada sorma anlamıyla bağlantılı aynı köke dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"sual maddesi","url":"https://www.nisanyansozluk.com/kelime/sual"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sual maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"haber","word":"haber","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḫabar","meaning":"bilgi, bilinen şey","period":null,"reconstructed":false},{"language":"tr","form":"haber","meaning":"bir olay veya durum hakkında iletilen bilgi","period":null,"reconstructed":false}],"shortMeaning":"Bir olay veya durum hakkında iletilen bilgi.","currentMeaning":"Bir olay, kişi veya durum hakkında edinilen ya da başkasına aktarılan bilgi; basın ve yayın yoluyla duyurulan olay anlatımı.","story":"Haber, Arapçada bilgi ve bilinen şey anlamları taşıyan ḫabar kelimesinden alınmıştır. Kaynak dilde deneme ve deneyerek öğrenmeyle bağlantılı bir köke dayanır. Türkçede gündelik bilgi aktarımını da gazetecilik ürününü de adlandırır.","firstAttestation":{"source":"Yusuf Has Hacib, Kutadgu Bilig","period":"1069","form":"ḫabar"},"relatives":[{"word":"haberci","relation":"türev"},{"word":"ihbar","relation":"akraba"},{"word":"muhabir","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"haber maddesi","url":"https://www.nisanyansozluk.com/kelime/haber"},{"name":"TDK Güncel Türkçe Sözlük","ref":"haber maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"hikâye","word":"hikâye","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥikāya(t)","meaning":"anlatma, anlatı","period":null,"reconstructed":false},{"language":"tr","form":"hikâye","meaning":"olay anlatısı, öykü","period":null,"reconstructed":false}],"shortMeaning":"Gerçek veya tasarlanmış olayları aktaran anlatı, öykü.","currentMeaning":"Gerçek ya da kurmaca olayları anlatan sözlü veya yazılı metin; olayları sınırlı bir kapsamda işleyen edebî tür.","story":"Hikâye, Arapçada anlatmayı ve anlatıyı belirten ḥikāya kelimesinden gelir. Kaynak dilde anlatma ile taklit etme anlamlarını taşıyan bir fiille bağlantılıdır. Türkçenin eski metinlerinde hikâyet biçimi de görülür.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"hıkāyet"},"relatives":[{"word":"hikâyeci","relation":"türev"},{"word":"tahkiye","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hikâye maddesi","url":"https://www.nisanyansozluk.com/kelime/hik%C3%A2ye"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hikâye maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"masal","word":"masal","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"mas̱al","meaning":"mesel, öğretici hikâye","period":null,"reconstructed":false},{"language":"tr","form":"mesel","meaning":"öğretici hikâye, ibretli anlatı","period":null,"reconstructed":false},{"language":"tr","form":"masal","meaning":"olağanüstü olaylar içerebilen geleneksel anlatı","period":null,"reconstructed":false}],"shortMeaning":"Olağanüstü olaylar içerebilen, gelenek yoluyla aktarılan kurmaca anlatı.","currentMeaning":"Genellikle belirsiz bir zaman ve yerde geçen, olağanüstü kişi ve olaylara yer verebilen geleneksel anlatı; mecazen inandırıcı bulunmayan söz.","story":"Masal, Arapça mas̱al kelimesinden gelen meselin Türkçede ayrışmış biçimidir. Mesel öğüt veren kısa anlatıyı karşılarken masal, olağanüstü olayların geçtiği geleneksel anlatının adı olmuştur. İki biçimin söyleyişçe ne zaman ayrıldığı eski yazılı metinlerden anlaşılamamaktadır.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"masal"},"relatives":[{"word":"mesel","relation":"akraba"},{"word":"masalcı","relation":"türev"}],"alternatives":null,"funFact":"Masal ile mesel aynı Arapça kelimeye dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"masal maddesi","url":"https://www.nisanyansozluk.com/kelime/masal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"masal maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"şaka","word":"şaka","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şaḳāˀ","meaning":"mutsuz olma, bedbahtlık","period":null,"reconstructed":false},{"language":"tr","form":"şaka","meaning":"güldürme veya eğlendirme amacı taşıyan söz ve davranış","period":null,"reconstructed":false}],"shortMeaning":"Güldürmek veya eğlendirmek amacıyla söylenen söz ya da yapılan davranış.","currentMeaning":"Ciddi bir amaç taşımadan, güldürmek veya eğlendirmek için söylenen söz ya da yapılan hareket.","story":"Şakanın kökeni kesin değildir. Arapçada bedbahtlık anlamına gelen şaḳāˀ biçiminden alınmış olabilir, fakat oradan güldürmeye uzanan anlam yolu açıklanabilmiş değildir. Türkçedeki en eski tanıklıkta kelime hâlâ mutsuzluk anlamını taşır. Eğlence anlamı ancak bir yüzyıl sonra görülür.","firstAttestation":{"source":"Hoca Sadeddin Efendi, Tacü't-Tevârih","period":"1574","form":"şaḳā"},"relatives":[{"word":"şakacı","relation":"türev"},{"word":"şakalaşmak","relation":"türev"}],"alternatives":["Arapçada bedbahtlık anlamına gelen şaḳāˀ biçiminden alınmış olabilir, ancak anlam değişimi açıklanmış değildir.","Farsçada şaka anlamına gelen şūḫī kelimesiyle anlam birleşmesi yaşanmış olabilir."],"funFact":"Şakanın Türkçedeki en eski tanıklığında kelime, eğlence değil bedbahtlık anlamındadır.","sources":[{"name":"Nişanyan Sözlük","ref":"şaka maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Faka"}],"confidence":"orta","reviewed":true},{"id":"zevk","word":"zevk","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ẕawḳ","meaning":"tatma, tat","period":null,"reconstructed":false},{"language":"tr","form":"zevk","meaning":"haz, hoşlanma, beğeni","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyden duyulan haz veya kişisel beğeni.","currentMeaning":"Bir şeyin verdiği hoş duygu ve haz; kişinin güzellik, uygunluk veya hoşluk bakımından yaptığı seçimleri belirleyen beğeni.","story":"Zevk, Arapçada tatmayı ve tadı anlatan ẕawḳ kelimesinden alınmıştır. Türkçede bedensel tat almanın ötesinde hoşlanmayı ve beğeniyi ifade eder. Sanat zevki gibi kullanımlarda kelimenin değerlendirme ve seçme yönü öne çıkar.","firstAttestation":{"source":"Âşık Paşa, Garib-nâme","period":"1330","form":"ẕevḳ"},"relatives":[{"word":"zevkli","relation":"türev"},{"word":"zevksiz","relation":"türev"}],"alternatives":null,"funFact":"Zevk, Türkçedeki en eski tanıklığında bile tatma değil, doğrudan keyif anlamındadır.","sources":[{"name":"Nişanyan Sözlük","ref":"zevk maddesi","url":"https://www.nisanyansozluk.com/kelime/zevk"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zevk maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"keyif","word":"keyif","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"kayf","meaning":"hâl, ruh hâli","period":null,"reconstructed":false},{"language":"tr","form":"keyif","meaning":"hoşnutluk, ruh hâli, istek","period":null,"reconstructed":false}],"shortMeaning":"Hoşnutluk, neşe veya kişinin içinde bulunduğu ruh hâli.","currentMeaning":"Kişinin bedensel ve ruhsal durumu; hoşnutluk ve neşe; bir şeyi yapma isteği veya kişisel tercih.","story":"Keyif, Arapçada hâl ve ruh hâli anlamlarını taşıyan kayf kelimesinden gelir. Kaynak dilde bu kelime, nasıl sorusunu karşılayan kayfa sözünden türetilmiştir. Türkçede hem iyi hissetmeyi hem de kişinin canının istediği gibi davranmasını anlatan kullanımlar kazanmıştır.","firstAttestation":{"source":"Kâtip Çelebi, Fezleke","period":"1653","form":"keyf"},"relatives":[{"word":"keyifli","relation":"türev"},{"word":"keyifsiz","relation":"türev"},{"word":"keyfiyet","relation":"akraba"}],"alternatives":null,"funFact":"Keyif kelimesinin kökeninde Arapçanın nasıl anlamındaki soru sözü bulunur.","sources":[{"name":"Nişanyan Sözlük","ref":"keyif maddesi","url":"https://www.nisanyansozluk.com/kelime/keyif"},{"name":"TDK Güncel Türkçe Sözlük","ref":"keyif maddesi","url":"https://sozluk.gov.tr/"}],"confidence":"yüksek","reviewed":true},{"id":"akıl","word":"akıl","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁaḳala","meaning":"dizginlemek; düşünerek değerlendirmek","period":null,"reconstructed":false},{"language":"ar","form":"ˁaḳl","meaning":"ölçülü düşünme ve yargılama gücü","period":null,"reconstructed":false},{"language":"tr","form":"akıl","meaning":"düşünme ve kavrama yetisi","period":"14. yy","reconstructed":false}],"shortMeaning":"Düşünme, kavrama ve yargılama yetisi.","currentMeaning":"İnsanın düşünmesini, ilişkileri kavramasını ve değerlendirme yapmasını sağlayan yeti.","story":"Akıl sözünün ardında, hareketi sınırlayan bir bağ ve dizgin resmi vardır. Arapçada ˁaḳala, hem dizginlemeyi hem de bir şeyi düşünerek değerlendirmeyi anlatıyordu. Bu fiilden doğan ˁaḳl, insanın düşüncesine ölçü koyan yetinin adı oldu. Türkçede akıl, bu denetleme fikrini de taşıyarak düşünme ve kavrama gücünü anlatır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"aḫel"},"relatives":[{"word":"akıllı","relation":"türev"},{"word":"akılsız","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"akıl maddesi","url":"https://www.nisanyansozluk.com/kelime/ak%C4%B1l"},{"name":"TDK Güncel Türkçe Sözlük","ref":"akıl maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"fikir","word":"fikir","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"fakara","meaning":"düşünmek ve akıl işletmek","period":null,"reconstructed":false},{"language":"ar","form":"fikr","meaning":"düşünme yoluyla oluşan düşünce","period":null,"reconstructed":false},{"language":"tr","form":"fikir","meaning":"düşünce veya görüş","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir konuda oluşan düşünce veya görüş.","currentMeaning":"Zihinde oluşan düşünce, bir konuya ilişkin görüş ya da tasarı.","story":"Fikir, Arapçada düşünme eylemini anlatan fakara ile aynı ailede doğdu. Bu eylemden türeyen fikr, zihnin çalışmasıyla ortaya çıkan düşünceyi adlandırdı. Türkçeye geçerken fikr biçiminin iki son ünsüzü arasına bir ünlü yerleşti; düşünmenin ürünü olan fikir böylece bugünkü ses yapısına kavuştu.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"fikr"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"fikir maddesi","url":"https://www.nisanyansozluk.com/kelime/fikir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"fikir maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"zihin","word":"zihin","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ẕihn","meaning":"kavrama ve düşünme yetisi","period":null,"reconstructed":false},{"language":"tr","form":"zihin","meaning":"düşünme ve anlama süreçlerinin bütünü","period":"14. yy veya öncesi","reconstructed":false}],"shortMeaning":"Düşünme, anlama ve hatırlama süreçlerinin bütünü.","currentMeaning":"Duygu ve davranışların dışında kalan düşünme, anlama ve hatırlama gibi ruhsal süreçlerin bütünü.","story":"Arapçadaki ẕihn, insanın karşısındaki şeyi anlayıp kavrayabilmesini adlandırıyordu. Türkçedeki eski kullanımlarda zihnin açılmasından ya da bozulmasından söz edilmesi, bu yetinin işleyişine odaklanıldığını gösterir. Bugün zihin, düşüncelerin oluştuğu ve işlendiği süreçlerin bütünü için kullanılır.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1400 öncesi","form":"ẕihni"},"relatives":[{"word":"zihinsel","relation":"türev"},{"word":"zihniyet","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"zihin maddesi","url":"https://www.nisanyansozluk.com/kelime/zihin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zihin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hafıza","word":"hafıza","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥafaẓa","meaning":"koruyup saklamak","period":null,"reconstructed":false},{"language":"ar","form":"ḥāfiẓa(t)","meaning":"koruyan, saklayan dişil varlık","period":null,"reconstructed":false},{"language":"tr","form":"hafıza","meaning":"bilgi ve yaşantıları bellekte tutma yetisi","period":"17. yy","reconstructed":false}],"shortMeaning":"Bilgi ve yaşantıları saklayıp hatırlama yetisi.","currentMeaning":"Öğrenilenleri ve yaşananları zihinde tutmayı, gerektiğinde yeniden hatırlamayı sağlayan bellek.","story":"Hafızanın geçmişinde bir şeyi kaybolmasın diye koruyup saklama işi vardır. Arapça ḥafaẓa fiilinden türeyen ḥāfiẓa, saklayan varlığı anlatıyordu. Türkçede önce kuvvet-i hafıza ifadesinde görülen bu koruyucu görev, bilginin zihinde tutulmasına uygulandı. Hafıza böylece yaşananları ve öğrenilenleri saklayan yetinin adı oldu.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"hāfıza"},"relatives":[{"word":"muhafaza","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hafıza maddesi","url":"https://www.nisanyansozluk.com/kelime/haf%C4%B1za"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hafıza maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hayal","word":"hayal","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḫāla","meaning":"öyle olduğunu sanmak","period":null,"reconstructed":false},{"language":"ar","form":"ḫayāl","meaning":"düşte beliren görüntü; korkuluk","period":null,"reconstructed":false},{"language":"tr","form":"hayal","meaning":"zihinde canlandırılan görüntü veya tasarı","period":"14. yy","reconstructed":false}],"shortMeaning":"Zihinde canlandırılan görüntü, istek veya tasarı.","currentMeaning":"Gerçekte bulunmasa da zihinde canlandırılan görüntü ya da gerçekleşmesi arzulanan tasarı.","story":"Hayalin gerisindeki Arapça ḫāla fiili, bir şeyi öyle sanmayı anlatıyordu. Ondan türeyen ḫayāl, uykuda beliren görüntüyü adlandırdı; görünen şey ile gerçek arasındaki mesafe kelimenin merkezindeydi. Türkçede hayal, bu görüntü alanından zihinde kurulan tasarılara ve gerçekleşmesi özlenen şeylere uzandı.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"ḫayālden"},"relatives":[{"word":"hayalperest","relation":"birleşik"}],"alternatives":null,"funFact":"Hayalin Arapçadaki eski karşılıklarından biri, tarlaya dikilen korkuluktur.","sources":[{"name":"Nişanyan Sözlük","ref":"hayal maddesi","url":"https://www.nisanyansozluk.com/kelime/hayal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hayal maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"rüya","word":"rüya","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"raˀā","meaning":"görmek","period":null,"reconstructed":false},{"language":"ar","form":"ruˀyā","meaning":"düşte görülen görüntü","period":null,"reconstructed":false},{"language":"tr","form":"rüya","meaning":"uykuda yaşanan düş","period":"17. yy","reconstructed":false}],"shortMeaning":"Uykuda görülen görüntü ve yaşantılar.","currentMeaning":"Uyku sırasında zihinde beliren görüntülerin, olayların ve yaşantıların oluşturduğu düş.","story":"Rüyanın başlangıcında Arapça raˀā, yani görme eylemi bulunur. Bu eylemden doğan ruˀyā, göz önünde beliren bir görüngüyü ve uykudaki düşü adlandırdı. Türkçede rüya, uyurken yaşanan bu görme deneyimini anlatmayı sürdürür; rüya görmek ifadesi de kelimenin kökündeki eylemi yeniden söyler.","firstAttestation":{"source":"Evliya Çelebi — Seyahatname","period":"1665","form":"rüyā"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"rüya maddesi","url":"https://www.nisanyansozluk.com/kelime/r%C3%BCya"},{"name":"TDK Güncel Türkçe Sözlük","ref":"rüya maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"niyet","word":"niyet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nawā","meaning":"bir işi yapmayı tasarlamak","period":null,"reconstructed":false},{"language":"ar","form":"niyya(t)","meaning":"yapılması düşünülen iş, tasarı","period":null,"reconstructed":false},{"language":"tr","form":"niyet","meaning":"bir şeyi yapmaya yönelik düşünce","period":"11. yy","reconstructed":false}],"shortMeaning":"Bir şeyi yapmaya yönelik önceden oluşmuş düşünce.","currentMeaning":"Henüz eyleme geçmeden bir işi yapmaya yönelme ve onu gerçekleştirmeyi düşünme durumu.","story":"Arapça nawā, henüz yapılmamış bir işi zihinde tasarlamayı anlatıyordu. Bu fiilden türeyen niyya, eylemin kendisinden önce gelen planı adlandırdı. Türkçedeki erken kullanımında da insanın gönlünde taşıdığı yöneliş öne çıkar; niyet bugün aynı biçimde yapılacak işin düşüncedeki başlangıcını anlatır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"niyat"},"relatives":[{"word":"niyetlenmek","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"niyet maddesi","url":"https://www.nisanyansozluk.com/kelime/niyet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"niyet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"karar","word":"karar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳarra","meaning":"durmak, yerinde kalmak; bir seçime varmak","period":null,"reconstructed":false},{"language":"ar","form":"ḳarār","meaning":"sabitlik; kesinleşmiş hüküm veya seçim","period":null,"reconstructed":false},{"language":"tr","form":"karar","meaning":"düşünme sonunda kesinleşen yargı","period":"11. yy","reconstructed":false}],"shortMeaning":"Düşünme sonunda varılan kesin yargı veya seçim.","currentMeaning":"Bir konu ya da sorun üzerine düşünüldükten sonra benimsenen kesin yargı veya tercih.","story":"Kararın Arapçadaki geçmişi, durmak ve bir yerde kalmakla başlar. Ḳarār, hem yerinden oynamayan bir durumu hem de tereddüdün sona erdiği kesin seçimi anlatıyordu. Türkçedeki erken tanıklığında dünyanın kalıcı olmayışı bu kelimeyle dile getirilir. Bugünkü karar vermekte de düşüncenin seçenekler arasında dolaşıp birinde durması fikri yaşar.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ḳarārı"},"relatives":[{"word":"kararsız","relation":"türev"},{"word":"kararname","relation":"birleşik"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"karar maddesi","url":"https://www.nisanyansozluk.com/kelime/karar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"karar maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sebep","word":"sebep","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sabab","meaning":"ip; bir yere ulaştıran yol veya araç; gerekçe","period":null,"reconstructed":false},{"language":"tr","form":"sebep","meaning":"bir durumu ortaya çıkaran etken","period":"11. yy","reconstructed":false}],"shortMeaning":"Bir olayın veya durumun ortaya çıkmasına yol açan şey.","currentMeaning":"Bir olayın gerçekleşmesini ya da bir durumun oluşmasını sağlayan etken veya neden.","story":"Arapça sabab, ip gibi somut bir nesneyi de bir yere ulaştıran yolu ve aracı da adlandırıyordu. Bu anlam alanında öne çıkan ortak düşünce, bir şeye ulaşmayı sağlamaktı. Mantık dilinde kelime, bir sonuca götüren gerekçeye uygulandı. Türkçedeki sebep de bir olayın hangi yoldan ortaya çıktığını anlatan neden sözüne dönüştü.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"säbäb"},"relatives":[{"word":"sebeplenmek","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sebep maddesi","url":"https://www.nisanyansozluk.com/kelime/sebep"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sebep maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"netice","word":"netice","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nataca","meaning":"hayvanın yavru doğurması","period":null,"reconstructed":false},{"language":"ar","form":"natīca(t)","meaning":"doğan yavru; ortaya çıkan ürün","period":null,"reconstructed":false},{"language":"tr","form":"netice","meaning":"bir süreçten doğan sonuç","period":"15. yy","reconstructed":false}],"shortMeaning":"Bir işin, olayın veya düşünme sürecinin sonucu.","currentMeaning":"Bir olay, işlem ya da düşünme süreci sonunda ortaya çıkan durum veya ürün.","story":"Neticenin başlangıcında hayvanın yavru doğurması vardır. Arapça nataca fiilinden türeyen natīca, doğan yavruyu, ardından bir şeyden elde edilen ürünü adlandırdı. Mantıkçılar iki öncülden çıkan yargıyı da bu doğum resmiyle anlattılar. Türkçede netice, bir işten veya düşünceden doğan sonuç olarak yerleşti.","firstAttestation":{"source":"Ferec ba'd eş-şidde","period":"1451","form":"netiycesi"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"netice maddesi","url":"https://www.nisanyansozluk.com/kelime/netice"},{"name":"TDK Güncel Türkçe Sözlük","ref":"netice maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hayat","word":"hayat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥayya","meaning":"yaşamak, canlı bulunmak","period":null,"reconstructed":false},{"language":"ar","form":"ḥayā(t)","meaning":"canlılık ve yaşama durumu","period":null,"reconstructed":false},{"language":"tr","form":"hayat","meaning":"yaşam, canlı olma durumu","period":"14. yy","reconstructed":false}],"shortMeaning":"Canlı olma durumu ve sürdürülen yaşam.","currentMeaning":"Bir varlığın canlı olması ve yaşamını sürdürmesi durumu.","story":"Hayat, Arapçada canlı bulunmayı anlatan ḥayya fiilinden doğdu. Bu fiilin adı olan ḥayā, yaşayan varlığın durumunu dile getiriyordu. Türkçede de önce canlılığı anlatan kelime, gece hayatı gibi ifadelerde yaşamanın belirli alanlarını adlandıracak biçimde genişledi.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"hayāt"},"relatives":[{"word":"ḥay/ḥayah","relation":"eş köken"}],"alternatives":null,"funFact":"1930-1955 arasında hayat kadını ifadesi, meslek sahibi kadınlar için de kullanılıyordu.","sources":[{"name":"Nişanyan Sözlük","ref":"hayat maddesi, yaşam anlamı","url":"https://www.nisanyansozluk.com/kelime/hayat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hayat maddesi, canlı olma anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ömür","word":"ömür","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁamara","meaning":"canlılık kazandırmak","period":null,"reconstructed":false},{"language":"ar","form":"ˁumr","meaning":"yaşama, yaşam","period":null,"reconstructed":false},{"language":"tr","form":"ömür","meaning":"bir canlının yaşadığı süre","period":null,"reconstructed":false}],"shortMeaning":"Bir canlının yaşadığı süre.","currentMeaning":"Bir canlının doğumundan ölümüne kadar sürdürdüğü yaşam ve bu yaşamın süresi.","story":"Ömrün Arapçadaki kökü ˁamara, bir şeye canlılık kazandırmayı anlatıyordu. Aynı kökten türeyen ˁumr, yaşamın adı oldu. Türkçede ömür, bu canlılığı zaman boyutuyla anlatır; geçirilen, uzayan veya sona eren yaşam süresini öne çıkarır.","firstAttestation":null,"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ömür maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%B6m%C3%BCr"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ömür maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nefes","word":"nefes","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nafas","meaning":"alınıp verilen soluk","period":null,"reconstructed":false},{"language":"tr","form":"nefes","meaning":"solunum sırasında alınan veya verilen hava","period":"11. yy","reconstructed":false}],"shortMeaning":"Solunum sırasında alınan veya verilen soluk.","currentMeaning":"Solunumla içeri alınan ya da dışarı verilen hava ve bu alıp verme hareketi.","story":"Nefes, Arapça nafas biçiminde göğse girip çıkan soluğu adlandırıyordu. Akkadca ve Aramice-Süryanicedeki akrabaları da soluk alma çevresinde toplanır. Türkçeye geçtiğinde kelime bu bedensel anlamını korudu; eski kullanımında insanın yaşamı, alacağı solukların sayısıyla anlatılır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"nafas"},"relatives":[{"word":"napāşu","relation":"eş köken"},{"word":"naphşā/npheşā","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nefes maddesi","url":"https://www.nisanyansozluk.com/kelime/nefes"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nefes maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ruh","word":"ruh","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"rūḥ","meaning":"soluk, hafif rüzgâr; can; mecazen hoş koku","period":null,"reconstructed":false},{"language":"tr","form":"ruh","meaning":"can, varlığın manevi yönü","period":"14. yy","reconstructed":false}],"shortMeaning":"Can veya insanın manevi varlığı.","currentMeaning":"Canlılığı sağlayan manevi varlık olarak düşünülen can; insanın bedensel olmayan yönü.","story":"Ruhun Arapçadaki karşılığı rūḥ, hem soluğu ve esintiyi hem de canı adlandırıyordu. Böylece hissedilen hava hareketi ile bedene yaşam veren görünmez varlık aynı kelimede buluştu. Türkçeye taşınan ruhun manevi anlamının arkasında bu nefes resmi vardır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"rūḥ"},"relatives":[{"word":"ruhani","relation":"akraba"},{"word":"ruhaniyet","relation":"akraba"}],"alternatives":null,"funFact":"Eski Yunanca pneûma ve Latince spiritus da hem nefesi hem ruhu anlatır.","sources":[{"name":"Nişanyan Sözlük","ref":"ruh maddesi","url":"https://www.nisanyansozluk.com/kelime/ruh"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ruh maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"beden","word":"beden","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"badan","meaning":"insanın gövdesi; kısa kolsuz giysi veya zırh","period":null,"reconstructed":false},{"language":"tr","form":"beden","meaning":"gövde; vücudun bütünü","period":"14. yy","reconstructed":false}],"shortMeaning":"Gövde veya vücudun bütünü.","currentMeaning":"Baş, kol ve bacakların bağlandığı gövde; geniş kullanımda insanın veya hayvanın bütün vücudu.","story":"Arapça badan, vücudun baş ve uzuvlar dışında kalan orta bölümünü adlandırıyordu. Aynı kelime kısa, kolsuz bir giysi veya zırh için de kullanılıyor; gövde ile onu örten parça aynı ad altında buluşuyordu. Türkçede beden, gövde anlamını korurken vücudun tamamını da anlatacak biçimde kullanılır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"beden"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"beden maddesi","url":"https://www.nisanyansozluk.com/kelime/beden"},{"name":"TDK Güncel Türkçe Sözlük","ref":"beden maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sıhhat","word":"sıhhat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṣaḥḥa","meaning":"sağlıklı veya doğru olmak","period":null,"reconstructed":false},{"language":"ar","form":"ṣiḥḥa(t)","meaning":"sağlıklı bulunma durumu","period":null,"reconstructed":false},{"language":"tr","form":"sıhhat","meaning":"sağlık","period":"14. yy","reconstructed":false}],"shortMeaning":"Sağlıklı olma durumu.","currentMeaning":"Vücudun sağlıklı olması, hastalık veya rahatsızlık bulunmaması durumu.","story":"Sıhhatin dayandığı Arapça ṣaḥḥa fiili, hem sağlıklı olmayı hem de doğru olmayı anlatıyordu. Bedenin iyi durumda olması ile bir şeyin doğru çıkması aynı kökte buluştu. Bu kökten doğan ṣiḥḥa, Türkçede sağlık adı olarak yerleşti ve sıhhatler olsun dileğinde yaşamayı sürdürdü.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"ṣıḥḥat"},"relatives":[{"word":"sıhhiye","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sıhhat maddesi","url":"https://www.nisanyansozluk.com/kelime/s%C4%B1hhat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sıhhat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"maraz","word":"maraz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"mariża","meaning":"hastalık hâlinde bulunmak","period":null,"reconstructed":false},{"language":"ar","form":"maraż","meaning":"hastalık durumu","period":null,"reconstructed":false},{"language":"tr","form":"maraz","meaning":"hastalık, rahatsızlık","period":"14. yy","reconstructed":false}],"shortMeaning":"Hastalık veya rahatsızlık.","currentMeaning":"Sağlığın bozulmasıyla ortaya çıkan hastalık veya rahatsızlık.","story":"Maraz, Arapçada hasta durumda bulunmayı anlatan mariża fiilinin adlaşmış karşılığıyla bağlantılıdır. Maraż, bedenin bu durumunu hastalık adı altında topladı; Akkadcadaki akrabası da hasta olmayı anlatır. Türkçeye maraz olarak geçen kelime, erken kullanımında tedavisi bulunmayan bir dert için de kullanılmıştır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"marażdur"},"relatives":[{"word":"marāṣu","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"maraz maddesi","url":"https://www.nisanyansozluk.com/kelime/maraz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"maraz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ilaç","word":"ilaç","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁilāc","meaning":"iyileştirici madde veya çare","period":null,"reconstructed":false},{"language":"tr","form":"ilaç","meaning":"hastalığı önlemek veya gidermek için kullanılan madde","period":"14. yy","reconstructed":false}],"shortMeaning":"Hastalığı önlemek veya iyileştirmek için kullanılan madde.","currentMeaning":"Bir hastalığı önlemek, tedavi etmek veya etkilerini hafifletmek amacıyla kullanılan madde.","story":"Arapça ˁilāc, hastalığa karşı kullanılan dermanı ve çareyi adlandırıyordu. Türkçedeki erken bir kullanımda sabır da ilaç olarak sunulur; böylece kelime maddi bir tedavinin ötesinde sıkıntıyı giderecek yolu da anlatır. Bugün ilaç denince öncelikle tedavide kullanılan madde düşünülür, fakat çare olma fikri kelimenin içinde yaşamayı sürdürür.","firstAttestation":{"source":"Rabguzi — Kısasü'l-Enbiya tercümesi","period":"1310","form":"ˁilācı"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ilaç maddesi","url":"https://www.nisanyansozluk.com/kelime/ila%C3%A7"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ilaç maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"merhem","word":"merhem","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLan maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"mide","word":"mide","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁadā","meaning":"bir yerden ötekine geçmek","period":null,"reconstructed":false},{"language":"ar","form":"maˁida(t)/maˁda(t)","meaning":"besinin toplandığı kursak","period":null,"reconstructed":false},{"language":"tr","form":"mide","meaning":"yemek borusundan gelen besini işleyen sindirim organı","period":"14. yy","reconstructed":false}],"shortMeaning":"Yemek borusu ile ince bağırsak arasındaki sindirim organı.","currentMeaning":"Omurgalılarda yemek borusuyla onikiparmak bağırsağı arasında bulunan ve besinleri işleyen organ; omurgasızlarda sindirim kanalının buna karşılık gelen bölümü.","story":"Mide, Arapça maˁida veya maˁda biçiminde besinin toplandığı kursağı adlandırıyordu. Bu adın bir yerden ötekine geçmeyi anlatan ˁadā fiiliyle bağlantısı muhtemeldir; böyle bir bağlantı organı besinin geçişi üzerinden açıklar. Türkçenin erken metinlerinde maˁde ve maˁıde biçimleri görülür, daha sonra mide biçimi yerleşir.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"maˁdeye"},"relatives":[],"alternatives":["Nişanyan Sözlük, maˁida(t)/maˁda(t) biçimini ˁadā fiiline muhtemel bir türeme ilişkisiyle bağlar; zincirin ilk iki halkası arasındaki ilişki kesin değildir."],"funFact":"Codex Cumanicus'ta 1303'te mide karşılığı olarak Türkçe kursak kaydedilmiştir.","sources":[{"name":"Nişanyan Sözlük","ref":"mide maddesi","url":"https://www.nisanyansozluk.com/kelime/mide"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mide maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kalp","word":"kalp","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳalb","meaning":"yürek","period":null,"reconstructed":false},{"language":"tr","form":"kalp","meaning":"kanı dolaşıma pompalayan organ","period":"14. yy","reconstructed":false}],"shortMeaning":"Kanın vücutta dolaşmasını sağlayan organ.","currentMeaning":"Göğüste bulunan, kasılıp gevşeyerek kanı akciğerlere ve bedenin diğer bölümlerine pompalayan organ.","story":"Arapçada ḳalb, göğüste atan yüreğin adıydı ve Türkçeye de bu organın adı olarak geçti. Kelime, Türkçede zaten bulunan yürek ile yan yana yaşadı. Zamanla krizin ve ameliyatın anlatıldığı tıp dilinde yerini aldı.","firstAttestation":{"source":"Gülşehri — Mantıku't-Tayr","period":"1317","form":"ḳalbüm"},"relatives":[],"alternatives":null,"funFact":"Akkadca ḳablu ile Arapça ḳalb, biri ötekinden alınmış değil, aynı Sami kökten gelen kardeş biçimlerdir.","sources":[{"name":"Nişanyan Sözlük","ref":"kalp maddesi","url":"https://www.nisanyansozluk.com/kelime/kalp"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kalp maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nabız","word":"nabız","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nabaḍa","meaning":"kalbin atması","period":null,"reconstructed":false},{"language":"ar","form":"nabḍ","meaning":"kalbin atışı","period":null,"reconstructed":false},{"language":"tr","form":"nabız","meaning":"atardamarda hissedilen düzenli vuru","period":null,"reconstructed":false}],"shortMeaning":"Kalbin çalışmasıyla atardamarlarda hissedilen vuru.","currentMeaning":"Kalbin pompaladığı kanın oluşturduğu basınç dalgasının atardamar üzerinde hissedilen vuruşu.","story":"Nabzın başlangıcında Arapça nabaḍa fiilinin anlattığı kalp hareketi bulunur. Bu hareketin adı olan nabḍ, Türkçede nabız biçimini aldı. Kelime, göğsün içindeki atışı bilekte parmakla duyulan vuru üzerinden anlatır.","firstAttestation":{"source":"Yadigâr-ı İbni Şerif","period":"<1421?","form":"nabż"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nabız maddesi","url":"https://www.nisanyansozluk.com/kelime/nab%C4%B1z"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nabız maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hücre","word":"hücre","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥacara","meaning":"kapatmak, yasaklamak","period":null,"reconstructed":false},{"language":"ar","form":"ḥucra(t)","meaning":"çevresi kapalı mekân, oda","period":null,"reconstructed":false},{"language":"tr","form":"hücre","meaning":"küçük oda; canlının temel yapısal birimi","period":"15. yy","reconstructed":false}],"shortMeaning":"Canlıların yapısını oluşturan en küçük canlı birim.","currentMeaning":"Canlılarda beslenme, büyüme ve çoğalma gibi yaşamsal işlevlerin gerçekleştiği temel yapı birimi.","story":"Hücrenin ilk dünyası mikroskobun altında değil, duvarlarla çevrili bir odadaydı. Arapça ḥacara fiilindeki kapatma düşüncesi, ḥucra adında kapalı bir mekâna dönüştü ve Türkçeye oda adı olarak taşındı. Biyoloji dilinde Fransızca cellule karşılanırken önce küçük oda fikrini taşıyan hüceyre kullanıldı; ardından hücre, canlının küçük yapı biriminin adı olarak yerleşti.","firstAttestation":{"source":"Ahmed b. Kadı-i Manyas — Gülistan tercümesi","period":"1429","form":"ḥucreyi"},"relatives":[{"word":"hüceyre","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hücre maddesi","url":"https://www.nisanyansozluk.com/kelime/h%C3%BCcre"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hücre maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"vücut","word":"vücut","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"wacada","meaning":"bulmak, bulunmak, var olmak","period":null,"reconstructed":false},{"language":"ar","form":"wucūd","meaning":"var olma, varlık","period":null,"reconstructed":false},{"language":"tr","form":"vücut","meaning":"beden; var olma","period":"14. yy","reconstructed":false}],"shortMeaning":"İnsan veya hayvan bedeninin bütünü.","currentMeaning":"Bir insanın veya hayvanın bütün organları ve uzuvlarıyla oluşturduğu bedensel yapı.","story":"Vücudun geçmişinde önce etten ve kemikten bir beden değil, var olma düşüncesi vardır. Arapça wacada fiilinin bulunma ve var olma çevresindeki anlamları, wucūd adında varlık kavramına dönüşür. Türkçeye taşınan kelime, soyut varlığın yanında insanın somut bedensel bütününü de anlatmaya başladı.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"vücūd"},"relatives":[{"word":"vücutçu","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"vücut maddesi","url":"https://www.nisanyansozluk.com/kelime/v%C3%BCcut"},{"name":"TDK Güncel Türkçe Sözlük","ref":"vücut maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şifa","word":"şifa","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şafā","meaning":"sağlığına kavuşturmak","period":null,"reconstructed":false},{"language":"ar","form":"şifāˀ","meaning":"sağlığa kavuşma, tedavi","period":null,"reconstructed":false},{"language":"tr","form":"şifa","meaning":"hastalıktan kurtulma","period":"11. yy","reconstructed":false}],"shortMeaning":"Hastalıktan kurtulup sağlığa kavuşma.","currentMeaning":"Bedeni veya ruhu etkileyen bir hastalığın iyileşmesiyle sağlığın yeniden kazanılması.","story":"Şifanın ardında, hastayı iyileştirmeyi anlatan Arapça şafā fiili bulunur. Bu eylemden doğan şifāˀ, hem tedaviye hem de onunla beklenen iyileşmeye ad oldu. Türkçe kelimeyi, hastalığın sona ermesi ve sağlığın geri gelmesi çevresindeki anlamıyla benimsedi.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"şifā"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"şifa maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Fifa"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şifa maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hekim","word":"hekim","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥakīm","meaning":"bilgelik ve bilim sahibi kişi; tabip","period":null,"reconstructed":false},{"language":"tr","form":"hekim","meaning":"hastalıkları tanıyıp tedavi eden kişi","period":null,"reconstructed":false}],"shortMeaning":"Hastalıkları teşhis ve tedavi eden kişi.","currentMeaning":"Tıp eğitimi almış, insan sağlığını korumak ve hastalıkları teşhis edip tedavi etmekle uğraşan kişi.","story":"Hekim adı, Arapça ḥakīm kelimesinin taşıdığı geniş bilgi ve bilgelik dünyasından ayrılarak belirginleşti. Bu adın kapsamına filozof da hastayı tedavi eden kişi de giriyordu. Türkçede hakîm ile hekim arasındaki yazım ayrımı harf devriminden önce belirgin değildi; bugün hekim denince bu geniş alanın tıpla uğraşan kişisi anlaşılır.","firstAttestation":{"source":"Akşam gazetesi","period":"1930","form":"Hekim"},"relatives":[{"word":"hakîm","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hekim maddesi","url":"https://www.nisanyansozluk.com/kelime/hekim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hekim maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cenaze","word":"cenaze","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"pal","chain":[{"language":"pal","form":"ganz/gazīnag","meaning":"gömülü değer, hazine","period":null,"reconstructed":false},{"language":"ar","form":"cināza","meaning":"ölüyü taşıyan tabut","period":null,"reconstructed":false},{"language":"tr","form":"cenaze","meaning":"defnedilmek üzere hazırlanmış ölü","period":"14. yy","reconstructed":false}],"shortMeaning":"
