işanyan Sözlük","ref":"bohem maddesi","url":"https://www.nisanyansozluk.com/kelime/bohem"},{"name":"TDK Güncel Türkçe Sözlük","ref":"bohem maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"burlesk","word":"burlesk","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"it","chain":[{"language":"it","form":"burla","meaning":"şaka, alay","period":null,"reconstructed":false},{"language":"it","form":"burlesco","meaning":"şaka, alay","period":null,"reconstructed":false},{"language":"fr","form":"burlesque","meaning":"kaba komedi, alaycı taklit","period":null,"reconstructed":false},{"language":"tr","form":"burlesk","meaning":"abartılı komikliğe ve alaya dayanan sanat türü","period":null,"reconstructed":false}],"shortMeaning":"Abartılı komiklik ve alay üzerine kurulan sanat türü.","currentMeaning":"Özellikle edebiyat ve gösteri sanatlarında abartı, alay ve gülünçleştirmeye dayanan tür.","story":"İtalyanca burla, bir şakanın veya alayın çevresinde dolaşan kelimeydi. Burlesco üzerinden İngilizce ve Fransızcadaki burlesque biçimine ulaştığında, komik taklitleri ve kaba güldürüyü adlandırmaya başladı. Türkçeye aktarımında Fransızca öne çıkmakla birlikte İngilizce yolu da verilir. Bugünkü kullanımında şaka, tek bir davranıştan çıkarak eserin bütününü kuran bir sanat anlayışına dönüşmüştür.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1949","form":"burlesk"},"relatives":null,"alternatives":["Nişanyan Sözlük veren dil halkasını İngilizce / Fransızca olarak sunarken TDK Güncel Türkçe Sözlük Fransızca burlesque biçimini gösterir."],"funFact":"Amerikan İngilizcesinde burlesque, 1870'lerden itibaren striptiz gösterilerini de adlandırmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"burlesk maddesi","url":"https://www.nisanyansozluk.com/kelime/burlesk"},{"name":"TDK Güncel Türkçe Sözlük","ref":"burlesk maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"dekadan","word":"dekadan","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"cadere, cas-","meaning":"düşmek","period":null,"reconstructed":false},{"language":"la","form":"decadere","meaning":"gerilemek, yozlaşmak","period":null,"reconstructed":false},{"language":"la","form":"decadens","meaning":"gerilemek, yozlaşmak","period":null,"reconstructed":false},{"language":"fr","form":"décadent","meaning":"yozlaşmış, sefahate düşkün; bohem","period":null,"reconstructed":false},{"language":"tr","form":"dekadan","meaning":"natüralizme karşı çıkarak sembolizme öncülük eden sanatçı","period":null,"reconstructed":false}],"shortMeaning":"Fransa'da sembolizme öncülük eden sanatçılara verilen ad.","currentMeaning":"19. yüzyılın sonlarında Fransa'da natüralizme karşı çıkan ve sembolizmin gelişmesine öncülük eden sanatçı.","story":"Latince cadere, bir şeyin bulunduğu yerden düşmesini anlatıyordu. Geç Latincede bu düşüş, decadere ile bozulma ve gerilemenin resmi hâline geldi. Fransızca décadent aynı olumsuz değerlendirmeyi kişilere ve yaşayışlara taşıdı. Edebiyatta ise kelime, natüralizme karşı çıkan ve sembolizme yönelen sanatçıların adı olarak özelleşti; Türkçeye de bu sanat tartışmalarının terimi olarak yerleşti.","firstAttestation":{"source":"Ahmed Rasim — Şehir Mektupları","period":"1897","form":"dekadanlar"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"dekadan maddesi","url":"https://www.nisanyansozluk.com/kelime/dekadan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dekadan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"determinist","word":"determinist","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"déterministe","meaning":"olayların nedenlerle belirlendiğini savunan kişi","period":null,"reconstructed":false},{"language":"tr","form":"determinist","meaning":"belirlenimcilik görüşünü benimseyen kişi","period":null,"reconstructed":false}],"shortMeaning":"Olayların nedenlerle belirlendiğini savunan kişi.","currentMeaning":"Olayların ve eylemlerin önceki nedenler ve koşullar tarafından belirlendiği görüşünü benimseyen kişi.","story":"Fransızca déterministe, bir olayın ortaya çıkışını onu hazırlayan nedenlere bağlayan düşüncenin savunucusunu adlandırır. Bu bakışta her sonuç, kendinden önceki koşulların devamı olarak ele alınır. Türkçeye alınan determinist de aynı düşünsel tutumu benimseyen kişiyi belirtir.","firstAttestation":null,"relatives":[{"word":"determinizm","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"determinist maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"diyalektik","word":"diyalektik","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"légō, log-","meaning":"söz söylemek","period":null,"reconstructed":false},{"language":"grc","form":"dialégō","meaning":"karşılıklı konuşmak, tartışmak","period":null,"reconstructed":false},{"language":"grc","form":"dialektikḗ téχnē","meaning":"karşılıklı konuşmak, tartışmak","period":null,"reconstructed":false},{"language":"fr","form":"dialectique","meaning":"karşıt savlarla düşünme ve tartışma yöntemi","period":null,"reconstructed":false},{"language":"tr","form":"diyalektik","meaning":"çelişkileri inceleyerek ilerleyen düşünme yöntemi","period":null,"reconstructed":false}],"shortMeaning":"Çelişkileri inceleyip aşmaya yönelen düşünme yöntemi.","currentMeaning":"Gerçeklikteki karşıtlıkları ve çelişkileri inceleyerek bunların aşılma yollarını araştıran akıl yürütme yöntemi.","story":"Eski Yunancada légō ile başlayan söz söyleme eylemi, dialégō biçiminde karşılıklı konuşmaya ve tartışmaya açıldı. Dialektikḗ téχnē bu karşılaşmayı bir düşünme becerisi olarak adlandırdı. Fransızca dialectique içinde karşı karşıya gelen savlar, akıl yürütmenin araçlarına dönüştü. Türkçedeki diyalektik de çelişkileri düşüncenin ilerleyişine katan bu yöntemi sürdürür.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1932","form":"diyalektik"},"relatives":[{"word":"diyalog","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"diyalektik maddesi","url":"https://www.nisanyansozluk.com/kelime/diyalektik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"diyalektik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"diksiyon","word":"diksiyon","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"dicere, dict-","meaning":"söz söylemek","period":null,"reconstructed":false},{"language":"la","form":"dictio","meaning":"söz söylemek","period":null,"reconstructed":false},{"language":"fr","form":"diction","meaning":"sözleri ifade ediş tarzı","period":null,"reconstructed":false},{"language":"tr","form":"diksiyon","meaning":"ses, vurgu ve durakları düzenleyerek konuşma biçimi","period":null,"reconstructed":false}],"shortMeaning":"Sesleri, vurguları ve durakları düzenleyerek söyleme biçimi.","currentMeaning":"Konuşurken sesleri açıkça çıkarma, vurguları yerleştirme ve anlamın gerektirdiği durakları kullanma biçimi.","story":"Latince dicere, insanın söz söyleme eylemini adlandırıyordu; dictio da aynı eylemi bir ad altında topladı. Fransızca diction ile dikkat, sözün söylenmesinden nasıl söylendiğine yöneldi. Türkçede diksiyon denince seslerin açıklığı, vurgunun yeri ve konuşmanın durakları birlikte düşünülür.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1938","form":"diksiyon"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"diksiyon maddesi","url":"https://www.nisanyansozluk.com/kelime/diksiyon"},{"name":"TDK Güncel Türkçe Sözlük","ref":"diksiyon maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"diletant","word":"diletant","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"lacere, lect-","meaning":"cezbetmek, kendine çekmek","period":null,"reconstructed":false},{"language":"la","form":"delacere, delect-","meaning":"cezbetmek, kendine çekmek","period":null,"reconstructed":false},{"language":"it","form":"dilettere","meaning":"haz duymak","period":null,"reconstructed":false},{"language":"it","form":"dilettante","meaning":"haz duyan kişi, sanatla ilgilenen meraklı","period":null,"reconstructed":false},{"language":"fr","form":"dilettante","meaning":"bir alanla amatörce ilgilenen kişi","period":null,"reconstructed":false},{"language":"tr","form":"diletant","meaning":"sanatla zevk için, amatörce uğraşan kişi","period":null,"reconstructed":false}],"shortMeaning":"Sanatla uzmanlık iddiasından çok zevk için uğraşan kişi.","currentMeaning":"Sanata veya bir bilgi alanına profesyonel uzmanlık düzeyinde olmadan, kişisel merak ve zevkle yönelen kişi.","story":"Diletantın geçmişinde bir şeyin insana çekici gelmesi ve haz vermesi bulunur. Latince kökten gelişen İtalyanca dilettere, ilgiyi zevk alma eylemine taşır. Dilettante bu zevkin peşinden sanata yönelen kişiyi adlandırırken Fransızcada amatörlük yönü öne çıktı. Türkçedeki diletant da sanatla uğraşının merkezine kişisel merakı ve zevki koyan kişiyi anlatır.","firstAttestation":{"source":"Milliyet gazetesi","period":"1929","form":"dilentantelerimiz"},"relatives":null,"alternatives":null,"funFact":"İngilizcede sevinç ve zevki anlatan delight, diletant ile aynı Latince kökü paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"diletant maddesi","url":"https://www.nisanyansozluk.com/kelime/diletant"}],"confidence":"orta","reviewed":true},{"id":"diskur","word":"diskur","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"currere, curs-","meaning":"koşmak","period":null,"reconstructed":false},{"language":"la","form":"discurrere, discurs-","meaning":"ayrı yönlere koşmak, tartışmak","period":null,"reconstructed":false},{"language":"la","form":"discursus","meaning":"koşuşturma; tartışma; tartışılan konuda söylev","period":null,"reconstructed":false},{"language":"fr","form":"discours","meaning":"söylev, söylem","period":null,"reconstructed":false},{"language":"tr","form":"diskur","meaning":"nutuk, uzun ve iddialı konuşma","period":null,"reconstructed":false}],"shortMeaning":"Nutuk veya uzun ve iddialı konuşma.","currentMeaning":"Bir konuda nutuk verircesine yapılan uzun, iddialı konuşma.","story":"Diskurun en eski halkasında Latince currere, yani koşma eylemi vardır. Discurrere ile farklı yönlere dağılan bu hareket, tartışmanın karşılıklı ilerleyişini de anlatmaya başladı. Discursus artık hem koşuşturmayı hem tartışmayı ve söylevi adlandırıyordu. Fransızca discours üzerinden Türkçeye geçen diskurda bedensel hareket kayboldu, uzun konuşma kaldı.","firstAttestation":{"source":"Ali Seydi — Lisan-ı Osmanide Müstamel Lugat-i Ecnebiye","period":"1911","form":"diskur"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"diskur maddesi","url":"https://www.nisanyansozluk.com/kelime/diskur"},{"name":"TDK Güncel Türkçe Sözlük","ref":"diskur maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"eklektik","word":"eklektik","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"légō, log-","meaning":"seçmek, bir araya toplamak","period":null,"reconstructed":false},{"language":"grc","form":"eklégō","meaning":"içinden seçerek ayırmak","period":null,"reconstructed":false},{"language":"grc","form":"eklektikós","meaning":"seçim yapan, seçmeci","period":null,"reconstructed":false},{"language":"fr","form":"éclectique","meaning":"farklı kaynaklardan seçerek oluşturan, karma","period":null,"reconstructed":false},{"language":"tr","form":"eklektik","meaning":"çeşitli anlayışlardan seçilen unsurları birleştiren","period":null,"reconstructed":false}],"shortMeaning":"Farklı anlayışlardan seçilen unsurları bir araya getiren.","currentMeaning":"Tek bir sisteme bağlı kalmadan çeşitli düşünce, yöntem veya üsluplardan seçilen öğeleri birleştiren.","story":"Eski Yunancada légō, seçip toplama işini anlatıyordu. Eklégō biçiminde bir yığının içinden belirli parçaları ayırma hareketi belirginleşti; eklektikós da böyle seçim yapanı niteledi. Fransızca éclectique, farklı düşünce ve üsluplardan parçalar seçme anlayışını taşıdı. Türkçedeki eklektik, bu parçalarla kurulan karma bütünleri anlatır.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1937","form":"eklektik"},"relatives":[{"word":"eklektizm","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"eklektik maddesi","url":"https://www.nisanyansozluk.com/kelime/eklektik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"eklektik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"elips","word":"elips","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"leípō, lip-","meaning":"eksik olmak","period":null,"reconstructed":false},{"language":"grc","form":"elleípō","meaning":"bir bölümünü eksik bırakmak","period":null,"reconstructed":false},{"language":"grc","form":"éllipsis","meaning":"bir bölümünü eksik bırakmak","period":null,"reconstructed":false},{"language":"fr","form":"ellipse, ellipt-","meaning":"eksilme; belirli bir kapalı geometrik eğri","period":null,"reconstructed":false},{"language":"tr","form":"elips","meaning":"iki odağa uzaklıkları toplamı sabit olan kapalı eğri","period":null,"reconstructed":false}],"shortMeaning":"İki odağa uzaklıkları toplamı sabit olan noktaların kapalı eğrisi.","currentMeaning":"Düzlemde, iki ayrı sabit noktaya uzaklıklarının toplamı değişmeyen noktaların oluşturduğu kapalı eğri.","story":"Elipsin geçmişindeki Eski Yunanca leípō, bir şeyin eksik oluşunu anlatır. Elleípō ve éllipsis biçimleri de eksik bırakma düşüncesini sürdürür. Eksiklik bildiren bu ad, Yunancada bir geometrik eğriyi de adlandırmış; Fransızca ellipse üzerinden Türkçeye taşınmıştır. Türkçede elips denince bu eski eksiklik düşüncesinden çok, iki odağı bulunan kapalı şekil öne çıkar.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1936","form":"elips"},"relatives":[{"word":"eliptik","relation":"akraba"},{"word":"elipsoit","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"elips maddesi","url":"https://www.nisanyansozluk.com/kelime/elips"},{"name":"TDK Güncel Türkçe Sözlük","ref":"elips maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"empresyonizm","word":"empresyonizm","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"impressionnisme","meaning":"izlenimleri öne çıkaran sanat akımı","period":null,"reconstructed":false},{"language":"tr","form":"empresyonizm","meaning":"sanatta izlenimcilik","period":null,"reconstructed":false}],"shortMeaning":"Duyusal izlenimleri öne çıkaran sanat akımı, izlenimcilik.","currentMeaning":"Özellikle resimde ışık, renk ve anlık algının uyandırdığı izlenimleri öne çıkaran sanat anlayışı.","story":"Fransızca impressionnisme adının merkezinde, görülen şeyin kişide bıraktığı izlenim bulunur. Bu anlayışta bir manzaranın değişen ışığı ve renkleri, o anki algının parçaları olarak resme taşınır. Türkçeye empresyonizm biçiminde geçen ad, bu izlenimi öne çıkaran sanat yaklaşımını anlatır.","firstAttestation":null,"relatives":[{"word":"empresyonist","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"empresyonizm maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"enstantane","word":"enstantane","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"stāre, stat-","meaning":"durmak","period":null,"reconstructed":false},{"language":"la","form":"instāre","meaning":"durmak, mevcut ve hazır bulunmak","period":null,"reconstructed":false},{"language":"la","form":"instans","meaning":"hazır bulunan, şimdiki","period":null,"reconstructed":false},{"language":"fr","form":"instant","meaning":"çok kısa zaman parçası","period":null,"reconstructed":false},{"language":"fr","form":"instantané","meaning":"bir anda gerçekleşen","period":null,"reconstructed":false},{"language":"tr","form":"enstantane","meaning":"çok kısa pozlamayla fotoğraf çekme yöntemi","period":null,"reconstructed":false}],"shortMeaning":"Hareketi çok kısa pozlamayla fotoğraflama yöntemi.","currentMeaning":"Hızlı hareketi yakalamak için saniyenin 1/25'i veya daha kısa bir ışıklama süresiyle fotoğraf çekme yöntemi.","story":"Enstantanenin başlangıcında Latince stāre ile anlatılan durma eylemi vardır. Instāre ve instans biçimlerinde bu düşünce, hazır bulunmaya ve şimdi elde olana yöneldi. Fransızca instant, şimdiki zamanı küçücük bir an olarak adlandırırken instantané bir anda gerçekleşeni niteledi. Türkçede kelime fotoğrafçılığa yerleşerek hareketin çok kısa bir ışıklamayla yakalanmasını anlatır oldu.","firstAttestation":{"source":"Ahmed Midhat Ef. — çeşitli yazıları","period":"<1900","form":"Enstantane"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"enstantane maddesi","url":"https://www.nisanyansozluk.com/kelime/enstantane"},{"name":"TDK Güncel Türkçe Sözlük","ref":"enstantane maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"epilog","word":"epilog","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"lógos","meaning":"söz","period":null,"reconstructed":false},{"language":"grc","form":"epílogos","meaning":"söz","period":null,"reconstructed":false},{"language":"fr","form":"épilogue","meaning":"anlatıyı kapatan son söz","period":null,"reconstructed":false},{"language":"tr","form":"epilog","meaning":"eserin sonundaki tamamlayıcı bölüm","period":null,"reconstructed":false}],"shortMeaning":"Bir eserin sonunda yer alan tamamlayıcı bölüm, son söz.","currentMeaning":"Ana anlatının ardından gelerek eseri tamamlayan, sonuçlandıran veya sonrasını açıklayan bölüm.","story":"Eski Yunanca lógos, sözü adlandıran temel kelimelerden biriydi. Ondan kurulan epílogos ile söz, konuşmanın veya anlatının kapanışında özel bir yer edindi. Fransızca épilogue üzerinden Türkçeye geçen epilog, ana anlatı bittikten sonra eseri tamamlayan son bölümü adlandırır.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1951","form":"epilog"},"relatives":[{"word":"prolog","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"epilog maddesi","url":"https://www.nisanyansozluk.com/kelime/epilog"},{"name":"TDK Güncel Türkçe Sözlük","ref":"epilog maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"estet","word":"estet","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"esthète","meaning":"sanatta güzelliği başlıca değer sayan kişi","period":null,"reconstructed":false},{"language":"tr","form":"estet","meaning":"sanat eserlerini değerlendirirken güzelliği üstün tutan kişi","period":null,"reconstructed":false}],"shortMeaning":"Sanatta güzelliği en üstün değer olarak gören kişi.","currentMeaning":"Sanat eserlerine yaklaşımında güzelliği temel ve en yüksek ölçüt kabul eden kişi.","story":"Fransızca esthète, sanat karşısında güzelliğe öncelik veren kişiyi adlandırır. Bu kişinin değerlendirmesinde bir eserin biçimi, uyumu ve duyusal etkisi belirleyici yer tutar. Türkçeye estet olarak alınan kelime, güzelliği en yüksek ölçüt sayan bu tutumu taşıyan kişiyi anlatmayı sürdürür.","firstAttestation":null,"relatives":[{"word":"estetik","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"estet maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"ezoterik","word":"ezoterik","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"ésō","meaning":"iç taraf, içeri","period":null,"reconstructed":false},{"language":"grc","form":"esōtéron","meaning":"iç tarafta bulunan","period":null,"reconstructed":false},{"language":"grc","form":"esōterikós","meaning":"içe ait, batıni","period":null,"reconstructed":false},{"language":"fr","form":"ésotérique","meaning":"içe ait, batıni","period":null,"reconstructed":false},{"language":"tr","form":"ezoterik","meaning":"yalnızca belirli bir çevrenin erişebildiği bilgiye ilişkin","period":null,"reconstructed":false}],"shortMeaning":"Yalnızca belirli bir çevrenin erişebildiği bilgiye ilişkin, içrek.","currentMeaning":"Öğretisi veya anlamı herkese açık olmayan, anlaşılması belirli bir topluluğa katılmayı ya da özel bilgi edinmeyi gerektiren.","story":"Eski Yunanca ésō, içeriye doğru yönü gösteriyordu. Esōtéron ve esōterikós ile bu mekânsal iç taraf düşüncesi, bir çevrenin kendi içinde tuttuğu bilgiye taşındı. Türkçeye gelişinde Fransızca ve İngilizce yolları verilir. Ezoterik bugün bu iç sınırı koruyarak yalnızca belirli kişilere açılan öğretileri ve bilgileri niteler.","firstAttestation":{"source":"Milliyet gazetesi","period":"1963","form":"Ezoterik"},"relatives":null,"alternatives":["Nişanyan Sözlük İngilizce esoteric veya Fransızca ésotérique yollarını verirken TDK Güncel Türkçe Sözlük doğrudan Fransızcayı gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ezoterik maddesi","url":"https://www.nisanyansozluk.com/kelime/ezoterik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ezoterik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"figüratif","word":"figüratif","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"figurer","meaning":"biçim vermek","period":null,"reconstructed":false},{"language":"fr","form":"figuratif","meaning":"figür barındıran","period":null,"reconstructed":false},{"language":"tr","form":"figüratif","meaning":"tanınabilir varlıkları betimleyen","period":null,"reconstructed":false}],"shortMeaning":"Sanatta tanınabilir varlıkları betimleyen.","currentMeaning":"Resim ve heykelde insan, hayvan, nesne veya doğa biçimlerini tanınabilir biçimde temsil eden.","story":"Fransızca figurer fiilinin merkezinde bir şeye biçim verme düşüncesi bulunur. Bu fiilden oluşan figuratif, sanat eserinde seçilebilir figürlerin bulunmasını öne çıkarır. Türkçeye sanat tartışmaları içinde taşınan kelime, görünen dünyayla bağını koruyan resim ve heykelleri nitelemeye yerleşmiştir.","firstAttestation":{"source":"Cumhuriyet","period":"1950","form":"non figüratif"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"figüratif maddesi","url":"https://www.nisanyansozluk.com/kelime/fig%C3%BCratif"},{"name":"TDK Güncel Türkçe Sözlük","ref":"figüratif maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"fragman","word":"fragman","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"bʰreg-","meaning":"kırmak","period":null,"reconstructed":true},{"language":"ine","form":"bʰr̥-n-g-","meaning":"kırmak","period":null,"reconstructed":true},{"language":"la","form":"frangere, fract-","meaning":"kırmak","period":null,"reconstructed":false},{"language":"la","form":"fragmentum","meaning":"kırmak","period":null,"reconstructed":false},{"language":"fr","form":"fragment","meaning":"bir bütünden kopmuş parça","period":null,"reconstructed":false},{"language":"tr","form":"fragman","meaning":"bir filmi tanıtan kısa görüntü derlemesi","period":null,"reconstructed":false}],"shortMeaning":"Bir filmi tanıtmak için hazırlanan kısa görüntü derlemesi.","currentMeaning":"Bir filmin seçilmiş sahnelerini bir araya getirerek konusunu ve havasını tanıtan kısa film.","story":"Kelimenin en eski katmanında bir bütünü kırma eylemi vardır. Bu kök Latince frangere üzerinden ilerler; Fransızca fragment aşamasında öne çıkan şey bütünden ayrılmış parçadır. Türkçede sinema alanına yerleşince bu parça, seyircinin henüz tamamını görmediği filmden sunulan kısa görüntülere dönüşmüştür.","firstAttestation":{"source":"Milliyet","period":"1954","form":"fragmanları"},"relatives":[{"word":"break","relation":"eş köken"}],"alternatives":null,"funFact":"İngilizcede kırmayı anlatan break ile sinema fragmanı aynı eski kökte buluşur.","sources":[{"name":"Nişanyan Sözlük","ref":"fragman maddesi","url":"https://www.nisanyansozluk.com/kelime/fragman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"fragman maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"grotesk","word":"grotesk","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"kryptḗ","meaning":"gözden saklı, yer altında kalmış","period":null,"reconstructed":false},{"language":"la","form":"crypta","meaning":"yer altı geçidi veya mahzen","period":null,"reconstructed":false},{"language":"it","form":"grotta","meaning":"mağara veya yer altı geçidi","period":null,"reconstructed":false},{"language":"it","form":"grottesca","meaning":"eski Roma yapılarının yer altı bölümlerini andıran","period":null,"reconstructed":false},{"language":"fr","form":"grotesque","meaning":"acayip, korkutucu veya aşırı çirkin","period":null,"reconstructed":false},{"language":"tr","form":"grotesk","meaning":"tuhaf ve gülünç figürlere dayanan süsleme üslubu","period":null,"reconstructed":false}],"shortMeaning":"Tuhaf ve gülünç figürleri birleştiren süsleme üslubu.","currentMeaning":"Eski Roma yapılarındaki örnekleriyle tanınan, alışılmadık ve gülünç figürleri bir araya getiren bezeme üslubu.","story":"Groteskin geçmişinde önce saklı bir yer, ardından mahzen ve mağara vardır. Yunancadan Latinceye uzanan bu mekân adı, İtalyanca grotta ile eski Roma yapılarının yer altı bölümlerine bağlanır. Bu yerlerle ilişkilendirilen süslemelerin tuhaf figürleri, Fransızcada kelimeye acayiplik ve ürperticilik yüklemiştir. Türkçede de bu görsel dünyanın adı olarak kullanılır.","firstAttestation":{"source":"Cumhuriyet","period":"1939","form":"grotesk"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"grotesk maddesi","url":"https://www.nisanyansozluk.com/kelime/grotesk"},{"name":"TDK Güncel Türkçe Sözlük","ref":"grotesk maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"illüzyon","word":"illüzyon","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"ludus","meaning":"oyun","period":null,"reconstructed":false},{"language":"la","form":"ludere, lus-","meaning":"oynamak","period":null,"reconstructed":false},{"language":"la","form":"illudere","meaning":"oyunla yanıltmak, alaya almak","period":null,"reconstructed":false},{"language":"la","form":"illusio","meaning":"oyunla yanıltmak, alaya almak","period":null,"reconstructed":false},{"language":"fr","form":"illusion","meaning":"gerçeği yansıtmayan görünüş veya hayal","period":null,"reconstructed":false},{"language":"tr","form":"illüzyon","meaning":"görme duyusunu yanıltan gösteri veya görüntü","period":null,"reconstructed":false}],"shortMeaning":"Görme duyusunu yanıltmaya dayanan gösteri veya görüntü.","currentMeaning":"Bir şeyi olduğundan başka türlü göstererek gözde yanılsama yaratan düzenleme veya gösteri.","story":"İllüzyonun başlangıcında Latincedeki oyun dünyası vardır. Oynamayı anlatan ludere, illudere biçiminde birini alaya alma ve yanıltma yönüne açılır. Fransızca illusion, bu oyunu gerçeğe benzeyen aldatıcı bir görüntüye taşır. Türkçede kelime, özellikle gözün gördüğüyle gerçekte olanın ayrıldığı gösterilerle yerleşmiştir.","firstAttestation":{"source":"Cumhuriyet","period":"1936","form":"illüzyonist"},"relatives":[{"word":"illüzyonist","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"illüzyon maddesi","url":"https://www.nisanyansozluk.com/kelime/ill%C3%BCzyon"},{"name":"TDK Güncel Türkçe Sözlük","ref":"illüzyon maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ironi","word":"ironi","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"werh₁- (wer-)","meaning":"söylemek","period":null,"reconstructed":true},{"language":"ine","form":"wér-i̯e-","meaning":"söylemek","period":null,"reconstructed":true},{"language":"grc","form":"eírō","meaning":"konuşturmak","period":null,"reconstructed":false},{"language":"grc","form":"eirōnía","meaning":"bildiğini veya gerçek niyetini saklayarak davranma","period":null,"reconstructed":false},{"language":"fr","form":"ironie","meaning":"örtülü ve alaylı söyleyiş","period":null,"reconstructed":false},{"language":"tr","form":"ironi","meaning":"söylenenle kastedilen arasındaki ayrılıktan doğan alay","period":null,"reconstructed":false}],"shortMeaning":"Söylenenle kastedilen arasındaki ayrılıktan doğan alay.","currentMeaning":"Asıl düşünceyi doğrudan söylemek yerine farklı veya karşıt bir ifade kullanarak oluşturulan ince alay ve gülmece.","story":"Eski Yunanca eirōnía, kişinin bildiğini saklayıp başka bir tavır takınmasını anlatıyordu. Bu adın, karşısındakini konuşturmayı anlatan eírō ile bağlantısı muhtemel görülür. Fransızcada ironie, niyeti gizleyen tavrı alaylı bir anlatım aracına dönüştürür. Türkçedeki kullanımda da sözün yüzeyde söylediğiyle gerçekte hedeflediği arasındaki mesafe belirleyicidir.","firstAttestation":{"source":"Cumhuriyet","period":"1937","form":"ironi"},"relatives":[{"word":"retorik","relation":"eş köken"}],"alternatives":["Nişanyan Sözlük, Yunanca eirōnía biçiminin eírō fiilinden türeyişini kesin değil, muhtemel olarak değerlendirir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ironi maddesi","url":"https://www.nisanyansozluk.com/kelime/ironi"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ironi maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"jargon","word":"jargon","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"jargon","meaning":"kuş ötüşü, anlaşılması güç konuşma veya bir grubun özel dili","period":null,"reconstructed":false},{"language":"tr","form":"jargon","meaning":"bir meslek veya çevrenin kendine özgü söz varlığı","period":null,"reconstructed":false}],"shortMeaning":"Bir meslek veya çevrenin kendine özgü söz varlığı.","currentMeaning":"Belirli bir işi yapanların veya aynı topluluğa bağlı kişilerin kendi aralarında kullandıkları özel kelime ve ifadeler bütünü.","story":"Fransızca jargonun anlam dünyasında kuşların sesiyle insanların anlaşılması güç konuşması yan yana durur. Dışarıdan dinleyene çözülemeyen bu sesler, bir grubun yalnız kendi üyelerine açık dili için de uygun bir benzetme oluşturur. Türkçe, kelimeyi özellikle mesleklerin ve toplulukların kendilerine özgü sözlerini anlatmak için almıştır.","firstAttestation":{"source":"Türk Tarihinin Ana Hatları","period":"1930","form":"jargonile"},"relatives":[{"word":"gergo","relation":"eş köken"},{"word":"geringonça","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"jargon maddesi","url":"https://www.nisanyansozluk.com/kelime/jargon"},{"name":"TDK Güncel Türkçe Sözlük","ref":"jargon maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kadans","word":"kadans","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"ḱh₂d- (ḱad-)","meaning":"düşmek","period":null,"reconstructed":true},{"language":"la","form":"cadere, cas-","meaning":"düşmek, yaşamını yitirmek","period":null,"reconstructed":false},{"language":"it","form":"cadere","meaning":"düşmek","period":null,"reconstructed":false},{"language":"it","form":"cadenza","meaning":"aşağıya düşüş","period":null,"reconstructed":false},{"language":"fr","form":"cadence","meaning":"müzikal gerilimin azalması","period":null,"reconstructed":false},{"language":"tr","form":"kadans","meaning":"müzikte bir cümleyi durak veya sonuca bağlayan ilerleyiş","period":null,"reconstructed":false}],"shortMeaning":"Müzikte bir cümleyi durak veya sonuca bağlayan ilerleyiş.","currentMeaning":"Müzikal bir cümlenin sonunda duraklama veya tamamlanma duygusu oluşturan ses ve akor ilerleyişi.","story":"Kadansın kökündeki hareket aşağıya doğrudur: eski kök düşmeyi anlatır. Latince cadere ve İtalyanca cadenza üzerinden ilerleyen bu düşüş, Fransızcada müziğin gerilimine uygulanır. Seslerin bir durağa yaklaşırken yarattığı çözülme, böylece fiziksel düşüşün işitsel karşılığı olur. Türkçedeki müzik terimi de bu durulma ve tamamlanma duygusunu taşır.","firstAttestation":{"source":"Hüseyin Rahmi Gürpınar — Gulyabani","period":"1911","form":"kadans"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kadans maddesi","url":"https://www.nisanyansozluk.com/kelime/kadans"}],"confidence":"orta","reviewed":true},{"id":"karizma","word":"karizma","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"en","ultimateOrigin":"ine","chain":[{"language":"ine","form":"ǵʰer-³","meaning":"sevmek","period":null,"reconstructed":true},{"language":"grc","form":"χaírō","meaning":"sevgi veya sevinç duymak","period":null,"reconstructed":false},{"language":"grc","form":"χárisma(t)","meaning":"incelik, bağışlanan iyilik ve hoş davranış","period":null,"reconstructed":false},{"language":"de","form":"Charisma","meaning":"incelik, bağışlanan iyilik ve hoş davranış","period":null,"reconstructed":false},{"language":"en","form":"charisma","meaning":"başkalarında sevgi ve hayranlık uyandırma gücü","period":null,"reconstructed":false},{"language":"tr","form":"karizma","meaning":"kişinin başkalarını etkileyen çekim gücü","period":null,"reconstructed":false}],"shortMeaning":"Kişinin başkalarında hayranlık uyandıran çekim gücü.","currentMeaning":"Bir kişinin davranışları ve kişiliğiyle çevresindekileri etkilemesini, ilgi ve hayranlık toplamasını sağlayan özellik.","story":"Karizmanın eski kökü sevme ve sevinme çevresinde şekillenir. Yunanca χárisma, bu duygusal alandan inceliğe ve lütfa uzanır. Almanca üzerinden İngilizceye uzanan aktarımda kelime, başkalarının sevgisini ve hayranlığını kazanabilen kişinin özelliğini anlatır. Türkçeye doğrudan hangi Batı dilinden geçtiği konusunda kaynaklar ayrışsa da bugünkü kullanımın odağında insanın çevresinde yarattığı etki vardır.","firstAttestation":{"source":"Milliyet","period":"1965","form":"karizmatik"},"relatives":[{"word":"karizmatik","relation":"türev"}],"alternatives":["Nişanyan Sözlük Türkçeye aktarımı Almanca üzerinden İngilizce charisma ile açıklar; TDK Güncel Türkçe Sözlük doğrudan kaynak olarak Fransızca charisme biçimini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"karizma maddesi","url":"https://www.nisanyansozluk.com/kelime/karizma"},{"name":"TDK Güncel Türkçe Sözlük","ref":"karizma maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"klişe","word":"klişe","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":null,"chain":[{"language":"fr","form":"clicher","meaning":"bir kalıp içinde dökmek","period":null,"reconstructed":false},{"language":"fr","form":"cliché","meaning":"baskı kalıbı; sürekli yinelenen söz veya düşünce","period":null,"reconstructed":false},{"language":"tr","form":"klişe","meaning":"baskı levhası; özgünlüğünü yitirmiş söz veya düşünce","period":null,"reconstructed":false}],"shortMeaning":"Baskı kalıbı; çok yinelenerek özgünlüğünü yitirmiş söz veya düşünce.","currentMeaning":"Baskı için hazırlanan kabartmalı levha; mecazen sürekli tekrarlandığı için etkisini ve özgünlüğünü kaybetmiş ifade veya düşünce.","story":"Fransızca clicher, malzemeyi kalıba dökme işini anlatır; fiilin başlangıcında bir ses taklidi bulunur. Buradan doğan cliché, aynı görüntünün tekrar tekrar basılmasını sağlayan kalıbın adı olur. Kalıbın hep aynı izi üretmesi, söz ve düşünce dünyasına da taşınır. Türkçede klişe, hem baskı aracını hem de hazır bir kalıptan çıkmış gibi yinelenen ifadeyi anlatır.","firstAttestation":{"source":"Basiretçi Ali Bey — İstanbul Mektupları","period":"1870","form":"klişe"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"klişe maddesi","url":"https://www.nisanyansozluk.com/kelime/kli%C5%9Fe"},{"name":"TDK Güncel Türkçe Sözlük","ref":"klişe maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kolaj","word":"kolaj","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"colla","meaning":"tutkal","period":null,"reconstructed":false},{"language":"fr","form":"colle","meaning":"tutkal","period":null,"reconstructed":false},{"language":"fr","form":"coller","meaning":"bir yüzeye yapıştırmak","period":null,"reconstructed":false},{"language":"fr","form":"collage","meaning":"yapıştırma işlemi","period":null,"reconstructed":false},{"language":"tr","form":"kolaj","meaning":"çeşitli parçaları yapıştırarak oluşturulan kompozisyon","period":null,"reconstructed":false}],"shortMeaning":"Çeşitli parçaları yapıştırarak oluşturulan kompozisyon.","currentMeaning":"Kâğıt, fotoğraf, kumaş gibi farklı malzemelerden alınan parçaları bir yüzey üzerinde birleştirme tekniği ve bu teknikle oluşturulan eser.","story":"Kolajın geçmişinde sanat eserinden önce tutkal vardır. Latince colla, Fransızcada colle olarak yaşar; buradan yapıştırma eylemini anlatan coller ve işlemin adı collage oluşur. Sanatta farklı parçalar aynı yüzeye tutturulunca işlemin adı eserin de adı hâline gelir. Türkçeye geçen kolaj, parçaların bir araya gelişini adında korur.","firstAttestation":{"source":"Milliyet","period":"1964","form":"kolaj"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kolaj maddesi","url":"https://www.nisanyansozluk.com/kelime/kolaj"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kolaj maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"lirik","word":"lirik","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"lýra","meaning":"lir adlı telli çalgı","period":null,"reconstructed":false},{"language":"grc","form":"lyrikós","meaning":"lirle seslendirilmek için hazırlanan şiire ilişkin","period":null,"reconstructed":false},{"language":"fr","form":"lyrique","meaning":"aşk şiirini andıran","period":null,"reconstructed":false},{"language":"tr","form":"lirik","meaning":"duyguyu coşkuyla dile getiren","period":null,"reconstructed":false}],"shortMeaning":"Duyguları yoğun ve coşkulu biçimde dile getiren.","currentMeaning":"Şiirde ve başka sanat eserlerinde kişisel duyguları coşkulu, içten ve esinli bir söyleyişle yansıtan.","story":"Lirik anlatımın arkasında Eski Yunan dünyasının telli çalgısı lir bulunur. Lyrikós, bu çalgının eşliğinde seslendirilecek şiiri anlatırken müzikle söz aynı sahnede buluşur. Fransızca lyrique aşamasında aşk şiirinin duygu yüklü söyleyişi öne çıkar. Türkçede kelime, yanında bir çalgı bulunmasa da duyguyu coşkuyla aktaran anlatımları niteler.","firstAttestation":{"source":"Ahmed Rasim — Şehir Mektupları","period":"1898","form":"lirik"},"relatives":[{"word":"lir","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"lirik maddesi","url":"https://www.nisanyansozluk.com/kelime/lirik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"lirik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"marjinal","word":"marjinal","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"margo, margin-","meaning":"kenar","period":null,"reconstructed":false},{"language":"la","form":"marginalis","meaning":"kenar","period":null,"reconstructed":false},{"language":"fr","form":"marginal","meaning":"sayfa kenarına ilişkin; ana konunun veya toplum düzeninin dışında kalan","period":null,"reconstructed":false},{"language":"tr","form":"marjinal","meaning":"yerleşik anlayışın dışında kalan, aykırı","period":null,"reconstructed":false}],"shortMeaning":"Yerleşik anlayışın dışında kalan, aykırı.","currentMeaning":"Bir toplumda veya çevrede yaygın biçimde benimsenen düşünce, davranış ve yaşam biçimlerinden ayrılan.","story":"Latince margo, bir şeyin kenarını gösterir. Fransızca marginal içinde bu kenar, kitabın ana metninin dışında kalan not ve süslemelerin yeridir. Ana metnin dışında durma düşüncesi toplum hayatına taşınınca yerleşik düzenin dışında kalan kişi ve tutumları da kapsar. Türkçedeki aykırılık anlamı, bu merkez ile kenar ayrımını sürdürür.","firstAttestation":{"source":"Milliyet","period":"1964","form":"marjinal"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"marjinal maddesi","url":"https://www.nisanyansozluk.com/kelime/marjinal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"marjinal maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"melankoli","word":"melankoli","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"χolḗ","meaning":"safra sıvısı","period":null,"reconstructed":false},{"language":"grc","form":"mélas, melan-","meaning":"siyah","period":null,"reconstructed":false},{"language":"grc","form":"melanχolḗ","meaning":"siyah safra","period":null,"reconstructed":false},{"language":"grc","form":"melanχolía","meaning":"eski hekimlikte siyah safra fazlalığına bağlanan ruhsal rahatsızlık","period":null,"reconstructed":false},{"language":"fr","form":"mélancholie","meaning":"derin keder ve kara sevda","period":null,"reconstructed":false},{"language":"tr","form":"melankoli","meaning":"içe işleyen hüzün ve karasevda hâli","period":null,"reconstructed":false}],"shortMeaning":"İçe işleyen hüzün ve karasevda hâli.","currentMeaning":"Kişinin duygu dünyasına hâkim olan derin keder, durgunluk ve karasevda hâli.","story":"Melankoli, Yunancada siyahı anlatan mélas ile safrayı anlatan χolḗ öğelerinin birleşmesine dayanır. Eski hekimlik, bazı ruhsal sıkıntıları bedende kara safranın fazlalaşmasıyla açıklıyordu. Böylece varsayılan bir beden sıvısının adı, insanın iç dünyasındaki kederin adına dönüştü. Fransızca aracılığıyla Türkçeye geçen kelime, bugün bu eski açıklamayı benimsemeksizin derin hüznü anlatır.","firstAttestation":{"source":"Tıngır & Sinapian — Istılahat Lugati","period":"1892","form":"melankoliya"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"melankoli maddesi","url":"https://www.nisanyansozluk.com/kelime/melankoli"},{"name":"TDK Güncel Türkçe Sözlük","ref":"melankoli maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"metafor","word":"metafor","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"phérō","meaning":"bir şeyi taşımak veya götürmek","period":null,"reconstructed":false},{"language":"grc","form":"metaphérō","meaning":"yerini veya biçimini değiştirmek, aktarmak","period":null,"reconstructed":false},{"language":"grc","form":"metaphorá","meaning":"aktarma ve dönüşüm; bir sözü alışılmış anlamının dışında kullanma","period":null,"reconstructed":false},{"language":"en","form":"metaphor","meaning":"simgelerle anlatma","period":null,"reconstructed":false},{"language":"fr","form":"métaphore","meaning":"simgelerle anlatma","period":null,"reconstructed":false},{"language":"tr","form":"metafor","meaning":"bir kavramı başka bir kavram üzerinden anlatan anlam aktarımı","period":null,"reconstructed":false}],"shortMeaning":"Bir kavramı başka bir kavram üzerinden anlatan anlam aktarımı.","currentMeaning":"Bir varlık veya düşünceyi başka bir varlık ya da düşüncenin özellikleriyle anlatarak kurulan eğretileme.","story":"Yunanca phérō, bir şeyi bir yerden başka bir yere taşımayı anlatır. Metaphérō ve metaphorá ile bu hareket, kelimenin kendi anlam alanından başka bir alana aktarılmasını da kapsar. Bir insana taş demek, fiziksel bir nesneyi taşımadan onun çağrışımlarını insana yükler. Türkçeye aktarımda Fransızca ve İngilizce alternatif yollar olarak gösterilir; her iki biçim de bu anlam taşıma düşüncesini sürdürür.","firstAttestation":{"source":"Hakimiyet-i Milliye","period":"1934","form":"metafor"},"relatives":[{"word":"metaforik","relation":"türev"}],"alternatives":["Nişanyan Sözlük, Fransızca métaphore ile İngilizce metaphor biçimlerini Türkçeye aktarım için alternatif olarak verir; bu iki halka birbirinden ardışık alıntıyı göstermez."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"metafor maddesi","url":"https://www.nisanyansozluk.com/kelime/metafor"}],"confidence":"orta","reviewed":true},{"id":"nüans","word":"nüans","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"(s)newdʰ-","meaning":"sis veya bulut","period":null,"reconstructed":true},{"language":"la","form":"nubes","meaning":"sis veya bulut","period":null,"reconstructed":false},{"language":"fr","form":"nue","meaning":"bulut","period":null,"reconstructed":false},{"language":"fr","form":"nuance","meaning":"renkler arasındaki ince ton farkı","period":null,"reconstructed":false},{"language":"tr","form":"nüans","meaning":"benzer şeyleri ayıran ince fark","period":null,"reconstructed":false}],"shortMeaning":"Birbirine benzeyen şeyler arasındaki ince fark.","currentMeaning":"Renk, ses, anlam veya davranış gibi alanlarda birbirine yakın özellikleri ayırt etmeyi sağlayan küçük fark.","story":"Nüansın kökündeki görüntü sis ve buluttur; Latince nubes ile Fransızca nue bu bağı taşır. Fransızcada nuance, bulutlardaki yumuşak geçişleri andıran ince renk ayrımlarına ad olur. Resim dilindeki bu kullanım, belirgin sınırları olmayan küçük farkları anlatmaya elverişlidir. Türkçede kelime renklerin ötesine geçerek ses, düşünce ve davranıştaki incelikleri de kapsar.","firstAttestation":{"source":"Ahmed Rasim — Şehir Mektupları","period":"1897","form":"nüansı"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nüans maddesi","url":"https://www.nisanyansozluk.com/kelime/n%C3%BCans"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nüans maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"palimpsest","word":"palimpsest","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"en","ultimateOrigin":"grc","chain":[{"language":"grc","form":"psēχō","meaning":"yüzeyi kazımak","period":null,"reconstructed":false},{"language":"grc","form":"psēstós","meaning":"kazınarak temizlenmiş","period":null,"reconstructed":false},{"language":"grc","form":"pálin","meaning":"yeniden, geriye doğru","period":null,"reconstructed":false},{"language":"grc","form":"palímpsēstos","meaning":"yeniden kazınıp silinmiş","period":null,"reconstructed":false},{"language":"en","form":"palimpsest","meaning":"önceki yazısı silinerek yeniden kullanılmış el yazması","period":null,"reconstructed":false},{"language":"tr","form":"palimpsest","meaning":"silinen eski yazının üzerine yeni yazı yazılmış el yazması","period":null,"reconstructed":false}],"shortMeaning":"Eski yazısı silinip üzerine yeniden yazılmış el yazması.","currentMeaning":"Önceki metni kazınarak veya silinerek yazı yüzeyi yeniden kullanılmış el yazması; mecazen eski izler üzerinde oluşan yeni katmanlar bütünü.","story":"Palimpsestin arkasında yazılı bir yüzeyi kazıyıp yeniden kullanma işi bulunur. Yunancada kazınmış olmayı anlatan psēstós ile yeniden düşüncesini taşıyan pálin birleşerek bu işlemi adlandırır. İngilizce palimpsest, eski metni silinmiş ve yeniden yazılmış el yazmasını belirtir. Türkçede kelime, bu somut nesnenin yanında geçmişin izleri üzerine eklenen yeni katmanları anlatmak için de kullanılır.","firstAttestation":{"source":"Cumhuriyet","period":"1990","form":"Palimpsestler"},"relatives":null,"alternatives":null,"funFact":"George Orwell'in 1984 romanındaki kullanımı, el yazmalarına ilişkin bu teknik terimin mecaz olarak yayılmasına katkı sağlamıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"palimpsest maddesi","url":"https://www.nisanyansozluk.com/kelime/palimpsest"}],"confidence":"orta","reviewed":true},{"id":"pastiş","word":"pastiş","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"it","chain":[{"language":"it","form":"pasta","meaning":"hamur kıvamında karışım","period":null,"reconstructed":false},{"language":"it","form":"pasticcio","meaning":"hamur kıvamında karışım","period":null,"reconstructed":false},{"language":"fr","form":"pastiche","meaning":"karışım; değişik sanat üsluplarını birleştiren eser","period":null,"reconstructed":false},{"language":"tr","form":"pastiş","meaning":"başka sanatçıların üslubunu taklit ederek oluşturulan eser","period":null,"reconstructed":false}],"shortMeaning":"Başka sanatçıların üslubunu taklit ederek oluşturulan eser.","currentMeaning":"Bir veya birden çok sanatçının anlatım ve biçim özelliklerini taklit ederek meydana getirilen sanat eseri.","story":"Pastişin başlangıcında İtalyancanın hamur ve karışım dünyası bulunur. Pasticcio ile anlatılan bulamaç, Fransızca pastiche içinde farklı üslupların birbirine katıldığı sanat eserine dönüşür. Malzemelerin karışması artık renklerin, anlatım biçimlerinin ve sanatçı üsluplarının karışmasıdır. Türkçedeki pastiş, özellikle başka eserlerin üslubunu taklit ederek üretmeyi öne çıkarır.","firstAttestation":{"source":"Kadro","period":"1932","form":"pastişlerine"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"pastiş maddesi","url":"https://www.nisanyansozluk.com/kelime/pasti%C5%9F"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pastiş maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"patetik","word":"patetik","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"páthos","meaning":"duygu; özellikle acı çekme veya acıma","period":null,"reconstructed":false},{"language":"grc","form":"pathētikós","meaning":"duygu; özellikle acı çekme veya acıma","period":null,"reconstructed":false},{"language":"fr","form":"pathétique","meaning":"yoğun duygu uyandıran","period":null,"reconstructed":false},{"language":"tr","form":"patetik","meaning":"duygular üzerinde güçlü etki bırakan","period":null,"reconstructed":false}],"shortMeaning":"Yoğun duygu uyandıran, dokunaklı.","currentMeaning":"Özellikle acı ve acıma duygularını harekete geçirerek güçlü bir duygusal etki bırakan.","story":"Yunanca páthos, duyguyu özellikle acı çekme ve acıma yönleriyle ele alır. Bu kökten gelişen pathētikós, Fransızca pathétique aşamasında karşısındakinin duygularını harekete geçiren niteliği öne çıkarır. Türkçeye geçen patetik de bir olayın veya anlatımın insanda bıraktığı güçlü duygusal etkiyi niteler.","firstAttestation":{"source":"Cumhuriyet","period":"1934","form":"patetik"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"patetik maddesi","url":"https://www.nisanyansozluk.com/kelime/patetik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"patetik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"pitoresk","word":"pitoresk","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"pingere, pig-","meaning":"boyamak veya resmetmek","period":null,"reconstructed":false},{"language":"la","form":"pictor","meaning":"boyamak veya resmetmek","period":null,"reconstructed":false},{"language":"it","form":"pittore","meaning":"resim yapan sanatçı","period":null,"reconstructed":false},{"language":"it","form":"pittoresco","meaning":"resim yapan sanatçı","period":null,"reconstructed":false},{"language":"fr","form":"pittoresque","meaning":"ressamın bakışına uygun, resmi yapılmaya değer","period":null,"reconstructed":false},{"language":"tr","form":"pitoresk","meaning":"bir tabloyu andıran, resmedilmeye elverişli","period":null,"reconstructed":false}],"shortMeaning":"Bir tabloyu andıran, resmedilmeye değer.","currentMeaning":"Görünüşü, renkleri ve düzeniyle bir resim izlenimi veren; resme konu olmaya elverişli bulunan.","story":"Pitoreskin çıkış noktası Latincede boyama ve resim yapma eylemidir. İtalyanca pittore ile bu işi yapan ressam öne çıkar; pittoresco üzerinden Fransızcaya geçen kelime ressamın bakışını manzaraya taşır. Bir yerin pitoresk bulunması, onun resme dönüşmeye hazır görülmesidir. Türkçede de kelime, görünüşüyle tablo izlenimi veren yerleri ve sahneleri niteler.","firstAttestation":{"source":"Cumhuriyet","period":"1929","form":"Pitoresk"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"pitoresk maddesi","url":"https://www.nisanyansozluk.com/kelime/pitoresk"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pitoresk maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"retorik","word":"retorik","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"werh₁- (wer-)","meaning":"söz söylemek","period":null,"reconstructed":true},{"language":"ine","form":"wr-ē-tor-","meaning":"konuşan kişi","period":null,"reconstructed":true},{"language":"grc","form":"ʰrétōr","meaning":"topluluk önünde konuşan kişi","period":null,"reconstructed":false},{"language":"grc","form":"ʰretōrikḗ téχnē","meaning":"topluluk önünde konuşan kişi","period":null,"reconstructed":false},{"language":"fr","form":"rhétorique","meaning":"sözü güzel ve sanatlı biçimde kullanma","period":null,"reconstructed":false},{"language":"tr","form":"retorik","meaning":"güzel ve etkili konuşma sanatı","period":null,"reconstructed":false}],"shortMeaning":"Güzel ve etkili konuşma sanatı.","currentMeaning":"Düşünceleri dinleyici üzerinde etki bırakacak biçimde düzenleme ve güzel bir söyleyişle ifade etme sanatı.","story":"Retoriğin en eski kökü söz söyleme eylemine uzanır. Bu kökten gelişen Yunanca ʰrétōr, topluluk karşısında söz alan kişiyi öne çıkarır. Hatibin yaptığı iş bir sanat olarak ele alındığında konuşmanın nasıl düzenleneceği ve nasıl etki yaratacağı önem kazanır. Fransızca rhétorique üzerinden Türkçeye geçen kelime, bu özenli söz söyleme sanatının adı olmuştur.","firstAttestation":{"source":"Horatius — Yakup Kadri çevirisi","period":"1931","form":"retor"},"relatives":[{"word":"ironi","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"retorik maddesi","url":"https://www.nisanyansozluk.com/kelime/retorik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"retorik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sofistike","word":"sofistike","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"en","ultimateOrigin":"en","chain":[{"language":"en","form":"sophist","meaning":"söz oyunlarıyla tartışan kişi","period":null,"reconstructed":false},{"language":"en","form":"sophisticate","meaning":"söz oyunlarına başvurmak","period":null,"reconstructed":false},{"language":"en","form":"sophisticated","meaning":"yapay veya incelmiş, kaba olmaktan uzak","period":null,"reconstructed":false},{"language":"tr","form":"sofistike","meaning":"yapmacıklı veya incelikle geliştirilmiş","period":null,"reconstructed":false}],"shortMeaning":"Yapmacıklı veya incelikle geliştirilmiş olan.","currentMeaning":"Yapmacık bir incelik taşıyan; ayrıca gelişmiş, karmaşık veya işlenmiş nitelikte olan.","story":"İngilizcedeki sophist, tartışmayı söz oyunlarıyla yürüten kişiydi; sophisticate bu davranışı bir eyleme dönüştürdü. Sophisticated ise yapaylık çağrışımının yanına kabalıktan uzaklaşmış, incelmiş olmayı ekledi. Türkçedeki kullanımda da gösterişli bir yapmacıklık ile gelişmiş bir incelik yan yana durur. İngilizce üzerinden açıklanan anlam yoluna Fransızca söyleyiş eşlik eder.","firstAttestation":{"source":"Milliyet","period":"1964","form":"sofistike"},"relatives":null,"alternatives":["Nişanyan Sözlük anlam aktarımını İngilizce sophisticated ile açıklar ve Fransızca söyleyişin benimsendiğini belirtir; TDK Güncel Türkçe Sözlük doğrudan kaynak olarak Fransızca sophistiqué biçimini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sofistike maddesi","url":"https://www.nisanyansozluk.com/kelime/sofistike"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sofistike maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"sürrealizm","word":"sürrealizm","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"fr","form":"réél","meaning":"gerçek olan","period":null,"reconstructed":false},{"language":"la","form":"super","meaning":"üstte, üzerinde","period":null,"reconstructed":false},{"language":"fr","form":"sur","meaning":"üs çalan sanatçı","period":null,"reconstructed":false}],"shortMeaning":"Bir çalgıyı olağanüstü ustalıkla çalan sanatçı.","currentMeaning":"Bir müzik çalgısını üstün teknik beceri ve sanat gücüyle çalabilen kişi.","story":"Latince virtus, erkeklik ve erdemle birlikte kişinin yetkinliğini de kapsıyordu. İtalyancada virtù ve ondan türeyen virtuoso, bu nitelikler çevresinde gelişti. Fransızca virtuose ile vurgu, özellikle müzikte sergilenen üstün beceriye yerleşti. Türkçedeki virtüöz de bu uzun yolun sonunda çalgısına olağanüstü hâkim olan sanatçıyı adlandırır.","firstAttestation":{"source":"Mehmed Bahaeddin [Toven] — Yeni Türkçe Lugat","period":"1924","form":"virtüoz"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"virtüöz maddesi","url":"https://www.nisanyansozluk.com/kelime/virt%C3%BC%C3%B6z"},{"name":"TDK Güncel Türkçe Sözlük","ref":"virtüöz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ağıl","word":"ağıl","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"öz","donorLanguage":null,"ultimateOrigin":"otk","chain":[{"language":"otk","form":"aġıl","meaning":"hayvanların tutulduğu çevrili yer","period":null,"reconstructed":false},{"language":"tr","form":"ağıl","meaning":"koyun ve keçilerin barındırıldığı çevrili yer","period":null,"reconstructed":false}],"shortMeaning":"Koyun ve keçilerin barındırıldığı çevrili yer.","currentMeaning":"Küçükbaş hayvanları bir arada tutmak ve barındırmak için çevresi sınırlandırılmış alan.","story":"Eski Türkçe aġıl, sürüyü açık araziden ayıran çevrili bir barınaktı. Çitlerin içindeki hayvanları bir arada tutma işlevi, sözcüğün bugüne uzanan somut çekirdeğini oluşturdu. Türkçede ağıl denince özellikle koyun ve keçiler için ayrılmış bu alan anlaşılır.","firstAttestation":{"source":"Irk Bitig","period":"900 öncesi","form":"ağılıŋta"},"relatives":null,"alternatives":null,"funFact":"Oğuzların bir kullanımında ağıl, barınağın kendisini değil koyunların dışkısını adlan ing":"Bulanık olmayan, berrak.","currentMeaning":"İçindeki bulanıklık giderilmiş veya baştan beri berrak olan.","story":"Duru, Eski Türkçedeki durma eylemini anlatan tur- fiiline bağlıdır. Bu fiilden türeyen turuġ, sakinliği ve berraklığı aynı sözde buluşturuyordu. Çalkantısı kesilen suyun içindekilerin dibe çökmesi, bu anlam bağını göz önüne getirir. Sözcük duru biçimini alırken berraklık anlamını korudu.","firstAttestation":{"source":"Türkische Turfantexte 1-9","period":"900 öncesi","form":"turuġ"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"duru maddesi","url":"https://www.nisanyansozluk.com/kelime/duru"},{"name":"TDK Güncel Türkçe Sözlük","ref":"duru maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"esen","word":"esen","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"tartışmalı","donorLanguage":"otk","ultimateOrigin":"fa","chain":[{"language":"fa","form":"āsūdan, āsāy-","meaning":"dinlenmek, rahat etmek","period":null,"reconstructed":false},{"language":"fa","form":"āsān","meaning":"dinlenmek, rahat etmek","period":null,"reconstructed":false},{"language":"otk","form":"esen","meaning":"rahatlık içinde, ferah","period":null,"reconstructed":false},{"language":"tr","form":"esen","meaning":"bedeni ve ruhu sağlıklı","period":null,"reconstructed":false}],"shortMeaning":"Beden ve ruh bakımından sağlıklı olan.","currentMeaning":"Bedensel ve ruhsal sağlığı yerinde bulunan.","story":"Esen, Eski Türkçede kişinin rahat ve ferah oluşunu anlatıyordu. Bir görüş, bu sözü Farsçada dinlenme eylemine bağlanan āsān ile ilişkilendirir; ancak bu aktarım açıklaması tartışmalıdır. Türkçedeki anlam çizgisinde rahatlık, bedenin ve ruhun iyi oluşuyla birleşir. Böylece esen, kişinin sağlıklı durumunu anlatan bir söz olarak yaşar.","firstAttestation":{"source":"Türkische Manichäica aus Chotscho 1-3","period":"900 öncesi","form":"esenin"},"relatives":[{"word":"esenlik","relation":"türev"}],"alternatives":["Nişanya inen","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"otk","ultimateOrigin":"zh","chain":[{"language":"zh","form":"yìn","meaning":"mühür, damga; baskı yapmak; belirti, iz","period":null,"reconstructed":false},{"language":"otk","form":"im/em/en","meaning":"tanıtıcı belirti, hayvan damgası","period":null,"reconstructed":false},{"language":"tr","form":"im","meaning":"bir şeyi gösteren belirti veya işaret","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyi gösteren veya tanıtan işaret.","currentMeaning":"Bir şeyi belirtmek, tanıtmak ya da bildirmek için kullanılan işaret.","story":"İm için önerilen Çince bağlantı, mühür basma eylemini ve onun bıraktığı izi aynı sözde buluşturan yìn biçimine dayanır. Bu aktarım kesin değildir. Eski Türkçedeki im, em ve en biçimleri, tanımayı sağlayan belirtileri ve hayvanlara vurulan damgaları karşılıyordu. Türkçede bir süre sınırlı kullanımda kalan söz, Dil Devrimi döneminde daha genel bir işaret adı olarak yaygınlaştırıldı.","firstAttestation":{"source":"Kaşgarî — Divan-i Lugati't-Türk","period":"1073","form":"im"},"relatives":[{"word":"imlemek","relation":"türev"}],"alternatives":["Nişanyan Sözlük, Çince yìn ile Eski Türkçe im arasındaki bağlantıyı kesinleşmiş bir aktarım olarak değil, tartışmalı bir köken açıklaması olarak verir."],"funFact":"İm, eski kullanımında askerî birliklerin birbirini tanımasını sağlayan parolanın da adıydı.","sources":[{"name":"Nişanyan Sözlük","ref":"im maddesi","url":"https://www.nisanyansozluk.com/kelime/im"},{"name":"TDK Güncel Türkçe Sözlük","ref":"im maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"imece","word":"imece","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"türeme","donorLanguage":null,"ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁāmma(t)","meaning":"halkın bütünü, kamu","period":null,"reconstructed":false},{"language":"tr","form":"ˁammece","meaning":"topluca, herkesin katılımıyla","period":null,"reconstructed":false},{"  öncesi","form":"taŋsuk"},"relatives":[{"word":"tangsug","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tansık maddesi","url":"https://www.nisanyansozluk.com/kelime/tans%C4%B1k"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tansık maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"umarsız","word":"umarsız","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"türeme","donorLanguage":"tr","ultimateOrigin":"tr","chain":[{"language":"tr","form":"umar","meaning":"çözüm yolu, çare","period":null,"reconstructed":false},{"language":"tr","form":"umarsız","meaning":"çözüm yolu bulunmayan, çaresiz","period":null,"reconstructed":false}],"shortMeaning":"Bir çıkış yolu veya çare bulamayan.","currentMeaning":"İçinde bulunduğu güçlüğü aşacak bir çözümden yoksun olan.","story":"Umar, bir güçlükten çıkmayı sağlayacak çareyi adlandırır. Umarsız, bu çıkış yolunun yokluğunu kişinin ya da durumun özelliğine dönüştürür. Sözcüğün merkezinde, çözüm arayıp başvuracak yol bulamama hâli vardır.","firstAttestation":null,"relatives":[{"word":"umar","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"umarsız maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"yılkı","word":"yılkı","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"öz","donorLanguage":null,"ultimateOrigin":"otk","chain":[{"language":"otk","form":"yılkı","meaning":"at veya at topluluğu","period":null,"reconstructed":false},{"language":"tr","form":"yılkı","meaning":"doğada serbest yaşayan at topluluğu","period":null,"reconstructed":false}],"shortMeaning":"Doğada serbestçe dolaşan at topluluğu.","currentMeaning":"Doğal ortamda insan denetimi dışında sürü hâlinde yaşayan yabani atlar.","story":"Yılkı, Eski Türkçede atı ve at topluluğunu adlandırıyordu. Tarih boyunca yük hayvanları ve başka dört ayaklılar için de kullanılarak daha geniş bir alanı kapsadı. Bugünkü kullanımında yen
