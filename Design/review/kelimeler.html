r. Bu söze ki eklenerek, istenen durumu bir cümleye bağlayan kāşki kurulmuştur. Türkçede keşke biçimine yerleşen kelime, hem geleceğe dönük bir isteği hem de yaşanmış olanı değiştirme arzusunu taşır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"ḫesḫa"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"keşke maddesi","url":"https://www.nisanyansozluk.com/kelime/ke%C5%9Fke"},{"name":"TDK Güncel Türkçe Sözlük","ref":"keşke maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"arzu","word":"arzu","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"āwarzōg/āwarjōg","meaning":"istek","period":null,"reconstructed":false},{"language":"fa","form":"ārzū","meaning":"istek, özellikle cinsel istek","period":null,"reconstructed":false},{"language":"tr","form":"arzu","meaning":"bir şeye yönelen istek","period":null,"reconstructed":false}],"shortMeaning":"Bir şeye ulaşmaya veya onu elde etmeye duyulan istek.","currentMeaning":"Bir şeyi isteme, elde etmeyi veya yaşamayı dileme duygusu.","story":"Arzu, Orta Farsçadaki daha uzun āwarzōg ve āwarjōg biçimlerinden Farsçanın ārzū biçimine ulaşmıştır. Farsçada insanı bir şeye yönelten isteği, özellikle de cinsel isteği anlatıyordu. Türkçede kelimenin alanı genel isteği kapsar; istenen bir buluşma da ulaşılmak istenen bir amaç da arzu olabilir.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ārzū"},"relatives":[{"word":"arzulamak","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"arzu maddesi","url":"https://www.nisanyansozluk.com/kelime/arzu"},{"name":"TDK Güncel Türkçe Sözlük","ref":"arzu maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"naz","word":"naz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nāz","meaning":"kibir, kendini üstün görme","period":null,"reconstructed":false},{"language":"tr","form":"naz","meaning":"beğenilmek için ağırdan alma davranışı","period":null,"reconstructed":false}],"shortMeaning":"İlgi görmek için kendini ağırdan satma davranışı.","currentMeaning":"Beğenilmek veya daha çok ilgi görmek amacıyla isteksiz görünme ve kendini ağırdan satma davranışı.","story":"Farsçadaki nāz, kişinin kendini yüksek görmesiyle ve kibirle ilgiliydi. Türkçedeki eski kullanımlarında da kendini ağırdan satma ve büyüklenme yan yana durur. Bugünkü nazda bu tavır, karşısındakinin ilgisini artırmak için hemen razı olmama davranışına dönüşür.","firstAttestation":{"source":"Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"nāz"},"relatives":[{"word":"nazlanmak","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"naz maddesi","url":"https://www.nisanyansozluk.com/kelime/naz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"naz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nazik","word":"nazik","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"nāzuk","meaning":"ince, zarif","period":null,"reconstructed":false},{"language":"fa","form":"nāzuk","meaning":"ince, zarif, nazlı","period":null,"reconstructed":false},{"language":"tr","form":"nazik","meaning":"incelikli ve saygılı davranan","period":null,"reconstructed":false}],"shortMeaning":"Başkalarına incelik ve saygıyla davranan.","currentMeaning":"İnsanlarla ilişkilerinde saygılı, düşünceli ve incelikli davranan.","story":"Farsçadaki nāzuk, ince ve zarif olanı anlatıyordu. Türkçedeki eski örneklerde kelime, boyun veya kirpik gibi bedensel incelikleri betimler. Bugünkü kullanımda aynı incelik davranışa taşınır; nazik kişi, karşısındakine özen ve saygı gösterir.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"näzik"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nazik maddesi","url":"https://www.nisanyansozluk.com/kelime/nazik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nazik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"narin","word":"narin","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"mn","chain":[{"language":"mn","form":"narin","meaning":"küçük","period":null,"reconstructed":false},{"language":"fa","form":"nārīn","meaning":"ince, zarif, körpe","period":null,"reconstructed":false},{"language":"tr","form":"narin","meaning":"ince ve zarif yapılı","period":null,"reconstructed":false}],"shortMeaning":"Yapısı ince ve zarif olan.","currentMeaning":"İnce, zarif ve kolay incinebilir bir yapıya sahip olan.","story":"Narinin yolu, Moğolcada küçüklüğü anlatan narin biçiminden geçer. Farsçada kelimenin çevresine incelik, zarafet ve körpelik anlamları eklenmiştir. Türkçeye bu anlamlarla taşınan narin, bir bedenin ya da nesnenin kaba ve iri görünmeyen, ince yapısını öne çıkarır.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"nārin"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"narin maddesi","url":"https://www.nisanyansozluk.com/kelime/narin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"narin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"can","word":"can","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"gyān","meaning":"ruh ve yaşam","period":null,"reconstructed":false},{"language":"fa","form":"cān","meaning":"yaşam","period":null,"reconstructed":false},{"language":"tr","form":"can","meaning":"yaşamı sağlayan manevi varlık","period":null,"reconstructed":false}],"shortMeaning":"Canlıya hayat verdiği düşünülen manevi varlık.","currentMeaning":"İnsan ve hayvanı yaşatan, ölümle bedenden ayrıldığı düşünülen maddi olmayan varlık.","story":"Orta Farsçadaki gyān, ruhu ve yaşamı aynı ad altında topluyordu. Farsçada cān biçimini alan kelime, Türkçeye de canlılığın adı olarak taşındı. Canını vermek ifadesinde korunan bağ budur: kaybedilen yalnız bir şey değil, yaşamın kendisidir.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"cānını"},"relatives":[{"word":"vyāna","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"can maddesi","url":"https://www.nisanyansozluk.com/kelime/can"},{"name":"TDK Güncel Türkçe Sözlük","ref":"can maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cihan","word":"cihan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"gēhān","meaning":"dünya","period":null,"reconstructed":false},{"language":"fa","form":"cahān/cihān","meaning":"dünya","period":null,"reconstructed":false},{"language":"tr","form":"cihan","meaning":"dünya, evren","period":null,"reconstructed":false}],"shortMeaning":"Dünya veya var olan her şeyi kapsayan evren.","currentMeaning":"Dünya; bütün varlıkları içine alan evren.","story":"Cihan, Orta Farsçadaki gēhān biçiminden Farsçanın cahān ve cihān biçimlerine uzanır. Yol boyunca insanın içinde yaşadığı dünyayı anlatmayı sürdürmüştür. Türkçede de tek bir ülkenin sınırlarını aşarak bütün dünyayı, daha geniş kullanımında evreni kapsar.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"cihān"},"relatives":[{"word":"ajun","relation":"eş köken"}],"alternatives":null,"funFact":"Cihan, Türkçe edebî dilde aynı kökten gelen ajunun yerini 11. yüzyıldan başlayarak almıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"cihan maddesi","url":"https://www.nisanyansozluk.com/kelime/cihan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cihan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cömert","word":"cömert","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"cawān-mard","meaning":"genç erkek, delikanlı","period":null,"reconstructed":false},{"language":"fa","form":"cō-mard","meaning":"malını esirgemeyen","period":null,"reconstructed":false},{"language":"tr","form":"cömert","meaning":"elindekini paylaşmaktan kaçınmayan","period":null,"reconstructed":false}],"shortMeaning":"Elindekini başkalarıyla paylaşmaktan kaçınmayan.","currentMeaning":"Parasını, malını veya imkânlarını başkaları için kullanırken esirgemeyen.","story":"Cömertin başlangıcında, Farsçada genç bir erkeği adlandıran cawān-mard birleşiği vardır. Bu birleşik cō-mard biçimine kısalırken delikanlılığı anlatan ad, eli açıklığı anlatan bir niteliğe dönüşmüştür. Türkçeye ulaşan kelime artık kişinin yaşını değil, elindekini başkalarıyla paylaşma tutumunu belirtir.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"ǵomard"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"cömert maddesi","url":"https://www.nisanyansozluk.com/kelime/c%C3%B6mert"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cömert maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kahraman","word":"kahraman","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"kār-framān","meaning":"iş yapılmasını buyuran","period":null,"reconstructed":false},{"language":"fa","form":"ḳahramān","meaning":"İran mitolojisinde Tahmuras'ın oğlunun adı","period":null,"reconstructed":false},{"language":"tr","form":"kahraman","meaning":"tehlike karşısında yiğitlik gösteren kişi","period":null,"reconstructed":false}],"shortMeaning":"Tehlike karşısında cesareti ve yaptıklarıyla öne çıkan kişi.","currentMeaning":"Savaşta veya tehlikeli koşullarda cesur davranarak yararlık gösteren kişi.","story":"Kahramanın gerisinde, Orta Farsçada iş yapılmasını buyuran kişiyi anlatan kār-framān vardır. Bu eski İranî ad, Farsçada mitolojik hükümdar Tahmuras'ın oğlunun adı olarak karşımıza çıkar. Türkçede özel bir kişinin adı olmaktan çıkıp tehlike karşısında yiğitlik gösterenlerin ortak adına dönüşmüştür.","firstAttestation":{"source":"Seydi Ali Reis — Miratü'l-Memalik","period":"1557","form":"ḳahremānlar"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kahraman maddesi","url":"https://www.nisanyansozluk.com/kelime/kahraman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kahraman maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"dost","word":"dost","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"peo","chain":[{"language":"peo","form":"dauştā","meaning":"dost, sevilen kişi","period":null,"reconstructed":false},{"language":"fa","form":"dōst","meaning":"yakın arkadaş, sevgili","period":null,"reconstructed":false},{"language":"tr","form":"dost","meaning":"sevilen ve güvenilen yakın kişi","period":null,"reconstructed":false}],"shortMeaning":"Sevilen ve güven duyulan yakın kişi.","currentMeaning":"Sevgi ve güven bağı kurulan, iyi anlaşılan yakın kimse.","story":"Dost, eski İran dillerinden beri sevilen ve yakın tutulan kişiyi anlatan bir addır. Farsçadaki dōst, arkadaşlıkla sevgililik arasındaki yakınlık alanını kapsıyordu. Türkçede de yalnız tanışıklığı değil, birine gönül rahatlığıyla güvenebilmeyi anlatan güçlü bağını korur.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"dostḳa"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"dost maddesi","url":"https://www.nisanyansozluk.com/kelime/dost"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dost maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"düşman","word":"düşman","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"duşmān/duşman","meaning":"kötülük isteyen kişi","period":null,"reconstructed":false},{"language":"tr","form":"düşman","meaning":"zarar vermek isteyen kişi","period":null,"reconstructed":false}],"shortMeaning":"Birinin kötülüğünü isteyen ve ona zarar vermeye çalışan kişi.","currentMeaning":"Birine karşı nefret veya zarar verme isteği taşıyan, onun kötülüğünü isteyen kimse.","story":"Düşmanın eski anlam yapısında, karşısındaki için kötü şeyler düşünen kişi vardır. Farsçadaki kelimenin Avestaca eş kökenlisi duşmanah-, kötülük bildiren duş ile düşünceyi anlatan manah- öğelerini birleştirir. Türkçedeki düşman da bu kötü niyeti korur ve başkasına zarar vermek isteyen kişiyi adlandırır.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"duşman"},"relatives":[{"word":"düşmanlık","relation":"türev"}],"alternatives":null,"funFact":"Eski Yunanca düşman anlamındaki dysménēs de kötü ile düşünce öğelerinden kurulmuş paralel bir yapıdır.","sources":[{"name":"Nişanyan Sözlük","ref":"düşman maddesi","url":"https://www.nisanyansozluk.com/kelime/d%C3%BC%C5%9Fman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"düşman maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sarhoş","word":"sarhoş","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"sarḫʷaş","meaning":"başı hoş olan; içkinin etkisindeki kişi","period":null,"reconstructed":false},{"language":"tr","form":"sarhoş","meaning":"alkol veya benzeri bir maddenin etkisiyle bilinci bulanmış","period":null,"reconstructed":false}],"shortMeaning":"Alkol veya benzeri bir maddenin etkisiyle bilinci bulanmış.","currentMeaning":"Alkol ya da keyif verici bir maddenin etkisiyle algısı ve davranışlarını denetleme yetisi bozulmuş olan.","story":"Sarhoş, Farsçada başı anlatan ser ile hoşluk bildiren öğenin birleşmesinden doğmuştur. Birleşiğin kurduğu resimde, içkinin etkisi başta hissedilen bir hoşluk olarak adlandırılır. Türkçede kelime, bu etkinin kişinin bilincini ve davranışlarını değiştirdiği durumu anlatır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"sarḫōş"},"relatives":[{"word":"hoş","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sarhoş maddesi","url":"https://www.nisanyansozluk.com/kelime/sarho%C5%9F"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sarhoş maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hoş","word":"hoş","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"huşnūd","meaning":"memnun, hoşnut","period":null,"reconstructed":false},{"language":"pal","form":"ḫʷaş","meaning":"güzel, memnuniyet veren","period":null,"reconstructed":false},{"language":"fa","form":"ḫoş/ḫʷaş","meaning":"güzel, memnuniyet veren","period":null,"reconstructed":false},{"language":"tr","form":"hoş","meaning":"beğenilen, zevk veren","period":null,"reconstructed":false}],"shortMeaning":"İnsanda beğeni ve memnuniyet uyandıran.","currentMeaning":"Duyulara veya duygulara iyi gelen, beğenilen ve zevk veren.","story":"Hoş, Farsçada güzelliği ve insanda uyandırdığı memnuniyeti birlikte anlatıyordu. Daha geride, Orta Farsçada memnun olmayı bildiren huşnūd ile bir bağlantı bulunabilir; bu ses gelişimi kesin değildir. Türkçede kelime aynı duygu alanını korur: hoş bir ses ya da davranış, onu algılayan kişide iyi bir karşılık bulur.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ḫoş"},"relatives":[{"word":"hoşlanmak","relation":"türev"},{"word":"sarhoş","relation":"birleşik"}],"alternatives":["Nişanyan Sözlük, Orta Farsça huşnūd ile ḫʷaş arasındaki ses gelişimini muhtemel sayar; TDK Güncel Türkçe Sözlük yalnız Farsça ḫoş biçimini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hoş maddesi","url":"https://www.nisanyansozluk.com/kelime/ho%C5%9F"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hoş maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"serbest","word":"serbest","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"sar-basta","meaning":"belgeyi bağlayıcı kılan imza veya mühür işareti","period":null,"reconstructed":false},{"language":"tr","form":"serbest","meaning":"bağlayıcı bir koşulu olmadan davranabilen","period":null,"reconstructed":false}],"shortMeaning":"Bağlayıcı bir koşul olmadan istediği gibi davranabilen.","currentMeaning":"Bir zorunluluk veya kısıtlamayla bağlı olmayan, kendi isteği doğrultusunda davranabilen.","story":"Serbestin Farsça yapısında başı anlatan sar ile bağlama eylemini taşıyan bastan bulunur. Sar-basta, bir belgeye geçerlilik kazandıran imza veya mühür gibi bağlayıcı işaretlerle ilgili bir hukuk terimiydi. Osmanlı kullanımında onaylanmış olma düşüncesinden yükümlülükten muaf tutulmaya geçildi. Bugünkü özgür davranabilme anlamı, bu muafiyetin genişlemesiyle ortaya çıktı.","firstAttestation":{"source":"Fatih Sultan Mehmed — Kanunname-i Al-i Osman","period":"<1481","form":"serbestdir"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"serbest maddesi","url":"https://www.nisanyansozluk.com/kelime/serbest"},{"name":"TDK Güncel Türkçe Sözlük","ref":"serbest maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"bedava","word":"bedava","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"bād-ı havā","meaning":"hava yeli; sonuçsuz, boş iş","period":null,"reconstructed":true},{"language":"tr","form":"bedava","meaning":"karşılığında ücret istenmeyen","period":null,"reconstructed":false}],"shortMeaning":"Karşılığında para ödenmesi gerekmeyen.","currentMeaning":"Alınması veya kullanılması için ücret ödenmeyen.","story":"Bedava, yel ve hava öğelerini yan yana getiren bād-ı havā ifadesiyle açıklanır. Türkçedeki eski biçim önce boş ve sonuçsuz işi, daha sonraki kullanımlarda karşılıksız elde edileni anlatır. Böylece boşunalık düşüncesinden ücret ödememeye uzanan bir anlam yolu görünür. Bununla birlikte, ifadenin Farsçada doğrudan belgelenmemesi ve hava öğesinin diline ilişkin farklı açıklamalar, kökenin ayrıntılarını belirsiz bırakır.","firstAttestation":{"source":"Yazıcızade Ali — Tarih-i Âl-i Selçuk","period":"1423","form":"bād-ı hevā"},"relatives":[],"alternatives":["Nişanyan Sözlük, bād-ı havā biçimini Farsça altında yeniden kurar ancak bu ifadenin Fars edebiyatında ve Farsça sözlüklerde belgelenmediğini belirtir.","TDK Güncel Türkçe Sözlük, birleşiği Farsça bād ve Arapça hevā ile açıklar; Nişanyan Sözlük özetinde havā öğesi Farsça altında gösterilir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"bedava maddesi","url":"https://www.nisanyansozluk.com/kelime/bedava"},{"name":"TDK Güncel Türkçe Sözlük","ref":"bedava maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"peynir","word":"peynir","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"panīr","meaning":"peynir","period":null,"reconstructed":false},{"language":"fa","form":"panīr","meaning":"peynir","period":null,"reconstructed":false},{"language":"tr","form":"peynir","meaning":"sütün katılaştırılmasıyla hazırlanan besin","period":null,"reconstructed":false}],"shortMeaning":"Sütün mayalanıp katılaştırılmasıyla hazırlanan besin.","currentMeaning":"Sütün maya yardımıyla katılaştırılmasından elde edilen, farklı kıvam ve tatlarda hazırlanabilen besin.","story":"Peynirin adının gerisinde, sütü anlatan eski Hint ve İran dili biçimleriyle bir akrabalık bulunur. Orta Farsçada panīr, sütün kendisini değil, ondan hazırlanan besini adlandırıyordu. Farsçadan Türkçeye taşınırken bu besinle bağı korundu; eski penīr ve beynir biçimlerinin ardından bugünkü peynir söyleyişi yerleşti.","firstAttestation":{"source":"Ebu Hayyan — Kitabu'l-İdrak","period":"1312","form":"penīr"},"relatives":[{"word":"páyas","relation":"eş köken"},{"word":"payah-","relation":"eş köken"},{"word":"panīr","relation":"eş köken"}],"alternatives":null,"funFact":"Hintçedeki panīr de Farsçadan alınmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"peynir maddesi","url":"https://www.nisanyansozluk.com/kelime/peynir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"peynir","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sebze","word":"sebze","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"sabz","meaning":"yeşil, taze","period":null,"reconstructed":false},{"language":"fa","form":"sabz","meaning":"yeşil, taze, yaş","period":null,"reconstructed":false},{"language":"fa","form":"sabza","meaning":"yeşillik, ot","period":null,"reconstructed":false},{"language":"tr","form":"sebze","meaning":"besin olarak kullanılan bitki veya bitki bölümü","period":null,"reconstructed":false}],"shortMeaning":"Yaprağı, kökü veya başka bölümleri besin olarak kullanılan bitki.","currentMeaning":"Yaprakları, kökleri, meyveleri veya taneleri yemeklerde kullanılan bitkilerin ve yenilen bölümlerinin ortak adı.","story":"Sebzenin başlangıcında bir yiyecek türünden önce yeşil renk ve tazelik vardır. Farsça sabz bu özellikleri anlatırken, ondan türeyen sabza yerde biten otları ve yeşillikleri adlandırdı. Türkçede sebze, bu yeşillik alanından mutfakta kullanılan bitkilerin genel adına uzandı.","firstAttestation":null,"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sebze maddesi","url":"https://www.nisanyansozluk.com/kelime/sebze"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sebze","url":null}],"confidence":"yüksek","reviewed":true},{"id":"meyve","word":"meyve","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"mēvag","meaning":"meyve","period":null,"reconstructed":false},{"language":"fa","form":"mīva/mēva","meaning":"meyve","period":null,"reconstructed":false},{"language":"tr","form":"meyve","meaning":"bitkinin tohum taşıyan ürünü, yemiş","period":null,"reconstructed":false}],"shortMeaning":"Bitkinin tohumlarını taşıyan, çoğu zaman yenebilen ürünü.","currentMeaning":"Çiçeğin döllenmesini izleyen gelişme sonucunda oluşan, tohumları içinde bulunduran ve birçok bitkide besin olarak tüketilen organ.","story":"Orta Farsçadaki mēvag, bitkinin verdiği yemişi adlandırıyordu. Farsçada mīva ve mēva biçimleriyle yaşayan bu ad, Türkçeye de aynı somut ürünü anlatmak üzere geçti. Söyleyiş meyveye dönüşürken dalda yetişen, olgunlaşıp dökülen yemişle bağı sürdü.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"mīve"},"relatives":[{"word":"məġdē","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"meyve maddesi","url":"https://www.nisanyansozluk.com/kelime/meyve"},{"name":"TDK Güncel Türkçe Sözlük","ref":"meyve","url":null}],"confidence":"yüksek","reviewed":true},{"id":"havuç","word":"havuç","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"havīc/havic","meaning":"yenilebilir kökü için yetiştirilen sebze","period":null,"reconstructed":false},{"language":"tr","form":"havuç","meaning":"etli kökü yenen bitki ve kökü","period":null,"reconstructed":false}],"shortMeaning":"Etli kökü sebze olarak yenen iki yıllık bitki.","currentMeaning":"Maydanozgiller ailesinden, aşağı doğru daralan etli kökü için yetiştirilen iki yıllık bitki ve bu bitkinin yenilen kökü.","story":"Farsçada havīc, toprağın altında gelişen yenilebilir köküyle tanınan sebzenin adıydı. Türkçedeki eski hevc ve hevic biçimleri de aynı bitkiyi gösteriyordu. On yedinci yüzyılda halk söyleyişinde havuç biçimine yaklaşılırken adın gösterdiği kök sebze değişmedi.","firstAttestation":null,"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"havuç maddesi","url":"https://www.nisanyansozluk.com/kelime/havu%C3%A7"},{"name":"TDK Güncel Türkçe Sözlük","ref":"havuç","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hıyar","word":"hıyar","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"fa","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḫiyār","meaning":"seçme, tercih; bitki adıyla bağlantısı tartışmalı","period":null,"reconstructed":false},{"language":"fa","form":"ḫiyār","meaning":"salatalık","period":null,"reconstructed":false},{"language":"tr","form":"hıyar","meaning":"salatalık bitkisi ve meyvesi","period":null,"reconstructed":false}],"shortMeaning":"Salatalık bitkisi ve bu bitkinin yenilen uzun meyvesi.","currentMeaning":"Kabakgiller ailesinden, yerde yayılarak büyüyen bir yıllık bitki ve bu bitkinin genellikle çiğ tüketilen uzun meyvesi.","story":"Farsçada ḫiyār, uzun meyveli salatalığın adıydı ve Türkçeye bu bitkiyi adlandırmak üzere geçti. Daha geride Arapçadaki seçme ve tercih kavramıyla bir bağ kurulsa da bu açıklama kesin değildir. Bitkinin biçimi nedeniyle örtmeceli bir adlandırma yapıldığı düşüncesi, önerilen anlam geçişini açıklamaya çalışır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"ḫear"},"relatives":[],"alternatives":["Nişanyan Sözlük, Farsça bitki adı ḫiyār ile Arapça 'seçme, tercih' bildiren ḫiyār arasındaki bağı tahmine dayalı veya tartışmalı olarak işaretler.","TDK Güncel Türkçe Sözlük, bitki adının doğrudan kaynağını Farsça olarak verir; daha eski Arapça bağlantısını belirtmez."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hıyar maddesi; bitki anlamı","url":"https://www.nisanyansozluk.com/kelime/h%C4%B1yar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hıyar","url":null}],"confidence":"yüksek","reviewed":true},{"id":"turşu","word":"turşu","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"ters-","meaning":"kurumak","period":null,"reconstructed":true},{"language":"ine","form":"tr̥s-i̯é-","meaning":"kurumak","period":null,"reconstructed":true},{"language":"pal","form":"tru(f)ş","meaning":"ekşi veya tuzlu","period":null,"reconstructed":false},{"language":"fa","form":"turş","meaning":"ekşi veya tuzlu","period":null,"reconstructed":false},{"language":"fa","form":"turşī","meaning":"ekşilik; salamura veya sirkede mayalanan yiyecek","period":null,"reconstructed":false},{"language":"tr","form":"turşu","meaning":"salamura veya sirkeyle hazırlanan sebze ya da meyve","period":null,"reconstructed":false}],"shortMeaning":"Sebze veya meyvenin salamura ya da sirkeyle hazırlanmış hâli.","currentMeaning":"Sebze ya da meyvelerin tuzlu su veya sirke içinde bekletilerek tat ve kıvam kazanmasıyla hazırlanan yiyecek.","story":"Turşunun uzak geçmişinde kurumayı anlatan bir kök bulunur; İran dillerindeki devamında ekşi ve tuzlu tatlar öne çıkar. Farsça turş bu tatları nitelerken turşī hem ekşiliği hem de bu tadı kazanmış yiyeceği adlandırdı. Türkçe, adı tuzlu suya veya sirkeye yatırılan sebze ve meyveler için benimsedi.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1400 öncesi","form":"turşīsi"},"relatives":[{"word":"thirst","relation":"eş köken"},{"word":"terra","relation":"eş köken"}],"alternatives":null,"funFact":"İngilizce thirst ve Latince terra, turşunun en eski köküyle akrabadır.","sources":[{"name":"Nişanyan Sözlük","ref":"turşu maddesi","url":"https://www.nisanyansozluk.com/kelime/tur%C5%9Fu"},{"name":"TDK Güncel Türkçe Sözlük","ref":"turşu","url":null}],"confidence":"yüksek","reviewed":true},{"id":"reçel","word":"reçel","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"rīçāl/riçāl","meaning":"reçel","period":null,"reconstructed":false},{"language":"tr","form":"reçel","meaning":"meyvenin şekerle pişirilmesiyle yapılan tatlı","period":null,"reconstructed":false}],"shortMeaning":"Meyvelerin şekerle pişirilmesiyle yapılan tatlı.","currentMeaning":"Meyvenin şekerle birlikte kaynatılıp kıvamlandırılmasıyla elde edilen tatlı yiyecek.","story":"Farsçadaki rīçāl, meyvenin tatlı bir yiyeceğe dönüştürülmüş hâlinin adıydı. Türkçeye giren adın eski rīçāl biçimi zamanla reçel söyleyişine dönüştü. Buradaki yolculukta yiyeceğin anlamı korunurken adı Türkçenin seslerine yaklaştı.","firstAttestation":{"source":"Anonim — Ferec ba'd eş-şidde","period":"1451 öncesi","form":"rīçāller"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"reçel maddesi","url":"https://www.nisanyansozluk.com/kelime/re%C3%A7el"},{"name":"TDK Güncel Türkçe Sözlük","ref":"reçel","url":null}],"confidence":"yüksek","reviewed":true},{"id":"pirinç","word":"pirinç","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"dra","chain":[{"language":"dra","form":"warinci","meaning":"pirinç","period":null,"reconstructed":true},{"language":"sa","form":"vrīha/vrīza","meaning":"pirinç","period":null,"reconstructed":false},{"language":"peo","form":"wrīza-/wrinca-","meaning":"pirinç","period":null,"reconstructed":true},{"language":"fa","form":"brinc/birinc","meaning":"pirinç bitkisi ve tanesi","period":null,"reconstructed":false},{"language":"tr","form":"pirinç","meaning":"sulu alanlarda yetiştirilen tahıl ve yenilen tanesi","period":null,"reconstructed":false}],"shortMeaning":"Bol suyla yetiştirilen bir tahıl ve onun yenilen tanesi.","currentMeaning":"Buğdaygiller ailesinden, suya doygun alanlarda yetiştirilen bitki ve kabuklarından ayrılarak yemeklerde kullanılan taneleri.","story":"Pirinç adı, Güney Asya'daki bir Dravid dilinden Sanskritçeye uzanan bir geçmiş taşır. Eski Farsça üzerinden Farsçadaki brinc ve birinc biçimlerine ulaşırken aynı tahılı adlandırmayı sürdürdü. Türkçeye Farsçadan giren bu ad, eski metinlerde aynı ürün için kullanılan tuturgan adıyla birlikte görüldü.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"brinç"},"relatives":[{"word":"oryza","relation":"eş köken"},{"word":"ruzz","relation":"eş köken"}],"alternatives":null,"funFact":"Tamilcede arisi, Teluguca warinci biçimleri pirincin Dravit kökenini gösterir.","sources":[{"name":"Nişanyan Sözlük","ref":"pirinç maddesi; tahıl anlamı","url":"https://www.nisanyansozluk.com/kelime/pirin%C3%A7"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pirinç; bitki anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nohut","word":"nohut","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"naḫōd","meaning":"nohut","period":null,"reconstructed":false},{"language":"fa","form":"naḫōd/nuḫōd","meaning":"nohut","period":null,"reconstructed":false},{"language":"tr","form":"nohut","meaning":"bir baklagil ve yenilen tanesi","period":null,"reconstructed":false}],"shortMeaning":"Yemeklerde kullanılan taneleri için yetiştirilen bir baklagil.","currentMeaning":"Baklagiller ailesinden, sarımsı çiçekler açan tarım bitkisi ve bu bitkinin besin olarak kullanılan taneleri.","story":"Orta Farsçadaki naḫōd, bugün de tanelerini yediğimiz baklagilin adıydı. Farsçada naḫōd ve nuḫōd biçimleriyle sürdürülen ad, Türkçede nohut oldu. Diller arasında değişen seslerine karşılık, tarladaki bitkiyle sofradaki taneyi birlikte adlandırma işlevi korundu.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"noghu[t]"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nohut maddesi","url":"https://www.nisanyansozluk.com/kelime/nohut"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nohut","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mercimek","word":"mercimek","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"marcumak","meaning":"küçük taneli bir baklagil, mercimek","period":null,"reconstructed":false},{"language":"tr","form":"mercimek","meaning":"yassı taneleri yenen baklagil","period":null,"reconstructed":false}],"shortMeaning":"Küçük ve yassı taneleri yenen bir baklagil.","currentMeaning":"Baklagiller ailesinden, beyaz çiçekli tarım bitkisi ve yemeklerde kullanılan küçük, yassı taneleri.","story":"Farsça marcumak, küçük taneli mercimeği adlandırıyordu. Bu ad, aynı dilde göz bebeğini anlatan mardumak ile kök bağı taşır; mardumak da insanı anlatan mardumla bağlantılıdır. Bitki adı Türkçeye mercimek olarak geçerken gözle ilgili kullanım değil, yenilen tanenin adı yerleşti.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"maruimak"},"relatives":[{"word":"mardumak","relation":"eş köken"},{"word":"mardum","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mercimek maddesi","url":"https://www.nisanyansozluk.com/kelime/mercimek"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mercimek","url":null}],"confidence":"yüksek","reviewed":true},{"id":"patlıcan","word":"patlıcan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"sa","chain":[{"language":"sa","form":"vātigagama/vātiŋgaṇa","meaning":"patlıcan","period":null,"reconstructed":false},{"language":"fa","form":"bādingān","meaning":"patlıcan","period":null,"reconstructed":false},{"language":"ar","form":"bādincān","meaning":"patlıcan","period":null,"reconstructed":false},{"language":"tr","form":"patlıcan","meaning":"meyvesi sebze olarak yenen bitki","period":null,"reconstructed":false}],"shortMeaning":"Meyvesi sebze olarak kullanılan bir bitki ve onun meyvesi.","currentMeaning":"Patlıcangiller ailesinden, kalınca saplı ve uzun yapraklı otsu bitki ile yemeklerde kullanılan etli meyvesi.","story":"Hindistan kökenli bu bitkinin adı, Sanskritçeden Farsçaya, oradan da Arapçaya taşındı. Farsça bādingān ve Arapça bādincān aynı sebzeyi gösterirken Türkçedeki söyleyiş zamanla patlıcan biçimini aldı. Bitki Yakın Doğu'da tanındıkça adı da farklı dillerin seslerine uyarlanarak yaşamayı sürdürdü.","firstAttestation":null,"relatives":[{"word":"aubergine","relation":"eş köken"}],"alternatives":null,"funFact":"Fransızca aubergine, aynı Arapça bitki adının Katalanca üzerinden geçmiş biçimidir.","sources":[{"name":"Nişanyan Sözlük","ref":"patlıcan maddesi","url":"https://www.nisanyansozluk.com/kelime/patl%C4%B1can"},{"name":"TDK Güncel Türkçe Sözlük","ref":"patlıcan","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ıspanak","word":"ıspanak","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"spey-","meaning":"sivrilikle ilişkili kök","period":null,"reconstructed":true},{"language":"peo","form":"spai-","meaning":"dikenli, uzun veya sivri nesne","period":null,"reconstructed":true},{"language":"pal","form":"ispanāḫ/ispanāg/spanāg","meaning":"ıspanak","period":null,"reconstructed":true},{"language":"fa","form":"ispanāḫ/ispānac/sipānāḫ/sipānāc","meaning":"ıspanak bitkisi","period":null,"reconstructed":false},{"language":"tr","form":"ıspanak","meaning":"yaprakları yenen sebze","period":null,"reconstructed":false}],"shortMeaning":"Yeşil yaprakları sebze olarak yenen bitki.","currentMeaning":"Yaprakları yemek, börek ve benzeri yiyeceklerde kullanılan otsu sebze bitkisi.","story":"Ispanağın adını Farsçaya bağlayan açıklama, daha geride sivri ve dikenli nesneleri anlatan eski bir köke uzanır. Bu çizgide ad, İran dillerinde bir sebzeye bağlanmış ve Türkçede yaprakları yenen bitkiyi adlandırmıştır. Ancak Türkçeye doğrudan Farsçadan mı, Rumcadan mı geçtiği konusunda kaynaklar uyuşmaz.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"yspanak"},"relatives":[{"word":"spinach","relation":"eş köken"},{"word":"épinard","relation":"eş köken"}],"alternatives":["Nişanyan Sözlük, Türkçe ıspanağı Farsça biçimlerden açıklar ve kökü eski İran dilleri üzerinden Hintavrupa Anadiline götürür.","TDK Güncel Türkçe Sözlük, Türkçeye kaynaklık eden dili Rumca olarak belirtir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ıspanak maddesi","url":"https://www.nisanyansozluk.com/kelime/%C4%B1spanak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ıspanak","url":null}],"confidence":"orta","reviewed":true},{"id":"nar","word":"nar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nār/anār","meaning":"nar ağacı ve meyvesi","period":null,"reconstructed":false},{"language":"tr","form":"nar","meaning":"çok taneli meyve ve onu veren ağaç","period":null,"reconstructed":false}],"shortMeaning":"İçi sulu tanelerle dolu meyve ve bu meyveyi veren ağaç.","currentMeaning":"Kırmızı çiçekler açan küçük ağaç ve bu ağacın kalınca bir kabuk içinde çok sayıda sulu tane barındıran meyvesi.","story":"Narın Farsça nār ve anār biçimleri, hem ağacı hem de içi tanelerle dolu meyvesini adlandırıyordu. Bu adın Akkadca ve Hititçedeki karşılıklarıyla kök bağı, geçmişini eski Mezopotamya ve Anadolu'nun bitki adlarına bağlar. Türkçede enār biçimi de kullanılmış, bugünkü dilde kısa nar biçimi yerleşmiştir.","firstAttestation":{"source":"Anonim — Tezkiretü'l-Evliya tercümesi","period":"1341","form":"nār"},"relatives":[{"word":"nurmû","relation":"eş köken"},{"word":"nur","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nar maddesi; meyve anlamı","url":"https://www.nisanyansozluk.com/kelime/nar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nar","url":null}],"confidence":"yüksek","reviewed":true},{"id":"badem","word":"badem","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"wādām","meaning":"badem","period":null,"reconstructed":false},{"language":"fa","form":"bādām/bāyām","meaning":"badem","period":null,"reconstructed":false},{"language":"tr","form":"badem","meaning":"badem ağacı ve yenilen içi","period":null,"reconstructed":false}],"shortMeaning":"Sert kabuklu meyvesinin içi yenen ağaç ve onun yenilen içi.","currentMeaning":"Sert bir kabukla çevrili yenilebilir iç veren ağaç ve bu ağacın besin olarak tüketilen meyve içi.","story":"Orta Farsçadaki wādām, kabuğunun içi yenilen bademin eski adıdır. Farsçada bādām ve bāyām biçimleri oluşmuş, Türkçede de bādām ile pāyām kullanılmıştır. Bugün badem dediğimiz yiyeceğin adında büyük bir anlam değişmesi yaşanmamış; aynı ürün farklı ses biçimleriyle adlandırılmıştır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"badam"},"relatives":[{"word":"payam","relation":"eş köken"},{"word":"Acıpayam","relation":"birleşik"},{"word":"vāma","relation":"eş köken"}],"alternatives":null,"funFact":"Acıpayam ilçesinin adı, eski payam biçimiyle kurulmuş 'acı badem' adlandırmasıdır.","sources":[{"name":"Nişanyan Sözlük","ref":"badem maddesi","url":"https://www.nisanyansozluk.com/kelime/badem"},{"name":"TDK Güncel Türkçe Sözlük","ref":"badem","url":null}],"confidence":"yüksek","reviewed":true},{"id":"dut","word":"dut","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"syc","chain":[{"language":"syc","form":"tūtā","meaning":"dut","period":null,"reconstructed":false},{"language":"ar","form":"tūt","meaning":"dut ağacı ve meyvesi","period":null,"reconstructed":false},{"language":"tr","form":"dut","meaning":"dut ağacı ve yenilen meyvesi","period":null,"reconstructed":false}],"shortMeaning":"Yaprakları ipek böceğine verilen ağaç ve onun meyvesi.","currentMeaning":"Ilıman bölgelerde yetişen, yaprakları ipek böceği besiciliğinde kullanılan ağaç ve bu ağacın yenilebilir meyvesi.","story":"Dutun geçmişini Süryanice tūtā ile başlatan açıklamada, ad Arapçaya tūt olarak geçer ve hem ağacı hem meyvesini gösterir. Türkçenin eski tūt biçimi de aynı bitkiyi adlandırırken zamanla dut söyleyişi yerleşir. Türkçeye geçişteki doğrudan aracının Arapça mı, Farsça mı olduğu konusunda kaynaklar farklı açıklamalar sunar.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1400 öncesi","form":"tūt"},"relatives":[],"alternatives":["Nişanyan Sözlük, Türkçe dutu Arapça tūt üzerinden Süryanice tūtā biçimine bağlar.","TDK Güncel Türkçe Sözlük, Türkçe dutun kaynağını Farsça tūt olarak verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"dut maddesi","url":"https://www.nisanyansozluk.com/kelime/dut"},{"name":"TDK Güncel Türkçe Sözlük","ref":"dut","url":null}],"confidence":"orta","reviewed":true},{"id":"incir","word":"incir","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"ancīr","meaning":"incir","period":null,"reconstructed":false},{"language":"tr","form":"incir","meaning":"incir ağacı ve meyvesi","period":null,"reconstructed":false}],"shortMeaning":"Geniş yapraklı bir ağaç ve onun tatlı meyvesi.","currentMeaning":"Akdeniz çevresine özgü, geniş ve dilimli yaprakları olan ağaç ile bu ağacın taze veya kurutularak yenilen meyvesi.","story":"İran dillerindeki ancīr, bugün incir dediğimiz meyvenin eski adını taşır. Türkçe bu adı Farsçadan alırken başlangıçtaki sesleri değişmiş, ancak adın gösterdiği meyve değişmemiştir. Bugünkü incir, hem geniş yapraklı ağacı hem de ondan toplanan tatlı ürünü adlandırır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"ingir"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"incir maddesi","url":"https://www.nisanyansozluk.com/kelime/incir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"incir","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şeftali","word":"şeftali","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"şaft + ālū","meaning":"kaba, kalın + erik türü meyve","period":null,"reconstructed":false},{"language":"fa","form":"şaft-ālū","meaning":"şeftali","period":null,"reconstructed":false},{"language":"tr","form":"şeftali","meaning":"şeftali ağacı ve meyvesi","period":null,"reconstructed":false}],"shortMeaning":"Pembe çiçekli bir ağaç ve onun iri çekirdekli, sulu meyvesi.","currentMeaning":"Gülgiller ailesinden, ılıman iklimlerde yetişen pembe çiçekli ağaç ve bu ağacın etli, sulu meyvesi.","story":"Şeftalinin Farsça adı, meyveyi erik benzeri ürünlerin arasında tarif eder. Adın ālū bölümü bu meyve grubunu gösterirken şaft bölümü kabalık ve kalınlık niteliği ekler. Bu iki parçadan kurulan şaft-ālū, Türkçeye tek bir meyvenin adı olarak taşınmış ve şeftali biçimini almıştır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"saftalu"},"relatives":[{"word":"zerdali","relation":"akraba"}],"alternatives":null,"funFact":"Şeftalinin eski şeftālü biçimi, 'öpücük' için de kullanılmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"şeftali maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Feftali"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şeftali","url":null}],"confidence":"yüksek","reviewed":true},{"id":"zerdali","word":"zerdali","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"zard + ālū","meaning":"sarı + erik türü meyve","period":null,"reconstructed":false},{"language":"fa","form":"zardālū","meaning":"sarı erik; kayısı","period":null,"reconstructed":false},{"language":"tr","form":"zerdali","meaning":"küçük meyveli kayısı türü","period":null,"reconstructed":false}],"shortMeaning":"Küçük meyveli bir kayısı türü ve onun meyvesi.","currentMeaning":"Akdeniz çevresinde yetiştirilen, meyveleri küçük olan kayısı türü ve bu ağacın meyvesi.","story":"Farsçada zard sarı rengi, ālū ise erik benzeri meyveleri adlandırır. Birleşmeleriyle oluşan zardālū, kayısıyı rengi üzerinden 'sarı erik' olarak tarif ediyordu. Türkçede başlangıçta kayısıyı karşılayan bu adın kapsamı daraldı ve zerdali özellikle küçük meyveli tür için kullanılır oldu.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1400 öncesi","form":"zerdālūnuŋ"},"relatives":[{"word":"şeftali","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"zerdali maddesi","url":"https://www.nisanyansozluk.com/kelime/zerdali"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zerdali","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hurma","word":"hurma","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"ḫordan, ḫor","meaning":"yemek","period":null,"reconstructed":false},{"language":"pal","form":"ḫormag","meaning":"yemiş","period":null,"reconstructed":false},{"language":"fa","form":"ḫurmā","meaning":"yemiş; özellikle taze hurma","period":null,"reconstructed":false},{"language":"tr","form":"hurma","meaning":"hurma ağacı ve tatlı meyvesi","period":null,"reconstructed":false}],"shortMeaning":"Hurma ağacı ve onun tatlı, etli meyvesi.","currentMeaning":"Sıcak iklimlerde yetişen hurma ağacı ve bu ağacın taze ya da kurutulmuş olarak tüketilen tatlı meyvesi.","story":"Hurmanın adı, Orta Farsçada yemek eylemine bağlanır. Bu eylemden türeyen ḫormag, belirli bir meyveden önce genel olarak yemişi adlandırıyordu. Farsça ḫurmā kullanımında özellikle taze hurma öne çıktı; Türkçede de ad bu belirli meyve ve ağacı üzerinde yerleşti.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"ḫurma"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hurma maddesi","url":"https://www.nisanyansozluk.com/kelime/hurma"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hurma","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nişasta","word":"nişasta","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"ni-sed-","meaning":"aşağı oturmak","period":null,"reconstructed":true},{"language":"pal","form":"nişastan","meaning":"oturmak","period":null,"reconstructed":false},{"language":"pal","form":"nişāstag","meaning":"nişasta, çökelti","period":null,"reconstructed":false},{"language":"fa","form":"nişāsta","meaning":"nişasta; dibe çöken madde","period":null,"reconstructed":false},{"language":"tr","form":"nişasta","meaning":"bitkilerden ayrıştırılarak elde edilen unumsu madde","period":null,"reconstructed":false}],"shortMeaning":"Tahıl ve yumru gibi bitkisel ürünlerden elde edilen unumsu madde.","currentMeaning":"Tahıl, baklagil veya patates gibi bitkisel ürünlerden ayrıştırılan, un görünümünde ve yemeklerde kıvam vermek için de kullanılan madde.","story":"Nişastanın adının başlangıcında oturmak ve aşağı yerleşmek hareketi vardır. Orta Farsçadaki nişastan fiiline bağlı ad, Farsçada dibe çöken maddeyi ve nişastayı birlikte anlatır. Sıvı içinde dibe oturan çökelti görüntüsü böylece bir mutfak malzemesinin adına dönüşmüş, Türkçeye nişasta olarak geçmiştir.","firstAttestation":{"source":"Anonim — Danişmend-Name","period":"1360","form":"nişasta"},"relatives":[{"word":"nişīdati","relation":"eş köken"},{"word":"nişidaiti","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nişasta maddesi","url":"https://www.nisanyansozluk.com/kelime/ni%C5%9Fasta"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nişasta","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çorba","word":"çorba","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"bāġ","meaning":"sulu aş","period":null,"reconstructed":false},{"language":"fa","form":"bā","meaning":"aş","period":null,"reconstructed":false},{"language":"pal","form":"sōr","meaning":"tuzlu","period":null,"reconstructed":false},{"language":"fa","form":"şōr","meaning":"tuzlu veya karışık","period":null,"reconstructed":false},{"language":"fa","form":"şōrbā","meaning":"tuz katılmış veya karıştırılmış aş","period":null,"reconstructed":false},{"language":"tr","form":"çorba","meaning":"çeşitli malzemelerle pişirilen sulu yemek","period":null,"reconstructed":false}],"shortMeaning":"Çeşitli malzemelerle hazırlanan sulu yemek.","currentMeaning":"Et, sebze veya tahıl gibi malzemelerin suyla pişirilmesiyle hazırlanan yemek.","story":"Çorbanın Farsça adında iki parça buluşur: tuzlu ya da karışık olmayı anlatan şōr ile aş bildiren bā. İkisinin de geçmişi Orta Farsçaya uzanır; birlikte, içine malzeme ve tuz katılan bir aşı adlandırırlar. Türkçeye şōrbā biçiminden geçen ad, zamanla çorba söyleyişini kazanarak farklı malzemelerle yapılan sulu yemekleri kapsadı.","firstAttestation":{"source":"Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"şōrbā"},"relatives":[],"alternatives":null,"funFact":"Arapçadaki şūrabāc da Farsçadan alınmıştır; çorba, Arapçanın içmeyi anlatan şurb fiiline dayanmaz.","sources":[{"name":"Nişanyan Sözlük","ref":"çorba maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7orba"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çorba maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"köfte","word":"köfte","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"(s)kop-","meaning":"vurmak veya kesmek","period":null,"reconstructed":true},{"language":"fa","form":"kōftan","meaning":"döverek işlemek, vurmak","period":null,"reconstructed":false},{"language":"fa","form":"kōfta","meaning":"dövülerek ufaltılmış","period":null,"reconstructed":false},{"language":"tr","form":"köfte","meaning":"kıyılmış malzemeye biçim verilerek hazırlanan yemek","period":null,"reconstructed":false}],"shortMeaning":"Kıyılmış et veya başka malzemelerle biçim verilerek yapılan yemek.","currentMeaning":"Çoğunlukla kıymadan, ayrıca balık, tavuk veya patates gibi malzemelerden hazırlanan, biçim verilerek pişirilen yemek.","story":"Köftenin adında, malzemeyi havanda döven elin hareketi saklıdır. Farsçada kōftan dövmeyi, ondan türeyen kōfta ise bu işlemden geçmiş malzemeyi anlatıyordu. Türkçede bu ad, kıyılıp biçim verilen yemeğe yerleşti; bugün malzeme havanda dövülmese de eski hazırlama işlemi adında yaşar.","firstAttestation":{"source":"Danişmend-Name","period":"1360","form":"köftelü"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"köfte maddesi","url":"https://www.nisanyansozluk.com/kelime/k%C3%B6fte"},{"name":"TDK Güncel Türkçe Sözlük","ref":"köfte maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"pilav","word":"pilav","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"sa","chain":[{"language":"sa","form":"pul","meaning":"küme","period":null,"reconstructed":false},{"language":"sa","form":"pulāka","meaning":"pirinç dolu kâse","period":null,"reconstructed":false},{"language":"fa","form":"pilāv/palāv/pulav","meaning":"pirinçle hazırlanan yemek","period":null,"reconstructed":false},{"language":"tr","form":"pilav","meaning":"pirinç, bulgur veya kuskus yemeği","period":null,"reconstructed":false}],"shortMeaning":"Pirinç, bulgur veya kuskusla pişirilen yemek.","currentMeaning":"Pirinç, bulgur ya da kuskusun su veya et suyu gibi bir sıvıyla pişirilmesiyle hazırlanan yemek.","story":"Pilavın izini geriye sürünce Sanskritçede bir kümeye, ardından pirinç dolu bir kâseye ulaşılır. Bu ad Farsçada pirinç yemeğini karşılayan pilāv ve benzeri biçimlere dönüştü. Türkçeye geçtiğinde pirinçle bağını korudu, fakat bulgur ve kuskusla hazırlanan yemeklerin de adı oldu.","firstAttestation":{"source":"Ferec ba'd eş-şidde","period":"<1451","form":"pilāv-ı sultānī"},"relatives":[],"alternatives":null,"funFact":"Temcit pilavı deyimi, bir imama her seher aynı bulgur pilavının ısıtılıp sunulması anlatısıyla açıklanır.","sources":[{"name":"Nişanyan Sözlük","ref":"pilav maddesi","url":"https://www.nisanyansozluk.com/kelime/pilav"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pilav maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hoşaf","word":"hoşaf","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"ḫoşāb/ḫʷaşāb","meaning":"tatlı su; meyveli tatlı içecek","period":null,"reconstructed":false},{"language":"tr","form":"hoşaf","meaning":"kuru meyveyle hazırlanan sulu tatlı","period":null,"reconstructed":false}],"shortMeaning":"Kuru meyvelerin şekerli suda kaynatılmasıyla hazırlanan tatlı.","currentMeaning":"Kuru meyvelerin bütün veya doğranmış olarak şekerli su içinde pişirilmesiyle yapılan sulu tatlı.","story":"Hoşafın eski Farsça biçimi, hoşluk ve tatlılık bildiren parça ile suyu karşılayan ābı birleştirir. Böylece adın merkezinde meyveden önce tatlandırılmış su bulunur. Türkçedeki hoşāb ve hoşāv biçimleri zamanla hoşafa dönüşürken ad, kuru meyvelerle hazırlanan sulu tatlıya yerleşti.","firstAttestation":{"source":"Mercimek Ahmed, Kâbusname tercümesi","period":"1432","form":"ḫoşābı"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hoşaf maddesi","url":"https://www.nisanyansozluk.com/kelime/ho%C5%9Faf"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hoşaf maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"meze","word":"meze","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"mizag","meaning":"tat, tadım","period":null,"reconstructed":false},{"language":"fa","form":"maza","meaning":"tat veya tadımlık","period":null,"reconstructed":false},{"language":"tr","form":"meze","meaning":"içkinin yanında sunulan yiyecek","period":null,"reconstructed":false}],"shortMeaning":"İçkinin yanında sunulan yiyecek.","currentMeaning":"İçkiye eşlik etmesi için sofraya getirilen yiyecek.","story":"Mezenin geçmişinde belirli bir yemek değil, ağızda duyulan tat vardır. Orta Farsça mizagın devamı olan Farsça maza, tat ve tadım çevresinde kullanılıyordu. Bugünkü yiyecek adının, tadımlık bir şeyi anlatan mezelik kullanımından gelişmiş olması muhtemeldir; böylece tat duyusunun adı sofradaki yiyeceğe bağlanmış olur.","firstAttestation":{"source":"Edib Ahmed, Atebet-ül Hakayık","period":"<1250?","form":"maza"},"relatives":[{"word":"mezelik","relation":"türev"}],"alternatives":["Nişanyan Sözlük, günümüzdeki yiyecek anlamının mezelik kullanımından gelişmesini olası bir açıklama olarak sunar."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"meze maddesi","url":"https://www.nisanyansozluk.com/kelime/meze"},{"name":"TDK Güncel Türkçe Sözlük","ref":"meze maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tarhana","word":"tarhana","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"ḫʷān","meaning":"masa","period":null,"reconstructed":false},{"language":"fa","form":"tar","meaning":"ıslak, yaş","period":null,"reconstructed":false},{"language":"fa","form":"tarḫʷāna","meaning":"kurutulmuş yoğurtla hazırlanan çorba","period":null,"reconstructed":false},{"language":"tr","form":"tarhana","meaning":"kurutulup ufalanan çorbalık karışım","period":null,"reconstructed":false}],"shortMeaning":"Mayalanıp kurutulan, ufalanarak saklanan çorbalık karışım.","currentMeaning":"Tahıl veya hamurun yoğurt, süt, sebze ve otlarla işlenip mayalandırılması, ardından kurutulup ufalanmasıyla hazırlanan çorba malzemesi.","story":"Tarhananın Farsça geçmişinde ıslaklığı anlatan tar ile masayı karşılayan ḫʷān birleşir. Ortaya çıkan ad, kurutulmuş yoğurtla yapılan bir çorbaya verilmiştir. Türkçedeki tarhana ise yoğurt veya sütle işlenen tahıl ve hamurun kurutularak saklandığı çorbalık karışımı adlandırır; eski yemek adı, çorbanın hazırlık malzemesinde de yaşamayı sürdürür.","firstAttestation":{"source":"Danişmend-Name","period":"1360","form":"tarḫāna"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tarhana maddesi","url":"https://www.nisanyansozluk.com/kelime/tarhana"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tarhana maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"erişte","word":"erişte","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"riştan","meaning":"iplik eğirmek","period":null,"reconstructed":false},{"language":"fa","form":"rişta","meaning":"iplik veya şerit","period":null,"reconstructed":false},{"language":"tr","form":"erişte","meaning":"ince şeritler biçiminde kesilip kurutulan hamur","period":null,"reconstructed":false}],"shortMeaning":"İnce şeritler hâlinde kesilerek kurutulan hamur.","currentMeaning":"Açılmış hamurun ince uzun parçalar hâlinde kesilip kurutulmasıyla hazırlanan yiyecek.","story":"Eriştenin adındaki görüntü, ince uzun bir ipliktir. Farsça rişta, eğirme ve bükme eylemiyle bağlantılı olarak ipliği ve şeridi adlandırıyordu. Hamurun ince şeritleri de bu adla anıldı; Türkçedeki eski rişte biçimi, başına ünlü alarak erişteye dönüştü.","firstAttestation":{"source":"Erzurumlu Darir, Kıssa-i Yusuf tercümesi","period":"<1377","form":"rişte"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"erişte maddesi","url":"https://www.nisanyansozluk.com/kelime/eri%C5%9Fte"},{"name":"TDK Güncel Türkçe Sözlük","ref":"erişte maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"zerde","word":"zerde","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"zardak","meaning":"sarı renkli şey","period":null,"reconstructed":false},{"language":"fa","form":"zarda","meaning":"sarı şey; safran","period":null,"reconstructed":false},{"language":"tr","form":"zerde","meaning":"safranlı tatlı pirinç peltesi","period":null,"reconstructed":false}],"shortMeaning":"Safranla sarartılan tatlı pirinç peltesi.","currentMeaning":"Pirinç ve şekerle hazırlanan, safranın renk ve koku kattığı pelte kıvamında tatlı.","story":"Zerde adını pirinçten değil, tatlının sarı görünüşünden alır. Orta Farsça zardakın devamı olan zarda, sarı şeyleri ve safranı adlandırıyordu. Türkçede bu renk adı, safranın sararttığı pirinç tatlısına yerleşti.","firstAttestation":{"source":"Erzurumlu Darir, Kıssa-i Yusuf tercümesi","period":"<1377","form":"zerde"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"zerde maddesi","url":"https://www.nisanyansozluk.com/kelime/zerde"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zerde maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"keşkek","word":"keşkek","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"kaşk","meaning":"peynir suyu; belki kurut","period":null,"reconstructed":false},{"language":"fa","form":"kaşk","meaning":"süt pıhtısı, peynir altı suyu veya arpa ürünü","period":null,"reconstructed":false},{"language":"tr","form":"keşkek","meaning":"dövülmüş buğday ve etle hazırlanan yemek","period":null,"reconstructed":false}],"shortMeaning":"Dövülmüş buğdayın etle uzun süre pişirilmesiyle yapılan yemek.","currentMeaning":"İyice dövülen buğdayın etle birlikte uzun süre kaynatılmasıyla hazırlanan yemek.","story":"Keşkeğin geçmişindeki Farsça kaşk, süt pıhtısı ve peynir altı suyunun yanında arpa ve arpa suyunu da adlandırıyordu. Bu yüzden adın eski anlam çevresinde hem süt ürünleri hem tahıl bulunur. Türkçedeki keşkek, buğdayla etin uzun süre pişirildiği yemeğe yerleşmiştir; ancak sondaki ekin niteliği ve eski Orta Farsça biçimin tam karşılığı belirsizdir.","firstAttestation":{"source":"Danişmend-Name","period":"1360","form":"keşkek"},"relatives":[],"alternatives":["Nişanyan Sözlük, keşkek biçimindeki +ek unsurunun niteliğini belirsiz bırakır.","Nişanyan Sözlük, Orta Farsça kaşk için kurut karşılığını soru işaretiyle verir.","TDK Güncel Türkçe Sözlük, doğrudan kaynak biçimi Farsça keşkek olarak gösterirken Nişanyan Sözlük açıklamasını kaşk üzerinden kurar."],"funFact":"Aynı yemeğin herise veya harisa adı, Farsçadan değil Arapçadan alınmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"keşkek maddesi","url":"https://www.nisanyansozluk.com/kelime/ke%C5%9Fkek"},{"name":"TDK Güncel Türkçe Sözlük","ref":"keşkek maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sirke","word":"sirke","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":null,"ultimateOrigin":null,"chain":[{"language":"fa","form":"sirka","meaning":"sirke; Türkçeyle alıntı yönü belirsiz","period":null,"reconstructed":false},{"language":"otk","form":"sirke","meaning":"üzümden elde edilen asitli sıvı","period":null,"reconstructed":false},{"language":"tr","form":"sirke","meaning":"yiyeceklere ekşilik veren mayalanmış sıvı","period":null,"reconstructed":false}],"shortMeaning":"Mayalanmayla elde edilen, yiyeceklere ekşilik katan sıvı.","currentMeaning":"Üzüm gibi meyvelerden mayalanma yoluyla elde edilen, yemeklerde ve salatalarda kullanılan ekşi sıvı.","story":"Sirke, Eski Türkçede üzümden elde edilen asitli sıvının adıydı; bugünkü mutfak kullanımı bu eski anlamı sürdürür. Farsçada da sirka biçimi bulunur, ancak kelimenin iki dil arasında hangi yönde geçtiği kesin değildir. Bu nedenle bugünkü ekşi sıvıdan eski üzüm ürününe uzanan anlam bağı açık olsa da adın ilk doğduğu dil belirsiz kalır.","firstAttestation":{"source":"Kaşgarî, Divan-i Lugati't-Türk","period":"1073","form":"sirke"},"relatives":[],"alternatives":["Nişanyan Sözlük, mutfakta kullanılan sirkenin nihai kökenini ve Türkçe ile Farsça arasındaki alıntı yönünü belirsiz sayar; Farsçadan Türkçeye geçiş kesinleştirilemez."],"funFact":"Bit yumurtasını adlandıran ayrı sirke kelimesi de 1073 tarihli Türkçe tanıklığa sahiptir.","sources":[{"name":"Nişanyan Sözlük","ref":"sirke maddesi; eş sesli kelime için sirke2 maddesi","url":"https://www.nisanyansozluk.com/kelime/sirke"}],"confidence":"orta","reviewed":true},{"id":"para","word":"para","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"pāra","meaning":"bir bütünden ayrılmış parça","period":null,"reconstructed":false},{"language":"tr","form":"para","meaning":"ödemede kullanılan değer aracı","period":null,"reconstructed":false}],"shortMeaning":"Alışveriş ve ödemelerde kullanılan değer aracı.","currentMeaning":"Devletin çıkardığı, belirli bir değeri temsil eden kâğıt veya metal ödeme aracı.","story":"Paranın eski Farsça adı pāra, herhangi bir bütünden ayrılmış parçayı anlatıyordu. Türkçede 16. yüzyılın başlarında bu parça, gümüşten bir ödeme parçası olarak ayrı bir anlam kazandı. Böylece nesnenin bölünmüş oluşunu anlatan ad, alışverişte taşıdığı değeri öne çıkararak bugünkü paraya dönüştü.","firstAttestation":{"source":"Osmanlı Kanunnameleri","period":"1501","form":"pāre"},"relatives":[{"word":"pare","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"para maddesi","url":"https://www.nisanyansozluk.com/kelime/para"},{"name":"TDK Güncel Türkçe Sözlük","ref":"para maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"pazar","word":"pazar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"peo","chain":[{"language":"peo","form":"vahā-çarāna-","meaning":"alışveriş yapılan yer","period":null,"reconstructed":false},{"language":"pal","form":"vāzār","meaning":"alışveriş alanı","period":null,"reconstructed":false},{"language":"fa","form":"bāzār","meaning":"ticaret yapılan alan, çarşı","period":null,"reconstructed":false},{"language":"tr","form":"pazar","meaning":"belirli günlerde kurulan satış yeri","period":null,"reconstructed":false}],"shortMeaning":"Satıcıların belirli günlerde bir araya geldiği alışveriş yeri.","currentMeaning":"Malların satışa sunulması için belirli günlerde kurulan geçici alışveriş alanı.","story":"Pazarın en eski halkası, Eski Farsçada alışverişe ayrılmış bir yeri adlandırır. Bu yer adı Orta Farsçada vāzār, Farsçada bāzār biçimini aldı; satıcılarla alıcıların buluştuğu alanı anlatmayı sürdürdü. Türkçede pazar biçimine dönüşen kelime, belirli günlerde kurulan satış alanlarının da adı oldu.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"bazar"},"relatives":[{"word":"vāçarn","relation":"eş köken"},{"word":"vacaŗ","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"pazar maddesi","url":"https://www.nisanyansozluk.com/kelime/pazar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pazar maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çarşı","word":"çarşı","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"sōk","meaning":"yol","period":null,"reconstructed":false},{"language":"fa","form":"sū","meaning":"yol","period":null,"reconstructed":false},{"language":"fa","form":"çār","meaning":"dört","period":null,"reconstructed":false},{"language":"fa","form":"çārsū","meaning":"dörtyol kavşağı; dükkânların toplandığı merkez","period":null,"reconstructed":false},{"language":"tr"," ,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tezgâh maddesi","url":"https://www.nisanyansozluk.com/kelime/tezg%C3%A2h"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tezgâh maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çeyrek","word":"çeyrek","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"yak","meaning":"bir","period":null,"reconstructed":false},{"language":"fa","form":"çār/çahār","meaning":"dört","period":null,"reconstructed":false},{"language":"fa","form":"çār-yak","meaning":"dört eşit parçadan biri","period":null,"reconstructed":false},{"language":"tr","form":"çeyrek","meaning":"bir bütünün dörtte biri","period":null,"reconstructed":false}],"shortMeaning":"Bir bütünün dört eşit parçasından biri.","currentMeaning":"Dört eşit bölüme ayrılmış bir bütünün tek bölümü.","story":"Çeyreğin Farsça yapısında dört ile bir yan yana durur. Çār-yak, bir bütünü dört eşit parçaya ayırıp bunlardan birini seçen ölçüyü adlandırır. Türkçede söyleyiş çeyreğe dönüşmüş olsa da kelimenin taşıdığı oran değişmemiştir.","firstAttestation":{"source":"Filippo Argenti, Regola del Parlare Turco","period":"1533","form":"çeyrek"},"relatives":[{"word":"çarşı","relation":"akraba"}],"alternatives":null,"funFact":"Çeyrek ile çarşı, Farsçada dördü bildiren aynı çār unsurunu paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"çeyrek maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7eyrek"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çeyrek maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çift","word":"çift","rarity":"gündelik","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"yewg-","meaning":"iki şeyi birbirine bağlamak, çift koşmak","period":null,"reconstructed":true},{"language":"ine","form":"yugtós","meaning":"birbirine koşulmuş","period":null,"reconstructed":true},{"language":"pal","form":"cuḫt","meaning":"eş, birbirine koşulmuş çift","period":null,"reconstructed":false},{"language":"fa","form":"cuft","meaning":"eş; birlikte koşulan öküzlerden biri","period":null,"reconstructed":false},{"language":"tr","form":"çift","meaning":"birbirini tamamlayan iki tekten oluşan","period":null,"reconstructed":false}],"shortMeaning":"Birbirini tamamlayan iki tekten oluşan.","currentMeaning":"Birlikte bir bütün oluşturan veya birbirini tamamlayan iki unsurdan meydana gelen.","story":"Çiftin en eski kökünde iki şeyi birbirine bağlama ve birlikte koşma eylemi vardır. Farsça cuft, hem eşi hem birlikte koşulan öküzlerden birini adlandırıyordu. Türkçeye geçen kelime, bu birliktelik fikrini koruyarak birbirini tamamlayan iki nesneyi de anlatır oldu.","firstAttestation":{"source":"Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"cifti"},"relatives":[{"word":"yóga","relation":"eş köken"},{"word":"yoke","relation":"eş köken"},{"word":"yuḫta-","relation":"eş köken"}],"alternatives":null,"funFact":"Çift ile Sanskritçe yoga, birleştirme ve boyunduruk fikrini taşıyan aynı eski kökte buluşur.","sources":[{"name":"Nişanyan Sözlük","ref":"çift maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7ift"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çift maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tane","word":"tane","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"dʰoH-néh₂","meaning":"tahıl","period":null,"reconstructed":true},{"language":"pal","form":"dānag","meaning":"tohum, tahıl tanesi","period":null,"reconstructed":false},{"language":"fa","form":"dāna","meaning":"tohum; özellikle tahılın tek tanesi","period":null,"reconstructed":false},{"language":"tr","form":"tane","meaning":"sayılan şeylerin her biri","period":null,"reconstructed":false}],"shortMeaning":"Sayılan varlıkların her biri; adet.","currentMeaning":"Bir topluluk ve este maddesi; anlam kaydı","url":null}],"confidence":"orta","reviewed":true},{"id":"harman","word":"harman","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"ḫirman","meaning":"biçilmiş ekini toplama işi ve bu işin alanı","period":null,"reconstructed":false},{"language":"tr","form":"harman","meaning":"tahıl tanelerini başaklardan ayırma işi","period":null,"reconstructed":false}],"shortMeaning":"Biçilmiş tahılın tanelerini başaklarından ayırma işi.","currentMeaning":"Biçilip toplanan tahılın üzerinden düven geçirilerek tanelerinin başaklardan ayrılması işi.","story":"Harmanın Farsça geçmişinde biçilmiş ekinin bir yere yığılması vardır. Ḫirman hem bu işi hem ekinin toplandığı alanı adlandırıyordu. Türkçede hırman ve hırmen biçimlerinden harmana dönüşen kelime, hasadın devamındaki tane ayırma işini de anlatır; yığın, çalışma alanı ve yapılan işlem aynı adın çevresinde buluşur.","firstAttestation":{"source":"Rabguzi, Kısasü'l-Enbiya tercümesi","period":"1310","form":"ḫırman"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"harman maddesi","url":"https://www.nisanyansozluk.com/kelime/harman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"harman maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çuval","word":"çuval","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"guvāl","meaning":"kalın dokumadan torba veya yük dengi","period":null,"reconstructed":false},{"language":"fa","form":"cuwāl","meaning":"kalın dokumadan torba veya yük dengi","period":null,"reconstructed":false},{"language":"tr","form":"çuval","meaning":"dokuma büyük torba","period":null,"reconstructed":false}],"shortMeaning":"Yük koymak ve taşımak için kullanılan büyük dokuma torba.","currentMeaning":"Pamuk, kenevir veya sentetik liflerden dokunarak yapılan büyük torba.","story":"Çuvalın geçmişindeki nesne, kaba dokumayla yükü bir arada tutan büyük bir torbadır. Orta Farsça guvālin devamı olan Farsça cuwāl, böyle bir torbayı ve yük dengini adlandırıyordu. Türkçede şuvāl ve çüvāl gibi biçimlerden bugünkü çuvala ulaşılırken nesnenin temel işi değişmedi: içine konulanları toplamak ve taşımak.","firstAttestation":{"source":"et-Tuhfetu'z-Zekiyye fi'l-Lugati't-Türkiyye","period":"<1400","form":"şuvāl"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"çuval maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7uval"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çuval maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şal","word":"şal","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"şāl","meaning":"keşmir keçisinin yününden örtü","period":null,"reconstructed":false},{"language":"tr","form":"şal","meaning":"yünlü kumaş ve bundan yapılan örtü","period":null,"reconstructed":false}],"shortMeaning":"İnce yünlü kumaş veya omuzlara alınan örtü.","currentMeaning":"Özel desenlerle dokunmuş ince yünlü kumaş veya omuzları örtmek için kullanılan kumaş parçası.","story":"Şalın geçmişinde Keşmir keçilerinin yününden yapılan örtüler vardır. Farsçadaki şāl adı Türkçeye geçerken hem dokumanın hem de ondan yapılan örtünün adı olmayı sürdürdü. Böylece belirli bir yün dokumasının adı, omuzlara alınan bir giyim parçasında yaşamaya devam etti.","firstAttestation":{"source":"Hayalî — Ravzatü'l-envâr","period":"1449","form":"şāl"},"relatives":[{"word":"shawl","relation":"eş köken"},{"word":"châle","relation":"eş köken"}],"alternatives":null,"funFact":"İngilizce shawl ile Fransızca châle, aynı adı Urduca aracılığıyla almıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"şal maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Fal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şal","url":null}],"co
