rc","chain":[{"language":"grc","form":"notéō","meaning":"ıslatmak, yağmur yağdırmak","period":null,"reconstructed":false},{"language":"el","form":"nótos","meaning":"güney yönü","period":null,"reconstructed":false},{"language":"el","form":"nótios","meaning":"güneyden gelen, yağış taşıyan rüzgâr","period":null,"reconstructed":false},{"language":"tr","form":"lodos","meaning":"güney veya güneybatı yönünden esen rüzgâr","period":null,"reconstructed":false}],"shortMeaning":"Güneyden veya güneybatıdan esen, bazen yağış getiren rüzgâr.","currentMeaning":"Güney ve güneybatı yönlerinden gelen, kimi zaman yağış taşıyan yerel rüzgâr.","story":"Lodosun eski Yunancadaki kökünde ıslanma ve yağmur vardır. Güney yönünü bildiren nótos ile ondan türeyen nótios, bu yağışlı hava tablosunu güneyden gelen rüzgâra bağlar. Türkçede lodos adı, güney ve güneybatıdan esen rüzgârda yaşamayı sürdürür.","firstAttestation":{"source":"Piri Reis — Kitab-ı Bahriye","period":"1521","form":"lodos"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"lodos maddesi","url":"https://www.nisanyansozluk.com/kelime/lodos"},{"name":"TDK Güncel Türkçe Sözlük","ref":"lodos maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"poyraz","word":"poyraz","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"grc","chain":[{"language":"grc","form":"boréas/boreás","meaning":"kuzeyle ilgili olan, kuzeyden esen rüzgâr","period":null,"reconstructed":false},{"language":"el","form":"boreás/voreás","meaning":"kuzeyden esen rüzgâr","period":null,"reconstructed":false},{"language":"tr","form":"poyraz","meaning":"kuzeydoğu yönünden gelen soğuk rüzgâr","period":null,"reconstructed":false}],"shortMeaning":"Kuzeydoğudan esen soğuk rüzgâr.","currentMeaning":"Kuzeydoğu yönünden gelen ve soğuk hava taşıyan rüzgâr.","story":"Eski Yunancada boréas, kuzeyle ve o yönden esen rüzgârla ilişkiliydi. Yunancadaki boreás ve voreás biçimleri üzerinden Türkçeye taşınırken sözcüğün sesleri poyraza dönüştü. Türkçedeki yön adı daha belirginleşerek pusulanın kuzeydoğusundan gelen soğuk rüzgâra yerleşti.","firstAttestation":{"source":"Yadigâr-ı İbni Şerif","period":"1421 öncesi?","form":"foryāz"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"poyraz maddesi","url":"https://www.nisanyansozluk.com/kelime/poyraz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"poyraz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"aforoz","word":"aforoz","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"grc","chain":[{"language":"grc","form":"ʰóros","meaning":"ayırıcı sınır","period":null,"reconstructed":false},{"language":"grc","form":"aphorízō","meaning":"sınırın dışına çıkarmak, sürmek","period":null,"reconstructed":false},{"language":"el","form":"aforismós","meaning":"kişiyi kilisenin komünyonuna katılmaktan men etme cezası","period":null,"reconstructed":false},{"language":"tr","form":"aforoz","meaning":"kilise cemaatinden çıkarma cezası","period":null,"reconstructed":false}],"shortMeaning":"Kilisede bir kişiyi cemaatten çıkarma cezası.","currentMeaning":"Hristiyanlıkta kilisenin bir kişiyi dinî cemaatin dışında bırakmak üzere verdiği ceza.","story":"Aforozun uzak başlangıcında, Eski Yunancada sınırı gösteren ʰóros vardır. Bu sınırın dışına çıkarma eylemi, aphorízō biçiminde sürgün etmeyi anlatır. Orta Yunancada aforismós ile sınır dinî topluluğun çevresine çekilir ve dışarıda bırakılan kişi komünyondan men edilir. Türkçe aforoz, bu topluluktan çıkarma cezasının adını taşır.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"āforos"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"aforoz maddesi","url":"https://www.nisanyansozluk.com/kelime/aforoz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"aforoz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"anason","word":"anason","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"grc","chain":[{"language":"grc","form":"ánēthon/ánnēthon","meaning":"dereotu veya rezene olarak yorumlanan bitki","period":null,"reconstructed":false},{"language":"el","form":"ánison","meaning":"anason bitkisi","period":null,"reconstructed":false},{"language":"tr","form":"anason","meaning":"kokulu tohumlarından yararlanılan bir bitki","period":null,"reconstructed":false}],"shortMeaning":"Tohumları yiyecek ve içeceklere koku veren bir bitki.","currentMeaning":"Maydanozgillerden, aromalı tohumları hamur işlerinde ve rakı üretiminde kullanılan Pimpinella anisum türü.","story":"Anason adının eski Yunancadaki başlangıcında, dereotu mu yoksa rezene mi olduğu kesinleşmeyen bir bitki adı bulunur. Yunancadaki ánison aşamasında ad, bugün anason dediğimiz bitkiye bağlanır. Türkçeye doğrudan Yunancadan mı yoksa Arapça aracılığıyla mı ulaştığı konusunda iki ayrı açıklama vardır. Bugünkü ad, hamura ve içeceğe belirgin kokusunu veren tohumların bitkisini gösterir.","firstAttestation":{"source":"Yadigâr-ı İbni Şerif","period":"1421 öncesi?","form":"anīson"},"relatives":[{"word":"anise","relation":"eş köken"},{"word":"anis","relation":"eş köken"}],"alternatives":["Nişanyan Sözlük, eski Yunancadaki ánēthon/ánnēthon biçiminin hangi bitkiyi gösterdiğini dereotu ve rezene seçenekleriyle belirsiz bırakır.","Nişanyan Sözlük Türkçeye geçişi Yunanca ánison üzerinden açıklarken TDK Güncel Türkçe Sözlük doğrudan veren dil olarak Arapçayı gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"anason maddesi","url":"https://www.nisanyansozluk.com/kelime/anason"},{"name":"TDK Güncel Türkçe Sözlük","ref":"anason maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"funda","word":"funda","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"la","chain":[{"language":"la","form":"fundere, fus-","meaning":"dökmek, yaymak; bitkide bolca gelişmek ve dallanmak","period":null,"reconstructed":false},{"language":"el","form":"fúndonō","meaning":"sıklaşarak büyümek, birbirine giren dallar oluşturmak","period":null,"reconstructed":false},{"language":"el","form":"fúnda","meaning":"püskül, baş süsü, kabarık nesne ve çalı","period":null,"reconstructed":false},{"language":"tr","form":"funda","meaning":"süpürge otu adıyla da bilinen çalı","period":null,"reconstructed":false}],"shortMeaning":"Süpürge otu olarak da adlandırılan çalı.","currentMeaning":"Süpürge otu adıyla tanınan, çalı biçiminde gelişen bitki.","story":"Funda adının gerisindeki Latince eylem, dökülüp yayılmanın yanında bitkinin bolca dallanmasını da anlatıyordu. Yunancada bu hareket, sık ve iç içe büyümeyi anlatan fúndonō biçimine taşındı. Püskül gibi kabarık şeyleri ve çalıyı adlandıran fúnda, Türkçede süpürge otunun adı olarak yerleşti.","firstAttestation":{"source":"Filippo Argenti — Regola del Parlare Turco","period":"1533","form":"fundā"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"funda maddesi, bitki anlamı","url":"https://www.nisanyansozluk.com/kelime/funda"},{"name":"TDK Güncel Türkçe Sözlük","ref":"funda maddesi, bitki anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"izmarit","word":"izmarit","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"grc","chain":[{"language":"grc","form":"smáragdos","meaning":"zümrüt taşı","period":null,"reconstructed":false},{"language":"el","form":"smarída/smaragdinós","meaning":"zümrüt adıyla ilişkilendirilen küçük deniz balığı","period":null,"reconstructed":false},{"language":"tr","form":"izmarit","meaning":"pullu ve bol kılçıklı küçük deniz balığı","period":null,"reconstructed":false}],"shortMeaning":"Pullu ve bol kılçıklı küçük bir deniz balığı.","currentMeaning":"İzmaritgiller ailesinden, küçük gövdeli, pullu ve çok kılçıklı Maena smaris adlı balık.","story":"Balık adı olan izmaritin eski Yunancadaki başlangıcında zümrüt taşı vardır. Smáragdos adı, Yunancadaki smarída ve smaragdinós biçimlerinde bir deniz balığına bağlanır. Türkçe, bu adlandırmayı izmarit biçiminde alarak küçük ve kılçıklı balığın adı olarak sürdürür.","firstAttestation":{"source":"Gio. Molino — Dittionario della lingua italiana e turchesca","period":"1641","form":"izmarit"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"izmarit2 maddesi, balık anlamı","url":"https://www.nisanyansozluk.com/kelime/izmarit2"},{"name":"TDK Güncel Türkçe Sözlük","ref":"izmarit maddesi, balık anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kikla","word":"kikla","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"el","chain":[{"language":"el","form":"kíkla","meaning":"lapin türünden bir balık","period":null,"reconstructed":false},{"language":"tr","form":"kikla","meaning":"lapinagillerden renkli bir deniz balığı","period":null,"reconstructed":false}],"shortMeaning":"Lapinagillerden, renkleriyle dikkat çeken bir deniz balığı.","currentMeaning":"Lapinagiller ailesinde yer alan, boyu yaklaşık yarım metre olan renkli Labrus berggylta türü balık.","story":"Yunancadaki kíkla, lapin türünden bir balığın adı olarak Türkçeye taşınmıştır. Türkçede kikla biçimini alan ad, renkli gövdesiyle tanınan bu deniz canlısına bağlı kalır. Sözcüğün bugünkü kullanımında da merkezde aynı balık vardır.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"kikla maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"lapina","word":"lapina","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"lapina","meaning":"kayalık kıyılarda yaşayan renkli bir balık","period":null,"reconstructed":false},{"language":"tr","form":"lapina","meaning":"kayalık kıyılarda yaşayan renkli bir balık","period":null,"reconstructed":false}],"shortMeaning":"Sığ ve kayalık kıyılarda yaşayan renkli bir deniz balığı.","currentMeaning":"Lapinagillerden, yaklaşık 25-35 santimetreye ulaşan, mavi veya yeşil gövdesinde kırmızı benekler bulunan kıyı balığı.","story":"Fransızcadaki lapina adı, Türkçeye kayalık kıyıların renkli bir balığını adlandırmak üzere taşındı. Sözcük burada başka bir nesnenin adına dönüşmedi; sığ sularda yaşayan, benekli gövdesiyle ayırt edilen balığın adı olarak kullanıldı.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"lapina maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"lakerda","word":"lakerda","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"el","chain":[{"language":"el","form":"lakérda","meaning":"tuzla hazırlanmış palamut veya orkinos","period":null,"reconstructed":false},{"language":"tr","form":"lakerda","meaning":"iri balık dilimlerinden hazırlanan salamura","period":"15. yy","reconstructed":false}],"shortMeaning":"Palamut ve torik gibi balıklardan hazırlanan dilimli salamura.","currentMeaning":"Palamut, torik ve benzeri balıkların dilimlenip tuzla işlenmesiyle hazırlanan salamura yiyecek.","story":"Yunancadaki lakérda, denizde yüzen balıktan çok tuzla hazırlanmış balığı adlandırıyordu. Türkçeye de bu hazırlama biçimiyle birlikte geçti; palamut ve torik dilimlerinin salamuradaki hâlinin adı oldu.","firstAttestation":{"source":"Osmanlı Kanunnameleri, Selanik kanunnamesi","period":"1488","form":"lakerda"},"relatives":[{"word":"lacerta","relation":"eş köken"}],"alternatives":null,"funFact":"Latince eş kökenlisi lacerta, bir balık türünün yanı sıra kertenkeleyi de adlandırıyordu.","sources":[{"name":"Nişanyan Sözlük","ref":"lakerda maddesi","url":"https://www.nisanyansozluk.com/kelime/lakerda"},{"name":"TDK Güncel Türkçe Sözlük","ref":"lakerda maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"orkinos","word":"orkinos","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"grc","chain":[{"language":"grc","form":"óryks, oryg-","meaning":"sivri uçlu alet; tek boynuzlu efsanevi deniz canlısı veya bir balina türü","period":null,"reconstructed":false},{"language":"el","form":"órkinos","meaning":"bir ton balığı türü","period":null,"reconstructed":false},{"language":"tr","form":"orkinos","meaning":"ton balığı","period":"16. yy","reconstructed":false}],"shortMeaning":"Ton balığı.","currentMeaning":"Ton balığı adıyla da bilinen iri deniz balığı.","story":"Sözcüğün eski ucunda sivri bir alet ile tek boynuzlu olarak tasarlanan bir deniz yaratığı yan yana durur. Eski Yunancadaki bu ad ailesi, Yunancada órkinos biçimiyle bir ton balığı türüne bağlandı. Türkçeye geçen orkinos da efsanevi yaratığın değil, avlanan iri deniz balığının adı oldu.","firstAttestation":{"source":"Akhisarlı M. Bedrüddin, Cinanü'l-Cinas; Tarama Sözlüğü aktarımı","period":"1584","form":"orkenez"},"relatives":[{"word":"orca","relation":"eş köken"}],"alternatives":null,"funFact":"Latince orca ile orkinos eş kökenlidir; iki adın geçmişi farklı deniz canlılarında buluşur.","sources":[{"name":"Nişanyan Sözlük","ref":"orkinos maddesi","url":"https://www.nisanyansozluk.com/kelime/orkinos"},{"name":"TDK Güncel Türkçe Sözlük","ref":"orkinos maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kalamata","word":"kalamata","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"el","chain":[{"language":"el","form":"Kalamáta","meaning":"Yunanistan'da bir kent adı","period":null,"reconstructed":false},{"language":"tr","form":"kalamata","meaning":"iri ve etli bir zeytin çeşidi","period":"20. yy","reconstructed":false}],"shortMeaning":"İri ve etli bir zeytin çeşidi.","currentMeaning":"Kalamata zeytini olarak da adlandırılan, büyük taneli ve etli zeytin çeşidi.","story":"Kalamáta önce Yunanistan'daki bir kentin adıydı. Kent adı zeytinle birlikte anılınca coğrafyayı gösteren özel ad, sofradaki bir çeşidi de belirtmeye başladı. Türkçede kalamata denildiğinde artık kentin kendisi değil, iri ve etli zeytini öne çıkar.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1936","form":"Kalamata"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kalamata maddesi","url":"https://www.nisanyansozluk.com/kelime/kalamata"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kalamata maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sirtaki","word":"sirtaki","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"el","chain":[{"language":"el","form":"sirtós","meaning":"sirto adlı dans","period":null,"reconstructed":false},{"language":"el","form":"sirtáki","meaning":"küçük sirto; dans ezgisi","period":null,"reconstructed":false},{"language":"tr","form":"sirtaki","meaning":"kol ve ayak hareketleriyle giderek hızlanan halk oyunu","period":"20. yy","reconstructed":false}],"shortMeaning":"Kol ve ayak hareketleriyle giderek hızlanan bir halk oyunu.","currentMeaning":"Kolların ve ayakların belirgin hareketleriyle oynanan, temposu aşamalı olarak yükselen halk oyunu.","story":"Yunancadaki sirtós adlı dans, küçültme biçimi sirtáki ile yeni bir ad kazandı. Bu ad hem küçük sirtoyu hem de oyun havasını karşılıyordu. Türkçeye taşınırken dansla bağı korundu ve giderek hızlanan hareketleriyle tanınan oyunun adı oldu.","firstAttestation":{"source":"Milliyet gazetesi","period":"1965","form":"Sirtakiyi"},"relatives":[{"word":"sirto","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sirtaki maddesi","url":"https://www.nisanyansozluk.com/kelime/sirtaki"},{"name":"TDK ing":"Yaz mevsiminde gündüz saatlerinde denizden karaya yönelen serinletici rüzgâr.","story":"İtalyancadaki imbatto, denizden gelen esintiyi adlandırıyordu. Daha geride vurma ve çarpma eylemini anlatan battere ile bir bağlantı bulunabilir, ancak bu türeme kesin değildir. Türkçede imbat, kıyıya ulaşan bu esintinin yaz gündüzlerinde hissedilen deniz yeli olarak özelleşmiş adıdır.","firstAttestation":{"source":"Piri Reis, Kitab-ı Bahriye","period":"1521","form":"inbād"},"relatives":null,"alternatives":["Nişanyan Sözlük, İtalyanca imbatto ile battere arasındaki türeme ilişkisini muhtemel olarak değerlendirir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"imbat maddesi","url":"https://www.nisanyansozluk.com/kelime/imbat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"imbat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"bora","word":"bora","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"mn","ultimateOrigin":"mn","chain":[{"language":"mn","form":"boruġa(n)","meaning":"yağmur","period":null,"reconstructed":false},{"language":"tr","form":"bora","meaning":"çoğunlukla ardından yağmur gelen sert rüzgâr","period":null,"reconstructed":false}],"shortMeaning":"Çoğunlukla ardından yağmur gelen sert rüzgâr.","currentMeaning":"Sert esen ve genellikle yağışın habercisi olan rüzgâr; boğanak.","story":"Boranın geçmişi için iki ayrı dil yolu gösterilir. Moğolca açıklamasında başlangıçtaki boruġa(n) yağmuru adlandırır; Türkçedeki kullanımda ağırlık, yağışla birlikte düşünülen sert rüzgâra kayar. Diğer açıklama ise sözcüğü İtalyanca borea ile bağlar; bu yüzden Türkçeye hangi dilden geçtiği konusunda görüş birliği yoktur.","firstAttestation":{"source":"et-Tuhfetu'z-Zekiyye fi'l-Lugati't-Türkiyye","period":"1400 öncesi","form":"borġan"},"relatives":[{"word":"boran","relation":"akraba"}],"alternatives":["Nişanyan Sözlük, borayı yağmur bildiren Moğolca boruġa(n) biçiminden alınmış olarak açıklar.","TDK Güncel Türkçe Sözlük, d ına bağlanır.","firstAttestation":{"source":"Milliyet gazetesi","period":"1957","form":"tremolo"},"relatives":[{"word":"tremble","relation":"akraba"},{"word":"tremor","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tremolo maddesi","url":"https://www.nisanyansozluk.com/kelime/tremolo"}],"confidence":"orta","reviewed":true},{"id":"andante","word":"andante","rarity":"az-bilinen","partOfSpeech":"zarf","formationType":"alıntı","donorLanguage":"it","ultimateOrigin":"it","chain":[{"language":"it","form":"andánte","meaning":"orta derecede yavaş tempoyla","period":null,"reconstructed":false},{"language":"tr","form":"andante","meaning":"orta derecede yavaş tempoyla","period":null,"reconstructed":false}],"shortMeaning":"Orta derecede yavaş bir tempoyla.","currentMeaning":"Bir müzik parçasının adacyo ile andantino arasındaki yarı yavaş tempoda çalınmasını belirten terim.","story":"İtalyancadaki andánte, müzikçinin parçayı hangi hızda ilerleteceğini belirten bir terim olarak Türkçeye taşındı. Burada da sesin yüksekliğini veya çalgının türünü değil, icranın zaman içindeki akışını düzenler. Adacyo ile andantino arasında kalan yarı yavaş bir ilerleyiş ister.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"andante maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"kreşendo","word":"kreşendo","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"it","ultimateOrigin":"la","chain":[{"language":"la","form":"crescere, cret-","meaning":"büyümek, artmak, yükselmek","period":null,"reconstructed":false},{"language":"it","form":"crescere","meaning":"büyümek, artmak, yükselmek","period":null,"reconstructed":false},{"language":"it","form":"crescendo","meaning":"müzikte sesin giderek güçlenmesi","period":null,"reconstructed":false},{"language":"tr","form":"kreşendo","meaning":"sesin giderek güçlendirilmesini göstere ory":"Arapçada fikr tek bir düşünceyi, afkār ise düşünceleri karşılıyordu. Türkçede bu düşünceler dünyasına zamanla dert ve kaygı da katıldı. Böylece efkâr, zihinden geçenlerden çok bunların insanda bıraktığı hüzünle özdeşleşti.","firstAttestation":{"source":"Evliya Çelebi — Seyahatname","period":"1665","form":"efkâre"},"relatives":[{"word":"fikir","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"efkâr maddesi","url":"https://www.nisanyansozluk.com/kelime/efk%C3%A2r"},{"name":"TDK Güncel Türkçe Sözlük","ref":"efkâr maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tebessüm","word":"tebessüm","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"basama","meaning":"gülümsedi","period":null,"reconstructed":false},{"language":"ar","form":"tabassum","meaning":"gülümseme","period":null,"reconstructed":false},{"language":"tr","form":"tebessüm","meaning":"gülümseme","period":"14. yy","reconstructed":false}],"shortMeaning":"Yüzde beliren hafif gülüş.","currentMeaning":"Dudakların ve yüzün hafifçe gülme ifadesi alması.","story":"Arapça basama, yüzün gülümsemesini anlatan bir eylemdi. Bu hareketin adı olan tabassum, Türkçeye tebessüm biçiminde taşındı. Kelimenin yolculuğunda büyük bir anlam değişmesi olmadı; bugün de yüzün hafif bir gülüşle değişmesini anlatır.","firstAttestation":{"source":"Rabguzi — Kısasü'l-Enbiya tercümesi","period":"1310","form":"tebessüm"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tebessüm maddesi","url":"https://www.nisanyansozluk.com/kelime/tebess%C3%BCm"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tebessüm maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"muzip","word":"muzip","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁaẕ aning":"Benzerlik ve ayrılıkları görmek için karşılaştırma.","currentMeaning":"İki veya daha çok şeyi benzerlikleri, farklılıkları ya da değerleri bakımından karşılaştırma.","story":"Mukayesenin Arapça geçmişinde ölçmek kadar bir başkasıyla ölçüşmek de vardır. Yarışan iki kişinin birbirine göre değerlendirilmesi, bu anlam alanının somut bir görünümüdür. Türkçede kelime, yarışma düşüncesinden daha geniş bir karşılaştırma işlemine açılır; nesneler, görüşler ve sonuçlar da mukayese edilir.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"muḳāyeset"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mukayese maddesi","url":"https://www.nisanyansozluk.com/kelime/mukayese"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mukayese maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"muhteva","word":"muhteva","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥawā","meaning":"bir araya getirdi","period":null,"reconstructed":false},{"language":"ar","form":"muḥtawā","meaning":"bir şeyin içinde bulunan","period":null,"reconstructed":true},{"language":"tr","form":"muhteva","meaning":"bir bütünün kapsadığı şeyler","period":"20. yy","reconstructed":false}],"shortMeaning":"Bir şeyin içinde bulunanların bütünü.","currentMeaning":"Bir metnin, eserin veya başka bir bütünün kapsadığı konuların ve unsurların tamamı.","story":"Muhtevanın Arapça kökünde toplama eylemi bulunur. Bir araya getirilenlerin bir bütünün içinde bulunması, kelimenin içerikle bağını kurar. Türkçede bir kitabın muhtevasından söz edildiğinde, sayfaların içinde toplanmış konular ve düşünceler kastedilir.","firstAttestation":{"source":"TDK, Türkçe Sözlük, 1. Baskı","period":"1945","form":"muhteva"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"muhteva maddesi","url":"https://www.nisanyansozluk.com/k et etti","period":null,"reconstructed":false},{"language":"ar","form":"macāl","meaning":"hareket veya oyun alanı; erişim sınırı, yapabilme gücü","period":null,"reconstructed":false},{"language":"tr","form":"mecal","meaning":"bir işi yapmaya yetecek güç","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir işi yapmaya yetecek güç ve takat.","currentMeaning":"Bir hareketi veya işi gerçekleştirmek için gereken bedensel güç.","story":"Arapça cāla, dönüp dolaşan bir hareketi anlatır; macāl ise bu hareketin gerçekleşebileceği alanı adlandırır. Kelimenin anlamı, dolaşılabilecek yerden kişinin yapabileceklerinin kapsamına ve gücüne uzanır. Türkçede mecal kalmaması, bu anlam yolculuğunun güç tarafını yaşatır: kişi artık hareket edecek takati bulamaz.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"mecāl"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mecal maddesi","url":"https://www.nisanyansozluk.com/kelime/mecal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mecal maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mecaz","word":"mecaz","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"cāza","meaning":"bir yandan öbür yana geçti","period":null,"reconstructed":false},{"language":"ar","form":"macāz","meaning":"geçiş sağlayan yer veya köprü; gerçek anlamı dışında kullanılan ifade","period":null,"reconstructed":false},{"language":"tr","form":"mecaz","meaning":"benzerlik veya bağlantıyla başka anlamda kullanılan söz","period":"11. yy","reconstructed":false}],"shortMeaning":"Bir bağlantıyla gerçek anlamının dışında kullanılan söz.","currentMeaning":"Bir benzerlik veya anlam ilişkisi kurularak temel anlamından farklı bir anlamda kullanılan söz.","story":"Mecazın arkasında Arapça cāza fiilindeki karşıya geçme hareketi bulunur. Macāz önce geçit ve köprüyü, ardından bir sözün asıl anlamın ing":"canını aldı","period":null,"reconstructed":false},{"language":"ar","form":"maḳtūl","meaning":"öldürme eylemiyle hayatı sona ermiş","period":null,"reconstructed":false},{"language":"tr","form":"maktul","meaning":"başkası tarafından öldürülmüş","period":"14. yy","reconstructed":false}],"shortMeaning":"Öldürülmüş olan.","currentMeaning":"Bir öldürme eylemi sonucunda yaşamını kaybetmiş olan.","story":"Maktulun temelinde Arapça ḳatala fiilinin anlattığı öldürme eylemi bulunur. Maḳtūl, bu eylemden etkilenen ve hayatını kaybeden kişiyi gösterir. Türkçeye geçen maktul da ölümün gerçekleşmiş olmasından çok, kişinin öldürülmüş olduğunu belirtir.","firstAttestation":{"source":"Danişmend-Name","period":"1360","form":"maḳtūl"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"maktul maddesi","url":"https://www.nisanyansozluk.com/kelime/maktul"},{"name":"TDK Güncel Türkçe Sözlük","ref":"maktul maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"suhulet","word":"suhulet","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sahala","meaning":"sertliğini yitirdi, gevşeyip kolay duruma geldi","period":null,"reconstructed":false},{"language":"ar","form":"suhūla(t)","meaning":"sertliğin azalması; rahatça akma veya yapılabilme","period":null,"reconstructed":false},{"language":"tr","form":"suhulet","meaning":"güçlük çekmeden yapılabilme durumu","period":"17. yy","reconstructed":false}],"shortMeaning":"Bir işin güçlük çekilmeden yapılabilmesi, kolaylık.","currentMeaning":"Bir işin zorlanmadan ve güçlükle karşılaşmadan gerçekleştirilebilmesi.","story":"Suhuletin başlangıcındaki Arapça sahala, sertliğin çözülmesini, gevşemeyi ve kolaylaşmayı birlikte anlatır. Suhūla(t) bu yumuşaklığın ve rahat ilerleyişin adıdır. Türkçede suhuletle yapılan bir işte de aynı düşünce sürer: iş, dirençle karşılaşmadan ilerler.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"sühūlet"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"suhulet maddesi","url":"https://www.nisanyansozluk.com/kelime/suhulet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"suhulet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sükûnet","word":"sükûnet","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sakana","meaning":"durulup dinlendi, bir yerde kaldı","period":null,"reconstructed":false},{"language":"ar","form":"sukūn","meaning":"bir yerde kalma; hareketin yatışması","period":null,"reconstructed":false},{"language":"ar","form":"sukūna(t)","meaning":"sakinlik ve ağırbaşlılık","period":null,"reconstructed":true},{"language":"tr","form":"sükûnet","meaning":"telaştan ve hareketlilikten uzak sakinlik","period":"14. yy","reconstructed":false}],"shortMeaning":"Telaşın ve hareketliliğin yatıştığı dinginlik.","currentMeaning":"Ortalığın veya kişinin durulduğu, sakinlik ve dinginliğin hâkim olduğu durum.","story":"Sükûnetin temelindeki Arapça sakana, hareketin dinmesini ve bir yerde konaklamayı bir araya getirir. Sukūn da hem bir yerde kalmayı hem dinginliği anlatır. Sükûnetin hazır bir Arapça biçim olarak mı alındığı, yoksa sükûnun dinginlik anlamını ayırmak için mi türetildiği tartışmalıdır. Türkçedeki kullanımında kelime, hareketin ve telaşın yatıştığı duruma odaklanır.","firstAttestation":{"source":"Şeyhoğlu — Marzubânnâme tercümesi","period":"1380","form":"sükūnet"},"relatives":[],"alternatives":["TDK Güncel Türkçe Sözlük kelimeyi Arapça sukūnet biçimine bağlar; Nişanyan Sözlük ise Arapça sözlüklerde bu biçime rastlanmadığını ve sükûnun anlamlarını ayırmak amacıyla bir türev üretildiğini belirtir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sükûnet maddesi","url":"https://www.nisanyansozluk.com/kelime/s%C3%BCk%C3%BBnet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sükûnet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"malul","word":"malul","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁalla","meaning":"sağlamlığını yitirdi, kusuru vardı","period":null,"reconstructed":false},{"language":"ar","form":"maˁlūl","meaning":"hastalık veya kusur taşıyan","period":null,"reconstructed":false},{"language":"tr","form":"malul","meaning":"hastalık veya sakatlığı bulunan","period":"14. yy","reconstructed":false}],"shortMeaning":"Hastalık veya sakatlığı bulunan.","currentMeaning":"Hastalığı ya da sakatlığı olan kişiyi niteleyen söz.","story":"Malulun dayandığı Arapça ˁalla, bir şeyin bozulmasını veya kusurlu olmasını anlatır. Maˁlūl bu durumu taşıyanı niteler ve hastalığı da aynı anlam çevresine alır. Türkçede malul, bu geniş kusur ve hastalık alanından kişinin sağlık durumuna yönelen kullanımı sürdürür.","firstAttestation":{"source":"Gülşehri — Mantıku't-Tayr","period":"1317","form":"maˁlūl"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"malul maddesi","url":"https://www.nisanyansozluk.com/kelime/malul"},{"name":"TDK Güncel Türkçe Sözlük","ref":"malul maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mavera","word":"mavera","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"warāˀ","meaning":"bir şeyin arka veya öte tarafında","period":null,"reconstructed":false},{"language":"ar","form":"mā warāˀ","meaning":"bir şeyin arka veya öte tarafında bulunan","period":null,"reconstructed":false},{"language":"tr","form":"mavera","meaning":"bir sınırın öbür tarafı","period":"17. yy","reconstructed":false}],"shortMeaning":"Bir şeyin ötesi, öbür tarafı.","currentMeaning":"Bir yerin, sınırın veya şeyin ötesinde kalan taraf.","story":"Arapça warāˀ, bir şeyin arkasını veya ötesini gösteren bir yer ilişkisi kurar. Mā warāˀ ifadesi bu konumda bulunanı, yani öte tarafta olanı anlatır. Türkçede tek kelime hâlini alan mavera, bakışın bir sınırı aşıp öbür tarafa yönelmesini korur.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"māverā"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mavera maddesi","url":"https://www.nisanyansozluk.com/kelime/mavera"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mavera maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"minval","word":"minval","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nāla","meaning":"besin sağladı (anlam ve türeme bağlantısı belirsiz)","period":null,"reconstructed":false},{"language":"ar","form":"minwāl","meaning":"dönme ekseni veya çıkrığın mili; yön, yapılış biçimi","period":null,"reconstructed":false},{"language":"tr","form":"minval","meaning":"bir işin yürütülüş biçimi","period":"15. yy","reconstructed":false}],"shortMeaning":"Bir işin yapılış veya yürütülüş tarzı.","currentMeaning":"Bir işin nasıl yapıldığını ya da bir durumun nasıl sürdüğünü belirleyen biçim ve usul.","story":"Türkçedeki minvalin arkasında Arapça minwāl vardır; bu kelime çıkrığın milini ve eksenini de yönü ve usulü de anlatır. Kelimenin beslemeyle ilişkilendirilen nāla fiiline bağı ise kesin değildir. Somut bir dönme ekseniyle bir işin izlediği yön aynı kelimede buluşur; Türkçedeki bu minval üzere ifadesi, işin belirli bir tarzda sürmesini anlatır.","firstAttestation":{"source":"Şeyh Elvan Şirazî — Gülşen-i Raz tercümesi","period":"1426","form":"minvāl"},"relatives":[],"alternatives":["Nişanyan Sözlük minwāl biçiminin nāla fiilinden türemesini muhtemel sayar ve fiile verdiği besleme anlamını soru işaretiyle sunar."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"minval maddesi","url":"https://www.nisanyansozluk.com/kelime/minval"},{"name":"TDK Güncel Türkçe Sözlük","ref":"minval maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mizan","word":"mizan","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"wazana","meaning":"ağırlığını ölçtü","period":null,"reconstructed":false},{"language":"ar","form":"mīzān","meaning":"ağırlık ölçmeye yarayan araç","period":null,"reconstructed":false},{"language":"tr","form":"mizan","meaning":"tartmada kullanılan terazi","period":"14. yy","reconstructed":false}],"shortMeaning":"Tartmaya yarayan araç, terazi.","currentMeaning":"Bir şeyin ağırlığını belirlemeye yarayan tartı aracı.","story":"Mizanın başlangıcındaki Arapça wazana, bir şeyin ağırlığını ölçme eylemini anlatır. Mīzān bu eylemi gerçekleştiren araca, yani teraziye verilen addır. Türkçeye mizan olarak geçen kelime, tartma işiyle onu yapan araç arasındaki bağı korur.","firstAttestation":{"source":"İrşadü'l-Mülûk ve's-Selâtîn","period":"1387","form":"mīzān"},"relatives":[],"alternatives":null,"funFact":"Mizanın muhasebeye taşınmasında, İtalyanca bilancia kelimesinin hem teraziyi hem borç ve alacakları karşılaştıran defteri adlandırması örnek alınmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"mizan maddesi","url":"https://www.nisanyansozluk.com/kelime/mizan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mizan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mugalata","word":"mugalata","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ġalaṭa","meaning":"hataya düştü","period":null,"reconstructed":false},{"language":"ar","form":"muġālaṭa(t)","meaning":"bir başkasını hataya sürükleme","period":null,"reconstructed":false},{"language":"tr","form":"mugalata","meaning":"karşısındakini yanıltmaya yönelik söz yürütme","period":"17. yy","reconstructed":false}],"shortMeaning":"Karşısındakini yanıltmak amacıyla söz yürütme.","currentMeaning":"Sağlam kanıtlara dayanmayan sözlerle karşısındakini hatalı bir sonuca yöneltme.","story":"Mugalatanın temelindeki Arapça ġalaṭa, kişinin yanılmasını anlatır. Muġālaṭa(t) biçiminde ağırlık, yanılan kişiden başkasını yanılgıya sürükleyen eyleme geçer. Türkçede mugalata, tartışmayı sağlam gerekçelerle ilerletmek yerine karşısındakini sözle yanlış sonuca götürme davranışını adlandırır.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"muġālatat"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mugalata maddesi","url":"https://www.nisanyansozluk.com/kelime/mugalata"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mugalata maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nedamet","word":"nedamet","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nadima","meaning":"yaptığından üzüntü duydu","period":null,"reconstructed":false},{"language":"ar","form":"nadāma(t)","meaning":"yaptığından dolayı duyulan üzüntü","period":null,"reconstructed":false},{"language":"tr","form":"nedamet","meaning":"geçmişteki davranışından pişmanlık duyma","period":"14. yy","reconstructed":false}],"shortMeaning":"Yaptığı bir şeyden dolayı duyulan pişmanlık.","currentMeaning":"Kişinin yaptığı bir davranışı yanlış bularak bundan üzüntü duyması.","story":"Arapçada nadima, kişinin yaptığına dönüp bakarak pişman olmasını anlatıyordu. Bu eylemden oluşan nadāma(t), davranışın ardından kalan üzüntünün adı oldu. Türkçeye nedamet olarak taşınan kelime, geçmişte yapılanı geri alma isteğini de hissettiren pişmanlık duygusunu korudu.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"nedāmet"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nedamet maddesi","url":"https://www.nisanyansozluk.com/kelime/nedamet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nedamet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nüve","word":"nüve","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nawā","meaning":"hurmanın içindeki çekirdek","period":null,"reconstructed":false},{"language":"tr","form":"nüve","meaning":"bir oluşumun temelindeki öz","period":"20. yy","reconstructed":false}],"shortMeaning":"Bir şeyin temelini oluşturan öz veya çekirdek.","currentMeaning":"Bir düşüncenin, yapının veya oluşumun gelişmesine temel olan küçük başlangıç ya da öz.","story":"Nüvenin geçmişinde Arapça nawā ile adlandırılan hurma çekirdeği bulunuyor olabilir. Bu açıklamada meyvenin içindeki küçük çekirdek, daha büyük bir oluşumun başlangıcını anlatan bir benzetmeye dönüşür. Türkçede kelime bir düşüncenin ya da yapının özünü karşılar; ancak nawā biçiminden nüveye geçiş kesin değildir.","firstAttestation":{"source":"Genç Kalemler — dergi","period":"1912","form":"nüvesi"},"relatives":null,"alternatives":["Nişanyan Sözlük, Arapça nawā ile bağlantıyı kesinleşmemiş bir açıklama olarak sunar ve Toven'in biçimin yanlış aktarılmış olabileceği değerlendirmesini aktarır.","TDK Güncel Türkçe Sözlük, doğrudan kaynak biçimini Arapça nuve olarak verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nüve maddesi","url":"https://www.nisanyansozluk.com/kelime/n%C3%BCve"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nüve maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"nükte","word":"nükte","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nakata","meaning":"sivri bir uçla dürttü","period":null,"reconstructed":false},{"language":"ar","form":"nukta(t)","meaning":"zekice söylenen şaka","period":null,"reconstructed":false},{"language":"tr","form":"nükte","meaning":"ince düşünce taşıyan şakalı söz","period":"14. yy","reconstructed":false}],"shortMeaning":"İnce bir düşünce taşıyan zekice şaka.","currentMeaning":"Güldürürken düşündüren, incelikli bir düşünceyi kısa ve şakalı biçimde dile getiren söz.","story":"Arapça nakata, sivri bir şeyle dürtme hareketini anlatıyordu. Aynı kökten çıkan nukta(t) ile bu küçük dokunuş, sözün yaptığı ince etkiye taşındı. Türkçedeki nükte de uzun bir açıklama yerine kısa bir sözle zihni dürten şakanın adıdır.","firstAttestation":{"source":"Mesud b. Ahmed — Süheyl ü Nevbahar tercümesi","period":"1354","form":"nükte"},"relatives":[{"word":"nükteli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nükte maddesi","url":"https://www.nisanyansozluk.com/kelime/n%C3%BCkte"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nükte maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nüfuz","word":"nüfuz","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nafaẕa","meaning":"içeri girdi, içinden geçti","period":null,"reconstructed":false},{"language":"ar","form":"nufūẕ","meaning":"içeri işleme; sözünü geçirebilme","period":null,"reconstructed":false},{"language":"tr","form":"nüfuz","meaning":"içine işleme; başkaları üzerinde etkili olma gücü","period":"16. yy","reconstructed":false}],"shortMeaning":"İçine işleme veya başkaları üzerinde etkili olma gücü.","currentMeaning":"Bir şeyin içine geçip işlemesi; bir kişinin ya da kurumun başkalarının kararlarını etkileyebilme gücü.","story":"Arapça nafaẕa, bir şeyin içine girip geçme hareketini anlatıyordu. Nufūẕ adı bu fiziksel geçişin yanında, bir sözün engelleri aşarak etkili olmasını da karşılamaya başladı. Türkçede hem bir maddenin başka bir şeye işlemesinde hem de bir kişinin sözünü geçirmesinde aynı kelime kullanılır.","firstAttestation":{"source":"Hoca Sadeddin Efendi — Tacü't-Tevârih","period":"1574","form":"nüfūẕ"},"relatives":[{"word":"nüfuzlu","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nüfuz maddesi","url":"https://www.nisanyansozluk.com/kelime/n%C3%BCfuz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nüfuz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nüsha","word":"nüsha","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"akk","chain":[{"language":"akk","form":"nasāḫu","meaning":"bir şeyden bölüm veya özet çıkarmak","period":null,"reconstructed":false},{"language":"akk","form":"nisḫu","meaning":"resmî yazılı kayıt","period":null,"reconstructed":false},{"language":"arc","form":"nusḫā","meaning":"resmî yazılı kayıt","period":null,"reconstructed":false},{"language":"ar","form":"nusḫa(t)","meaning":"yazıya geçirme, temiz kopyasını hazırlama; yazılı örnek","period":null,"reconstructed":false},{"language":"tr","form":"nüsha","meaning":"bir metnin veya yayının örneklerinden biri","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir metnin veya yayının örneklerinden her biri.","currentMeaning":"Aynı metni taşıyan yazılı ya da basılı örneklerden her biri; bir yayının tek bir örneği.","story":"Kelimenin izlediği yol, Akatçada bir şeyden bölüm çıkarma eyleminden yazılı kayda uzanır. Kayıt bildiren nisḫu, Aramiceye nusḫā biçimiyle, oradan da Arapçaya geçti. Arapçada yazıyı yeniden hazırlama ve kopyasını çıkarma çevresinde kullanılan söz, Türkçede aynı metnin ayrı ayrı örneklerini adlandırdı.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"nusḫasın"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nüsha maddesi","url":"https://www.nisanyansozluk.com/kelime/n%C3%BCsha"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nüsha maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nida","word":"nida","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nadā","meaning":"sesini yükselterek çağırdı","period":null,"reconstructed":false},{"language":"ar","form":"nidāˀ","meaning":"yükselen ses, çağrı","period":null,"reconstructed":false},{"language":"tr","form":"nida","meaning":"sesle çağırma, haykırış","period":"14. yy","reconstructed":false}],"shortMeaning":"Seslenme veya haykırış.","currentMeaning":"Birine ses yönelterek çağırma ya da bir duyguyu yükselen sesle dışa vurma.","story":"Arapça nadā, sesini yükselterek birine ulaşma eylemini anlatıyordu. Bu eylemin adı olan nidāˀ, duyulan çağrıyı ve yükselen sesi karşılıyordu. Türkçeye geçen nida, seslenmenin yanı sıra bir duygunun haykırışla dışarı çıkmasını da anlatır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"nidāden"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nida maddesi","url":"https://www.nisanyansozluk.com/kelime/nida"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nida maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"rayiha","word":"rayiha","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"rūḥ","meaning":"solunan hava, nefes ve koku","period":null,"reconstructed":false},{"language":"ar","form":"rāˀiḥa(t)","meaning":"hoş kokulu yayılım, esans","period":null,"reconstructed":false},{"language":"tr","form":"rayiha","meaning":"hoşa giden koku","period":"14. yy","reconstructed":false}],"shortMeaning":"Hoşa giden, güzel koku.","currentMeaning":"Bir çiçekten, yiyecekten veya başka bir kaynaktan yayılan hoş koku.","story":"Arapçada rūḥ, nefesi ve kokuyu aynı anlam çevresinde buluşturuyordu. Bu bağlantıdan oluşan rāˀiḥa(t), havayla taşınan kokuyu, özellikle de hoş kokuyu adlandırdı. Türkçedeki rayiha, nefesle algılanan bu duyumun güzel koku tarafını öne çıkarır.","firstAttestation":{"source":"Seyf-i Sarayî — Gülistan tercümesi","period":"1391","form":"rāyiḥalu"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"rayiha maddesi","url":"https://www.nisanyansozluk.com/kelime/rayiha"},{"name":"TDK Güncel Türkçe Sözlük","ref":"rayiha maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mütenasip","word":"mütenasip","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nasaba","meaning":"birbiriyle ilişki ve oran içindeydi","period":null,"reconstructed":false},{"language":"ar","form":"mutanāsib","meaning":"birbirine ölçü bakımından uyan","period":null,"reconstructed":false},{"language":"tr","form":"mütenasip","meaning":"ölçüsü veya niteliği bakımından uyumlu","period":"15. yy","reconstructed":false}],"shortMeaning":"Ölçü veya nitelik bakımından birbirine uygun.","currentMeaning":"Bir başka şeyle büyüklük, miktar veya nitelik bakımından uygun bir ilişki içinde olan.","story":"Arapça nasaba, şeylerin birbiriyle ilişki ve oran içinde bulunmasını anlatıyordu. Mutanāsib, bu ilişkinin dengeli olduğu durumları niteleyen biçimdi. Türkçede mütenasip, sayıların oranından bir işin karşılığına kadar iki şeyin birbirine uygun düşmesini anlatır.","firstAttestation":{"source":"Anonim — Türkî Hisab","period":"1450","form":"mütenāsibdür"},"relatives":[{"word":"tenasüp","relation":"akraba"},{"word":"nispet","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mütenasip maddesi","url":"https://www.nisanyansozluk.com/kelime/m%C3%BCtenasip"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mütenasip maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"müteessir","word":"müteessir","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"as̱s̱ara","meaning":"bir şey üzerinde etki veya iz oluşturdu","period":null,"reconstructed":false},{"language":"ar","form":"mutaˀas̱s̱ir","meaning":"bir etkinin altında kalan, duygulanan","period":null,"reconstructed":false},{"language":"tr","form":"müteessir","meaning":"yaşananlardan etkilenip üzülen","period":"16. yy","reconstructed":false}],"shortMeaning":"Bir olaydan etkilenmiş ve üzüntü duymuş.","currentMeaning":"Bir olay, haber veya durum karşısında duygusal olarak etkilenmiş, kederlenmiş olan.","story":"Arapça as̱s̱ara, bir şey üzerinde iz veya etki bırakmayı anlatıyordu. Mutaˀas̱s̱ir, bu etkinin ulaştığı kişiyi ya da şeyi niteliyordu. Türkçede müteessir denince özellikle insanın içinde üzüntü bırakan etki öne çıktı.","firstAttestation":{"source":"Hoca Sadeddin Efendi — Tacü't-Tevârih","period":"1574","form":"müteessir"},"relatives":[{"word":"tesir","relation":"akraba"},{"word":"teessür","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"müteessir maddesi","url":"https://www.nisanyansozluk.com/kelime/m%C3%BCteessir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"müteessir maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"müspet","word":"müspet","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"s̱abata","meaning":"sağlamlık kazandı, doğruluğu kesinleşti","period":null,"reconstructed":false},{"language":"ar","form":"mus̱bat","meaning":"doğruluğu ortaya konmuş","period":null,"reconstructed":false},{"language":"tr","form":"müspet","meaning":"olumlu; kanıtla doğrulanmış","period":"17. yy","reconstructed":false}],"shortMeaning":"Olumlu veya doğruluğu kanıtlanmış.","currentMeaning":"Olumlu bulunan; ayrıca gözlem ya da kanıtla doğrulanmış olan.","story":"Arapça s̱abata, bir şeyin sağlam ve kesin duruma gelmesini anlatıyordu. Mus̱bat, doğruluğu dayanaklarla ortaya konmuş olanı niteledi. Türkçede kelime önce bu kanıtlanmışlık anlamını taşıdı; zamanla olum ı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"waṣala","meaning":"varıp birleşti","period":null,"reconstructed":false},{"language":"ar","form":"muttaṣil","meaning":"arasında boşluk bulunmayan, birbirine bağlı","period":null,"reconstructed":false},{"language":"tr","form":"muttasıl","meaning":"bitişmiş veya kesintisiz olan","period":"14. yy","reconstructed":false}],"shortMeaning":"Bitişik veya kesintisiz olan.","currentMeaning":"Birbirine bağlı ya da bitişik olan; zaman bakımından aralıksız süren.","story":"Arapça waṣala, bir yere varmayı ve bir şeye kavuşmayı anlatıyordu. Muttaṣil, bu kavuşmanın oluşturduğu bağlantıyı, arada boşluk kalmamasını öne çıkardı. Türkçedeki muttasıl hem yan yana birleşmiş şeyleri hem de zamanda boşluk bırakmadan süren durumları niteleyebilir.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"muttaṣıldur"},"relatives":[{"word":"vuslat","relation":"akraba"},{"word":"ittisal","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"muttasıl maddesi","url":"https://www.nisanyansozluk.com/kelime/muttas%C4%B1l"},{"name":"TDK Güncel Türkçe Sözlük","ref":"muttasıl maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"müteakip","word":"müteakip","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁaḳaba","meaning":"arkasından geldi","period":null,"reconstructed":false},{"language":"ar","form":"mutaˁāḳib","meaning":"birbirinin ardından gelen","period":null,"reconstructed":false},{"language":"tr","form":"müteakip","meaning":"ardından gelen; bir olayın sonrasında","period":"15. yy","reconstructed":false}],"shortMeaning":"Bir şeyin ardından gelen veya gerçekleşen.","currentMeaning":"Bir olayın ya da zamanın ardından gelen; bir olaya bağlanarak kullanıldığında o olaydan sonra gerçekleşmeyi belirtir.","story":"Arapça ˁaḳaba, bir şeyin arkasında <div class="sarmal">
  <div class="cubuk">
    <div class="baslik">
      <h1>Kökçe Kelime İncelemesi</h1>
      <span class="sayac"><b id="gorunen">0</b> madde · <span id="isaretliSayi">0</span> işaretli</span>
    </div>
    <div class="alan">
      <input type="search" id="ara" placeholder="Ara (kelime veya anlam)" autocomplete="off">
      <select id="fRarity"><option value="">Sıklık: tümü</option></select>
      <select id="fConfidence"><option value="">Güven: tümü</option></select>
      <select id="fFormation"><option value="">Oluşum: tümü</option></select>
      <select id="fDonor"><option value="">Veren dil: tümü</option></select>
      <button type="button" class="dugme" id="dOrnek" aria-pressed="false">Rastgele %10</button>
      <button type="button" class="dugme" id="dOrta" aria-pressed="false">Yalnız orta güven</button>
      <button type="button" class="dugme" id="dSifirla">Filtreleri sıfırla</button>
    </div>
  </div>

  <div class="liste" id="liste"></div>

  <div class="cikti">
    <div class="alan">
      <button type="button" class="dugme ana" id="dKopyala">İşaretlenenleri kopyala</button>
      <button type="button" class="dugme" id="dIsaretli" aria-pressed="false">Yalnız işaretlileri göster</button>
    </div>
    <textarea id="ciktiAlan" spellcheck="false" placeholder="İşaretlenen maddeler burada JSON olarak görünür."></textarea>
    <div class="durum" id="durum"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var VERI = JSON.parse(document.getElementById("veri").textContent);
  var W = VERI.words, L = VERI.languages;
  var ANAHTAR = "kokce-inceleme-v1";

  /* --- yardımcılar --- */
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function dil(kod){ return kod ? esc(L[kod] || kod) : "&mdash;"; }
  function katla(s){
    return String(s).toLowerCase().normalize("NFD")
      .replace(/[̀-ͯ]/g,"").replace(/ı/g,"i");
  }
  W.forEach(function(w){ w._ara = katla(w.word + " " + w.shortMeaning + " " + w.id); });

  /* --- sabit tohumlu %10 örneklem --- */
  function tohum(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var ORNEK = (function(){
    var r = tohum(20261001), i, j, t, ix = W.map(function(_, k){ return k; });
    for(i = ix.length - 1; i > 0; i--){
      j = Math.floor(r() * (i + 1)); t = ix[i]; ix[i] = ix[j]; ix[j] = t;
    }
    var n = Math.round(W.length * 0.1), s = Object.create(null);
    for(i = 0; i < n; i++){ s[W[ix[i]].id] = 1; }
    return s;
  })();

  /* --- işaretler (tek doğruluk kaynağı; DOM'dan okunmaz) --- */
  var isaretler = Object.create(null);
  try{
    var kayit = localStorage.getItem(ANAHTAR);
    if(kayit){
      var o = JSON.parse(kayit);
      Object.keys(o).forEach(function(k){
        isaretler[k] = { bad: !!o[k].bad, note: String(o[k].note || "") };
      });
    }
  }catch(e){}
  function sakla(){
    try{ localStorage.setItem(ANAHTAR, JSON.stringify(isaretler)); }catch(e){}
  }
  function isaret(id){
    if(!isaretler[id]) isaretler[id] = { bad:false, note:"" };
    return isaretler[id];
  }
  function isaretliSayisi(){
    return Object.keys(isaretler).filter(function(k){ return isaretler[k].bad; }).length;
  }

  var acik = Object.create(null);

  /* --- filtre seçenekleri --- */
  function doldur(sec, degerler, etiketle){
    degerler.forEach(function(d){
      var o = document.createElement("option");
      o.value = d; o.textContent = etiketle ? etiketle(d) : d;
      sec.appendChild(o);
    });
  }
  function benzersiz(alan){
    var g = {}, c = [];
    W.forEach(function(w){ if(w[alan] != null && !g[w[alan]]){ g[w[alan]] = 1; c.push(w[alan]); } });
    return c.sort(function(a, b){ return a.localeCompare(b, "tr"); });
  }
  var fArama = document.getElementById("ara"),
      fRarity = document.getElementById("fRarity"),
      fConf = document.getElementById("fConfidence"),
      fForm = document.getElementById("fFormation"),
      fDonor = document.getElementById("fDonor");
  doldur(fRarity, benzersiz("rarity"));
  doldur(fConf, benzersiz("confidence"));
  doldur(fForm, benzersiz("formationType"));
  doldur(fDonor, benzersiz("donorLanguage"), function(k){ return L[k] || k; });
  (function(){
    var yok = W.filter(function(w){ return w.donorLanguage == null; }).length;
    if(yok){
      var o = document.createElement("option");
      o.value = "__yok__"; o.textContent = "Veren dil yok (" + yok + ")";
      fDonor.appendChild(o);
    }
  })();

  var sadeceOrnek = false, sadeceIsaretli = false;

  /* --- kart çizimi --- */
  function rozet(m, sinif){ return '<span class="roz ' + sinif + '">' + esc(m) + "</span>"; }
  function kartHTML(w){
    var m = isaretler[w.id] || { bad:false, note:"" };
    var a = !!acik[w.id];
    return '<article class="kart' + (m.bad ? " hatali" : "") + '" data-id="' + esc(w.id) + '">'
      + '<div class="satir1"><span class="kelime">' + esc(w.word) + "</span>"
      + rozet(w.rarity, w.rarity === "az-bilinen" ? "vurgu" : "")
      + rozet("güven: " + w.confidence, w.confidence === "orta" ? "dolu" : "")
      + rozet(w.formationType, "")
      + "</div>"
      + '<div class="zincir">' + w.chain.map(function(s){ return dil(s.language); }).join(' <span class="ok">&rarr;</span> ') + "</div>"
      + '<div class="kisa">' + esc(w.shortMeaning) + "</div>"
      + '<div class="kontrol">'
      + '<label class="kutu"><input type="checkbox" class="bad"' + (m.bad ? " checked" : "") + "> Hatalı</label>"
      + '<input class="not" type="text" placeholder="not…" value="' + esc(m.note) + '">'
      + '<button type="button" class="dugme ac">' + (a ? "Ayrıntıyı kapat" : "Ayrıntı") + "</button>"
      + "</div>"
      + '<div class="govde"' + (a ? "" : " hidden") + ">" + (a ? ayrintiHTML(w) : "") + "</div>"
      + "</article>";
  }
  function ayrintiHTML(w){
    var p = [];
    p.push('<div class="meta">' + esc(w.partOfSpeech) + " &middot; veren dil: " + dil(w.donorLanguage)
      + " &middot; en eski halka: " + dil(w.ultimateOrigin) + " &middot; <code>" + esc(w.id) + "</code></div>");
    p.push("<h3>Köken zinciri</h3><ol>");
    w.chain.forEach(function(s){
      var ek = [];
      if(s.period) ek.push(esc(s.period));
      if(s.reconstructed) ek.push("kurgulanmış biçim");
      p.push("<li><b>" + dil(s.language) + "</b> <i>" + esc(s.form) + "</i> &mdash; " + esc(s.meaning)
        + (ek.length ? ' <span class="soluk">(' + ek.join(", ") + ")</span>" : "") + "</li>");
    });
    p.push("</ol>");
    p.push("<h3>Bugünkü anlam</h3><p>" + esc(w.currentMeaning) + "</p>");
    p.push("<h3>Hikâye</h3><p>" + esc(w.story) + "</p>");
    if(w.firstAttestation){
      p.push("<h3>İlk tanıklık</h3><p>" + esc(w.firstAttestation.source) + " &middot; "
        + esc(w.firstAttestation.period) + " &middot; <i>" + esc(w.firstAttestation.form) + "</i></p>");
    }
    if(w.relatives && w.relatives.length){
      p.push("<h3>Akrabalar</h3><p>" + w.relatives.map(function(r){
        return esc(r.word) + ' <span class="soluk">(' + esc(r.relation) + ")</span>";
      }).join(", ") + "</p>");
    }
    if(w.alternatives && w.alternatives.length){
      p.push("<h3>Alternatif köken açıklamaları</h3><ul>" + w.alternatives.map(function(a){
        return "<li>" + esc(a) + "</li>";
      }).join("") + "</ul>");
    }
    if(w.funFact) p.push("<h3>İlginç ayrıntı</h3><p>" + esc(w.funFact) + "</p>");
    p.push("<h3>Kaynaklar</h3><ul>" + w.sources.map(function(s){
      var ad = s.url
        ? '<a href="' + esc(s.url) + '" target="_blank" rel="noreferrer noopener">' + esc(s.name) + "</a>"
        : esc(s.name);
      return "<li>" + ad + " &mdash; " + esc(s.ref) + "</li>";
    }).join("") + "</ul>");
    return p.join("");
  }

  /* --- süzme ve çizim --- */
  function suz(){
    var q = katla(fArama.value.trim()),
        r = fRarity.value, c = fConf.value, f = fForm.value, d = fDonor.value;
    return W.filter(function(w){
      if(q && w._ara.indexOf(q) === -1) return false;
      if(r && w.rarity !== r) return false;
      if(c && w.confidence !== c) return false;
      if(f && w.formationType !== f) return false;
      if(d === "__yok__"){ if(w.donorLanguage != null) return false; }
      else if(d && w.donorLanguage !== d) return false;
      if(sadeceOrnek && !ORNEK[w.id]) return false;
      if(sadeceIsaretli && !(isaretler[w.id] && isaretler[w.id].bad)) return false;
      return true;
    });
  }
  var liste = document.getElementById("liste");
  function ciz(){
    var v = suz();
    liste.innerHTML = v.length
      ? v.map(kartHTML).join("")
      : '<p class="bos">Bu süzgeçlere uyan madde yok.</p>';
    document.getElementById("gorunen").textContent = v.length;
    document.getElementById("isaretliSayi").textContent = isaretliSayisi();
  }

  /* --- olaylar --- */
  ["input", "change"].forEach(function(t){
    fArama.addEventListener(t, ciz);
  });
  [fRarity, fConf, fForm, fDonor].forEach(function(s){ s.addEventListener("change", ciz); });

  function basHedef(dugme, durum){ dugme.setAttribute("aria-pressed", durum ? "true" : "false"); }
  var dOrnek = document.getElementById("dOrnek"), dOrta = document.getElementById("dOrta"),
      dIsaretli = document.getElementById("dIsaretli");
  dOrnek.textContent = "Rastgele %10 (" + Object.keys(ORNEK).length + ")";
  dOrnek.addEventListener("click", function(){
    sadeceOrnek = !sadeceOrnek; basHedef(dOrnek, sadeceOrnek); ciz();
  });
  dOrta.addEventListener("click", function(){
    var acikMi = fConf.value !== "orta";
    fConf.value = acikMi ? "orta" : "";
    basHedef(dOrta, acikMi); ciz();
  });
  fConf.addEventListener("change", function(){ basHedef(dOrta, fConf.value === "orta"); });
  dIsaretli.addEventListener("click", function(){
    sadeceIsaretli = !sadeceIsaretli; basHedef(dIsaretli, sadeceIsaretli); ciz();
  });
  document.getElementById("dSifirla").addEventListener("click", function(){
    fArama.value = ""; fRarity.value = ""; fConf.value = ""; fForm.value = ""; fDonor.value = "";
    sadeceOrnek = false; sadeceIsaretli = false;
    basHedef(dOrnek, false); basHedef(dOrta, false); basHedef(dIsaretli, false);
    ciz();
  });

  liste.addEventListener("change", function(e){
    var t = e.target;
    if(!t.classList.contains("bad")) return;
    var kart = t.closest(".kart"), id = kart.getAttribute("data-id");
    isaret(id).bad = t.checked;
    kart.classList.toggle("hatali", t.checked);
    document.getElementById("isaretliSayi").textContent = isaretliSayisi();
    sakla();
  });
  liste.addEventListener("input", function(e){
    var t = e.target;
    if(!t.classList.contains("not")) return;
    isaret(t.closest(".kart").getAttribute("data-id")).note = t.value;
    sakla();
  });
  liste.addEventListener("click", function(e){
    var t = e.target;
    if(!t.classList.contains("ac")) return;
    var kart = t.closest(".kart"), id = kart.getAttribute("data-id"),
        govde = kart.querySelector(".govde");
    if(acik[id]){
      delete acik[id]; govde.hidden = true; govde.innerHTML = ""; t.textContent = "Ayrıntı";
    }else{
      acik[id] = 1;
      govde.innerHTML = ayrintiHTML(W.find(function(w){ return w.id === id; }));
      govde.hidden = false; t.textContent = "Ayrıntıyı kapat";
    }
  });

  var ciktiAlan = document.getElementById("ciktiAlan"), durum = document.getElementById("durum");
  document.getElementById("dKopyala").addEventListener("click", function(){
    var sira = {};
    W.forEach(function(w, i){ sira[w.id] = i; });
    var secilen = Object.keys(isaretler)
      .filter(function(k){ return isaretler[k].bad; })
      .sort(function(a, b){ return (sira[a] == null ? 1e9 : sira[a]) - (sira[b] == null ? 1e9 : sira[b]); })
      .map(function(k){ return { id: k, note: isaretler[k].note || "" }; });
    var metin = JSON.stringify(secilen, null, 2);
    ciktiAlan.value = metin;
    ciktiAlan.focus(); ciktiAlan.select();
    durum.textContent = secilen.length + " madde aşağıda.";
    try{
      navigator.clipboard.writeText(metin).then(function(){
        durum.textContent = secilen.length + " madde panoya kopyalandı.";
      }, function(){
        durum.textContent = secilen.length + " madde aşağıda; panoya erişilemedi, elle kopyalayın.";
      });
    }catch(err){
      durum.textContent = secilen.length + " madde aşağıda; panoya erişilemedi, elle kopyalayın.";
    }
  });

  ciz();
})();
</script>
