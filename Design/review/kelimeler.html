nguage":"pal","form":"pāçag","meaning":"ayakçık","period":null,"reconstructed":false},{"language":"fa","form":"pāça/pāyça","meaning":"küçük ayak; hayvan ayağı ve giysinin bacak bölümü","period":null,"reconstructed":false},{"language":"tr","form":"paça","meaning":"giysinin bacak ucu; yemeklik hayvan ayağı","period":null,"reconstructed":false}],"shortMeaning":"Pantolon gibi giysilerin bacakları çevreleyen alt bölümü.","currentMeaning":"Pantolon, şalvar ve benzeri giysilerin bacakların alt kısmını saran, ayakların çıktığı bölümü.","story":"Paçanın merkezinde Farsça pā, yani ayak bulunur. Bu adın küçültülmüş biçimi hem hayvanın ayağını hem de giysinin bacak bölümünü adlandırmıştır. Türkçede sofradaki paça ile pantolonun paçasının aynı adı taşıması, ayak çevresinde gelişen bu iki kullanımın devamıdır.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1400 öncesi","form":"paça"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"paça maddesi","url":"https://www.nisanyansozluk.com/kelime/pa%C3%A7a"},{"name":"TDK Güncel Türkçe Sözlük","ref":"paça","url":null}],"confidence":"yüksek","reviewed":true},{"id":"pamuk","word":"pamuk","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"pal","ultimateOrigin":"pal","chain":[{"language":"pal","form":"pambak/pambuk","meaning":"ipek böceği kozası, pamuk kozası ve pamuk","period":null,"reconstructed":false},{"language":"tr","form":"pamuk","meaning":"lifleri dokumacılıkta kullanılan bitki ve onun lifleri","period":null,"reconstructed":false}],"shortMeaning":"Kozasından yumuşak beyaz lif elde edilen bitki.","currentMeaning":"Sıcak iklimlerde yetiştirilen, kozalarındaki liflerden iplik yapılan tarım bitkisi ve bu bitkinin lifleri.","story":"Pamuğun adında, liflerden önce onları içinde taşıyan koza öne çıkar. Orta Farsça pambak/pambuk hem ipek böceğinin kozasını hem pamuk kozasını ve pamuğu adlandırıyordu. Yunancada koza için kullanılan bombúks da bu adla eş kökenli olarak ilişkilendirilir; bu bağlantı doğrudan Yunancadan alınmış olduğunu göstermez. Türkçeye İran dil alanından ulaşan ad, bitkinin kendisiyle birlikte yumuşak liflerini de karşılamayı sürdürdü.","firstAttestation":{"source":"Kaşgarî — Divan-i Lugati't-Türk","period":"1073","form":"bamuk"},"relatives":[],"alternatives":null,"funFact":"Pamuk bitkisi Hindistan kökenlidir, milat dolaylarında Doğu İran ile Orta Asya'ya, sonra Akdeniz havzasına yayılmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"pamuk maddesi","url":"https://www.nisanyansozluk.com/kelime/pamuk"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pamuk","url":null}],"confidence":"yüksek","reviewed":true},{"id":"astar","word":"astar","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"ster-","meaning":"sermek, yaymak","period":null,"reconstructed":true},{"language":"ae","form":"star-","meaning":"bir yüzeye sermek","period":null,"reconstructed":false},{"language":"fa","form":"āstar","meaning":"serilen örtü, kaba dokuma ve iç kaplama","period":null,"reconstructed":false},{"language":"tr","form":"astar","meaning":"eşyanın iç yüzünü örten katman","period":null,"reconstructed":false}],"shortMeaning":"Giysi ve benzeri eşyaların iç yüzüne geçirilen ince kat.","currentMeaning":"Giysi, çanta, perde veya ayakkabı gibi eşyaların iç yüzünü kaplamak üzere kullanılan kumaş ya da deri katmanı.","story":"Astarın uzak geçmişinde bir şeyi yüzeye yayma ve serme eylemi vardır. Bu kök ailesinde Sanskritçe āstarana- yere serilen örtüyü, Farsça āstar ise yaygı ve kumaşı adlandırır; Sanskritçe biçim bir akrabalık halkasıdır. Türkçede eski örtü kullanımı zamanla giysinin ve eşyanın içini kaplayan kata odaklanmıştır. Yere serilen örtüyle ceketin içindeki kumaşı birleştiren düşünce, bir yüzeyi başka bir katla örtmektir.","firstAttestation":{"source":"İrşadü'l-Mülûk ve's-Selâtîn","period":"1387","form":"astār"},"relatives":[{"word":"gustar","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"astar maddesi","url":"https://www.nisanyansozluk.com/kelime/astar"},{"name":"TDK Güncel Türkçe Sözlük","ref":"astar","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kemer","word":"kemer","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"kh₂em-","meaning":"bükmek, eğmek","period":null,"reconstructed":true},{"language":"peo","form":"kamarā-","meaning":"eğrilmiş veya bükülmüş nesne","period":null,"reconstructed":true},{"language":"pal","form":"kamar","meaning":"kuşak","period":null,"reconstructed":false},{"language":"fa","form":"kamar","meaning":"bel kuşağı; yapıda yay biçimli bölüm","period":null,"reconstructed":false},{"language":"tr","form":"kemer","meaning":"bel bağı; mimaride kavisli taşıyıcı","period":null,"reconstructed":false}],"shortMeaning":"Giysiyi tutmak veya süslemek için bele takılan bağ.","currentMeaning":"Bele dolanan ve çoğunlukla tokayla tutturulan deri, kumaş veya metal kuşak.","story":"Kemerin eski kökünde eğme ve bükme hareketi bulunur. İran dillerindeki kuşak adı, belin çevresinde kıvrılan bir nesneyi karşılar; Avestaca biçim de bu adın akrabasıdır. Farsçada aynı ad, yapıların kavisli bölümleri için de kullanılmıştır. Türkçedeki bel kemeri ile taş kemer, malzemeleri ayrı olsa da bu eğri biçimi paylaşır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"kemer"},"relatives":[{"word":"kamān","relation":"akraba"},{"word":"kámara","relation":"eş köken"}],"alternatives":null,"funFact":"Eski Yunancanın tonozlu oda için kullandığı kámara da Eski Farsçadan alınmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"kemer maddesi","url":"https://www.nisanyansozluk.com/kelime/kemer"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kemer","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tahta","word":"tahta","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"taḫt","meaning":"üzerine oturulan seki veya oturak","period":null,"reconstructed":false},{"language":"pal","form":"taḫtag","meaning":"tabla biçiminde ağaç parçası","period":null,"reconstructed":false},{"language":"fa","form":"taḫta","meaning":"biçilerek düzleştirilmiş ağaç","period":null,"reconstructed":false},{"language":"tr","form":"tahta","meaning":"düz ve yassı işlenmiş ağaç parçası","period":null,"reconstructed":false}],"shortMeaning":"Kesilip düzleştirilmiş, yassı ağaç parçası.","currentMeaning":"Yapı, eşya ve başka işlerde kullanılmak üzere ağaçtan biçilmiş, düz yüzeyli ve görece ince parça.","story":"Tahtanın geçmişi, üzerine oturulan sekiyi ve oturağı adlandıran taḫt ile bağlantılıdır. Bu tabandan gelişen biçim, Farsçada biçilmiş düz ağaç parçasının adı olmuştur. Türkçe, sözcüğü bu işlenmiş malzeme anlamıyla aldı; oturma yüzeyiyle ağaç levhayı birbirine bağlayan düz tabla fikri adın geçmişinde kaldı.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"takta"},"relatives":[{"word":"taht","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tahta maddesi","url":"https://www.nisanyansozluk.com/kelime/tahta"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tahta","url":null}],"confidence":"yüksek","reviewed":true},{"id":"köşe","word":"köşe","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"gōşag","meaning":"bucak, açı","period":null,"reconstructed":false},{"language":"fa","form":"gōşa","meaning":"köşe veya bucak","period":null,"reconstructed":false},{"language":"tr","form":"köşe","meaning":"çizgilerin veya yüzeylerin birleştiği açılı yer","period":null,"reconstructed":false}],"shortMeaning":"İki çizginin veya yüzeyin birleştiği açılı yer.","currentMeaning":"Birbirini kesen çizgilerin veya birleşen yüzeylerin oluşturduğu açı ve bu açının bulunduğu yer.","story":"Köşe, Farsçadaki gōşa biçimiyle bir mekânın bucağını adlandırıyordu. Orta Farsça gōşag aynı mekânsal anlamı taşır; Avestaca gaoşa- da onun eski akrabasıdır. Türkçedeki eski gūşe biçiminden bugünkü köşeye uzanan değişimde sesler dönüşmüş, iki yüzeyin buluştuğu yer fikri korunmuştur.","firstAttestation":{"source":"Anonim — Tezkiretü'l-Evliya tercümesi","period":"1341","form":"gūşe"},"relatives":[{"word":"köşekapmaca","relation":"birleşik"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"köşe maddesi","url":"https://www.nisanyansozluk.com/kelime/k%C3%B6%C5%9Fe"},{"name":"TDK Güncel Türkçe Sözlük","ref":"köşe","url":null}],"confidence":"yüksek","reviewed":true},{"id":"çadır","word":"çadır","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"fa","ultimateOrigin":"ine","chain":[{"language":"ine","form":"sk̂ed-","meaning":"üzerini kapatmak, örtmek","period":null,"reconstructed":true},{"language":"sa","form":"çhādayati","meaning":"örtmek","period":null,"reconstructed":false},{"language":"sa","form":"çhattra","meaning":"gölge sağlayan örtü veya tente","period":null,"reconstructed":false},{"language":"fa","form":"çādar/çādur","meaning":"gölgelik; bedeni örten örtü","period":null,"reconstructed":false},{"language":"otk","form":"çatır/çaşır","meaning":"örtüyle kurulan taşınabilir barınak","period":null,"reconstructed":false},{"language":"tr","form":"çadır","meaning":"direkler üzerinde örtü gerilerek kurulan barınak","period":null,"reconstructed":false}],"shortMeaning":"Bir örtünün direklerle desteklenmesiyle kurulan taşınabilir barınak.","currentMeaning":"Kalın dokuma, keçe, deri veya sentetik örtünün direklerle desteklenip gerilmesiyle kurulan taşınabilir barınak.","story":"Çadırın anlam yolculuğunda temel nesne, insanın üzerine gerilen koruyucu örtüdür. İran dillerindeki çādar/çādur hem gölgelik hem de bedeni örten kumaş için kullanılmış, Eski Türkçedeki biçimler taşınabilir barınağı adlandırmıştır. Daha geride Sanskritçenin örtme eylemi ve gölgelik adıyla bağlantı kurulsa da bu eski geçişin ayrıntıları tartışmalıdır. Bugünkü çadır, örtünün desteklerle yükseltilip yaşanacak bir mekâna dönüştüğü anlamı sürdürür.","firstAttestation":{"source":"Kaşgarî — Divan-i Lugati't-Türk","period":"1073","form":"çatır"},"relatives":[],"alternatives":["Nişanyan Sözlük, Sanskritçe çhattra ile İran dillerindeki çādar/çādur arasındaki eski bağlantıyı tartışmalı olarak işaretler.","Nişanyan Sözlük, Doerfer ve Clauson'un İran dili aracılığını, Cheung'un ise İran dilindeki biçim için Eski Hintçe kaynağını savunduğunu aktarır.","Nişanyan Sözlük, Eski Türkçe çat- fiilinden türetme önerisini ses ve yapı bakımından sorunlu bulur."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"çadır maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%A7ad%C4%B1r"},{"name":"TDK Güncel Türkçe Sözlük","ref":"çadır","url":null}],"confidence":"yüksek","reviewed":true},{"id":"terzi","word":"terzi","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"pal","chain":[{"language":"pal","form":"darzīk","meaning":"giysi diken kişi","period":null,"reconstructed":false},{"language":"fa","form":"darz","meaning":"dikiş","period":null,"reconstructed":false},{"language":"fa","form":"darzī","meaning":"dikiş işi yapan kişi","period":null,"reconstructed":false},{"language":"tr","form":"terzi","meaning":"giysi biçip diken kişi","period":null,"reconstructed":false}],"shortMeaning":"Giysi biçen, diken ve onaran kişi.","currentMeaning":"Kumaşı ölçüye göre keserek giysi diken ve giysiler üzerinde düzeltme yapan meslek sahibi.","story":"Terzinin adı Farsçada dikişi karşılayan darz ile bağlantılıdır. Darzī, kumaş parçalarını dikişle birleştiren kişiyi adlandırır; meslek adının daha eski biçimi Orta Farsçada darzīk olarak bulunur. Türkçeye derzi biçiminde giren adın başındaki ses zamanla sertleşmiş, yapılan iş ise değişmeden kalmıştır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"derzi"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"terzi maddesi","url":"https://www.nisanyansozluk.com/kelime/terzi"},{"name":"TDK Güncel Türkçe Sözlük","ref":"terzi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"balkon","word":"balkon","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"bʰelǵ-","meaning":"kalın ağaç gövdesi","period":null,"reconstructed":true},{"language":"goh","form":"balko","meaning":"yapıyı taşıyan ağaç kiriş","period":"Eski Yüksek Almanca dönemi","reconstructed":false},{"language":"fr","form":"balcon","meaning":"kirişle desteklenen yapı çıkması","period":null,"reconstructed":false},{"language":"tr","form":"balkon","meaning":"yapının dışında yer alan çevrili bölüm","period":null,"reconstructed":false}],"shortMeaning":"Bir yapının dışa açılan, çevresi korkulukla çevrili bölümü.","currentMeaning":"Genellikle bina yüzeyinden dışarı uzanan, kenarları duvar veya korkulukla çevrilmiş kullanım alanı.","story":"Balkonun adının gerisinde, yapıyı taşıyan kalın bir ağaç kiriş bulunur. Eski Yüksek Almanca balko bu taşıyıcı parçayı adlandırırken Fransızca balcon, kirişin desteklediği ev çıkmasını karşılar. Türkçeye geçen ad böylece taşıyıcı malzemeden onun üzerinde oluşan mekâna uzanan anlamı taşır.","firstAttestation":{"source":"Düstur Tertip I.-IV.","period":"1863","form":"balkon"},"relatives":[{"word":"Balken","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"balkon maddesi","url":"https://www.nisanyansozluk.com/kelime/balkon"},{"name":"TDK Güncel Türkçe Sözlük","ref":"balkon","url":null}],"confidence":"yüksek","reviewed":true},{"id":"garaj","word":"garaj","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"garer/guarer","meaning":"koruma altında tutmak","period":null,"reconstructed":false},{"language":"fr","form":"garage","meaning":"taşıtı kapalı yerde tutma işi ve bunun yapıldığı yer","period":null,"reconstructed":false},{"language":"tr","form":"garaj","meaning":"taşıtların bırakıldığı kapalı yer","period":null,"reconstructed":false}],"shortMeaning":"Taşıtların konulduğu üstü kapalı yer.","currentMeaning":"Otomobil ve benzeri araçların park edilip korunduğu kapalı veya üstü örtülü alan.","story":"Garajın çıkış noktası bir bina değil, Fransızcada korumayı anlatan garer/guarer eylemidir. Bundan türeyen garage, tekneyi ya da başka bir taşıtı kapalı yerde tutma işini ve bu iş için ayrılan yeri adlandırmıştır. Türkçe, eylemden mekâna geçen bu adın araçlara ayrılmış yer anlamını benimsemiştir.","firstAttestation":{"source":"İlan-ı Ticaret","period":"1920","form":"Garaj"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"garaj maddesi","url":"https://www.nisanyansozluk.com/kelime/garaj"},{"name":"TDK Güncel Türkçe Sözlük","ref":"garaj","url":null}],"confidence":"yüksek","reviewed":true},{"id":"apartman","word":"apartman","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"pars, part-","meaning":"bir bütünden ayrılan pay","period":null,"reconstructed":false},{"language":"la","form":"appartire","meaning":"paylara ayırmak","period":null,"reconstructed":false},{"language":"la","form":"appartimentum","meaning":"ayrılmış bölüm veya pay","period":"Geç Latince dönemi","reconstructed":false},{"language":"fr","form":"appartement","meaning":"konut içindeki bağımsız daire","period":null,"reconstructed":false},{"language":"tr","form":"apartman","meaning":"birden çok daire barındıran katlı bina","period":null,"reconstructed":false}],"shortMeaning":"Birden çok bağımsız daire içeren katlı konut yapısı.","currentMeaning":"Katlarında ayrı konutlar bulunan, birden fazla hanenin yaşayabildiği çok katlı bina.","story":"Apartmanın uzak kökünde Latincedeki pay ve paylaştırma düşüncesi vardır. Ayrılmış bir bölümü adlandıran biçim, Fransızcada konut içindeki bağımsız daireye dönüşmüştür. Türkçede ise adın kapsamı genişleyerek tek daireden bu daireleri bir araya getiren yapının bütününe kaymıştır.","firstAttestation":{"source":"Ahmet Midhat — Felatun Bey ile Rakım Efendi","period":"1876","form":"apartman"},"relatives":[{"word":"apart-otel","relation":"birleşik"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"apartman maddesi","url":"https://www.nisanyansozluk.com/kelime/apartman"},{"name":"TDK Güncel Türkçe Sözlük","ref":"apartman","url":null}],"confidence":"yüksek","reviewed":true},{"id":"asansör","word":"asansör","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"scandere","meaning":"basamakları çıkarak yükselmek","period":null,"reconstructed":false},{"language":"la","form":"adscendere","meaning":"yukarı çıkmak","period":null,"reconstructed":false},{"language":"fr","form":"ascendre","meaning":"tırmanarak yükselmek","period":null,"reconstructed":false},{"language":"fr","form":"ascenseur","meaning":"mekanik olarak yukarı taşıyan araç","period":null,"reconstructed":false},{"language":"tr","form":"asansör","meaning":"katlar arasında insan veya yük taşıyan düzenek","period":null,"reconstructed":false}],"shortMeaning":"İnsanları ve yükleri katlar arasında taşıyan mekanik araç.","currentMeaning":"Bir yapı içinde insanları veya yükleri farklı yükseklikler arasında çıkarıp indiren, çoğunlukla elektrikli taşıma düzeneği.","story":"Asansörün adının temelinde Latincede basamak çıkmayı anlatan scandere vardır. Yukarı çıkma eylemi Fransızcada ascendre biçimiyle sürmüş, ascenseur bu yükselme işini yapan mekanik aracı adlandırmıştır. Türkçe, insanın kendi adımlarıyla yaptığı hareketin bir makineye devredildiği bu adı almıştır.","firstAttestation":{"source":"Servet-i Fünun","period":"1890","form":"asansör"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"asansör maddesi","url":"https://www.nisanyansozluk.com/kelime/asans%C3%B6r"},{"name":"TDK Güncel Türkçe Sözlük","ref":"asansör","url":null}],"confidence":"yüksek","reviewed":true},{"id":"salon","word":"salon","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"gem","chain":[{"language":"gem","form":"sala","meaning":"koğuş, kapalı toplanma mekânı","period":null,"reconstructed":true},{"language":"it","form":"sala","meaning":"insanların toplandığı kapalı mekân","period":null,"reconstructed":false},{"language":"it","form":"salone","meaning":"geniş oda","period":null,"reconstructed":false},{"language":"fr","form":"salon","meaning":"geniş oda, özellikle konuk kabul edilen oda","period":null,"reconstructed":false},{"language":"tr","form":"salon","meaning":"konuk ağırlanan geniş oda","period":null,"reconstructed":false}],"shortMeaning":"Evde oturmaya ve konuk ağırlamaya ayrılan geniş oda.","currentMeaning":"Bir konutta birlikte oturmak ve konukları ağırlamak için kullanılan, genellikle diğer odalardan geniş bölüm.","story":"Salonun geçmişinde, insanların kapalı bir yerde bir araya gelmesini karşılayan Germence bir ad bulunur. İtalyancaya ulaşan sala, salone biçimiyle büyük bir odayı adlandırmış; Fransızca salon ise özellikle konuk kabul edilen odayla özdeşleşmiştir. Türkçede de evin insanları bir araya getiren geniş odası bu adı taşır.","firstAttestation":{"source":"Arşiv Belg. Göre Osmanlı Eğitiminde Modernleşme","period":"1857","form":"salon"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"salon maddesi","url":"https://www.nisanyansozluk.com/kelime/salon"},{"name":"TDK Güncel Türkçe Sözlük","ref":"salon","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tuvalet","word":"tuvalet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"toile","meaning":"dokuma bez veya giysi","period":null,"reconstructed":false},{"language":"fr","form":"toilette","meaning":"giyim ve süslenme; hazırlanma odası; hela","period":null,"reconstructed":false},{"language":"tr","form":"tuvalet","meaning":"bedensel boşaltım için ayrılan yer","period":null,"reconstructed":false}],"shortMeaning":"İdrar ve dışkının boşaltılması için düzenlenmiş yer.","currentMeaning":"İnsanların idrar ve dışkı boşaltma gereksinimini karşılamak üzere donatılmış bölüm.","story":"Tuvaletin yolculuğu Fransızcada bez ve giysiyi adlandıran toile ile başlar. Toilette önce kadınların giyinip süslenmesini, ardından bu hazırlığın yapıldığı odayı karşılamıştır. Daha sonra odanın adı hela için de kullanılmaya başlanmış, Türkçede giyimle ilgili eski kullanımın yanında bugün öne çıkan mekân anlamı yerleşmiştir.","firstAttestation":{"source":"Vartan Paşa — Akabi Hikâyesi","period":"1851","form":"toalet"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tuvalet maddesi","url":"https://www.nisanyansozluk.com/kelime/tuvalet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tuvalet","url":null}],"confidence":"yüksek","reviewed":true},{"id":"duş","word":"duş","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"ducere, duct-","meaning":"yönlendirmek, sevk etmek","period":null,"reconstructed":false},{"language":"la","form":"ductio","meaning":"suyu kanal veya boruyla taşıma","period":"Geç Latince dönemi","reconstructed":false},{"language":"it","form":"doccia","meaning":"su taşıyan boru veya kanal","period":null,"reconstructed":false},{"language":"fr","form":"douche","meaning":"borudan püskürtülen suyla yıkanma düzeneği","period":null,"reconstructed":false},{"language":"tr","form":"duş","meaning":"püskürtülen su altında yıkanma","period":null,"reconstructed":false}],"shortMeaning":"Üzerine püskürtülen suyla yıkanma.","currentMeaning":"Temizlenmek veya tedavi amacıyla, yukarıdan ya da bir başlıktan gelen suyun altında yıkanma.","story":"Duşun uzak kökünde Latincedeki yönlendirme ve bir yere sevk etme eylemi bulunur. Bu eylem suya uygulandığında, kanal ve boruyla su taşıma işi ve İtalyanca doccia gibi boru adları ortaya çıkmıştır. Fransızca douche, borunun taşıdığı suyla yıkanma düzeneğini adlandırmış; Türkçeye de bu banyo kullanımıyla geçmiştir.","firstAttestation":{"source":"Tıngır & Sinapian — Istılahat Lugati","period":"1892","form":"duş"},"relatives":[{"word":"duşakabin","relation":"birleşik"}],"alternatives":null,"funFact":"Duş için Osmanlıcada bir dönem teşelşül karşılığı önerilmiştir.","sources":[{"name":"Nişanyan Sözlük","ref":"duş maddesi","url":"https://www.nisanyansozluk.com/kelime/du%C5%9F"},{"name":"TDK Güncel Türkçe Sözlük","ref":"duş","url":null}],"confidence":"yüksek","reviewed":true},{"id":"küvet","word":"küvet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"cupa","meaning":"fıçı türünde büyük kap","period":null,"reconstructed":false},{"language":"fr","form":"cuve","meaning":"fıçı veya büyük tekne","period":null,"reconstructed":false},{"language":"fr","form":"cuvette","meaning":"yıkama işinde kullanılan leğen veya tekne","period":null,"reconstructed":false},{"language":"tr","form":"küvet","meaning":"içine girilerek yıkanılan su teknesi","period":null,"reconstructed":false}],"shortMeaning":"Su doldurularak içinde yıkanılan tekne.","currentMeaning":"Banyoda içine su doldurulabilen, bir insanın oturarak veya uzanarak yıkanmasına uygun tekne.","story":"Küvetin gerisinde Latincede fıçı gibi büyük kapları adlandıran cupa vardır. Fransızcada cuve biçimini alan bu kap adı, cuvette ile yıkama leğenini ve yıkanma teknesini karşılamıştır. Türkçede ad, suyu bir arada tutan kabın özellikle insanın içine girebildiği banyo biçimine yerleşmiştir.","firstAttestation":{"source":"Hüseyin Rahmi Gürpınar — Tutuşmuş Gönüller","period":"1926","form":"küvet"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"küvet maddesi","url":"https://www.nisanyansozluk.com/kelime/k%C3%BCvet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"küvet","url":null}],"confidence":"yüksek","reviewed":true},{"id":"koridor","word":"koridor","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"currere, curs-","meaning":"koşmak","period":null,"reconstructed":false},{"language":"la","form":"curritorium/corritorium","meaning":"koşmaya ayrılmış yol","period":"Geç Latince dönemi","reconstructed":false},{"language":"it","form":"corridor(e)","meaning":"koşu yolu veya geçit","period":null,"reconstructed":false},{"language":"fr","form":"corridor","meaning":"üstü kapalı uzun geçiş alanı","period":null,"reconstructed":false},{"language":"tr","form":"koridor","meaning":"yapı içindeki bölümleri birbirine bağlayan geçit","period":null,"reconstructed":false}],"shortMeaning":"Bir yapının odalarını veya bölümlerini birbirine bağlayan geçit.","currentMeaning":"Bir binada girişe, odalara veya başka bölümlere ulaşmayı sağlayan, genellikle uzun ve dar geçiş alanı.","story":"Koridorun kökünde Latincede koşmayı anlatan currere bulunur. Bu eylemden oluşan yol adı, İtalyanca ve Fransızcadaki biçimlerinde yapı içindeki uzun geçitlere uzanmıştır. Türkçenin Fransızcadan aldığı koridor, koşma eyleminden çok bir yerden diğerine geçmeyi sağlayan mimari alanı adlandırır.","firstAttestation":{"source":"Tebessüm","period":"1887","form":"koridor"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"koridor maddesi","url":"https://www.nisanyansozluk.com/kelime/koridor"},{"name":"TDK Güncel Türkçe Sözlük","ref":"koridor","url":null}],"confidence":"yüksek","reviewed":true},{"id":"antre","word":"antre","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"inter","meaning":"içeriye veya araya ilişkin","period":null,"reconstructed":false},{"language":"la","form":"intrare","meaning":"içeriye girmek","period":null,"reconstructed":false},{"language":"la","form":"intrata","meaning":"içeri girme","period":null,"reconstructed":false},{"language":"fr","form":"entrée","meaning":"giriş","period":null,"reconstructed":false},{"language":"tr","form":"antre","meaning":"içeri girildiğinde ulaşılan ilk bölüm","period":null,"reconstructed":false}],"shortMeaning":"Bir konutun kapısından girilince ulaşılan ilk bölüm.","currentMeaning":"Bir yapının veya konutun girişinde bulunan, iç bölümlere geçiş sağlayan alan.","story":"Antrenin geçmişinde Latincedeki içeri girme eylemi vardır. Bu eylem Fransızca entrée biçiminde girişin adı olmuş, Türkçede ise kapıdan geçince ulaşılan bölüme yerleşmiştir. Böylece bir hareketin adı, o hareketin gerçekleştiği mekânı karşılamaya başlamıştır.","firstAttestation":{"source":"Ali Seydi — Lisan-ı Osmanide Müstamel Lugat-i Ecnebiye","period":"1911","form":"antre"},"relatives":[],"alternatives":null,"funFact":"Antre, Türkçede yemek öncesinde sunulan yiyecekler için de kullanılmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"antre maddesi","url":"https://www.nisanyansozluk.com/kelime/antre"},{"name":"TDK Güncel Türkçe Sözlük","ref":"antre","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mobilya","word":"mobilya","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"mobilis","meaning":"yer değiştirebilen, taşınabilir","period":null,"reconstructed":false},{"language":"la","form":"mobiliaria","meaning":"taşınabilen eşyalar","period":null,"reconstructed":false},{"language":"fr","form":"mobilier","meaning":"taşınabilir mallar, ev döşemesi","period":null,"reconstructed":false},{"language":"tr","form":"mobilya","meaning":"ev ve iş yerlerinin döşenmesinde kullanılan taşınabilir eşya","period":null,"reconstructed":false}],"shortMeaning":"Masa, dolap, yatak gibi döşeme eşyalarının genel adı.","currentMeaning":"Evlerde ve çalışma alanlarında oturma, yatma, yemek yeme veya eşya saklama gibi ihtiyaçları karşılayan taşınabilir eşyaların bütünü.","story":"Mobilyanın geçmişinde bir eşyanın görünüşünden önce taşınabilmesi öne çıkar. Latince mobilis ile anlatılan hareket edebilme özelliği, mobiliaria biçiminde taşınabilir malların adına dönüşür. Fransızca mobilier bu çerçeveyi ev döşemesine taşır; Türkçeye doğrudan Fransızcadan mı, İtalyancadan mı geçtiği konusunda iki ayrı açıklama vardır. Bugünkü kullanımda kelime, evin içindeki masa ve dolap gibi eşyaları bir araya getirir.","firstAttestation":{"source":"Tıngır & Sinapian — Istılahat Lugati","period":"1892","form":"mobilya"},"relatives":[],"alternatives":["Nişanyan Sözlük aktarımı Fransızca mobilier üzerinden açıklarken TDK Güncel Türkçe Sözlük doğrudan kaynak olarak İtalyanca mobilia biçimini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mobilya maddesi","url":"https://www.nisanyansozluk.com/kelime/mobilya"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mobilya maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"büfe","word":"büfe","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":null,"chain":[{"language":"fr","form":"buffet","meaning":"yemek takımı dolabı, yiyecek sergilenen masa ve yiyecek içecek satış yeri","period":null,"reconstructed":false},{"language":"tr","form":"büfe","meaning":"yemek takımlarının saklandığı dolap","period":null,"reconstructed":false}],"shortMeaning":"Yemek takımlarını saklamak için kullanılan dolap.","currentMeaning":"Tabak, bardak ve benzeri sofra eşyalarının yerleştirildiği ev dolabı.","story":"Fransızca buffet, sofra çevresindeki birkaç farklı nesneyi aynı ad altında toplar: takımların saklandığı dolap ve yiyeceklerin sergilendiği masa. Kelimenin Fransızcadan önceki geçmişi bilinmez. Yiyecek sunulan masa ile satış yapılan yer arasındaki yakınlık, adın istasyonlardaki ve sokaklardaki yiyecek içecek satış noktalarına da yayılmasını sağlar. Türkçedeki büfe, hem evdeki dolabı hem de bu satış yerlerini adlandırır.","firstAttestation":{"source":"Ahmed Mithat — Karnaval","period":"1881","form":"büfe"},"relatives":[],"alternatives":["Nişanyan Sözlük Fransızca buffet biçiminin daha eski kaynağını bilinmeyen bir kelime olarak gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"büfe maddesi","url":"https://www.nisanyansozluk.com/kelime/b%C3%BCfe"},{"name":"TDK Güncel Türkçe Sözlük","ref":"büfe maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"komodin","word":"komodin","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"modus","meaning":"ölçü","period":null,"reconstructed":false},{"language":"la","form":"modare","meaning":"birbirine uymak, ölçü bakımından uyuşmak","period":null,"reconstructed":false},{"language":"la","form":"commodus","meaning":"birbirine uymak, ölçü bakımından uyuşmak","period":null,"reconstructed":false},{"language":"fr","form":"commode","meaning":"ölçüsü uygun, kullanımı kolay","period":null,"reconstructed":false},{"language":"fr","form":"commodine","meaning":"dirsek hizasına ulaşan dolap","period":null,"reconstructed":false},{"language":"tr","form":"komodin","meaning":"yatağın yanında kullanılan küçük dolap","period":null,"reconstructed":false}],"shortMeaning":"Yatağın yanına yerleştirilen küçük dolap.","currentMeaning":"Yatak başında kullanılan, üzerine lamba veya su gibi eşyaların konulabildiği, masa yüzeyli küçük dolap.","story":"Komodinin uzak geçmişinde ölçü ve birbirine uyma düşüncesi bulunur. Bu çizgi Fransızca commode biçiminde bir şeyin kullanıma uygunluğunu anlatan bir niteliğe dönüşür. Commodine ise bu kullanışlılığı somut bir eşyaya, dirsek hizasındaki dolaba bağlar. Türkçede ad, yatağın yanında durup gece ihtiyaç duyulan eşyaları el altında tutan küçük dolapta yerleşir.","firstAttestation":{"source":"Ali Seydi — Yeni Türkçe Lugat, Resimli","period":"1929","form":"Komodin"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"komodin maddesi","url":"https://www.nisanyansozluk.com/kelime/komodin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"komodin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"vitrin","word":"vitrin","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"vitre","meaning":"cam","period":null,"reconstructed":false},{"language":"fr","form":"vitrine","meaning":"dükkânın camla ayrılmış sergileme bölümü","period":null,"reconstructed":false},{"language":"tr","form":"vitrin","meaning":"eşyaların sergilendiği camlı alan","period":null,"reconstructed":false}],"shortMeaning":"Eşyaların sergilendiği camlı bölme.","currentMeaning":"Ürünlerin veya başka nesnelerin görülmesi ve tanıtılması için düzenlenen camlı sergileme alanı.","story":"Vitrinin adını belirleyen şey, içindeki ürünlerden önce onları görünür kılan camdır. Fransızca vitre ile adlandırılan malzeme, vitrine biçiminde dükkânın camlı sergileme bölümüne ad olur. Türkçe de kelimeyi bu işleviyle alır: eşya camın arkasında durur, dışarıdaki kişinin bakışına sunulur.","firstAttestation":{"source":"Tıngır & Sinapian — Istılahat Lugati","period":"1892","form":"vitrina"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"vitrin maddesi","url":"https://www.nisanyansozluk.com/kelime/vitrin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"vitrin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"abajur","word":"abajur","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"dies","meaning":"gündüz, gün","period":null,"reconstructed":false},{"language":"la","form":"diurnus","meaning":"gün","period":null,"reconstructed":false},{"language":"fr","form":"jour","meaning":"gün, aydınlık","period":null,"reconstructed":false},{"language":"fr","form":"abattre","meaning":"azaltmak, aşağı indirmek","period":null,"reconstructed":false},{"language":"fr","form":"abat","meaning":"azaltır, aşağı indirir","period":null,"reconstructed":false},{"language":"fr","form":"abat-jour","meaning":"ışığı azaltan lamba örtüsü","period":null,"reconstructed":false},{"language":"tr","form":"abajur","meaning":"lambanın ışığını yönlendiren ve perdeleyen siper","period":null,"reconstructed":false}],"shortMeaning":"Lamba ışığını perdeleyen ve yönlendiren siper.","currentMeaning":"Işığın göze doğrudan gelmesini engellemek veya belirli bir alana yönelmesini sağlamak için lambaya takılan örtü ya da başlık.","story":"Abajurun Fransızca adında ışığı azaltan bir nesnenin yaptığı iş saklıdır. Abat ile jour birleşince, aydınlığı kısan bir siper resmi ortaya çıkar; jour parçasının geçmişi Latincenin gün bildiren biçimlerine uzanır. Lambanın çevresindeki örtü ışığı tümüyle kesmez, gözle ışık kaynağının arasına girerek onu perdeler. Türkçede kelime bu siperin adı olarak kullanılır.","firstAttestation":{"source":"Vartan Paşa — Akabi Hikâyesi","period":"1851","form":"abajur"},"relatives":[],"alternatives":null,"funFact":"Abajur, Türkçedeki eski kullanımlarında lamba başlığının yanında pencereye takılan ışık kesici kanatları da adlandırıyordu.","sources":[{"name":"Nişanyan Sözlük","ref":"abajur maddesi","url":"https://www.nisanyansozluk.com/kelime/abajur"},{"name":"TDK Güncel Türkçe Sözlük","ref":"abajur maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"aplik","word":"aplik","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"appliquer","meaning":"bir şeyin üzerine eklemek, uygulamak","period":null,"reconstructed":false},{"language":"fr","form":"applique","meaning":"yüzeye eklenen süs; duvara takılan tek mumlu aydınlatıcı","period":null,"reconstructed":false},{"language":"tr","form":"aplik","meaning":"duvara sabitlenen lamba","period":null,"reconstructed":false}],"shortMeaning":"Duvara sabitlenerek kullanılan lamba.","currentMeaning":"Duvara monte edilen, çoğunlukla şamdanı andıran biçimdeki aydınlatma aracı.","story":"Apliğin adının merkezinde bir yüzeye bir şey ekleme hareketi vardır. Fransızca appliquer bu hareketi anlatırken applique, yüzeye eklenen süsün ve duvara takılan tek mumlu aydınlatıcının adı olur. Türkçeye geçen aplikte de bu bağ korunur: lamba bağımsız bir ayak üzerinde durmaz, duvara tutturulur.","firstAttestation":{"source":"Cumhuriyet — gazete","period":"1937","form":"aplik"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"aplik maddesi","url":"https://www.nisanyansozluk.com/kelime/aplik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"aplik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"stor","word":"stor","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"en","ultimateOrigin":"fro","chain":[{"language":"fro","form":"estorer","meaning":"saklamak, depolamak","period":null,"reconstructed":false},{"language":"en","form":"to store","meaning":"saklamak, depolamak","period":null,"reconstructed":false},{"language":"en","form":"store","meaning":"malların tutulduğu depo veya satıldığı dükkân","period":null,"reconstructed":false},{"language":"en","form":"store window","meaning":"dükkânın penceresi veya kepengi","period":null,"reconstructed":false},{"language":"tr","form":"stor","meaning":"bir kanal boyunca hareket ederek açılıp kapanan perde","period":null,"reconstructed":false}],"shortMeaning":"Bir kanal içinde hareket ederek açılıp kapanan perde.","currentMeaning":"Kumaş, ahşap veya benzeri malzemeden yapılan, bir kanal boyunca hareket ettirilerek açılıp kapatılan perde.","story":"Storun geçmişi için depodan dükkân penceresine uzanan bir açıklama vardır. Bu yolda Eski Fransızca estorer, İngilizce to store ve store üzerinden mal saklama işini, ardından dükkânı adlandıran bir çizgi oluşturur. Store window aşamasında odak dükkânın penceresine ve kepengine kayar; Türkçedeki perde adı bu yolla açıklanır. Bunun yanında kelimenin doğrudan Fransızca store üzerinden alındığını belirten ayrı bir köken kaydı da vardır.","firstAttestation":{"source":"Recaizade Ekrem — Araba Sevdası","period":"1896","form":"istorları"},"relatives":[],"alternatives":["Nişanyan Sözlük aktarım zincirini İngilizce store window ile tamamlarken TDK Güncel Türkçe Sözlük Türkçeye veren dil ve biçimi Fransızca store olarak gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"stor maddesi","url":"https://www.nisanyansozluk.com/kelime/stor"},{"name":"TDK Güncel Türkçe Sözlük","ref":"stor maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"paravan","word":"paravan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"it","chain":[{"language":"it","form":"vento","meaning":"rüzgâr","period":null,"reconstructed":false},{"language":"it","form":"parare","meaning":"korumak","period":null,"reconstructed":false},{"language":"it","form":"paravento","meaning":"korumak","period":null,"reconstructed":false},{"language":"fr","form":"paravent","meaning":"rüzgârı engelleyen siper","period":null,"reconstructed":false},{"language":"tr","form":"paravan","meaning":"bir alanı bölmek için kullanılan taşınabilir katlanır perde","period":null,"reconstructed":false}],"shortMeaning":"Bir alanı bölmeye yarayan taşınabilir, katlanır perde.","currentMeaning":"Birbirine menteşelerle tutturulmuş çerçeveli bölümlerden oluşan, mekân içinde ayırıcı olarak kullanılan taşınabilir perde.","story":"Paravanın adı, İtalyancada rüzgârı anlatan vento ile koruma eylemini anlatan parare parçalarını bir araya getirir. Bu birleşim Fransızca paravent biçiminde rüzgâra karşı duran bir siperi adlandırır. Türkçedeki kullanımda öne çıkan iş, odanın içinde bir sınır oluşturmaktır. Böylece aynı taşınabilir engel, hava akımını kesmenin ötesinde mekânı bölmeye yarar.","firstAttestation":{"source":"Tıngır & Sinapian — Istılahat Lugati","period":"1892","form":"paravan"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"paravan maddesi","url":"https://www.nisanyansozluk.com/kelime/paravan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"paravan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"karton","word":"karton","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"it","chain":[{"language":"it","form":"carta","meaning":"kâğıt","period":null,"reconstructed":false},{"language":"it","form":"cartone","meaning":"iri veya kaba yapılı kâğıt","period":null,"reconstructed":false},{"language":"fr","form":"carton","meaning":"kalın ve dayanıklı kâğıt","period":null,"reconstructed":false},{"language":"tr","form":"karton","meaning":"kâğıt hamurundan üretilen sert ve kalın levha","period":null,"reconstructed":false}],"shortMeaning":"Kâğıt hamurundan yapılan kalın ve sert malzeme.","currentMeaning":"Kâğıt hamurunun lifli tabakalarla birleştirilmesiyle elde edilen, sıradan kâğıttan daha kalın ve sert malzeme.","story":"Kartonun yolculuğu İtalyanca carta ile, bildik kâğıtla başlar. Cartone biçiminde aynı malzemenin büyük veya kaba yapılı çeşidi öne çıkar. Fransızca carton aşamasında kalınlık belirginleşir ve Türkçe kelimeyi bu özelliğiyle alır. Bugünkü karton, ince bir yaprak gibi kolayca bükülmeyen kâğıt malzemenin adıdır.","firstAttestation":{"source":"Mehmed Bahaeddin [Toven] — Yeni Türkçe Lugat","period":"1924","form":"karton"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"karton maddesi","url":"https://www.nisanyansozluk.com/kelime/karton"},{"name":"TDK Güncel Türkçe Sözlük","ref":"karton maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ambalaj","word":"ambalaj","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"balle","meaning":"balya veya top biçimindeki yığın","period":null,"reconstructed":false},{"language":"fr","form":"emballer","meaning":"paket hâline getirmek","period":null,"reconstructed":false},{"language":"fr","form":"emballage","meaning":"paket yapma işi ve ortaya çıkan paket","period":null,"reconstructed":false},{"language":"tr","form":"ambalaj","meaning":"ürünü saran, koruyan ve taşınmasını kolaylaştıran malzeme","period":null,"reconstructed":false}],"shortMeaning":"Ürünü koruyup taşımayı kolaylaştıran kaplama veya kap.","currentMeaning":"Ürünleri koruyan, bir arada tutan, taşınmalarına ve saklanmalarına yardımcı olan; üzerindeki bilgilerle tanıtım da sağlayabilen sarma veya kaplama malzemesi.","story":"Ambalajın başlangıcındaki Fransızca balle, malzemenin balya ya da top hâlinde bir araya getirilmesini düşündürür. Buradan gelişen emballer, eşyayı paketleme işini; emballage ise hem bu işi hem ortaya çıkan paketi adlandırır. Türkçede ağırlık, ürünü çevreleyen koruyucu malzemeye geçer. Balya hâlinde toplama fikri, bugünkü kutunun ve sargının ürünü bir arada tutma işinde yaşamayı sürdürür.","firstAttestation":{"source":"Recaizade Ekrem — Araba Sevdası","period":"1896","form":"ambalajı"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ambalaj maddesi","url":"https://www.nisanyansozluk.com/kelime/ambalaj"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ambalaj maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nezaket","word":"nezaket","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nāzuk","meaning":"ince, nazik","period":null,"reconstructed":false},{"language":"tr","form":"nezaket","meaning":"davranışta incelik ve kibarlık","period":null,"reconstructed":false}],"shortMeaning":"Başkalarına karşı gösterilen incelik ve kibarlık.","currentMeaning":"İnsanlarla ilişkilerde saygıyı gözeten, kırıcı olmamaya dayanan kibar davranış biçimi.","story":"Nezaketin bir açıklaması, Farsça nāzuk ile anlatılan inceliği bir davranış niteliğine dönüştürür. Bu açıklamada Farsça taban, Arapça bir türetme kuralıyla işlenir; başka bir açıklama ise kelimeyi Arapçadan alınmış kabul eder. Eski kullanımda bir şiirin anlatımındaki incelik de nezaket sayılabilirken, bugün kelimenin merkezinde insanlara gösterilen saygılı ve yumuşak davranış bulunur.","firstAttestation":{"source":"Latifî — Tezkîretü'ş-Şuarâ","period":"1546","form":"nezāket"},"relatives":[{"word":"nazik","relation":"akraba"}],"alternatives":["Nişanyan Sözlük nezaketi Farsça nāzuk tabanından Arapça dil bilgisi kuralıyla oluşturulmuş bir türev olarak açıklar; TDK Güncel Türkçe Sözlük ise Arapça nezāket biçimini kaynak gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nezaket maddesi","url":"https://www.nisanyansozluk.com/kelime/nezaket"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nezaket maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"nadide","word":"nadide","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"dīda","meaning":"görmüş olan, gören; göz","period":null,"reconstructed":false},{"language":"fa","form":"nādīda","meaning":"görmemiş olan, görmeyen","period":null,"reconstructed":false},{"language":"tr","form":"nadide","meaning":"pek az rastlanan, benzeri kolay bulunmayan","period":null,"reconstructed":false}],"shortMeaning":"Pek az rastlanan, benzeri kolay bulunmayan.","currentMeaning":"Seyrek karşılaşılan, alışılmış örneklerin dışında kalan veya eşine az rastlanan.","story":"Nadidenin Farsça geçmişinde gören kişi ile gördüğü şey arasında önemli bir yön değişimi vardır. Dīda görmeyle bağlantılıyken nādīda, bir şeyi görmemiş olan kişiyi anlatır. Türkçede bu etkin bakış edilgenleşir: görmemiş birinden, daha önce görülmemiş bir şeye geçilir. Bugünkü seyrek bulunma ve eşsizlik düşüncesi bu değişimin üzerine kurulur.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"nādīde"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nadide maddesi","url":"https://www.nisanyansozluk.com/kelime/nadide"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nadide maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hercai","word":"hercai","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"cāy","meaning":"yer","period":null,"reconstructed":false},{"language":"fa","form":"har","meaning":"her","period":null,"reconstructed":false},{"language":"fa","form":"harcāyī","meaning":"her yere bağlı, çeşitli yerlerde açan; kararsız","period":null,"reconstructed":false},{"language":"tr","form":"hercai","meaning":"bağlılığı ve ilgisi sık değişen, kararsız","period":null,"reconstructed":false}],"shortMeaning":"İlgisi ve bağlılığı sık değişen, kararsız.","currentMeaning":"Bir kişiye, konuya veya düşünceye bağlı kalmayıp yönelişini kolayca değiştiren.","story":"Hercainin Farsça yapısında her yer düşüncesi bulunur: har ile cāy, tek bir yere bağlı kalmayan bir çerçeve kurar. Harcāyī hem farklı yerlerde açan çiçeği hem de bağlılığı değişken kişiyi anlatır. Türkçede insan davranışına dönük kullanım, ilgisini bir yerde tutamayan kişiyi öne çıkarır. Son ekin dilsel açıklamasında ise kaynaklar farklı çözümlemeler sunar elime/bi%C3%A7are"}],"confidence":"orta","reviewed":true},{"id":"nevale","word":"nevale","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"nāla","meaning":"bağışta bulundu, yiyecek sağladı","period":null,"reconstructed":false},{"language":"ar","form":"nawāla(t)","meaning":"verilen bağış veya yiyecek payı, yol azığı","period":null,"reconstructed":false},{"language":"tr","form":"nevale","meaning":"yenmek üzere hazırlanmış yiyecek, azık","period":null,"reconstructed":false}],"shortMeaning":"Yenmek üzere hazırlanmış yiyecek; azık.","currentMeaning":"Özellikle yolda veya dışarıda tüketilmek üzere ayrılan ya da hazırlanan yiyecek.","story":"Nevalenin Arapça geçmişinde birine bir şey verme ve onu besleme eylemleri birleşir. Nawāla(t), bağışın yanında ayrılan yiyecek payını da adlandırır. Böylece verilen şeyin genel adı, yenilecek paya ve yol için hazırlanan azığa doğru daralır. Türkçedeki nevale kullanımında bu yiyecek tarafı öne çıkar.","firstAttestation":{"source":"Mercimek Ahmed — Kâbusname tercümesi","period":"1432","form":"nevāle"},"relatives":[{"word":"soğuk nevale","relation":"birleşik"}],"alternatives":null,"funFact":"Soğuk nevale sözünün başlangıcında, yolculukta yenmek üzere alınan soğuk yemek vardır.","sources":[{"name":"Nişanyan Sözlük","ref":"nevale maddesi","url":"https://www.nisanyansozluk.com/kelime/nevale"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nevale maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"serencam","word":"serencam","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"sar-ancām","meaning":"bir işin vardığı son nokta, sonuç","period":null,"reconstructed":false},{"language":"tr","form":"serencam","meaning":"bir olayın veya kişinin sonunda vardığı durum","period":null,"reconstructed":false}],"shortMeaning":"Bir olayın veya kişinin sonunda v Güncel Türkçe Sözlük","ref":"revan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"avare","word":"avare","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"āvāra","meaning":"yurdu veya evi olmayan, boş gezen","period":null,"reconstructed":false},{"language":"tr","form":"avare","meaning":"bir işle uğraşmadan dolaşan","period":null,"reconstructed":false}],"shortMeaning":"Bir işle uğraşmadan dolaşan, aylak.","currentMeaning":"Düzenli bir uğraşı olmadan başıboş dolaşan kimseyi niteleyen söz.","story":"Farsça āvāra, hem evinden yurdundan kopmuş kişiyi hem de aylak dolaşanı kapsar. Bir yere yerleşememe ile belli bir işe bağlanmama, bu kelimede aynı dolaşma görüntüsünde buluşur. Türkçedeki avarede ağırlık işsiz güçsüz gezmeye kayar; kişinin mutlaka evsiz olması gerekmez.","firstAttestation":{"source":"Gülşehri — Mantıku't-Tayr","period":"1317","form":"āvāre"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"avare maddesi","url":"https://www.nisanyansozluk.com/kelime/avare"},{"name":"TDK Güncel Türkçe Sözlük","ref":"avare maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"aheste","word":"aheste","rarity":"az-bilinen","partOfSpeech":"zarf","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"hastīdan","meaning":"var olmak; uyum sağlamak, işe yaramak, değer taşımak","period":null,"reconstructed":false},{"language":"fa","form":"āhasta","meaning":"ağır hareket eden, ses çıkarmayan","period":null,"reconstructed":false},{"language":"tr","form":"aheste","meaning":"acele etmeden, ağır ağır","period":null,"reconstructed":false}],"shortMeaning":"Acele etmeden, ağır ağır.","currentMeaning":"Bir hareketin veya işin düşük hızla, telaşsız biçimde yapıldığını anlatır.","story":"Ahestenin geçmişindeki Farsça hastīdan, var olmanın yanında uyma ve uygun düşme düşüncele :"Bugün pencere kenarında duran pervazın eski anlam dünyasında uçuş vardır. Gitme ve taşıma bildiren eski kök, Avestacada uçmayı da karşılar; Farsçada parvāz hem uçuşu hem kanat ve saçağı adlandırır. Türkçede uçma anlamı eski metinlerde görülürken kenarları çevreleyen parçayı anlatan kullanım da yerleşmiştir. Günlük yapı dilinde yaşayan anlam, bu kanat ve saçak tarafıdır.","firstAttestation":{"source":"Anonim — Tezkiretü'l-Evliya tercümesi","period":"1341","form":"pervāz"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"pervaz maddesi","url":"https://www.nisanyansozluk.com/kelime/pervaz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"pervaz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"peyderpey","word":"peyderpey","rarity":"az-bilinen","partOfSpeech":"zarf","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"pay","meaning":"ayak, atılan adım ve arka","period":null,"reconstructed":false},{"language":"fa","form":"pay dar pay","meaning":"bir adımın ardından öteki, peş peşe","period":null,"reconstructed":false},{"language":"tr","form":"peyderpey","meaning":"küçük bölümler veya aşamalar hâlinde","period":null,"reconstructed":false}],"shortMeaning":"Küçük bölümler hâlinde, aşama aşama.","currentMeaning":"Bir işin veya sürecin küçük bölümler hâlinde, zaman içinde ilerlemesini belirten söz.","story":"Farsça pay, ayağı ve onun attığı adımı adlandırır. Pay dar pay ifadesinde bir adımın arkasından öteki gelir; böylece yürüyüş, birbirini izleyen işlerin de resmi olur. Türkçede peyderpey, bu sıralı ilerleyişten hareketle bir şeyin küçük bölümler hâlinde gerçekleşmesini anlatır.","firstAttestation":{"source":"Ömer b. Mezîd — Mecmuatü'n-nezâir","period":"1437","form":"pey-ā-pey"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"peyderpey maddesi","url":"https://www.nisanyansozluk.com/kelime/peyderpey"},{"name":"TDK Güncel Türkçe Sözlük","ref":"peyderpey maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"rengârenk","word":"rengârenk","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"rengāreng","meaning":"birçok farklı renkte","period":null,"reconstructed":false},{"language":"tr","form":"rengârenk","meaning":"birçok farklı renkte","period":null,"reconstructed":false}],"shortMeaning":"Birçok farklı rengi bir arada taşıyan.","currentMeaning":"Üzerinde veya içinde birbirinden farklı pek çok renk bulunan.","story":"Farsça rengāreng, tek bir renge sığmayan görünüşü anlatır. Türkçede rengârenk biçimini alan kelime, farklı renklerin yan yana bulunması fikrini korur. Bir çiçek bahçesiyle çok renkli bir kumaşın aynı sözle anlatılmasını sağlayan ortaklık budur.","firstAttestation":null,"relatives":[{"word":"renk","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"rengârenk maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"rint","word":"rint","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"rind","meaning":"güzel insan; düşünür, gönlü geniş ve dünya hırsından uzak kişi","period":null,"reconstructed":false},{"language":"tr","form":"rint","meaning":"gösterişten ve dünya kaygılarından uzak yaşayan kişi","period":null,"reconstructed":false}],"shortMeaning":"Dünya hırslarından uzak, gönlünce yaşayan kimse.","currentMeaning":"Dış görünüşe ve toplumsal kurallara fazla önem vermeden, hayatı kendi iç dünyasının ölçüleriyle değerlendiren kimse.","story":"Farsça rind, güzel insanı da dünya hırsını geride bırakmış kalender kişiyi de anlatıyordu. Türkçedeki rintte özellikle ikinci portre belirginleşti: gösterişin ve kazanç kaygısının peşinden gitmeyen insan. Kelime böylece dış dünyanın ölçülerinden çok kendi gönlünü dinleyen bir yaşayışın adı oldu.","firstAttestation":{"source":"Anonim — Kitabü'l-İdrak Haşiyesi","period":"1402 öncesi","form":"rind"},"relatives":[{"word":"rintlik","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"rint maddesi","url":"https://www.nisanyansozluk.com/kelime/rint"},{"name":"TDK Güncel Türkçe Sözlük","ref":"rint maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"serazat","word":"serazat","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"sarāzād","meaning":"başı bağımsız ve özgür olan","period":null,"reconstructed":false},{"language":"tr","form":"serazat","meaning":"bağımsız davranabilen, özgür","period":null,"reconstructed":false}],"shortMeaning":"Özgürce ve bağımsız davranan.","currentMeaning":"Bir bağ veya baskı altında bulunmayan, özgür ve serbest.","story":"Farsçada başı anlatan ser ile özgürlüğü anlatan azat, serazatta birleşir. Ortaya çıkan resimde kişinin başı bir başkasının buyruğuna bağlı değildir. Türkçeye bütün olarak alınan kelime, bu resmi özgürce yaşayan ve davranan kişinin niteliğine dönüştürür.","firstAttestation":{"source":"Asım Efendi — Asım Efendi Tarihi","period":"1809","form":"ser-āzād"},"relatives":[{"word":"azat","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"serazat maddesi","url":"https://www.nisanyansozluk.com/kelime/serazat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"serazat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sergüzeşt","word":"sergüzeşt","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"guḏaştan, guḏār-","meaning":"bir yerden veya durumdan geçmek","period":null,"reconstructed":false},{"language":"fa","form":"sar","meaning":"baş","period":null,"reconstructed":false},{"language":"fa","form":"sar guḏaşt","meaning":"kişinin yaşadığı olay, başından geçen","period":null,"reconstructed":false},{"language":"tr","form":"sergüzeşt","meaning":"kişinin yaşadığı macera","period":null,"reconstructed":false}],"shortMeaning":"Bir kimsenin başından geçen macera.","currentMeaning":"Bir kimsenin yaşadığı, anlatılmaya değer olay veya macera.","story":"Farsçada başı anlatan sar, geçmek eyleminin bir biçimiyle birleşir. Böylece fiziksel olarak geçip gitme düşüncesi, insanın başından geçen olayları anlatmaya yönelir. Türkçe sergüzeşt de kişinin yaşadıklarını, özellikle macera olarak anlatılanları taşır.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"ser-güẕeştdir"},"relatives":[{"word":"serazat","relation":"akraba"},{"word":"sermest","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sergüzeşt maddesi","url":"https://www.nisanyansozluk.com/kelime/serg%C3%BCze%C5%9Ft"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sergüzeşt maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sermest","word":"sermest","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"mast","meaning":"sarhoş veya mutluluk içindeki","period":null,"reconstructed":false},{"language":"fa","form":"sar","meaning":"baş","period":null,"reconstructed":false},{"language":"tr","form":"sermest","meaning":"sarhoş, kendinden geçmiş","period":null,"reconstructed":false}],"shortMeaning":"Sarhoş veya coşkuyla kendinden geçmiş.","currentMeaning":"İçkinin ya da yoğun bir duygunun etkisiyle kendinden geçmiş, sarhoş.","story":"Farsçada sar başı, mast ise sarhoşluğu ve mutluluğu anlatır. Bu iki parçanın birleşmesi, sarhoşluğu başta duyulan bir hâl olarak resmeder. Türkçede sermest, içkinin yanında aşkın ve coşkunun insanı kendinden geçirmesini de anlatır.","firstAttestation":{"source":"Süleyman Çelebi — Mevlid","period":"1409","form":"sermest"},"relatives":[{"word":"mest","relation":"akraba"},{"word":"sergüzeşt","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sermest maddesi","url":"https://www.nisanyansozluk.com/kelime/sermest"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sermest maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şebnem","word":"şebnem","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nam","meaning":"ıslaklık ve nem","period":null,"reconstructed":false},{"language":"fa","form":"şab","meaning":"gece","period":null,"reconstructed":false},{"language":"fa","form":"şabnam","meaning":"yüzeylerde biriken çiy damlaları","period":null,"reconstructed":false},{"language":"tr","form":"şebnem","meaning":"yüzeylerde biriken çiy damlaları","period":null,"reconstructed":false}],"shortMeaning":"Gece serinliğinde yüzeylerde oluşan çiy.","currentMeaning":"Havadaki su buharının serin yüzeylerde yoğunlaşmasıyla oluşan küçük su damlaları; çiy.","story":"Farsçada geceyi anlatan şab ile nemi anlatan nam bir araya gelir. Bu birleşik ad, sabah yaprakların üzerinde görülen damlaları gecenin bıraktığı ıslaklık olarak resmeder. Türkçeye şebnem biçiminde geçerken aynı doğa olayını anlatmayı sürdürür.","firstAttestation":{"source":"Anonim — Danişmend-Name","period":"1360","form":"şeb-nem"},"relatives":[{"word":"nem","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"şebnem maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Febnem"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şebnem maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"yekpare","word":"yekpare","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"pāra","meaning":"bir bütünden ayrılan bölüm","period":null,"reconstructed":false},{"language":"fa","form":"yak","meaning":"bir","period":null,"reconstructed":false},{"language":"fa","form":"yak-pāra","meaning":"tek parçadan oluşan, bütünleşmiş","period":null,"reconstructed":false},{"language":"tr","form":"yekpare","meaning":"tek parça hâlinde bulunan","period":null,"reconstructed":false}],"shortMeaning":"Tek parça hâlinde olan.","currentMeaning":"Bölümlere ayrılmamış veya parçaları bir bütün oluşturacak biçimde birleşmiş olan.","story":"Farsça yak bir sayısını, pāra ise bir bütünden ayrılmış bölümü anlatır. Yan yana geldiklerinde parçaların çokluğu yerini tek parçalık bir bütüne bırakır. Türkçede yekpare, bir taşın veya yapının bölünmeden duruşunu da ayrı parçaların kaynaşıp bütünleşmesini de anlatabilir.","firstAttestation":{"source":"Yazıcıoğlu Ahmed Bîcan — Dürr-i Meknûn","period":"1465","form":"yekpāre"},"relatives":[{"word":"pare","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"yekpare maddesi","url":"https://www.nisanyansozluk.com/kelime/yekpare"},{"name":"TDK Güncel Türkçe Sözlük","ref":"yekpare maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"aforizma","word":"aforizma","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"aphorisme","meaning":"bir düşünceyi kısa ve özlü biçimde dile getiren söz","period":null,"reconstructed":false},{"language":"tr","form":"aforizma","meaning":"bir düşünceyi kısa ve özlü biçimde dile getiren söz","period":null,"reconstructed":false}],"shortMeaning":"Bir düşünceyi yoğunlaştıran kısa ve özlü söz.","currentMeaning":"Bir düşünceyi veya yargıyı kısa, özlü ve çarpıcı biçimde dile getiren söz.","story":"Fransızca aphorisme, uzun bir açıklamanın yerine düşünceyi birkaç söze sığdıran ifadeyi adlandırır. Türkçeye aforizma olarak geçerken bu düşünceyi yoğunlaştırma işlevini korur. Kelimenin odağında, az sözle geniş bir yargı dile getirme çabası vardır.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"aforizma maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"alegori","word":"alegori","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"agoreúō","meaning":"söz söylemek, konuşmak","period":null,"reconstructed":false},{"language":"ine","form":"h₂el- (al-)","meaning":"öteki, başka","period":null,"reconstructed":true},{"language":"grc","form":"állos","meaning":"başka","period":null,"reconstructed":false},{"language":"grc","form":"allēgoría","meaning":"bir şeyi başka bir anlatımla ima etme","period":null,"reconstructed":false},{"language":"fr","form":"allégorie","meaning":"simgeler aracılığıyla kurulan anlatı","period":null,"reconstructed":false},{"language":"tr","form":"alegori","meaning":"bir düşünceyi simgesel kişiler ve olaylarla canlandırma","period":null,"reconstructed":false}],"shortMeaning":"Bir düşünceyi simgesel bir anlatıyla canlandırma.","currentMeaning":"Bir düşünceyi, durumu veya yaşantıyı simgesel kişiler, olaylar ve görüntüler aracılığıyla anlaşılır kılan anlatım.","story":"Eski Yunancada başka olmayı anlatan állos ile konuşma eylemi aynı kelimede buluşur. Allēgoría, söylenenin arkasında başka bir düşüncenin bulunduğu anlatımı adlandırır. Fransızcada simgesel anlatıyı karşılayan kelime, Türkçeye alegori olarak geçer. Soyut bir düşüncenin kişiler ve olaylar içinde görünür olması, bu başka türlü söyleme fikrini sürdürür.","firstAttestation":{"source":"Hüseyin Rahmi Gürpınar — Kokotlar Mektebi","period":"1927","form":"alegorik"},"relatives":[{"word":"alofon","relation":"akraba"},{"word":"alomorf","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"alegori maddesi","url":"https://www.nisanyansozluk.com/kelime/alegori"},{"name":"TDK Güncel Türkçe Sözlük","ref":"alegori maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ambiyans","word":"ambiyans","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"ine","chain":[{"language":"ine","form":"h₁ei̯- (ei̯-)","meaning":"gitmek","period":null,"reconstructed":true},{"language":"la","form":"ire, it-","meaning":"ilerlemek, yol boyunca gitmek","period":null,"reconstructed":false},{"language":"la","form":"ambi+","meaning":"iki yanda, her iki tarafta","period":null,"reconstructed":false},{"language":"la","form":"ambire, ambit-","meaning":"çevresinde gezinmek, dolanmak","period":null,"reconstructed":false},{"language":"la","form":"ambientia","meaning":"dolanma ve dolaşım","period":null,"reconstructed":false},{"language":"fr","form":"ambiance","meaning":"çevreyi oluşturan ortam ve hava","period":null,"reconstructed":false},{"language":"tr","form":"ambiyans","meaning":"bir ortamın hissedilen tarzı ve havası","period":null,"reconstructed":false}],"shortMeaning":"Bir ortamın kendine özgü havası ve tarzı.","currentMeaning":"Bir yerin veya ortamın bütününden hissedilen kendine özgü tarz ve hava.","story":"Kelimenin uzak başlangıcında gitme hareketi vardır. Latincede bu hareket, iki yanı anlatan ambi ile birleşerek çevrede dolanma fikrine dönüşür. Fransızca ambiance aşamasında hareketin yerini insanı çevreleyen ortam ve onun havası alır. Türkçede ambiyans, bir yerdeki ışığın, sesin ve düzenin birlikte hissettirdiği tarzı anlatır.","firstAttestation":{"source":"Milliyet gazetesi","period":"1954","form":"Ambiyansını"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ambiyans maddesi","url":"https://www.nisanyansozluk.com/kelime/ambiyans"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ambiyans maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"anakronizm","word":"anakronizm","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"anachronisme","meaning":"bir şeyi ait olmadığı zamana yerleştirme","period":null,"reconstructed":false},{"language":"tr","form":"anakronizm","meaning":"bir şeyi ait olmadığı zamana yerleştirme","period":null,"reconstructed":false}],"shortMeaning":"Bir olayı veya unsuru yanlış döneme yerleştirme.","currentMeaning":"Bir olayın tarihini yanlış belirleme veya bir unsuru ait olmadığı tarihsel döneme yerleştirme yanılgısı.","story":"Fransızca anachronisme, olaylarla onların zamanı arasındaki uyuşmazlığı adlandırır. Türkçeye anakronizm olarak alınan kelime, bir şeyin tarih içindeki yerinin karıştırılmasını anlatır. Henüz icat edilmemiş bir aracı eski bir dönemin sahnesine koymak, bu zaman kaymasının somut bir örneğidir.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"anakronizm maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"analoji","word":"analoji","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"analogía","meaning":"benzerlik kurarak karşılaştırma","period":null,"reconstructed":false},{"language":"fr","form":"analogie","meaning":"benzerlik kurarak karşılaştırma","period":null,"reconstructed":false},{"language":"tr","form":"analoji","meaning":"benzer özellikler üzerinden ilişki kurma","period":null,"reconstructed":false}],"shortMeaning":"Benzer özelliklerden hareketle ilişki kurma.","currentMeaning":"İki şeyin benzer özelliklerinden veya ilişkilerinden hareketle aralarında karşılaştırma ve benzeşim kurma.","story":"Eski Yunanca analogía, iki şeyi karşılaştırıp aralarında benzerlik kurma düşüncesini taşır. Fransızcada analogie biçiminde sürdürülen bu düşünce, Türkçeye analoji adıyla geçer. Bilinmeyen bir işleyişi bilinen başka bir işleyişle yan yana getirerek açıklamak, kelimenin anlattığı zihinsel harekettir.","firstAttestation":{"source":"Eşref Edib — Darülfünun Dersleri","period":"1910","form":"analogie"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"analoji maddesi","url":"https://www.nisanyansozluk.com/kelime/analoji"},{"name":"TDK Güncel Türkçe Sözlük","ref":"analoji maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"anekdot","word":"anekdot","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"dídōmi, do-","meaning":"vermek","period":null,"reconstructed":false},{"language":"grc","form":"ékdotos","meaning":"dışarı verilmiş, yayıma sunulmuş","period":null,"reconstructed":false},{"language":"grc","form":"anékdotos","meaning":"yayımlanmamış anlatı, söylenti","period":null,"reconstructed":false},{"language":"fr","form":"anecdote","meaning":"bir kişinin yaşadıklarına ilişkin kısa gerçek anlatı","period":null,"reconstructed":false},{"language":"tr","form":"anekdot","meaning":"kısa ve dikkat çekici hikâye","period":null,"reconstructed":false}],"shortMeaning":"Bir kişi veya olayla ilgili kısa hikâye.","currentMeaning":"Bir kişi veya olay hakkında anlatılan kısa, dikkat çekici hikâye.","story":"Eski Yunancada verme eyleminden türeyen ékdotos, bir metnin dışarıya verilmesini, yani yayımlanmasını anlatır. Bunun olumsuzu anékdotos, yayımlanmamış anlatılar ve söylentiler için kullanılır. Fransızcada anecdote, bir kişinin hayatından aktarılan kısa gerçek hikâyeye yönelir. Türkçedeki anekdotta da kısa hikâye öne çıkar; yayımlanmamış olma şartı kalmaz.","firstAttestation":{"source":"Peyami Safa","period":"1936","form":"anekdot"},"relatives":null,"alternatives":null,"funFact":"Kelimenin yayılmasında, Bizans sarayının dedikodularını anlatan Prokopios'un Anekdota adlı eserinin adı rol oynadı.","sources":[{"name":"Nişanyan Sözlük","ref":"anekdot maddesi","url":"https://www.nisanyansozluk.com/kelime/anekdot"},{"name":"TDK Güncel Türkçe Sözlük","ref":"anekdot maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"angajman","word":"angajman","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"engagement","meaning":"bağlanma, yükümlülük üstlenme","period":null,"reconstructed":false},{"language":"tr","form":"angajman","meaning":"bir iş veya tarafla kurulan bağlılık","period":null,"reconstructed":false}],"shortMeaning":"Bir iş veya tarafla kurulan bağlantı ve bağlılık.","currentMeaning":"Bir iş, görüş veya tarafla kurulan bağlantı ve bunun getirdiği bağlılık.","story":"Fransızca engagement, bir işe bağlanmayı ve onun yükümlülüğünü üstlenmeyi anlatır. Türkçeye angajman olarak geçen kelime, bu bağlanma fikrini korur. Bir kişi ya da kurumun bir işle kurduğu ilişkiyi, o ilişkinin getirdiği bağlılıkla birlikte adlandırır.","firstAttestation":null,"relatives":[{"word":"angaje","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"angajman maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"antitez","word":"antitez","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"grc","chain":[{"language":"grc","form":"thésis","meaning":"koyma, ortaya yerleştirme","period":null,"reconstructed":false},{"language":"grc","form":"antíthesis","meaning":"koyma, ortaya yerleştirme","period":null,"reconstructed":false},{"language":"fr","form":"antithèse","meaning":"bir savın karşısına konan sav","period":null,"reconstructed":false},{"language":"tr","form":"antitez","meaning":"bir savı karşılayan karşıt sav","period":null,"reconstructed":false}],"shortMeaning":"Bir savın karşısına konan karşıt sav.","currentMeaning":"Bir düşünce veya savın karşısında yer alan, ona karşı ileri sürülen sav.","story":"Eski Yunanca thésis, bir şeyi koyma ve ortaya yerleştirme hareketini anlatır. Antíthesis biçiminde bu yerleştirme karşı karşıya getirme yönü kazanır. Fransızca antithèse üzerinden Türkçeye geçen antitezde, karşıya konan şey artık bir düşünce veya savdır.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1938","form":"antitez"},"relatives":[{"word":"tez","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"antitez maddesi","url":"https://www.nisanyansozluk.com/kelime/antitez"},{"name":"TDK Güncel Türkçe Sözlük","ref":"antitez maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"arketip","word":"arketip","rarity":"az-bilinen","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"en","ultimateOrigin":"grc","chain":[{"language":"grc","form":"arχétypos","meaning":"ilk örnek, model","period":null,"reconstructed":false},{"language":"en","form":"archetype","meaning":"ilk örnek; Jung psikolojisinde temel örüntü","period":null,"reconstructed":false},{"language":"tr","form":"arketip","meaning":"kök örnek","period":null,"reconstructed":false}],"shortMeaning":"Başka örneklerin temelinde bulunan ilk model.","currentMeaning":"Sonraki örneklere temel oluşturan model; Jung psikolojisinde ortak ruhsal örüntü.","story":"Eski Yunancadaki arχétypos, başka örneklerin kendisine bakılarak kurulacağı başlangıç modelini adlandırıyordu. Bu ilk örnek düşüncesi, İngilizcede Jung psikolojisinin temel ruhsal örüntülerini de anlatmaya başladı. Türkçeye doğrudan hangi dilden geçtiği konusunda İngilizce ve Fransızca açıklamaları ayrışsa da kelime bugün görünen örneklerin ardındaki ortak modeli düşündürür.","firstAttestation":{"source":"Orta Öğretim Psikoloji, Sosyoloji, Mantık, Felsefe ve Pedagoji Terimleri","period":"1952","form":"Arketip"},"relatives":null,"alternatives":["Nişanyan Sözlük doğrudan veren dili İngilizce olarak gösterirken TDK Güncel Türkçe Sözlük Fransızca archétype biçimini verir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"arketip maddesi","url":"https://www.nisanyansozluk.com/kelime/arketip"},{"name":"TDK Güncel Türkçe Sözlük","ref":"arketip maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"avangart","word":"avangart","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fr","chain":[{"language":"fr","form":"avant-garde","meaning":"öncü birlik; yeniliklere öncülük eden","period":null,"reconstructed":false},{"language":"tr","form":"avangart","meaning":"sanatta ve düşüncede yeniliklere öncülük eden","period":null,"reconstructed":false}],"shortMeaning":"Sanatta ve düşüncede alışılmışın önüne geçen, öncü.","currentMeaning":"Yerleşmiş anlayışları aşarak yeni ifade biçimleri deneyen ve yeniliklere öncülük eden.","story":"Fransızca avant-garde, ordunun önünde ilerleyen birliği adlandırır. Bu önden gitme görüntüsü sanat ve düşünce alanına taşındığında, başkalarının henüz denemediği yolları açanların niteliği oldu. Türkçede avangart da yeniliği ilk deneyen eserleri ve yaklaşımları anlatır.","firstAttestation":null,"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"avangart maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"banal","word":"banal","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"fro","chain":[{"language":"fro","form":"ban/bandon","meaning":"yargılama yetkisi, yasak","period":null,"reconstructed":false},{"language":"fr","form":"banal","meaning":"feodal yetkiye bağlı; sıradan halktan, bayağı","period":null,"reconstructed":false},{"language":"tr","form":"banal","meaning":"yaygın ve alışılmış, özgünlüğü olmayan","period":null,"reconstructed":false}],"shortMeaning":"Çok kullanıldığı için özgünlüğünü yitirmiş, sıradan.","currentMeaning":"Herkesin bildiği veya kullandığı, alışılmışlığı yüzünden özgün görünmeyen.","story":"Banalin geçmişinde, Eski Fransızcada yasak koyma ve yargılama yetkisini anlatan ban/bandon bulunur. Fransızca banal önce feodal yetkiye bağlı olanı, ardından soylu sayılmayan halk tabakasını niteledi. Toplumsal konum bildiren bu değerlendirme zamanla sıradanlık yargısına dönüştü; Türkçede de özgün görünmeyen sözlere ve düşüncelere uygulanır.","firstAttestation":{"source":"Hüseyin Rahmi Gürpınar","period":"<1930","form":"banal"},"relatives":[{"word":"banalite","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"banal maddesi","url":"https://www.nisanyansozluk.com/kelime/banal"},{"name":"TDK Güncel Türkçe Sözlük","ref":"banal maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"bohem","word":"bohem","rarity":"az-bilinen","partOfSpeech":"sıfat","formationType":"alıntı","donorLanguage":"fr","ultimateOrigin":"la","chain":[{"language":"la","form":"Boiohaemum","meaning":"Boii adlı Kelt topluluğunun ülkesi","period":null,"reconstructed":false},{"language":"fr","form":"Bohême","meaning":"Bohemya adlı Orta Avrupa bölgesi","period":null,"reconstructed":false},{"language":"fr","form":"bohème","meaning":"Bohemyalı; Roman; düzensiz yaşayan sanatçı","period":null,"reconstructed":false},{"language":"tr","form":"bohem","meaning":"geleceği düşünmeden, düzensiz ve tasasız yaşayan","period":null,"reconstructed":false}],"shortMeaning":"Geleceği dert etmeden, düzensiz ve tasasız yaşayan.","currentMeaning":"Geçim ve gelecek kaygısını geri plana atarak günübirlik, serbest ve düzensiz bir hayat süren kişi veya topluluğu niteleyen.","story":"Bohemin yolculuğu, Boii adlı Kelt topluluğunun yurdunu adlandıran Latince Boiohaemum ile başlar. Bu yer adı Fransızcada Bohême biçimini aldı; bohème de önce o ülkeyle ilişkilendirilen insanları, sonra Romanları adlandırdı. Kelime daha sonra yerleşik hayatın düzenine uymayan sanatçılara yöneldi. Türkçede ülke bağlantısı silikleşerek tasasız ve düzensiz bir yaşayışın niteliği öne çıktı.","firstAttestation":{"source":"Cumhuriyet gazetesi","period":"1930","form":"Bohem"},"relatives":null,"alternatives":null,"funFact":null,"sources":[{"name":"N
