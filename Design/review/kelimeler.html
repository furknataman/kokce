Gömülmek üzere hazırlanmış insan ölüsü.","currentMeaning":"Kefenlenerek tabuta yerleştirilmiş ve defin için hazırlanmış insan ölüsü.","story":"Cenazenin uzak geçmişinde Orta Farsçanın hazine ve gömü çevresindeki kelimeleri bulunur. Arapçada ve Farsçada kullanılan cināza ise ölünün konduğu tabuta ad olmuştur. Türkçedeki cenaze, bu taşıyıcı nesnenin adını onun içindeki, gömülmeye hazırlanmış insana taşır.","firstAttestation":{"source":"Rabguzi — Kısasü'l-Enbiya tercümesi","period":"1310","form":"cenāzesiŋe"},"relatives":[],"alternatives":["Nişanyan Sözlük cināza biçimini Arapça ve Farsça olarak birlikte kaydeder, Türkçeye veren dil bu iki seçenek arasında kesinleşmez."],"funFact":"Aramice ginzā ve gənīzā biçimleri, gömü ve saklı değer anlamlarıyla cenazenin uzak akrabalarıdır.","sources":[{"name":"Nişanyan Sözlük","ref":"cenaze maddesi","url":"https://www.nisanyansozluk.com/kelime/cenaze"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cenaze maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"merasim","word":"merasim","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"marāsim","meaning":"yerine getirilen resmî işlemler ve törenler","period":null,"reconstructed":false},{"language":"tr","form":"merasim","meaning":"belirli usullerle yapılan tören","period":"16. yy","reconstructed":false}],"shortMeaning":"Belirli usullere göre düzenlenen tören.","currentMeaning":"Bir olay veya kişi için belirlenmiş kurallara ve sıraya göre gerçekleştirilen törensel etkinlik.","story":"Merasimin Arapçadaki biçimi marāsim, hem resmî işlemleri hem de törenleri kapsıyordu. Türkçedeki eski kullanımında da bir saltanatın gerektirdiği işlemlerin yerine getirilmesi anlatılıyordu. Bugünkü törende korunan bağ, hareketlerin ve uygulamaların belirli bir usule göre yürütülmesidir.","firstAttestation":{"source":"Hoca Sadeddin Efendi — Tacü't-Tevârih","period":"1574","form":"merāsimini"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"merasim maddesi","url":"https://www.nisanyansozluk.com/kelime/merasim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"merasim maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ameliyat","word":"ameliyat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁamaliyya(t)","meaning":"uygulanan işlem","period":null,"reconstructed":false},{"language":"ar","form":"ˁamaliyyāt","meaning":"uygulanan işlemler","period":null,"reconstructed":false},{"language":"tr","form":"ameliyat","meaning":"cerrahi tedavi işlemi","period":"19. yy","reconstructed":false}],"shortMeaning":"Tedavi amacıyla yapılan cerrahi işlem.","currentMeaning":"Bir hastalığı veya yaralanmayı tedavi etmek için beden üzerinde kesme, çıkarma ya da dikme gibi yöntemlerle yapılan cerrahi müdahale.","story":"Ameliyat başlangıçta yalnızca cerrahın yaptığı işe ayrılmış bir ad değildi. Arapça ˁamaliyya tek bir işlemi, ˁamaliyyāt ise işlemleri karşılıyordu. Türkçede cerrahi işlemleri belirten ameliyatı cerrahiye ifadesinin ikinci bölümü kullanılmaz olunca, ameliyat tek başına bugünkü tıbbi anlamı üstlendi.","firstAttestation":{"source":"Ahmed Vefik Paşa — Lehce-i Osmani","period":"1876","form":"ˁameliyāt"},"relatives":[{"word":"ameliye","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ameliyat maddesi","url":"https://www.nisanyansozluk.com/kelime/ameliyat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ameliyat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"muayene","word":"muayene","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁayn","meaning":"görme organı, göz","period":null,"reconstructed":false},{"language":"ar","form":"muˁāyana(t)","meaning":"bir şeyi kendi gözüyle görme","period":null,"reconstructed":false},{"language":"tr","form":"muayene","meaning":"sağlık durumunu araştıran inceleme","period":"14. yy","reconstructed":false}],"shortMeaning":"Sağlık durumunu belirlemek için yapılan inceleme.","currentMeaning":"Bir kişinin sağlık durumunu ve varsa hastalığını belirlemek amacıyla hekim tarafından incelenmesi.","story":"Muayenenin merkezinde Arapça ˁayn, yani göz vardır. Ondan türeyen muˁāyana, bir şeyi başkasından duymak yerine kendi gözüyle görme fikrini taşır. Türkçede bu doğrudan görüp inceleme düşüncesi, hastanın durumunu araştıran hekimin yaptığı işe de ad oldu.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"muˁāyana"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"muayene maddesi","url":"https://www.nisanyansozluk.com/kelime/muayene"},{"name":"TDK Güncel Türkçe Sözlük","ref":"muayene maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kahve","word":"kahve","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":null,"chain":[{"language":"ar","form":"ḳahwa(t)","meaning":"eskiden koyu madde ve özsu; kahve içeceği","period":null,"reconstructed":false},{"language":"tr","form":"kahve","meaning":"kahve ağacı; tohumlarından hazırlanan içecek","period":"16. yy","reconstructed":false}],"shortMeaning":"Tohumlarından kahve içeceği hazırlanan sıcak iklim ağacı.","currentMeaning":"Sıcak bölgelerde yetişen, tohumları kavrulup öğütülerek içecek hazırlamada kullanılan Coffea arabica ağacı.","story":"Arapça ḳahwa adının eski anlam alanında koyu maddeler ve özsular bulunur; kelime daha sonra kahve tohumlarından hazırlanan içeceği de adlandırır. Türkçede kahve adı hem fincandaki içeceğe hem onun elde edildiği ağaca uzanır. Arapça biçimin daha eski kaynağı kesin değildir; Etiyopya dillerinden bir kelimeyle veya oradaki bir yer adıyla bağlantı kurulmuştur.","firstAttestation":{"source":"Meşâirü'ş-şuarâ","period":"1568","form":"ḳaḥve-ḫāne"},"relatives":[{"word":"kahvehane","relation":"birleşik"}],"alternatives":["Nişanyan Sözlük, Arapça kelimenin etimolojisini belirsiz sayar ve daha eski kaynağı için bir Etiyopya dili veya Etiyopya'daki bir yer adı önerildiğini aktarır."],"funFact":"Kahvenin adı, 17. yüzyılda bir kürkün rengini anlatmak için de kullanılıyordu.","sources":[{"name":"Nişanyan Sözlük","ref":"kahve maddesi","url":"https://www.nisanyansozluk.com/kelime/kahve"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kahve maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"baharat","word":"baharat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"bahārāt","meaning":"yiyeceklere koku ve tat katan maddeler","period":null,"reconstructed":false},{"language":"tr","form":"baharat","meaning":"yemeği kokulandırıp tatlandıran maddeler","period":null,"reconstructed":false}],"shortMeaning":"Yiyecek ve içeceklere koku ve tat katan maddeler.","currentMeaning":"Tarçın, karanfil veya karabiber gibi, yiyeceklerin ve içeceklerin kokusunu ve tadını zenginleştirmek için eklenen maddelerin ortak adı.","story":"Baharat, Arapça bahārāt adıyla Türkçeye taşınırken mutfaktaki görevini korudu. Birbirinden farklı tarçın, karanfil ve karabiber gibi maddeler, yemeğe koku ve tat katmaları sayesinde aynı adın altında buluşur. Kelimenin Türkçedeki anlamı da tek bir bitkiye değil, bu ortak kullanıma dayanır.","firstAttestation":null,"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"baharat maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"şerbet","word":"şerbet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şaraba","meaning":"içmek","period":null,"reconstructed":false},{"language":"ar","form":"şarba(t)","meaning":"bir içimlik miktar; içilen şey","period":null,"reconstructed":false},{"language":"tr","form":"şerbet","meaning":"tatlı içecek; tatlılara dökülen şekerli sıvı","period":"14. yy","reconstructed":false}],"shortMeaning":"Tatlıları ıslatmak için hazırlanan şekerli sıvı.","currentMeaning":"Baklava gibi hamur tatlılarına dökülmek üzere su ve şekerin kaynatılmasıyla hazırlanan sıvı.","story":"Şerbetin başlangıcında şekerden önce içme eylemi vardır: Arapça şaraba bu hareketi anlatır. Ondan türeyen şarba, bir içimlik miktarı ve içilecek şeyi adlandırır. Türkçede şerbet tatlı bir içecek olarak yaşarken, baklava gibi tatlıların üzerine dökülen şekerli sıvının da adı oldu.","firstAttestation":{"source":"Aşık Paşa — Garib-name","period":"1330","form":"şerbet"},"relatives":[{"word":"şurup","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"şerbet maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Ferbet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şerbet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şurup","word":"şurup","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şaraba","meaning":"içmek","period":null,"reconstructed":false},{"language":"ar","form":"şurb","meaning":"içme eylemi; içilen şey","period":null,"reconstructed":false},{"language":"tr","form":"şurup","meaning":"şekerli sıvı, şerbet","period":"15. yy","reconstructed":false}],"shortMeaning":"Şekerli suyla hazırlanan sıvı; şerbet.","currentMeaning":"Şekerin suda çözündürülmesiyle hazırlanan ve şerbet olarak da adlandırılan tatlı sıvı.","story":"Şurubun geçmişinde Arapça şaraba fiilinin anlattığı içme hareketi bulunur. Eski şurb biçimi, hem içmeyi hem de içilen şeyi kapsarken Türkçedeki şurup şekerli sıvıyı adlandırır. Türkçeye kaynak olan Arapça biçimin şurb veya şurūb olarak gösterilmesi konusunda sözlük kayıtları farklılaşır.","firstAttestation":{"source":"Lugat-i Halimi","period":"1477","form":"şurb"},"relatives":[{"word":"şerbet","relation":"eş köken"}],"alternatives":["Nişanyan Sözlük alıntının kaynağını Arapça şurb olarak gösterirken TDK Güncel Türkçe Sözlük Arapça şurūb biçimini verir; Nişanyan ayrıca 1835 tarihli Türkçe şurūb tanıklığını aktarır."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"şurup maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Furup"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şurup maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"helva","word":"helva","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥalab","meaning":"süt","period":null,"reconstructed":false},{"language":"ar","form":"ḥalwāˀ","meaning":"çeşitli tatlılar ve şekerlemeler","period":null,"reconstructed":false},{"language":"tr","form":"helva","meaning":"şeker ve yağla hazırlanan bir tatlı türü","period":"11. yy","reconstructed":false}],"shortMeaning":"Şeker, yağ ve un ya da irmikle hazırlanan tatlı.","currentMeaning":"Un veya irmik gibi bir malzemenin yağ ve şekerle işlenmesiyle hazırlanan tatlı.","story":"Helva adının geçmişinde süt ile tatlılık arasında kurulmuş bir bağ vardır. Arapça ḥalab sütü adlandırırken onunla bağlantılı ḥalwāˀ, tek bir tariften daha geniş bir tatlılar dünyasını kapsar. Türkçeye geçen ad, un veya irmikle hazırlananlar gibi belirli tatlı çeşitlerinde yerleşti.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"ḥalva"},"relatives":[],"alternatives":null,"funFact":"Tatlıyı sütle birleştiren aynı düşünce, Eski Türkçe süçig ile Farsça şīrīn kelimelerinde de görülür.","sources":[{"name":"Nişanyan Sözlük","ref":"helva maddesi","url":"https://www.nisanyansozluk.com/kelime/helva"},{"name":"TDK Güncel Türkçe Sözlük","ref":"helva maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"lokma","word":"lokma","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"laḳama","meaning":"yutmak","period":null,"reconstructed":false},{"language":"ar","form":"luḳma(t)","meaning":"bir ağız dolusu yiyecek veya içecek","period":null,"reconstructed":false},{"language":"tr","form":"lokma","meaning":"bir defada ağza alınan yiyecek miktarı","period":"14. yy","reconstructed":false}],"shortMeaning":"Bir defada ağza alınan yiyecek parçası.","currentMeaning":"Yemek yerken ağıza tek seferde alınabilecek büyüklükteki yiyecek parçası.","story":"Lokma, Arapça laḳama fiilindeki yutma hareketinden doğar. Luḳma adı, yiyeceği türüne göre değil, ağza bir defada alınan miktarına göre ayırır. Türkçede de aynı ölçü korunur: Ekmek de başka bir yemek de ağızdaki tek parçasıyla lokma olur.","firstAttestation":{"source":"Anonim — Mukaddimetü'l-Edeb tercümesi","period":"1300","form":"loḳmanı"},"relatives":[],"alternatives":null,"funFact":"Lokma adı, 1533 tarihli bir Türkçe-İtalyanca kayıtta hamur kızartması için de kullanılmıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"lokma maddesi","url":"https://www.nisanyansozluk.com/kelime/lokma"},{"name":"TDK Güncel Türkçe Sözlük","ref":"lokma maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kadayıf","word":"kadayıf","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳaṭīfa(t)","meaning":"yüzeydeki hav, küçük kırpıntılar veya kaymak","period":null,"reconstructed":false},{"language":"ar","form":"ḳaṭāˀif","meaning":"ince hamurlu tatlı, baklava","period":null,"reconstructed":false},{"language":"tr","form":"kadayıf","meaning":"ince hamurdan hazırlanan tatlı malzemesi","period":"15. yy","reconstructed":false}],"shortMeaning":"Tel veya yuvarlak biçimde hazırlanan ince hamur malzemesi.","currentMeaning":"Akışkan, az mayalı hamurun sıcak sac üzerinde ince teller veya yuvarlak parçalar hâlinde kurutulmasıyla elde edilen tatlı malzemesi.","story":"Kadayıfın geçmişinde yalnızca hamur değil, hav, kırpıntı ve sütün üstünden alınan kaymak da vardır. Bu nesneleri adlandıran Arapça ḳaṭīfa ile bağlantılı ḳaṭāˀif, ince hamurlu tatlıların adı olarak kullanılmıştır. Türkçedeki kadayıf adı da tel biçimindeki hamurla sınırlı kalmamış, kaymaklı ve ekmekli tatlı çeşitlerine uzanmıştır.","firstAttestation":{"source":"Lugat-i Halimi","period":"1477","form":"kaṭāif"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kadayıf maddesi","url":"https://www.nisanyansozluk.com/kelime/kaday%C4%B1f"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kadayıf maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tahin","word":"tahin","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṭaḥana","meaning":"öğütmek","period":null,"reconstructed":false},{"language":"ar","form":"ṭaḥīn","meaning":"öğütülmüş ürün, un","period":null,"reconstructed":false},{"language":"tr","form":"tahin","meaning":"öğütülmüş susam ezmesi","period":"17. yy","reconstructed":false}],"shortMeaning":"Kavrulmuş susamın öğütülmesiyle hazırlanan yağlı ezme.","currentMeaning":"Kavrulan susam tohumlarının öğütülmesiyle elde edilen, yoğun kıvamlı ve yağ bakımından zengin yiyecek.","story":"Tahinin adında önce susam değil, öğütme işi vardır. Arapça ṭaḥana fiilinden türeyen ṭaḥīn, öğütmenin ürünü olan unu adlandırır. Türkçede eski kayıtlarda un karşılığını koruyan kelime, daha sonra öğütülmüş susama özgüleşerek bugün bildiğimiz yağlı ezmenin adı oldu.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"ṭaḥīn"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tahin maddesi","url":"https://www.nisanyansozluk.com/kelime/tahin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tahin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"zeytin","word":"zeytin","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"arc","chain":[{"language":"arc","form":"zeytā","meaning":"zeytin ve zeytinden elde edilen yağ","period":null,"reconstructed":false},{"language":"ar","form":"zayt","meaning":"zeytin ve zeytinyağı","period":null,"reconstructed":false},{"language":"ar","form":"zaytūn","meaning":"zeytinin meyveleri","period":null,"reconstructed":false},{"language":"tr","form":"zeytin","meaning":"zeytin ağacı ve meyvesi","period":"14. yy","reconstructed":false}],"shortMeaning":"Akdeniz'de yetişen, yağlı meyveler veren uzun ömürlü ağaç.","currentMeaning":"Akdeniz çevresinde yetişen, gümüşi yapraklı ve yağ elde edilen meyvelere sahip, uzun ömürlü Olea europaea ağacı.","story":"Zeytinin adı, Doğu Akdeniz'de meyve ile ondan çıkarılan yağın çevresinde dolaşır. Aramice zeytā ve Arapça zayt bu ikisini birlikte adlandırırken, Arapça zaytūn meyve tanelerini öne çıkarır; Türkçe zeytin de bu biçimden alınmıştır. İbranice ve Fenike dilindeki benzerleri kelimenin akrabalarıdır. Daha uzak kaynağının bölgedeki Sami dillerinden önce konuşulmuş bir dil olması önerilir, ancak bu dil kesin olarak belirlenmiş değildir.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"zeytin"},"relatives":[{"word":"zeytinlik","relation":"türev"},{"word":"zeytinci","relation":"türev"}],"alternatives":["Nişanyan Sözlük, kelimenin nihai kaynağını Doğu Akdeniz'de Sami dillerinden önce konuşulan, adı belirlenmemiş bir dilin kalıntısı olarak değerlendirir."],"funFact":"Orta Farsça zayt ile Ermenice tsét biçimleri de bu adı Aramiceden almıştır.","sources":[{"name":"Nişanyan Sözlük","ref":"zeytin maddesi","url":"https://www.nisanyansozluk.com/kelime/zeytin"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zeytin maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"salep","word":"salep","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"s̱aˁlab","meaning":"tilki","period":null,"reconstructed":false},{"language":"ar","form":"ḫuṣyatu's̱-s̱aˁlab","meaning":"tilkinin testisi; benzetmeyle orkide","period":null,"reconstructed":false},{"language":"tr","form":"salep","meaning":"yumrulu bir orkide türü","period":null,"reconstructed":false}],"shortMeaning":"Toprak altında yumruları bulunan bir orkide.","currentMeaning":"Salepgillerden, toprak altında yumru oluşturan ve çiçekleri salkım ya da başak biçiminde toplanan Orchis cinsi bitki.","story":"Salebin adlandırılmasında bitkinin toprak altındaki yumrularıyla bir hayvanın organı arasında kurulan benzerlik öne çıkar. Bir açıklama, Arapça tilki adını taşıyan ve tilkinin testisini belirten bitki adının Türkçede kısalarak salep olduğunu anlatır. Bununla birlikte, Türkçeye kaynak gösterilen Arapça biçim konusunda sözlükler ayrılır; başka bir kayıt doğrudan saḥleb biçimini verir.","firstAttestation":{"source":"Hızır Paşa — Müntehab-ı Şifa","period":"1410'dan önce","form":"ṣaˁleb"},"relatives":[{"word":"salepçi","relation":"türev"}],"alternatives":["Nişanyan Sözlük, salebi Arapça ḫuṣyatu's̱-s̱aˁlab ifadesinin kısalmış biçimiyle açıklar ve modern Arapçadaki ilgili yazımları Türkçeden geri alıntı sayar.","TDK Güncel Türkçe Sözlük, doğrudan kaynak olarak Arapça saḥleb biçimini gösterir."],"funFact":"Anadolu ağızlarında aynı bitki için it taşağı adı da kullanılır.","sources":[{"name":"Nişanyan Sözlük","ref":"salep maddesi","url":"https://www.nisanyansozluk.com/kelime/salep"},{"name":"TDK Güncel Türkçe Sözlük","ref":"salep maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mutfak","word":"mutfak","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṭabaḫa","meaning":"pişirme işini yaptı","period":null,"reconstructed":false},{"language":"ar","form":"maṭbaḫ","meaning":"yemeğin pişirildiği bölüm","period":null,"reconstructed":false},{"language":"tr","form":"mutfak","meaning":"yemek hazırlama ve pişirme yeri","period":null,"reconstructed":false}],"shortMeaning":"Yemek hazırlanan ve pişirilen yer.","currentMeaning":"Bir evde veya işletmede yiyeceklerin hazırlanıp pişirildiği bölüm.","story":"Arapçada pişirme eylemini anlatan ṭabaḫa, bu işin yapıldığı yere ad olan maṭbaḫ biçiminin temelidir. Türkçeye geçen bu ad, zamanla mutfak biçimini aldı. Ocak başında yapılan iş, böylece evin bir bölümünün adına dönüştü.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"matbaḫ"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mutfak maddesi","url":"https://www.nisanyansozluk.com/kelime/mutfak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mutfak maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tabak","word":"tabak","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"pal","chain":[{"language":"pal","form":"tābag","meaning":"tava veya tepsi türünden kap","period":null,"reconstructed":false},{"language":"ar","form":"ṭabaḳ/tābaḳ","meaning":"tava, tepsi veya tencereyi örten kapak","period":null,"reconstructed":false},{"language":"tr","form":"tabak","meaning":"yiyecek sunulan yayvan kap","period":null,"reconstructed":false}],"shortMeaning":"Yiyecek koymak ve sunmak için kullanılan yayvan kap.","currentMeaning":"Yemeğin servis edildiği veya içinden yenildiği, çoğunlukla yuvarlak ve sığ kap.","story":"Orta Farsçada tābag, tava ve tepsi gibi kapların adıydı. Arapçaya geçtiğinde kullanım alanı tencere kapağını da kapsıyordu. Türkçede ise ad, özellikle sofraya konulan sığ yemek kabında yerleşti; pişirme ve kapatma işlerinden yemek sunmaya doğru daraldı.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"tabac"},"relatives":[{"word":"tava","relation":"eş köken"},{"word":"tabaklık","relation":"türev"}],"alternatives":null,"funFact":"Deri işleyen ustanın adı olan tabak, yemek kabıyla ilgisiz başka bir Arapça kelimeden doğmuştur.","sources":[{"name":"Nişanyan Sözlük","ref":"tabak ve tabak2 maddeleri","url":"https://www.nisanyansozluk.com/kelime/tabak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tabak maddesi, yemek kabı anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"tas","word":"tas","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṭās","meaning":"içme veya sıvı koyma kabı","period":null,"reconstructed":false},{"language":"tr","form":"tas","meaning":"özellikle sıvılar için kullanılan çukur kap","period":null,"reconstructed":false}],"shortMeaning":"Su ve benzeri sıvıların konulduğu çukur kap.","currentMeaning":"Genellikle metalden yapılan, içine su, çorba veya başka sıvılar konulan kap.","story":"Arapça ṭās, içecek ve başka sıvıları içine alan kadeh ya da çanak türündeki kapları adlandırıyordu. Türkçede tas, bu somut işlevi koruyarak su ve çorba gibi sıvılarla kullanılan kabın adı oldu. Hamam tasından çorba tasına uzanan kullanımlarda ortak olan, sıvıyı elde taşınabilir bir kapta tutmaktır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"tas"},"relatives":[{"word":"kafatası","relation":"birleşik"}],"alternatives":null,"funFact":"Fransızca tasse ve İspanyolca taza da tas ile aynı Arapça kap adını paylaşır.","sources":[{"name":"Nişanyan Sözlük","ref":"tas maddesi","url":"https://www.nisanyansozluk.com/kelime/tas"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tas maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sahan","word":"sahan","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṣaḥn","meaning":"geniş ve yayvan kap; avlu veya açık alan","period":null,"reconstructed":false},{"language":"tr","form":"sahan","meaning":"yemek için kullanılan sığ kap","period":null,"reconstructed":false}],"shortMeaning":"Yemek pişirmede veya sunmada kullanılan sığ kap.","currentMeaning":"Genellikle metalden yapılan, derinliği az, içinde yemek pişirilebilen veya sunulabilen kap.","story":"Arapça ṣaḥn, genişçe açılan bir yemek kabını da bir evin avlusunu da adlandırıyordu. Kabın yayvan yüzeyi ile avlunun açık alanı aynı kelimenin iki kullanımında yan yana duruyordu. Türkçede sahan, bu anlamlardan yemek kabını yaşattı.","firstAttestation":{"source":"Yazıcızade Ali — Tarih-i Âl-i Selçuk","period":"1423","form":"saḥnları"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sahan maddesi","url":"https://www.nisanyansozluk.com/kelime/sahan"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sahan maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ibrik","word":"ibrik","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"pal","chain":[{"language":"pal","form":"rēḫtan","meaning":"bir sıvıyı dökmek","period":null,"reconstructed":false},{"language":"pal","form":"āb","meaning":"su; bileşiğin ilk unsuru","period":null,"reconstructed":false},{"language":"pal","form":"ābrīk","meaning":"su dökmeye yarayan nesne","period":null,"reconstructed":true},{"language":"ar","form":"ibrīḳ","meaning":"boynu uzun su kabı","period":null,"reconstructed":false},{"language":"tr","form":"ibrik","meaning":"kulplu ve emzikli su kabı","period":null,"reconstructed":false}],"shortMeaning":"Suyu emziğinden dökmeye yarayan kulplu kap.","currentMeaning":"Su taşımak ve kontrollü biçimde dökmek için kullanılan, kulpu ve emziği bulunan kap.","story":"İbriğin gerisinde, Orta Farsçada suyu anlatan āb ile dökme eylemini anlatan rēḫtan birleşir. Bu birleşik ad, kabı görünüşünden önce yaptığı işle, su dökmesiyle tanımlar. Arapçada ibrīḳ biçimi uzun boyunlu bir su kabına yerleşti ve Türkçeye geçti. Bugünkü ibrik de suyu emziğinden akıtarak adındaki eski işi sürdürür.","firstAttestation":{"source":"Kaşgarî — Divan-i Lugati't-Türk","period":"1073","form":"ıvrıḳ"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ibrik maddesi","url":"https://www.nisanyansozluk.com/kelime/ibrik"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ibrik maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sofra","word":"sofra","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"safar","meaning":"yola çıkma, seyahat","period":null,"reconstructed":false},{"language":"ar","form":"sufra(t)","meaning":"yol azığı; yemek için serilen örtü veya hazırlanan yüzey","period":null,"reconstructed":false},{"language":"tr","form":"sofra","meaning":"yemek yenmek üzere hazırlanmış düzen","period":null,"reconstructed":false}],"shortMeaning":"Yemek yemek üzere hazırlanmış masa, sini veya örtü düzeni.","currentMeaning":"Yiyecekler ve yemek takımlarıyla hazırlanmış masa, sini ya da örtü ve bunların oluşturduğu yemek düzeni.","story":"Sofranın başlangıcında evdeki masa değil, yolculuk vardır. Arapça safar ile bağlantılı sufra, yolcunun azığını ve üzerinde yemek yenilen örtü ya da yüzeyi adlandırıyordu. Yolda taşınan yiyecekten onun serildiği yere uzanan bu anlam alanı, Türkçede yemeğe hazırlanmış düzen olarak yerleşti.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"sufra"},"relatives":[{"word":"sefer","relation":"eş köken"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sofra maddesi","url":"https://www.nisanyansozluk.com/kelime/sofra"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sofra maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sandalye","word":"sandalye","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"el","ultimateOrigin":"el","chain":[{"language":"el","form":"sandáli(on)","meaning":"tahta ayakkabı tabanı; seki; düz tabanlı küçük tekne","period":null,"reconstructed":false},{"language":"tr","form":"sandalye","meaning":"tek kişilik arkalıklı oturma eşyası","period":null,"reconstructed":false}],"shortMeaning":"Bir kişinin oturması için yapılmış arkalıklı eşya.","currentMeaning":"Genellikle kolçakları bulunmayan, bir kişilik, arkalıklı oturma eşyası.","story":"Bir açıklama sandalyeyi Yunancada tahta ayakkabı tabanını, sekiyi ve düz tabanlı kayığı adlandıran sandáli(on) ailesine bağlar. Bu anlamlar arasında oturma eşyasına en yakın olan, üzerine oturulan ahşap sekidir. Türkçeye geçiş yolu tartışmalıdır; doğrudan Yunanca açıklamasının yanında Arapça ṣandaliyye biçimini veren açıklama da vardır. Türkçede kelime, tek kişinin oturduğu arkalıklı eşyada yerleşmiştir.","firstAttestation":{"source":"Erzurumlu Darir — Kıssa-i Yusuf tercümesi","period":"1377'den önce","form":"ṣandali"},"relatives":[],"alternatives":["Nişanyan Sözlük Yunanca sandáli(on) ve sandália üzerinden bir zincir kurar.","TDK Güncel Türkçe Sözlük doğrudan kaynak olarak Arapça ṣandaliyye biçimini verir; Türkçeye veren dil konusunda iki kayıt uyuşmaz."],"funFact":"Altı düz kayığı anlatan sandal kelimesi de aynı Yunanca kaynağa dayanır.","sources":[{"name":"Nişanyan Sözlük","ref":"sandalye maddesi","url":"https://www.nisanyansozluk.com/kelime/sandalye"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sandalye maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"minder","word":"minder","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"fa","ultimateOrigin":"fa","chain":[{"language":"fa","form":"nīmdār","meaning":"yıpransa da kullanılabilen giysi olduğu ileri sürülür","period":null,"reconstructed":false},{"language":"tr","form":"minder","meaning":"oturmak veya yaslanmak için doldurulmuş şilte","period":null,"reconstructed":false}],"shortMeaning":"Oturmayı veya yaslanmayı rahatlatan dolgulu şilte.","currentMeaning":"Kumaş içine yumuşak dolgu yerleştirilerek yapılan, oturmaya veya yaslanmaya yarayan şilte.","story":"Minder için önerilen Farsça nīmdār bağlantısı, eski ama kullanılabilir bir giysi tasvirine dayanır. Giysiden oturma şiltesine nasıl geçildiği açıklığa kavuşmuş değildir. Türkçedeki eski kullanımda ise kelime, yün ya da kıtıkla doldurulmuş bir döşek olarak belirginleşir. Bugünkü minder bu yumuşak destek işlevini sürdürür.","firstAttestation":{"source":"Meninski — Thesaurus","period":"1680","form":"minder"},"relatives":[],"alternatives":["Nişanyan Sözlük Farsça nīmdār bağlantısını tahmine dayalı olarak sunar ve giysi anlamından şilte anlamına geçişin açıklanamadığını belirtir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"minder maddesi","url":"https://www.nisanyansozluk.com/kelime/minder"},{"name":"TDK Güncel Türkçe Sözlük","ref":"minder maddesi, anlam kaydı","url":null}],"confidence":"orta","reviewed":true},{"id":"havuz","word":"havuz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥāḍa","meaning":"su bir yerde toplandı","period":null,"reconstructed":false},{"language":"ar","form":"ḥawḍ","meaning":"suyun toplandığı yer veya hazne","period":null,"reconstructed":false},{"language":"tr","form":"havuz","meaning":"su doldurmak için yapılmış açık hazne","period":null,"reconstructed":false}],"shortMeaning":"Su biriktirmek veya yüzmek için yapılan açık hazne.","currentMeaning":"Suyu tutacak tabanı ve duvarları bulunan, yüzme, depolama veya süsleme amacıyla kullanılan, genellikle üstü açık yapı.","story":"Arapça ḥāḍa, suyun bir yerde toplanmasını anlatıyordu. Bununla bağlantılı ḥawḍ, birikmiş suyu ve onu tutan havuz ya da sarnıcı adlandırdı. Türkçede havuz, suyu sınırları belirli bir yerde toplama fikrini korudu; yüzme ve süsleme gibi kullanımlar bu temel işlevin çevresinde yer aldı.","firstAttestation":{"source":"Rabguzi — Kısasü'l-Enbiya tercümesi","period":"1310","form":"ḥavẓ"},"relatives":[],"alternatives":null,"funFact":"İran'daki Ahvaz şehrinin adı, havuzun Arapça biçiminin çoğuludur.","sources":[{"name":"Nişanyan Sözlük","ref":"havuz maddesi","url":"https://www.nisanyansozluk.com/kelime/havuz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"havuz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"raf","word":"raf","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"raff","meaning":"duvarda eşya koymaya ayrılan çıkıntı","period":null,"reconstructed":false},{"language":"tr","form":"raf","meaning":"eşya taşımak için yatay yerleştirilmiş levha","period":null,"reconstructed":false}],"shortMeaning":"Üzerine eşya koymak için tutturulan yatay levha.","currentMeaning":"Duvara, dolaba veya bir taşıyıcıya bağlanarak eşya yerleştirmeye yarayan yatay tahta, metal ya da benzeri yüzey.","story":"Arapça raff, duvarın yukarısında eşya koymaya yarayan bir çıkıntıyı adlandırıyordu. Türkçeye geçen raf da eşyayı yerden kaldırıp yatay bir yüzeyde tutma işini korudu. Bugün dolap içindeki levha da duvara tutturulan tahta da aynı işlev sayesinde bu adı taşır.","firstAttestation":{"source":"Anonim — Câmiü'l-Fürs","period":"1501","form":"raf"},"relatives":[{"word":"raflı","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"raf maddesi","url":"https://www.nisanyansozluk.com/kelime/raf"},{"name":"TDK Güncel Türkçe Sözlük","ref":"raf maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"mahalle","word":"mahalle","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥalla","meaning":"bir yere yerleşti veya konakladı","period":null,"reconstructed":false},{"language":"ar","form":"maḥalla(t)","meaning":"konulan veya mola verilen yer","period":null,"reconstructed":false},{"language":"tr","form":"mahalle","meaning":"yerleşim yerinin belirli bir bölümü","period":null,"reconstructed":false}],"shortMeaning":"Bir yerleşim yerinin bölümlerinden her biri.","currentMeaning":"Şehir, kasaba veya büyük köy gibi yerleşimlerin, en az beş yüz nüfuslu bölümlerinden biri.","story":"Mahallenin temelindeki Arapça ḥalla, bir yere konmayı anlatıyordu. Bu eylemden oluşan maḥalla, konaklanan yerin ve yol üzerindeki durağın adıydı. Türkçenin eski kullanımlarında durak anlamı da görülürken kelime, insanların yaşadığı yerleşim bölümünü de adlandırdı. Bugünkü mahallede, bir yere konma düşüncesi kalıcı komşuluk çevresine dönüşmüş durumdadır.","firstAttestation":{"source":"Gülşehri — Mantıku't-Tayr","period":"1317","form":"maḥalle"},"relatives":[{"word":"mahalleli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"mahalle maddesi","url":"https://www.nisanyansozluk.com/kelime/mahalle"},{"name":"TDK Güncel Türkçe Sözlük","ref":"mahalle maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sokak","word":"sokak","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"akk","chain":[{"language":"akk","form":"sūḳu","meaning":"özellikle çarşı içindeki satış geçidi","period":null,"reconstructed":false},{"language":"akk","form":"sūḳāḳu","meaning":"çarşı yolu veya geçidi","period":null,"reconstructed":false},{"language":"ar","form":"zuḳāḳ","meaning":"dar yol veya geçit","period":null,"reconstructed":false},{"language":"tr","form":"sokak","meaning":"yerleşim içindeki dar veya kısa yol","period":null,"reconstructed":false}],"shortMeaning":"Yerleşim içinde, genellikle caddeden dar veya kısa yol.","currentMeaning":"Bir yerleşimde yapıların arasından geçen, çoğunlukla caddeye göre daha dar veya kısa olan yol.","story":"Sokağın izleri, Akkadcada çarşı içindeki geçitleri adlandıran sūḳu ve sūḳāḳu biçimlerine uzanır. Başlangıçtaki somut çevre, belirli malların satıldığı çarşı yollarıdır. Arapçada zuḳāḳ, dar yol ve geçit için kullanıldı. Türkçede sokak biçimi yerleşirken kelime, alışveriş alanıyla sınırlı kalmadan evler arasındaki yolları da kapsadı.","firstAttestation":{"source":"Mesud b. Ahmed — Süheyl ü Nevbahar tercümesi","period":"1354","form":"zuḳāḳ"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"sokak maddesi","url":"https://www.nisanyansozluk.com/kelime/sokak"},{"name":"TDK Güncel Türkçe Sözlük","ref":"sokak maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cadde","word":"cadde","rarity":"gündelik","partOfSpeech":"isim","formationType":"tartışmalı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"cadda","meaning":"kesme eylemini yaptı","period":null,"reconstructed":false},{"language":"ar","form":"cādda(t)","meaning":"geniş ve başlıca ulaşım yolu","period":null,"reconstructed":false},{"language":"tr","form":"cadde","meaning":"yerleşim içindeki ana yol","period":null,"reconstructed":false}],"shortMeaning":"Bir yerleşim yerindeki ana yol.","currentMeaning":"Yerleşim içinde ulaşımı sağlayan başlıca yollardan biri.","story":"Arapça cādda, geniş ve ana güzergâh niteliğindeki yolu adlandırıyordu. Bu adın kesme eylemini anlatan cadda ile bağlantılı olması muhtemeldir, ancak bu türeme kesin değildir. Türkçeye geçen kelime yol anlamını korudu; eski kullanımlarda adalet gibi soyut kavramlar da üzerinde ilerlenen bir cadde olarak anlatılabiliyordu.","firstAttestation":{"source":"Hoca Sadeddin Efendi — Tacü't-Tevârih","period":"1574","form":"cādde"},"relatives":[],"alternatives":["Nişanyan Sözlük cādda(t) ile kesme eylemini anlatan cadda arasındaki türemeyi muhtemel olarak niteler; belirsizlik Arapçadan alıntıda değil, daha eski türeme ilişkisindedir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"cadde maddesi","url":"https://www.nisanyansozluk.com/kelime/cadde"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cadde maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"bina","word":"bina","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"banā","meaning":"bir yapı meydana getirdi","period":null,"reconstructed":false},{"language":"ar","form":"bināˀ","meaning":"yapı kurma işi ve ortaya çıkan yapı","period":null,"reconstructed":false},{"language":"tr","form":"bina","meaning":"barınma veya başka amaçlarla yapılmış yapı","period":null,"reconstructed":false}],"shortMeaning":"İçinde yaşamak veya çalışmak gibi amaçlarla yapılan yapı.","currentMeaning":"Barınma, çalışma, depolama ve benzeri ihtiyaçlar için inşa edilen yapı.","story":"Arapça banā, bir yapıyı meydana getirme eylemini anlatıyordu. Ondan türeyen bināˀ hem yapma işini hem de bu işin sonunda ortaya çıkan yapıyı kapsıyordu. Türkçede bina, bu iki yüzlü anlamın somut sonucuna, yani inşa edilmiş yapıya yerleşti.","firstAttestation":{"source":"Edib Ahmed — Atebet-ül Hakayık","period":"<1250?","form":"binā"},"relatives":[],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"bina maddesi","url":"https://www.nisanyansozluk.com/kelime/bina"},{"name":"TDK Güncel Türkçe Sözlük","ref":"bina maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"daire","word":"daire","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"dāra","meaning":"dönme hareketi yaptı","period":null,"reconstructed":false},{"language":"ar","form":"dāˀira(t)","meaning":"dönüş; çember biçimindeki sınır veya halka","period":null,"reconstructed":false},{"language":"tr","form":"daire","meaning":"konut birimi; çemberle sınırlı alan; kurum birimi","period":null,"reconstructed":false}],"shortMeaning":"Bir yapının bağımsız konut olarak kullanılan bölümü.","currentMeaning":"Bir binada ayrı bir konut olarak düzenlenmiş ve kullanılan bölüm.","story":"Dairenin gerisinde Arapça dāra ile anlatılan dönme hareketi vardır. Bu hareketten türeyen dāˀira, dönüşü, halkayı ve çemberi adlandırıyordu. Türkçede kelimenin kullanım alanı çizilmiş bir çemberden kurumlara ve konut bölümlerine kadar genişledi. Bugünkü ev anlamında belirleyici olan yuvarlaklık değil, bir yapı içinde ayrılmış birimdir.","firstAttestation":{"source":"Gülşehri — Mantıku't-Tayr","period":"1317","form":"dāyire"},"relatives":[{"word":"daireli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"daire maddesi","url":"https://www.nisanyansozluk.com/kelime/daire"},{"name":"TDK Güncel Türkçe Sözlük","ref":"daire maddesi, konut anlamı","url":null}],"confidence":"yüksek","reviewed":true},{"id":"inşaat","word":"inşaat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"inşāˀāt","meaning":"yapım işleri","period":null,"reconstructed":false},{"language":"tr","form":"inşaat","meaning":"yapı meydana getirme işi","period":null,"reconstructed":false}],"shortMeaning":"Bir yapıyı meydana getirme işi.","currentMeaning":"Bina ve benzeri yapıları oluşturmak için yürütülen yapım işi.","story":"Arapça inşāˀāt, Türkçeye yapım işini adlandıran bir kelime olarak geçti. Temelin hazırlanması, duvarların örülmesi ve yapının tamamlanması gibi işler Türkçede bu ad altında toplanır. Kelimenin merkezinde, bitmiş yapıyı ortaya çıkaran çalışma vardır.","firstAttestation":null,"relatives":[{"word":"inşaatçı","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"TDK Güncel Türkçe Sözlük","ref":"inşaat maddesi","url":null}],"confidence":"orta","reviewed":true},{"id":"tamir","word":"tamir","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ˁamara","meaning":"yaşatıp gelişmesini sağladı","period":null,"reconstructed":false},{"language":"ar","form":"taˁmīr","meaning":"yeniden canlılık kazandırma veya işler duruma getirme","period":null,"reconstructed":false},{"language":"tr","form":"tamir","meaning":"bozuk veya yıpranmış şeyi düzeltme","period":null,"reconstructed":false}],"shortMeaning":"Bozulmuş veya yıpranmış bir şeyi yeniden işler duruma getirme.","currentMeaning":"Bir eşyanın ya da yapının hasarını gidererek yeniden kullanılabilmesini sağlama işi.","story":"Tamirin Arapçadaki geçmişinde yalnızca kırığı düzeltmek değil, bir şeye yeniden canlılık kazandırmak da vardır. ˁAmara ile bağlantılı taˁmīr, yaşatma ve bayındırlaştırmadan onarmaya uzanan bir anlam alanı taşır. Türkçede harap bir yapının yeniden kullanılmasını anlatan kelime, bugün bozuk bir eşyanın işlevini geri kazanması için de kullanılır.","firstAttestation":{"source":"Anonim — Danişmend-Name","period":"1360","form":"taˁmīr"},"relatives":[{"word":"tamirci","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"tamir maddesi","url":"https://www.nisanyansozluk.com/kelime/tamir"},{"name":"TDK Güncel Türkçe Sözlük","ref":"tamir maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kira","word":"kira","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"arc","chain":[{"language":"arc","form":"kərī, kəriyā","meaning":"ürün yığını; toprağın kullanımı karşılığında ayrılan ürün payı","period":null,"reconstructed":false},{"language":"ar","form":"kirāˀ","meaning":"mülkü kullanma karşılığında verilen bedel","period":null,"reconstructed":false},{"language":"tr","form":"kira","meaning":"bir şeyi süreli kullanma karşılığındaki bedel veya bu kullanım düzeni","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyi belirli süre kullanmak için ödenen bedel.","currentMeaning":"Bir konut, taşıt veya başka malın belirli süre ve bedel karşılığında başkasının kullanımına verilmesi; bu kullanım için ödenen bedel.","story":"Kiranın eski anlam çevresinde para yerine bir ürün yığını vardır. Aramice kərī ve kəriyā, mal ya da mahsul yığınını ve toprağı kullanma karşılığında verilen ürün miktarını adlandırıyordu. Arapça kirāˀ, bir mülkten yararlanmanın bedelini öne çıkardı. Türkçede kelime, hem bu bedeli hem de bedel karşılığında geçici kullanım düzenini kapsadı.","firstAttestation":{"source":"Ebu Hayyan — Kitabu'l-İdrak","period":"1312","form":"kirāye"},"relatives":[{"word":"kiracı","relation":"türev"},{"word":"kiralamak","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kira maddesi","url":"https://www.nisanyansozluk.com/kelime/kira"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kira maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"ücret","word":"ücret","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ucra(t)","meaning":"yapılan iş için verilen karşılık","period":null,"reconstructed":false},{"language":"tr","form":"ücret","meaning":"çalışma karşılığında alınan para veya mal","period":null,"reconstructed":false}],"shortMeaning":"Yapılan iş karşılığında verilen para veya mal.","currentMeaning":"Bir kişinin emeği ya da sunduğu hizmet karşılığında aldığı para veya mal.","story":"Arapça ucra(t), yapılan işe karşılık verilen şeyi adlandırıyordu. Türkçedeki eski kullanımlarında da yazı yazma gibi bir işin karşılığı ve aylık çalışma ödemesi bu kelimeyle anlatılır. Bugünkü ücret, emeğin karşılığını belirleme düşüncesini korur.","firstAttestation":{"source":"Anonim — Nehcü'l-Feradis","period":"1358","form":"ücret"},"relatives":[{"word":"ücretli","relation":"türev"},{"word":"ücretsiz","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"ücret maddesi","url":"https://www.nisanyansozluk.com/kelime/%C3%BCcret"},{"name":"TDK Güncel Türkçe Sözlük","ref":"ücret maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hesap","word":"hesap","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥasaba","meaning":"sayıp sonucu belirledi","period":null,"reconstructed":false},{"language":"ar","form":"ḥisāb","meaning":"sayılarla işlem yapma","period":null,"reconstructed":false},{"language":"tr","form":"hesap","meaning":"sayılarla sonuç bulma işi","period":null,"reconstructed":false}],"shortMeaning":"Sayılarla işlem yaparak bir sonucu bulma işi.","currentMeaning":"Nicelikleri belirlemek veya aralarındaki ilişkileri çözmek için yapılan sayısal işlem.","story":"Arapça ḥasaba, saymayı ve bir hesabın sonucunu bulmayı anlatıyordu. Bu eylemle bağlantılı ḥisāb, sayı işlemlerinin adı olarak Türkçeye geçti. Türkçedeki eski kullanımlarında yılın günlerini saymakla insanın yaptıklarından sorumlu tutulması aynı kelimenin çevresinde buluşur. Böylece hesap, hem nicelikleri belirlemenin hem de yapılanları değerlendirmeye açmanın adı oldu.","firstAttestation":{"source":"Edib Ahmed — Atebet-ül Hakayık","period":"<1250?","form":"ḥisāb"},"relatives":[{"word":"hesaplamak","relation":"türev"},{"word":"hesaplı","relation":"türev"}],"alternatives":null,"funFact":"Hesabın kök ailesinde çakıl taşıyla bağlantı bulunur; Latincede de calculus adlı çakıl taşı, calculare hesaplama fiiline ad vermiştir.","sources":[{"name":"Nişanyan Sözlük","ref":"hesap maddesi","url":"https://www.nisanyansozluk.com/kelime/hesap"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hesap maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"maaş","word":"maaş","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"maˁīşa(t)","meaning":"hayatı sürdürme, geçimini sağlama","period":null,"reconstructed":false},{"language":"ar","form":"maˁāyiş","meaning":"geçinmeye yarayan imkânlar","period":null,"reconstructed":false},{"language":"tr","form":"maaş","meaning":"çalışma karşılığında düzenli alınan aylık ödeme","period":null,"reconstructed":false}],"shortMeaning":"Çalışma karşılığında düzenli alınan aylık ödeme.","currentMeaning":"Bir çalışana yaptığı iş karşılığında aylık olarak ödenen para.","story":"Maaşın geçmişinde yalnızca bir işin karşılığı değil, insanın hayatını sürdürmesini sağlayan geçim imkânları bulunur. Arapçadaki maˁīşa(t) ile bağlantılı maˁāyiş biçimi bu geniş geçim dünyasını anlatır; Türkçedeki biçimin doğrudan çıkış noktası konusunda iki farklı açıklama vardır. Türkçede önceleri geçinmeyi anlatan kelime, zamanla çalışana düzenli verilen aylık paraya yerleşmiştir.","firstAttestation":{"source":"Erzurumlu Darir, Kıssa-i Yusuf tercümesi","period":"1377'den önce","form":"maˁāş"},"relatives":[],"alternatives":["Nişanyan Sözlük Türkçe biçimi Arapça maˁāyiş üzerinden açıklarken TDK Güncel Türkçe Sözlük doğrudan Arapça maˁāş biçimini verir."],"funFact":"Halk ağzındaki mayış söyleyişi, maˁāyiş biçimine standart maaş söyleyişinden daha yakındır.","sources":[{"name":"Nişanyan Sözlük","ref":"maaş maddesi","url":"https://www.nisanyansozluk.com/kelime/maa%C5%9F"},{"name":"TDK Güncel Türkçe Sözlük","ref":"maaş maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"masraf","word":"masraf","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṣarafa","meaning":"para harcadı","period":null,"reconstructed":false},{"language":"ar","form":"maṣraf","meaning":"harcanan para, gider","period":null,"reconstructed":false},{"language":"tr","form":"masraf","meaning":"bir iş için yapılan harcama","period":null,"reconstructed":false}],"shortMeaning":"Bir iş veya ihtiyaç için yapılan harcama.","currentMeaning":"Bir ihtiyacı karşılamak ya da bir işi gerçekleştirmek için harcanan para.","story":"Masrafın arkasında Arapça ṣarafa fiilinin anlattığı para harcama eylemi vardır. Bu eylemden oluşan maṣraf, eldeki paranın giderlere ayrılan bölümünü adlandırır. Türkçeye geçtiğinde de aynı hesap dünyasını korumuş; evin ihtiyaçlarından büyük işlerin giderlerine kadar yapılan harcamaların adı olmuştur.","firstAttestation":{"source":"Kâtip Çelebi, Fezleke","period":"1653","form":"masraf"},"relatives":[{"word":"sarf","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"masraf maddesi","url":"https://www.nisanyansozluk.com/kelime/masraf"},{"name":"TDK Güncel Türkçe Sözlük","ref":"masraf maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"fiyat","word":"fiyat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"fī","meaning":"içinde bulunmayı bildiren edat","period":null,"reconstructed":false},{"language":"ar","form":"fiyāt / fīˀāt","meaning":"fī edatının Arapçada tanıklanmayan çoğul biçimi","period":null,"reconstructed":true},{"language":"tr","form":"fiyat","meaning":"bir malın para ile belirtilen karşılığı","period":null,"reconstructed":false}],"shortMeaning":"Bir mal veya hizmetin para ile belirtilen karşılığı.","currentMeaning":"Bir mal ya da hizmetin alınması veya satılması için belirlenen para tutarı.","story":"Fiyatın başlangıcında, Arapçada bir şeyin içinde bulunmayı bildiren fī edatı vardır. Bu edatın Arapçada bulunmayan çoğul biçimi ve alışverişteki değer kullanımı Türkçede gelişmiştir. Kelimenin eski Türkçe kayıtlarında gelir ve toplam tutar öne çıkarken, sonraki kayıtlarda tek tek malların satış bedeli belirginleşir.","firstAttestation":{"source":"Kieffer ve Bianchi, Dictionnaire Turc-Français","period":"1835","form":"fiyāt"},"relatives":[{"word":"fiyatlandırma","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"fiyat maddesi","url":"https://www.nisanyansozluk.com/kelime/fiyat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"fiyat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"kıymet","word":"kıymet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳāma","meaning":"durdu, sağlam veya değerli oldu","period":null,"reconstructed":false},{"language":"ar","form":"ḳīma(t)","meaning":"bir şeyin değeri veya miktarı","period":null,"reconstructed":false},{"language":"tr","form":"kıymet","meaning":"maddi ya da manevi değer","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyin maddi veya manevi değeri.","currentMeaning":"Bir varlığın para ile ölçülen karşılığı veya taşıdığı önem ve değer.","story":"Kıymetin dayandığı Arapça ḳāma fiili, durmayı ve sağlam bulunmayı değerli olmayla aynı anlam alanında buluşturur. Bu fiille bağlantılı ḳīma(t), bir şeyin değerini ve miktarını ifade eder. Türkçede kelime yalnızca alışveriş hesabına kapanmamış, erken kullanımında bilginin değerini de anlatmıştır. Bugün bir yüzüğün parasal karşılığıyla bir insanın hayatımızdaki önemini aynı kelimeyle dile getiririz.","firstAttestation":{"source":"Yusuf Hacib, Kutadgu Bilig","period":"1069","form":"ḳıymatın"},"relatives":[{"word":"kıymetli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"kıymet maddesi","url":"https://www.nisanyansozluk.com/kelime/k%C4%B1ymet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"kıymet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"zam","word":"zam","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḍamma","meaning":"bir araya getirdi, ekledi","period":null,"reconstructed":false},{"language":"ar","form":"ḍamm","meaning":"ekleme, birleştirme, toplama işlemi","period":null,"reconstructed":false},{"language":"tr","form":"zam","meaning":"fiyat veya ücret artışı","period":null,"reconstructed":false}],"shortMeaning":"Bir fiyatın veya ücretin artırılması.","currentMeaning":"Bir malın fiyatına veya bir kişinin ücretine eklenen artış.","story":"Zamın ilk resmi, bir şeyin yanına başka bir şeyi katmaktır. Arapça ḍamm hem birleştirmeyi hem de sayıları toplamayı kapsar. Türkçede de önce genel bir ekleme eylemini anlatan kelime, maaşa eklenen paraya ve ardından satış fiyatındaki artışa yerleşmiştir.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"zamm"},"relatives":[{"word":"zamlı","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"zam maddesi","url":"https://www.nisanyansozluk.com/kelime/zam"},{"name":"TDK Güncel Türkçe Sözlük","ref":"zam maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nakit","word":"nakit","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"naḳada","meaning":"gagaladı, eleştiri yaptı","period":null,"reconstructed":false},{"language":"ar","form":"naḳd","meaning":"gagalama, eleştiri; madeni para","period":null,"reconstructed":false},{"language":"tr","form":"nakit","meaning":"elde bulunan ve doğrudan ödenebilen para","period":null,"reconstructed":false}],"shortMeaning":"Ödemede doğrudan kullanılabilen hazır para.","currentMeaning":"Bir ödeme için hemen kullanılabilen para; özellikle banknot ve madeni para.","story":"Nakitin Arapça geçmişinde gagalama ve eleştirme eylemleriyle madeni para aynı kelime ailesinde buluşur. Bu anlamların nokta ya da çentik taşıyan sikke üzerinden bağlanmış olması bir köken açıklamasıdır. Türkçenin erken kayıtlarında kelime akçeyle birlikte para karşılığı olarak kullanılır. Günümüzde metal olma özelliği geri çekilmiş, paranın ödemeye hazır bulunması öne çıkmıştır.","firstAttestation":{"source":"Codex Cumanicus","period":"1303","form":"nagt"},"relatives":[{"word":"nakden","relation":"akraba"}],"alternatives":["Nişanyan Sözlük gagalama ile para arasındaki anlam bağını nokta, çentik veya işaretli sikke üzerinden olasılıklı biçimde açıklar; Aramice-Süryanice ve İbranice nḳd biçimlerini alıntı basamağı değil, eş kökenli karşılıklar olarak gösterir."],"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"nakit maddesi","url":"https://www.nisanyansozluk.com/kelime/nakit"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nakit maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"faiz","word":"faiz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"fāḍa","meaning":"taştı, çoğaldı, dışarı döküldü","period":null,"reconstructed":false},{"language":"ar","form":"fāˀiḍ","meaning":"artan veya taşan şey, fazlalık","period":null,"reconstructed":false},{"language":"tr","form":"faiz","meaning":"ödünç verilen paranın getirisi","period":null,"reconstructed":false}],"shortMeaning":"Ödünç verilen para karşılığında alınan getiri.","currentMeaning":"Bir paranın belirli süre kullanılmasına karşılık, ana paraya ek olarak ödenen tutar.","story":"Faizin ardındaki somut görüntü, dolduğu yerden taşan ve çevresine dökülen bir fazlalıktır. Arapça fāḍa fiilinden oluşan fāˀiḍ, artıp taşanı adlandırır. Para kullanımında bu fazlalık, başlangıçta verilen tutarın üzerine eklenen kazanca dönüşmüştür. Kelime bu alanda ribā terimini daha yumuşak bir ifadeyle karşılamak için benimsenmiştir.","firstAttestation":{"source":"Evliya Çelebi, Seyahatname","period":"1665","form":"fāiżi"},"relatives":[{"word":"faizli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"faiz maddesi","url":"https://www.nisanyansozluk.com/kelime/faiz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"faiz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"taksit","word":"taksit","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"arc","chain":[{"language":"arc","form":"ḳīsthā","meaning":"belirli bir ağırlığı ölçen tartı birimi","period":"Geç Antik Çağ","reconstructed":false},{"language":"ar","form":"ḳisṭ","meaning":"hakkaniyetle ayrılan pay, bölüşümde adalet","period":null,"reconstructed":false},{"language":"ar","form":"taḳsīṭ","meaning":"malı paylara ayırma; payların yazıldığı defter","period":null,"reconstructed":false},{"language":"tr","form":"taksit","meaning":"bölünmüş bir borcun ödeme parçalarından biri","period":null,"reconstructed":false}],"shortMeaning":"Bir borcun belirli zamanda ödenen parçalarından biri.","currentMeaning":"Parçalara bölünmüş bir borcun, önceden belirlenen tarihlerde ödenecek bölümlerinden her biri.","story":"Taksitin uzak geçmişinde, malları tartarken kullanılan standart bir ağırlık birimi bulunur. Aramiceden Arapçaya geçen bu ölçü adı, hakkaniyetli pay ve adil bölüşüm düşüncesiyle bağlantılanmıştır. Arapça taḳsīṭ, mülkü paylara ayırmayı ve bu payların kaydını tutan defteri anlatır. Türkçedeki kullanımda bölünen şey borç olmuş, her ödeme parçası taksit adını almıştır.","firstAttestation":{"source":"Ahmed Vefik Paşa, Lehce-i Osmani","period":"1876","form":"taḳsīṭ"},"relatives":[{"word":"kıst","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"taksit maddesi","url":"https://www.nisanyansozluk.com/kelime/taksit"},{"name":"TDK Güncel Türkçe Sözlük","ref":"taksit maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"senet","word":"senet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"sanada","meaning":"bir şeye yaslandı, dayandı","period":null,"reconstructed":false},{"language":"ar","form":"sanad","meaning":"destek, kanıt; borcu gösteren belge","period":null,"reconstructed":false},{"language":"tr","form":"senet","meaning":"bir borç veya yükümlülüğü gösteren imzalı belge","period":null,"reconstructed":false}],"shortMeaning":"Bir borç veya yükümlülüğü gösteren imzalı belge.","currentMeaning":"Bir kişinin ödeme ya da bir işi yapma yükümlülüğünü kayıt altına alan imzalı resmî belge.","story":"Senedin başlangıcında bir yere dayanmak, destek almak vardır. Arapça sanad bu desteği düşünce ve iddia dünyasına taşır: Bir sözün doğruluğu da bir kanıta dayanır. Borcu kanıtlayan yazılı belge bu yüzden aynı adla anılmıştır. Türkçede eski yasal dayanak kullanımıyla bugünkü borç belgesi arasında bu destek fikri sürer.","firstAttestation":{"source":"Anonim, Munyatu'l-ġuzāt","period":"1400'den önce","form":"sened"},"relatives":[{"word":"senetli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"senet maddesi","url":"https://www.nisanyansozluk.com/kelime/senet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"senet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"makbuz","word":"makbuz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḳabaḍa","meaning":"eline aldı, tuttu","period":null,"reconstructed":false},{"language":"ar","form":"maḳbūḍ","meaning":"ele alınmış, teslim alınmış","period":null,"reconstructed":false},{"language":"tr","form":"makbuz","meaning":"teslim alınanı belgeleyen yazılı kayıt","period":null,"reconstructed":false}],"shortMeaning":"Para veya bir şeyin teslim alındığını gösteren belge.","currentMeaning":"Bir para ya da eşyanın teslim alındığını doğrulamak amacıyla verilen belge.","story":"Makbuzun arkasında eliyle tutma ve ele alma eylemi bulunur. Arapça maḳbūḍ, bu eylemin sonucunu, yani artık alınmış olan şeyi niteler. Türkçede kelime zamanla alınan paranın kendisinden, onun teslim alındığını gösteren belgeye yönelmiştir. Böylece bir durumu bildiren ifade, o durumu kanıtlayan kâğıdın adı olmuştur.","firstAttestation":{"source":"Hoca Sadeddin Efendi, Tacü't-Tevârih","period":"1574","form":"maḳbūḍ"},"relatives":[{"word":"kabz","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"makbuz maddesi","url":"https://www.nisanyansozluk.com/kelime/makbuz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"makbuz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hediye","word":"hediye","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"hadā","meaning":"birine yol gösterdi","period":null,"reconstructed":false},{"language":"ar","form":"hadiyya(t)","meaning":"yolculuk kurbanı, yol için verilen şey; armağan","period":null,"reconstructed":false},{"language":"tr","form":"hediye","meaning":"birine karşılık beklemeden verilen armağan","period":null,"reconstructed":false}],"shortMeaning":"Birine karşılık beklenmeden verilen armağan.","currentMeaning":"Sevgi, saygı, teşekkür veya benzeri bir duyguyu göstermek için birine verilen şey.","story":"Hediyenin geçmişi, Arapçada yol gösterme eylemine uzanır. Hadiyya(t) kelimesinin anlam dünyasında yolculuk için kesilen kurban, uğur getirmesi beklenen sunu ve yola çıkana verilen şeyler vardır. Bu yolculuk çevresi genişleyerek her türlü armağanı içine almıştır. Türkçeye de bu geniş kullanımıyla geçen kelime, birini sevindirmek için verilen şeylerin adı olmuştur.","firstAttestation":{"source":"Edib Ahmed, Atebet-ül Hakayık","period":"1250'den önce?","form":"hedyeni"},"relatives":[{"word":"hediyelik","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hediye maddesi","url":"https://www.nisanyansozluk.com/kelime/hediye"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hediye maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"emanet","word":"emanet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"amana","meaning":"güven duydu, inandı","period":null,"reconstructed":false},{"language":"ar","form":"amāna(t)","meaning":"güven; güvenilerek bırakılan şey veya sorumluluk","period":null,"reconstructed":false},{"language":"tr","form":"emanet","meaning":"korunması için geçici olarak birine bırakılan şey","period":null,"reconstructed":false}],"shortMeaning":"Korunması için geçici olarak birine bırakılan şey.","currentMeaning":"Bir süre korunup daha sonra geri verilmesi veya sahibine ulaştırılması için birine bırakılan eşya, kişi ya da başka bir varlık.","story":"Emanetin merkezinde bir nesneden önce insanlar arasındaki güven vardır. Arapça amana fiiliyle bağlantılı amāna(t), hem bu güveni hem de güvenilerek birine verilen şeyi veya görevi kapsar. Türkçede güvenceyi anlatan eski kullanımların yanında, korunmak üzere başkasına bırakılan şey öne çıkmıştır. Kelime böylece güven duygusunu somut bir koruma sorumluluğuna bağlar.","firstAttestation":{"source":"Edib Ahmed, Atebet-ül Hakayık","period":"1250'den önce?","form":"amānat"},"relatives":[{"word":"emanetçi","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"emanet maddesi","url":"https://www.nisanyansozluk.com/kelime/emanet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"emanet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"eşya","word":"eşya","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"şayˀ","meaning":"şey","period":null,"reconstructed":false},{"language":"ar","form":"aşyāˀ","meaning":"birden çok şey, var olanlar","period":null,"reconstructed":false},{"language":"tr","form":"eşya","meaning":"kullanılan taşınabilir nesneler","period":null,"reconstructed":false}],"shortMeaning":"Çeşitli amaçlarla kullanılan taşınabilir nesneler.","currentMeaning":"İnsanların ihtiyaçları için kullandığı, taşınabilen cansız nesnelerin genel adı.","story":"Eşya başlangıçta bir evin içindekilerden çok daha geniş bir alanı kapsıyordu. Arapça şayˀ kelimesinin çoğulu olan aşyāˀ, var olan şeyleri topluca anlatır. Türkçenin eski kullanımında da bütün varlıkları kapsayabilen bu kelimenin alanı daralmış, gündelik hayatta kullanılan taşınır nesneler öne çıkmıştır.","firstAttestation":{"source":"Seyf-i Sarayî, Gülistan tercümesi","period":"1391","form":"eşyā"},"relatives":[{"word":"şey","relation":"akraba"}],"alternatives":null,"funFact":"Eşyanın tabiatı ifadesindeki eşya, yalnızca evdeki nesneleri değil, şeylerin genelini kapsayan eski kullanımı korur.","sources":[{"name":"Nişanyan Sözlük","ref":"eşya maddesi","url":"https://www.nisanyansozluk.com/kelime/e%C5%9Fya"},{"name":"TDK Güncel Türkçe Sözlük","ref":"eşya maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cihaz","word":"cihaz","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"cahaza","meaning":"gerekli donanımı sağladı","period":null,"reconstructed":false},{"language":"ar","form":"cahāz","meaning":"işe hazırlayan donanım, araç gereç","period":null,"reconstructed":false},{"language":"tr","form":"cihaz","meaning":"belirli bir işlevi yerine getiren aygıt","period":null,"reconstructed":false}],"shortMeaning":"Belirli bir işi yapmaya yarayan aygıt.","currentMeaning":"Bir işlevi yerine getirmek üzere düzenlenmiş araç veya mekanizma.","story":"Cihazın geçmişindeki Arapça cahaza fiili, birini veya bir şeyi gerekenlerle donatmayı anlatır. Cahāz da bu hazırlığı sağlayan donanımın ve araç gerecin adıdır. Türkçede geniş donanım kullanımı zamanla belirli işler yapan aygıtlara uzanmıştır. Soğutma ya da kumanda cihazı gibi kullanımlarda kelime artık tek bir teknik düzeneği gösterir.","firstAttestation":{"source":"Anonim, Danişmend-Name","period":"1360","form":"cihāz"},"relatives":[{"word":"teçhizat","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"cihaz maddesi","url":"https://www.nisanyansozluk.com/kelime/cihaz"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cihaz maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"alet","word":"alet","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"āla","meaning":"geri geldi, döndü","period":null,"reconstructed":false},{"language":"ar","form":"āla(t)","meaning":"iş görmeye yarayan düzenek veya araç","period":null,"reconstructed":false},{"language":"tr","form":"alet","meaning":"belirli bir işi yapmak için üretilmiş araç","period":null,"reconstructed":false}],"shortMeaning":"Bir işi gerçekleştirmek için yapılmış araç.","currentMeaning":"Bir el işini veya mekanik işlemi yapmak amacıyla özel olarak üretilmiş nesne.","story":"Aletin Arapça geçmişinde dönme ve geri gelme hareketini anlatan āla fiili bulunur. Bununla bağlantılı āla(t), iş görmeye yarayan araç ve düzeneklerin adıdır. Türkçedeki erken kullanımında da işin yapılabilmesi için gereken araç öne çıkar; bugünkü kullanım bu pratik işlevi sürdürür.","firstAttestation":{"source":"Aşık Paşa, Garib-name","period":"1330","form":"āleti"},"relatives":[{"word":"aletli","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"alet maddesi","url":"https://www.nisanyansozluk.com/kelime/alet"},{"name":"TDK Güncel Türkçe Sözlük","ref":"alet maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"nakil","word":"nakil","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"naḳala","meaning":"bir yerden başka yere taşıdı","period":null,"reconstructed":false},{"language":"ar","form":"naḳl","meaning":"yer değiştirtme, iletme","period":null,"reconstructed":false},{"language":"tr","form":"nakil","meaning":"bir yerden başka bir yere aktarma","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyi bir yerden başka bir yere aktarma.","currentMeaning":"Bir kimseyi veya şeyi bulunduğu yerden alıp başka bir yere taşıma ya da iletme.","story":"Naklin çekirdeğinde bir şeyi bulunduğu yerden alıp başka bir yere taşıma eylemi vardır. Arapça naḳala fiili ve ondan oluşan naḳl, bu hareketi adlandırır. Türkçede kelime aynı aktarım fikrini koruyarak insanların, nesnelerin ve anlatılan bilgilerin bir yerden diğerine geçirilmesini ifade eder.","firstAttestation":{"source":"Anonim, Nehcü'l-Feradis","period":"1358","form":"naḳl"},"relatives":[{"word":"nakletmek","relation":"birleşik"}],"alternatives":null,"funFact":"Eski Türkçe bir kullanımda dünyadan nakil yapmak, ölümü bir yer değiştirme olarak anlatır.","sources":[{"name":"Nişanyan Sözlük","ref":"nakil maddesi","url":"https://www.nisanyansozluk.com/kelime/nakil"},{"name":"TDK Güncel Türkçe Sözlük","ref":"nakil maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"malzeme","word":"malzeme","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"lazima","meaning":"gerekli oldu","period":null,"reconstructed":false},{"language":"ar","form":"mā lazima","meaning":"ihtiyaç duyulan şey","period":null,"reconstructed":false},{"language":"tr","form":"malzeme","meaning":"bir işte ihtiyaç duyulan nesneler","period":null,"reconstructed":false}],"shortMeaning":"Bir işi yapmak için gereken nesneler.","currentMeaning":"Bir işin yapılmasında veya bir ürünün hazırlanmasında kullanılan gerekli nesnelerin bütünü.","story":"Malzeme, Arapçada gerekli olmayı anlatan lazima fiiline dayanır. Mā lazima ifadesi, belirli bir maddeyi değil, yapılacak işin gerektirdiği şeyi gösterir. Türkçede bu ifade tek kelime hâlinde yerleşmiş ve söyleyişi bugünkü malzeme biçimine dönüşmüştür. İnşaattan yemek yapmaya kadar farklı işlerde kullanılabilmesi, başlangıçtaki bu geniş ihtiyaç fikrini korur.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"mālezim"},"relatives":[{"word":"lazım","relation":"akraba"}],"alternatives":null,"funFact":"Bugün standart olan malzeme söyleyişi, 1900 tarihli bir sözlükte yanlış kabul ediliyordu.","sources":[{"name":"Nişanyan Sözlük","ref":"malzeme maddesi","url":"https://www.nisanyansozluk.com/kelime/malzeme"},{"name":"TDK Güncel Türkçe Sözlük","ref":"malzeme maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"hacim","word":"hacim","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥacama","meaning":"memeden emdi, hacamat uyguladı","period":null,"reconstructed":false},{"language":"ar","form":"ḥacm","meaning":"meme, hacamat; deride veya kemik üzerinde çıkıntı","period":null,"reconstructed":false},{"language":"tr","form":"hacim","meaning":"bir cismin kapladığı üç boyutlu yer","period":null,"reconstructed":false}],"shortMeaning":"Bir cismin uzayda kapladığı üç boyutlu yer.","currentMeaning":"Bir cismin uzayda kapladığı yerin büyüklüğü.","story":"Hacmin geçmişi, soyut bir ölçüden önce bedenin çıkıntılarına ve hacamat uygulamasına bağlıdır. Arapça ḥacm, meme ve deri üzerindeki kabarıklıklarla kemik başı gibi belirgin çıkıntıları da adlandırır. Osmanlı Türkçesinde kelime, 19. yüzyılda Fransızca volume karşılığı olarak kullanılmıştır. Böylece bedendeki kabartıdan bir cismin bütün olarak kapladığı yere uzanan bir anlam kazanmıştır.","firstAttestation":{"source":"Meninski, Thesaurus","period":"1680","form":"hacm"},"relatives":[{"word":"hacamat","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"hacim maddesi","url":"https://www.nisanyansozluk.com/kelime/hacim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"hacim maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"cisim","word":"cisim","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"cism","meaning":"canlının bedeni, gövdesi","period":null,"reconstructed":false},{"language":"tr","form":"cisim","meaning":"maddi varlığı olan nesne","period":null,"reconstructed":false}],"shortMeaning":"Kütlesi olan ve uzayda yer kaplayan maddi varlık.","currentMeaning":"Kütlesi bulunan, uzayda yer kaplayan ve duyularla algılanabilen maddi varlık.","story":"Cisim, Arapça cism biçiminde canlı bir varlığın bedenini ve gövdesini anlatır. Türkçedeki eski kullanımlarında da varlıkların beden sahibi oluşu öne çıkar. Kelimenin kapsamı bedenden maddi varlıkların geneline genişlemiştir; bugün bir taş da metal bir parça da cisim olarak adlandırılabilir.","firstAttestation":{"source":"Aşık Paşa, Garib-name","period":"1330","form":"cismiyle"},"relatives":[{"word":"cismani","relation":"akraba"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"cisim maddesi","url":"https://www.nisanyansozluk.com/kelime/cisim"},{"name":"TDK Güncel Türkçe Sözlük","ref":"cisim maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"şekil","word":"şekil","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"akk","chain":[{"language":"akk","form":"kullatu","meaning":"tam, bütün","period":null,"reconstructed":false},{"language":"arc","form":"şaklīl/şiklīl","meaning":"tamamlama, biçimleme, bezeme","period":null,"reconstructed":false},{"language":"ar","form":"şakl","meaning":"bir şeyin biçimi","period":null,"reconstructed":false},{"language":"tr","form":"şekil","meaning":"bir şeyin dış görünüşünü belirleyen biçim","period":null,"reconstructed":false}],"shortMeaning":"Bir şeyin dış görünüşünü belirleyen biçim.","currentMeaning":"Bir nesnenin sınırları, çizgileri ve yüzey düzeniyle ortaya çıkan görünüşü veya biçimi.","story":"Şeklin uzak geçmişinde bir şeyi tam ve bütün hâle getirme düşüncesi vardır. Akkadca kullatu bütünlüğü anlatırken, aynı kökten kurulan Aramice şaklīl ve şiklīl biçim verme ve bezemeyi de kapsar. Arapça şakl bu geçmişten biçim adı olarak ayrılır, aktarımın doğrudan Akkadcadan mı yoksa Irak Aramicesi üzerinden mi gerçekleştiği açık değildir. Türkçeye geçtiğinde kelime, bir şeyin tamamlanmış dış görünüşünü anlatan kullanımını korumuştur.","firstAttestation":{"source":"Gülşehri, Mantıku't-Tayr","period":"1317","form":"şekl"},"relatives":[{"word":"şekilci","relation":"türev"}],"alternatives":["Nişanyan Sözlük, Arapça şakl için doğrudan Akkadcadan alıntıyı da seçenek olarak verir; zincirde Irak Aramicesi yolu gösterilmiştir.","Akkadca şuklulu ile Aramice şaklīl biçimleri, kll kökünün aynı vezinde kurulmuş kardeş türevleridir."],"funFact":"Şekil, Arapçadaki şkl kökünün türevi gibi görünse de o kökle anlam bağı yoktur.","sources":[{"name":"Nişanyan Sözlük","ref":"şekil maddesi","url":"https://www.nisanyansozluk.com/kelime/%C5%9Fekil"},{"name":"TDK Güncel Türkçe Sözlük","ref":"şekil maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"rahat","word":"rahat","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"rūḥ","meaning":"nefes","period":null,"reconstructed":false},{"language":"ar","form":"arāḥa","meaning":"nefes aldı","period":null,"reconstructed":false},{"language":"ar","form":"rāḥa(t)","meaning":"nefes alıp ferahlama, dinlenme","period":null,"reconstructed":false},{"language":"tr","form":"rahat","meaning":"sıkıntıdan uzak olma durumu","period":"11. yy","reconstructed":false}],"shortMeaning":"Sıkıntı ve tedirginlikten uzak olma durumu.","currentMeaning":"İnsanın kendisini sıkıntıdan uzak, huzurlu ve ferah hissetmesi.","story":"Rahatın geçmişinde nefes alıp ferahlayan bir beden vardır. Arapçada nefesle bağlantılı rūḥ ve arāḥa biçimlerinden gelişen rāḥa(t), dinlenmeyi de kapsıyordu. Türkçede bu bedensel ferahlık, insanın içini sıkan şeylerden uzak oluşunu da anlatan bir ada dönüştü.","firstAttestation":{"source":"Yusuf Hacib — Kutadgu Bilig","period":"1069","form":"rāḥat"},"relatives":[{"word":"rahatlık","relation":"türev"},{"word":"rahatsız","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"rahat maddesi","url":"https://www.nisanyansozluk.com/kelime/rahat"},{"name":"TDK Güncel Türkçe Sözlük","ref":"rahat maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"huzur","word":"huzur","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ḥaḍara","meaning":"orada bulundu, yerinde durdu","period":null,"reconstructed":false},{"language":"ar","form":"ḥuḍūr","meaning":"hazır bulunma, yerleşiklik, dinginlik","period":null,"reconstructed":false},{"language":"tr","form":"huzur","meaning":"gönül dinginliği","period":"14. yy","reconstructed":false}],"shortMeaning":"Gönlün dingin ve kaygıdan uzak olması.","currentMeaning":"İnsanın iç dünyasında duyduğu sakinlik, güven ve rahatlık.","story":"Huzurun Arapçadaki geçmişi, bir yerde hazır bulunmaya ve orada durmaya uzanır. Ḥuḍūr, yolculukta veya göç hâlinde olmanın karşısına yerleşik oluşu koyarken dinginliği de anlatıyordu. Türkçedeki gönül rahatlığı anlamı, bu durulma ve sakinlik yönünü sürdürür.","firstAttestation":{"source":"Erzurumlu Darir — Kıssa-i Yusuf tercümesi","period":"<1377","form":"ḥuẓūr"},"relatives":[{"word":"huzurevi","relation":"birleşik"},{"word":"huzurlu","relation":"türev"}],"alternatives":null,"funFact":null,"sources":[{"name":"Nişanyan Sözlük","ref":"huzur maddesi","url":"https://www.nisanyansozluk.com/kelime/huzur"},{"name":"TDK Güncel Türkçe Sözlük","ref":"huzur maddesi","url":null}],"confidence":"yüksek","reviewed":true},{"id":"sabır","word":"sabır","rarity":"gündelik","partOfSpeech":"isim","formationType":"alıntı","donorLanguage":"ar","ultimateOrigin":"ar","chain":[{"language":"ar","form":"ṣabara","meaning":"sabır gösterdi","period":null,"reconstructed":false},{"language":"ar","form":"ṣabr","meaning":"güçlüğe dayanma","period":null,"reconstructed":false},{"language":"tr","form":"sabır","meaning":"sıkıntıya dayanıp bekleyebilme","period":"11. yy","reconstructed":false}],"shortMeaning":"Sıkıntıya dayanıp acele etmeden bekleyebilme gücü.","currentMeaning":"Acı veya güçlük ka
